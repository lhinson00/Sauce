<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM Sales CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--bg2:#111418;--bg3:#181c22;--bg4:#1e2530;
  --border:#1e2530;--border2:#252d3a;
  --amber:#ff8c00;--amber2:#e07800;
  --amber-dim:rgba(255,140,0,.1);--amber-glow:rgba(255,140,0,.05);
  --green:#22c55e;--green-dim:rgba(34,197,94,.1);
  --red:#ef4444;--red-dim:rgba(239,68,68,.1);
  --yellow:#eab308;--yellow-dim:rgba(234,179,8,.1);
  --text:#f0f4fc;--text2:#b8c4d8;--text3:#6b7a90;
  --radius:7px;--sidebar:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-wrap{width:380px;max-width:95vw;}
.login-brand{margin-bottom:28px;}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;line-height:1;}
.login-tag{font-size:10px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-top:3px;}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:28px;}
.login-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
.login-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 13px;outline:none;transition:border-color .15s;margin-bottom:14px;color-scheme:dark;}
.login-input:focus{border-color:var(--amber);}
.login-btn{width:100%;background:var(--amber);color:#000;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:12px;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--amber2);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:16px;}

/* APP SHELL */
#app{display:none;height:100vh;overflow:hidden;}
.app-layout{display:flex;height:100vh;overflow:hidden;}

/* ICON RAIL */
.rail{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:4px;height:100vh;
}
.rail-logo{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;
  color:var(--amber);text-transform:uppercase;letter-spacing:1px;
  writing-mode:vertical-rl;transform:rotate(180deg);
  margin-bottom:18px;padding-bottom:14px;
  border-bottom:1px solid var(--border2);width:100%;text-align:center;
}
.ri{
  width:36px;height:36px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text3);border:none;background:none;
  transition:all .15s;font-size:18px;
}
.ri:hover{background:var(--bg3);color:var(--text2);}
.ri.on{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,140,0,.2);}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;}
.sb-avatar{
  width:28px;height:28px;border-radius:50%;
  background:var(--amber-dim);border:1px solid rgba(255,140,0,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--amber);
}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* VIEWS */
.view{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view.active{display:flex;}

/* QUOTES LIST + DETAIL (master/detail layout) */
.md-layout{display:grid;grid-template-columns:280px 1fr;flex:1;overflow:hidden;min-height:0;}
.list-col{
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg2);
}
.list-top{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--bg3);
}
.list-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:700;color:var(--text);
  letter-spacing:.3px;margin-bottom:8px;
}
.list-search{
  display:flex;align-items:center;gap:7px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:7px 10px;
}
.list-search i{font-size:14px;color:var(--text3);}
.list-search input{
  border:none;background:none;outline:none;
  font-size:12px;color:var(--text);font-family:'Barlow',sans-serif;width:100%;
}
.list-filters{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.lf-chip{
  font-size:10px;font-weight:600;letter-spacing:.3px;
  padding:3px 9px;border-radius:10px;
  border:1px solid var(--border2);background:none;
  color:var(--text3);cursor:pointer;transition:all .15s;
  font-family:'Barlow',sans-serif;text-transform:uppercase;
}
.lf-chip.on{background:var(--amber-dim);border-color:rgba(255,140,0,.3);color:var(--amber);}
.list-items{flex:1;overflow-y:auto;}
.q-item{
  padding:11px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;
}
.q-item:hover{background:var(--bg3);}
.q-item.sel{background:var(--bg3);border-left:2px solid var(--amber);}
.qi-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.qi-name{font-size:13px;font-weight:600;color:var(--text);}
.qi-amt{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.qi-bot{display:flex;justify-content:space-between;}
.qi-spec{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.qi-date{font-size:11px;color:var(--text3);}
.qi-status{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:2px;}

/* DETAIL COLUMN */
.detail-col{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;}
.detail-hd{
  padding:16px 20px 14px;border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--bg2);
}
.detail-name{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:2px;}
.detail-meta{font-size:11px;color:var(--text3);}
.detail-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.da-btn{
  display:flex;align-items:center;gap:5px;padding:6px 12px;
  border-radius:var(--radius);font-size:11px;font-weight:600;
  border:1px solid var(--border2);background:var(--bg3);
  color:var(--text2);cursor:pointer;transition:all .15s;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;text-transform:uppercase;
  text-decoration:none;
}
.da-btn:hover{border-color:var(--amber2);color:var(--amber);}
.da-btn.primary{background:var(--amber);color:#000;border-color:var(--amber);}
.da-btn.primary:hover{background:var(--amber2);}
.da-btn.danger{border-color:rgba(239,68,68,.3);color:var(--red);}
.da-btn.danger:hover{background:var(--red-dim);}
.da-btn i{font-size:13px;}

.detail-body{flex:1;overflow-y:auto;padding:18px 20px 40px;}

/* SNAPSHOT GRID */
.snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px;}
.snap-grid-sm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:16px;}
.snap{
  border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border2);position:relative;
  aspect-ratio:4/3;cursor:pointer;transition:border-color .15s;
}
.snap:hover{border-color:var(--amber2);}
.snap canvas{width:100%;height:100%;display:block;}
.snap-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:4px 8px;font-size:10px;
  color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;
}
.snap-placeholder{
  aspect-ratio:4/3;border-radius:var(--radius);
  border:1px dashed var(--border2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--text3);font-size:11px;
}
.snap-placeholder i{font-size:20px;animation:spin 1.2s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* SPEC HERO */
.spec-hero{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.spec-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),transparent);}
.spec-dims{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--text);line-height:1;margin-bottom:4px;}
.spec-sub{font-size:12px;color:var(--text3);}
.spec-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.spec-chip{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);}

/* SECTION TITLE */
.sec-t{
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;margin-top:16px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}

/* GRIDS */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
.cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;}
.cell-l{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;}
.cell-v{font-size:13px;color:var(--text);font-weight:500;}

/* PRICING */
.price-block{border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;margin-bottom:4px;}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px;}
.price-row:last-child{border-bottom:none;}
.price-row.pres{background:rgba(255,140,0,.07);}
.pr-lbl{color:var(--text2);}
.pr-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text);}
.pr-val.amber{color:var(--amber);}
.pr-tag{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,140,0,.3);margin-right:8px;}

/* CRM FIELDS */
.crm-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.f-group{display:flex;flex-direction:column;gap:4px;}
.f-group.full{grid-column:1/-1;}
.f-label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);}
.f-ctrl{
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;
  padding:7px 10px;outline:none;transition:border-color .15s;
  color-scheme:dark;accent-color:var(--amber);
}
.f-ctrl:focus{border-color:var(--amber);}
textarea.f-ctrl{resize:vertical;min-height:60px;}
.status-btns{display:flex;gap:4px;flex-wrap:wrap;}
.st-btn{
  padding:4px 11px;border-radius:10px;font-size:11px;font-weight:600;
  border:1px solid var(--border2);background:none;color:var(--text3);
  cursor:pointer;transition:all .15s;font-family:'Barlow',sans-serif;
}
.st-btn:hover{border-color:var(--border2);color:var(--text2);}
.st-btn.on{background:var(--amber-dim);border-color:rgba(255,140,0,.4);color:var(--amber);}
.st-btn.on.sold{background:var(--green-dim);border-color:rgba(34,197,94,.4);color:var(--green);}
.st-btn.on.dead{background:var(--red-dim);border-color:rgba(239,68,68,.4);color:var(--red);}

/* CONTACT LOG */
.log-entry{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.log-entry:last-child{border-bottom:none;}
.log-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.log-dot.note{background:var(--text3);}
.log-dot.call{background:var(--green);}
.log-dot.text{background:var(--amber);}
.log-dot.email{background:var(--amber2);}
.log-dot.status_change{background:var(--yellow);}
.log-body-wrap{flex:1;}
.log-time{font-size:10px;color:var(--text3);margin-bottom:2px;}
.log-body{font-size:13px;color:var(--text2);}
.note-add{display:flex;gap:8px;margin-top:10px;}
.note-type-sel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:7px 9px;outline:none;color-scheme:dark;flex-shrink:0;}

/* BADGES */
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:10px;}
.badge-Quoted{background:var(--bg4);color:var(--text2);border:1px solid var(--border2);}
.badge-Contacted{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(234,179,8,.25);}
.badge-Hot{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,140,0,.3);}
.badge-Sold{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.25);}
.badge-Shipped{background:rgba(34,197,94,.06);color:#86efac;border:1px solid rgba(134,239,172,.15);}
.badge-Dead{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.badge-matonly{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,140,0,.3);}

/* PIPELINE VIEW (fallback table) */
.pipe-shell{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.toolbar{display:flex;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;flex-shrink:0;}
.tb-sel,.tb-inp{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:7px 11px;outline:none;color-scheme:dark;accent-color:var(--amber);}
.tb-sel:focus,.tb-inp:focus{border-color:var(--amber);}
.tb-inp{flex:1;min-width:180px;}
.tbl-wrap{flex:1;overflow-y:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;background:var(--bg2);z-index:10;}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--text2);}
.si{margin-left:4px;opacity:.4;font-size:8px;}
.si.asc::after{content:'\25B2';opacity:1;color:var(--amber);}
.si.desc::after{content:'\25BC';opacity:1;color:var(--amber);}
td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);white-space:nowrap;}
tr.trow{cursor:pointer;}
tr.trow:hover td{background:var(--bg3);}
tr.row-hot td:first-child{border-left:2px solid var(--amber);}
tr.row-dead{opacity:.4;}
.td-name{color:var(--text);font-weight:600;}
.td-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;}
.td-green{color:var(--green);}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:3px 5px;border-radius:4px;transition:all .15s;text-decoration:none;display:inline-block;}
.icon-btn:hover{color:var(--amber);}
.status-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'Barlow',sans-serif;font-size:11px;padding:4px 8px;outline:none;cursor:pointer;color-scheme:dark;}
.empty-state{text-align:center;padding:60px;color:var(--text3);}

/* LIGHTBOX */
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;align-items:center;justify-content:center;}
.lb-overlay.open{display:flex;}
.lb-inner{position:relative;width:min(700px,90vw);}
.lb-canvas{border-radius:var(--radius);width:100%;display:block;border:1px solid var(--border2);}
.lb-label{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:8px;}
.lb-close{position:absolute;top:-12px;right:-12px;width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.lb-arr{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:5px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.lb-arr:hover{border-color:var(--amber2);color:var(--amber);}
.lb-dots{display:flex;gap:6px;}
.lb-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);cursor:pointer;border:none;}
.lb-dot.on{background:var(--amber);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

@media(max-width:700px){
  :root{--sidebar:44px;}
  .md-layout{grid-template-columns:1fr;height:100%;}
  .list-col{height:100%;}
  .detail-col{display:none;height:100%;}
  .md-layout.detail-open .list-col{display:none;}
  .md-layout.detail-open .detail-col{display:flex;}
  .snap-grid-sm{grid-template-columns:repeat(2,1fr);}
  .crm-fields{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  .mob-back{display:flex!important;}
  .detail-actions{gap:4px;}
  .da-btn span{display:none;}
}
.mob-back{
  display:none;align-items:center;gap:6px;
  padding:4px 0;margin-bottom:10px;
  background:none;border:none;color:var(--amber);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;
  font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;
}
.mob-back i{font-size:16px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-logo">STM Sales</div>
      <div class="login-tag">CRM Platform</div>
    </div>
    <div class="login-card">
      <label class="login-label">Username</label>
      <input class="login-input" id="l-user" type="text" autocomplete="username" placeholder="username">
      <label class="login-label">Password</label>
      <input class="login-input" id="l-pass" type="password" autocomplete="current-password" placeholder="password">
      <button class="login-btn" id="l-btn" onclick="doLogin()">Sign In</button>
      <div class="login-err" id="l-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-layout">

    <!-- ICON RAIL -->
    <div class="rail">
      <div class="rail-logo">STM</div>
      <button class="ri on" id="ri-quotes" onclick="showView('quotes')" title="Quotes"><i class="ti ti-layout-list" aria-hidden="true"></i></button>
      <button class="ri" id="ri-pipeline" onclick="showView('pipeline')" title="Pipeline"><i class="ti ti-filter" aria-hidden="true"></i></button>
      <div class="rail-foot">
        <a class="ri" href="sales-tool.html" target="_blank" title="New Quote" style="text-decoration:none"><i class="ti ti-plus" aria-hidden="true"></i></a>
        <div class="sb-avatar" id="sb-avatar">L</div>
        <button class="ri" onclick="doLogout()" title="Sign Out" style="font-size:15px;color:var(--text3)"><i class="ti ti-logout" aria-hidden="true"></i></button>
      </div>
    </div>

    <!-- MAIN -->
    <main class="main">

      <!-- QUOTES VIEW: master/detail -->
      <div class="view active" id="view-quotes">
        <div class="md-layout" id="md-layout">
          <!-- LIST -->
          <div class="list-col">
            <div class="list-top">
              <div class="list-title">Quotes</div>
              <div class="list-search">
                <i class="ti ti-search" aria-hidden="true"></i>
                <input id="qs-search" placeholder="Customer, building, city…" oninput="filterList()">

function restoreSession() {

// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    ...opts, headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if (r.status === 204) return null;
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

async function loadQuotes() {
  const rows = await sbFetch(
    `quotes?salesman=eq.${enc(CU.username)}&select=id,date,name,phone,email,city,total,specs,status,form_fields,pricing_results,config_encoded,updated_at,crm_data,snapshot,display_summary&order=updated_at.desc&limit=500`
  );
  return (rows||[]).map(norm);
}

function norm(r) {
  const c    = r.crm_data || {};
  const snap = r.snapshot  || {};
  const ds   = r.display_summary || snap.displaySummary || {};
  return {
    id: r.id||'', date: r.date||'', updated_at: r.updated_at||'',
    name: r.name||'', phone: r.phone||'', email: r.email||'', city: r.city||'',
    total: (parseMoney(r.total) > 0 ? r.total : null) || (r.pricing_results||{}).totalCombined || (r.pricing_results||{}).total || '', specs: r.specs||'',
    status:          c.status          || r.status || 'Quoted',
    follow_up_date:  c.follow_up_date  || '',
    ship_date:       c.ship_date       || '',
    final_material:  c.final_material  || 0,
    cs_amount:       c.cs_amount       || 0,
    mat_only:        c.mat_only        || false,
    selected_variants: c.selected_variants || r.pricing_results?.selectedVariants || [],
    form_fields:     r.form_fields     || {},
    pricing_results: r.pricing_results || {},
    config_encoded:  r.config_encoded  || '',
    display_summary: ds,
    snapshot:        snap,
  };
}

async function patchCrm(id, patch) {
  // Read existing crm_data, merge, write back
  const rows = await sbFetch(`quotes?id=eq.${enc(id)}&select=crm_data`);
  const existing = (rows&&rows[0]&&rows[0].crm_data) || {};
  const merged = { ...existing, ...patch };
  await sbFetch(`quotes?id=eq.${enc(id)}`, {
    method:'PATCH', body:JSON.stringify({ crm_data:merged, updated_at:new Date().toISOString() }),
    headers:{'Prefer':'return=minimal'}
  });
  const q = QQ.find(q=>q.id===id);
  if (q) Object.assign(q, patch);
}

async function loadNotes(qid) {
  try {
    const rows = await sbFetch(`crm_notes?quote_id=eq.${enc(qid)}&order=created_at.desc`);
    return rows || [];
  } catch(e) { return []; }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
const enc  = s => encodeURIComponent(s);
const fmt$ = n => '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => {
  const v=Math.abs(+n||0);
  if(v>=1000000) return '$'+(n/1000000).toFixed(2)+'M';
  if(v>=1000)    return '$'+(n/1000).toFixed(0)+'K';
  return fmt$(n);
};
function parseMoney(s) {
  if(typeof s==='number') return isNaN(s) ? 0 : s;
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[$,\s]/g,''));
  return isNaN(n) ? 0 : n;
}
function qMonth(q) {
  const s = (q.date||'').trim();
  if(!s) return '';
  // Strip time portion if present: "05/05/2026 11:57" → "05/05/2026"
  const datePart = s.split(' ')[0];
  let d;
  if(datePart.includes('/')) {
    const p = datePart.split('/');
    if(+p[0] > 31) d = new Date(+p[0], +p[1]-1, +p[2]); // YYYY/MM/DD
    else           d = new Date(+p[2], +p[0]-1, +p[1]);  // M/D/YYYY
  } else {
    d = new Date(datePart+'T00:00:00');
  }
  if(isNaN(d)) return '';
  return MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function shipMonth(q) {
  if(!q.ship_date) return '';
  const d=new Date(q.ship_date+'T00:00:00');
  if(isNaN(d)) return '';
  return MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function curMonth() { const d=new Date(); return MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function fmtDate(s) {
  if(!s) return '—';
  const d=new Date((s.includes('T')?s:s+'T00:00:00'));
  if(isNaN(d)) return s;
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function fuClass(s) {
  if(!s) return '';
  const d=new Date(s+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const diff=(d-now)/86400000;
  if(diff<0) return 'fup-overdue';
  if(diff<=3) return 'fup-soon';
  return '';
}
function badge(status) {
  return `<span class="badge badge-${status||'Quoted'}">${status||'Quoted'}</span>`;
}
function monthSort(a,b) {
  const da=new Date(a.split(' ')[1],MONTHS.indexOf(a.split(' ')[0]));
  const db=new Date(b.split(' ')[1],MONTHS.indexOf(b.split(' ')[0]));
  return db-da;
}

function populateMonthFilter() {
  const months=[...new Set(QQ.map(q=>qMonth(q)).filter(Boolean))].sort(monthSort);
  const sel=document.getElementById('f-month');

  sel.innerHTML='<option value="">All Months</option>'+months.map(m=>`<option${m===cur?' selected':''}>${m}</option>`).join('');

function psort(col) {
  if(_ps.col===col)_ps.dir*=-1; else{_ps.col=col;_ps.dir=-1;}
  renderPipeline();
}

function renderPipeline() {
  const fStat   = document.getElementById('f-status').value;
  const fMonth  = document.getElementById('f-month').value;
  const search  = (document.getElementById('f-search').value||'').toLowerCase();
  let rows=[...QQ];
  if(fStat)  rows=rows.filter(q=>q.status===fStat);
  if(fMonth) rows=rows.filter(q=>qMonth(q)===fMonth);
  if(search) rows=rows.filter(q=>(q.name||'').toLowerCase().includes(search)||(q.id||'').toLowerCase().includes(search)||(q.city||'').toLowerCase().includes(search)||(q.specs||'').toLowerCase().includes(search));

  rows.sort((a,b)=>{
    let av=a[_ps.col]||'',bv=b[_ps.col]||'';
    if(_ps.col==='total'){av=parseMoney(av);bv=parseMoney(bv);return(av-bv)*_ps.dir;}
    return String(av).localeCompare(String(bv))*_ps.dir;
  });

  document.querySelectorAll('.si').forEach(el=>{
    el.className='si';
    const thOC=el.parentElement.getAttribute('onclick')||'';
    if(thOC.includes(`'${_ps.col}'`)) el.classList.add(_ps.dir===-1?'desc':'asc');
  });

  const tbody=document.getElementById('pipe-body');
  const empty=document.getElementById('pipe-empty');
  if(!rows.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML=rows.map(q=>`
    <tr class="trow ${q.status==='Hot'?'row-hot':''} ${q.status==='Dead'?'row-dead':''}" onclick="openDetail('${q.id}')">
      <td class="td-num">${q.date||'—'}</td>
      <td><div class="td-name">${q.name||'—'}</div><div style="font-size:11px;color:var(--text3)">${q.city||''}</div></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--text2)">${q.specs||'—'}</td>
      <td class="td-num">${parseMoney(q.total) > 0 ? q.total : '—'}</td>
      <td>
        <select class="status-sel" onclick="event.stopPropagation()" onchange="quickStat('${q.id}',this.value)">
          ${STATUSES.map(s=>`<option${s===q.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td style="${fuClass(q.follow_up_date)==='fup-overdue'?'color:var(--red)':fuClass(q.follow_up_date)==='fup-soon'?'color:var(--yellow)':''}">${fmtDate(q.follow_up_date)}</td>
      <td onclick="event.stopPropagation()">
        ${q.phone?`<a class="icon-btn" href="sms:${q.phone.replace(/\D/g,'')}" title="Text">📱</a>`:''}
        ${q.email?`<a class="icon-btn" href="mailto:${q.email}" title="Email">✉️</a>`:''}
        ${q.config_encoded?`<a class="icon-btn" href="${SALES}?quote=${q.id}" target="_blank" title="Open in Sales Tool">🔗</a>`:''}
      </td>

}

// ── DETAIL ────────────────────────────────────────────────────────────────────
async function openDetail(id) {
  const q=QQ.find(q=>q.id===id); if(!q)return;
  _cq=q;
  try {
  const ff  = q.form_fields     || {};
  const pr  = q.pricing_results || {};
  const ds  = q.display_summary || {};
  const snap= q.snapshot        || {};

  const notes = await loadNotes(id);

  // Decode config_encoded for accurate door/window data
  let _cfg = null;
  if (q.config_encoded) {
    try { _cfg = await safeDecodeAsync(q.config_encoded); } catch(e) {}
  }

  // Door/window decode helper
  function decodeGD(sku) {
    if (!sku) return null;
    const s = String(sku);
    const raw = s.match(/^(\d+)x(\d+)(IN|INS)?$/i);
    if (raw) return raw[1]+"'\xd7"+raw[2]+"'"+(raw[3]?' Insulated':'');
    const skuM = s.match(/^GD(\d{1,2})(\d{1,2})(IN|INS)?W$/i);
    if (skuM) return skuM[1]+"'\xd7"+skuM[2]+"'"+(skuM[3]?' Insulated':'');
    const drum = s.match(/^GDDD(\d+)(\d+)(IN)?$/i);
    if (drum) return drum[1]+"'\xd7"+drum[2]+"' Drum"+(drum[3]?' Insulated':'');
    return s;
  }

  let gds=[], wds=[], wins=[];
  if (_cfg) {
    // Config allDoors has garage doors; walkDoors and windows are separate arrays
    const allDoors = _cfg.allDoors || [];
    gds = allDoors.filter(d=>d.type==='garage').map(d=>{
      const ic = d.insulated ? (d.w===18?'INS':'IN') : '';
      return decodeGD(d.w+'x'+d.h+ic);
    }).filter(Boolean);
    wds  = (_cfg.walkDoors||[]).map(d=>d.type||'').filter(Boolean);
    wins = (_cfg.windows||[]).map(d=>d.type||'').filter(Boolean);
  }
  // Fallback chain
  if (!gds.length) {
    gds = (ds.gdList||[]).map(decodeGD).filter(Boolean);
    if (!gds.length) gds = Object.keys(ff).filter(k=>k.startsWith('garageDoor')&&k.endsWith('Type'))
      .map(k=>ff[k]).filter(v=>v&&!v.includes('undefined')).map(decodeGD).filter(Boolean);
  }
  if (!wds.length) {
    wds = (ds.wdList||[]).filter(Boolean);
    if (!wds.length) wds = Object.keys(ff).filter(k=>k.startsWith('walkDoor')&&k.endsWith('Type'))
      .map(k=>ff[k]).filter(v=>v&&!v.includes('undefined')).filter(Boolean);
  }
  if (!wins.length) {
    wins = (ds.winList||[]).filter(Boolean);
    if (!wins.length) wins = Object.keys(ff).filter(k=>k.startsWith('window')&&k.endsWith('Type'))
      .map(k=>ff[k]).filter(v=>v&&!v.includes('undefined')).filter(Boolean);
  }
  const gdCount  = gds.length || +ds.garageDoors || 0;
  const wdCount  = wds.length || +ds.walkDoors   || 0;
  const winCount = wins.length|| +ds.windows      || 0;

  // Pricing variants
  const VMAP = [
    {key:'totalNoOH',    label:'Post Frame — No Overhang'},
    {key:'totalOH',      label:'Post Frame — 12" Soffit'},
    {key:'totalSteel',   label:'Steel Truss'},
    {key:'totalStud',    label:'Stud Frame'},
    {key:'totalCypress', label:'Cypress Board & Batten'},
    {key:'totalBB',      label:'Metal Board & Batten'},
  ];
  const storedTotal = parseMoney(q.total) || parseMoney(pr.totalCombined) || parseMoney(pr.total);
  const savedV = q.selected_variants || [];
  let presentedKey = null;
  if (savedV.length > 0) {
    const m = savedV.find(k => { const vt = parseMoney(pr[k]); return vt > 0 && Math.abs(vt - storedTotal) < 5; });
    presentedKey = m || savedV[0];
  } else if (storedTotal > 0) {
    const m = VMAP.find(v => { const vt = parseMoney(pr[v.key]); return vt > 0 && Math.abs(vt - storedTotal) < 5; });
    if (m) presentedKey = m.key;
  }
  // Final fallback — if totalCombined matches a variant, mark that as presented
  if (!presentedKey && pr.totalCombined) {
    const ref = parseMoney(pr.totalCombined);
    const m = VMAP.find(v => { const vt = parseMoney(pr[v.key]); return vt > 0 && Math.abs(vt - ref) < 5; });
    if (m) presentedKey = m.key;
  }
  const showV = savedV.length > 0
    ? VMAP.filter(v=>savedV.includes(v.key)&&pr[v.key])
    : VMAP.filter(v=>pr[v.key]&&parseMoney(pr[v.key])>0);

  // Building
  const dims  = [ff.width,ff.length,ff.height].filter(Boolean).map(d=>d+"'").join(' x ');
  const pitch = ff.roofPitch ? ff.roofPitch+'/12' : '';
  const truss = ff.truss || ds.truss || '';
  const oh    = ds.oh && ds.oh!=='0' ? ds.oh+'" Soffit' : 'No Soffit';

  // Parse doors/windows from form_fields, decode SKUs to readable format
  function decodeGD(sku) {
    if (!sku) return null;
    const s = String(sku);
    // Raw format from dropdown: "9x7", "12x10", "9x7IN", "9x7INS"
    const raw = s.match(/^(\d+)x(\d+)(IN|INS)?$/i);
    if (raw) return raw[1]+"'×"+raw[2]+"'"+(raw[3]?' Insulated':'');
    // SKU format: GD{w}{h}[IN|INS]W — w and h concatenated from dropdown parts
    // e.g. GD97W=9'×7', GD1210W=12'×10', GD1210INW=12'×10' Insulated
    // Width is 1-2 digits, height is 1-2 digits, insulation optional
    const skuM = s.match(/^GD(\d{1,2})(\d{1,2})(IN|INS)?W$/i);
    if (skuM) return skuM[1]+"'×"+skuM[2]+"'"+(skuM[3]?' Insulated':'');
    // Drum door: GDDD{w}{h}[IN]
    const drum = s.match(/^GDDD(\d+)(\d+)(IN)?$/i);
    if (drum) return drum[1]+"'×"+drum[2]+"' Drum"+(drum[3]?' Insulated':'');
    return s; // show raw if nothing matched
  }
  function decodeWD(val) {
    if (!val) return null;
    // Already readable — walk door types are full descriptions or "3x6" dimension format
    const m = String(val).match(/^(\d+)x(\d+)$/i);
    return m ? m[1]+"'×"+m[2]+"'" : val;
  }


  const upg=[];
  if(ff.insulation&&ff.insulation!=='None') upg.push('Insulation: '+ff.insulation);
  if(ff.insulationRoof==='Yes') upg.push('Roof Insulation');
  if(ff.insulationWalls==='Yes') upg.push('Wall Insulation');
  if(ff.concrete&&ff.concrete!=='None') upg.push('Concrete: '+ff.concrete);
  if(ff.wainscot==='Yes') upg.push('Wainscot'+(ds.wainscotColor?' ('+ds.wainscotColor+')':''));
  if(ff.postWraps==='Yes') upg.push('Post Wraps');
  if(ff.lvlHeaders==='Yes') upg.push('LVL Headers');
  if(ff.gutters==='Yes') upg.push('Gutters'+(ds.gutterType?' — '+ds.gutterType:'')+(ds.gutterGuard?' w/ Guard':''));
  if(ff.barjoist==='Yes') upg.push('Bar Joist'+(ff.barjoistType?' ('+ff.barjoistType+')':''));
  if(ff.wetSetPosts==='Yes') upg.push('Wet-Set Posts');
  if(ff.postProtectors==='Yes') upg.push('Post Protectors');
  if(ff.rockWainscot==='Yes') upg.push('Stone Wainscot');
  if(ds.cupolaOn) upg.push('Cupola '+ds.cupolaSize+'" x '+ds.cupolaQty);
  if(ff.pitch612==='Yes') upg.push('6/12 Pitch (Steel)');
  if(ff.manualNotes) upg.push('Notes: '+ff.manualNotes);

  const pricingRows = showV.map(v => {
    const isp = v.key===presentedKey;
    const bg  = isp ? 'background:rgba(255,140,0,.09);' : '';
    const clr = isp ? 'color:var(--amber)' : 'color:var(--text2)';
    const lclr= isp ? 'color:var(--text);font-weight:600' : 'color:var(--text2)';
    const pBadge = isp ? '<span style="font-size:9px;font-weight:700;letter-spacing:1px;color:var(--amber);text-transform:uppercase;margin-left:8px;background:var(--amber-dim);padding:1px 6px;border-radius:3px;border:1px solid var(--amber2)">PRESENTED</span>' : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);'+bg+'">'
      + '<div style="font-size:13px;'+lclr+'">'+v.label+pBadge+'</div>'
      + '<div style="font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:700;'+clr+'">'+pr[v.key]+'</div>'
      + '</div>';
  }).join('');

  const upgRows = upg.map(u =>
    '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)">'
    +'<span style="color:var(--green);flex-shrink:0">✓</span>'+u+'</div>'
  ).join('');

  const bldGrid = [
    ff.roofColor  ? ['Roof Color', ff.roofColor]   : null,
    ff.wallColor  ? ['Wall Color', ff.wallColor]   : null,
    ff.trimColor  ? ['Trim Color', ff.trimColor]   : null,
    ff.roofMetal  ? ['Roof Metal', ff.roofMetal]   : null,
    ff.wallMetal  ? ['Wall Metal', ff.wallMetal]   : null,
    ff.mbPostSize ? ['Post Size',  ff.mbPostSize]  : null,
    ff.eavePostSpacing ? ['Eave Spacing', ff.eavePostSpacing+"'"] : null,
    ff.trussSpacing    ? ['Truss Spacing', ff.trussSpacing+"'"]  : null,
  ].filter(Boolean).map(([lbl,val]) =>
    '<div class="bld-item"><div class="bld-lbl">'+lbl+'</div><div class="bld-val">'+val+'</div></div>'
  ).join('');

  let shedStr = ds.sheds || '';
  if (!shedStr) {
    const parts = [];
    if (ff.ssWidth)  parts.push(ff.ssWidth+"' × "+(ff.ssLength||'?')+"' Side Shed");
    if (ff.ss2Width) parts.push(ff.ss2Width+"' × "+(ff.ss2Length||'?')+"' Side Shed");
    shedStr = parts.join(', ');
  }
  if (!shedStr && _cfg && _cfg.shedConfigs) {
    shedStr = (_cfg.shedConfigs||[]).filter(sc=>sc&&sc.w&&sc.l).map(sc=>{
      const t = sc.type==='gable'?'Gable Ext':sc.type==='leanto'?'Lean-to':(sc.type||'Lean-to');
      return sc.w+"'×"+sc.l+"' "+t;
    }).join(', ');
  }

  // ── RENDER INTO NEW MASTER/DETAIL LAYOUT ──────────────────────────────────
  _selectedId = id;
  renderList(); // update selected highlight

  // Show detail content
  document.getElementById('detail-empty').style.display='none';
  document.getElementById('detail-content').style.display='flex';
  // Mobile: switch to detail view
  document.getElementById('md-layout').classList.add('detail-open');

  // Header
  document.getElementById('d-hd').innerHTML =
    '<button class="mob-back" onclick="closeDetail()"><i class="ti ti-arrow-left" aria-hidden="true"></i> All Quotes</button>'
    +'<div class="detail-name">'+q.name+'</div>'
    +'<div class="detail-meta">'+q.id+' · '+(q.city||'')+(q.date?' · Quoted '+q.date:'')+'</div>'
    +'<div class="detail-actions">'
    +(q.config_encoded?'<a class="da-btn primary" href="'+SALES+'?quote='+q.id+'" target="_blank"><i class="ti ti-external-link" aria-hidden="true"></i> Open in sales tool</a>':'')
    +'<a class="da-btn" href="'+SALES+'" target="_blank"><i class="ti ti-plus" aria-hidden="true"></i> New quote</a>'
    +'<button class="da-btn" onclick="openInSalesTool()"><i class="ti ti-file-type-pdf" aria-hidden="true"></i> Quote PDF</button>'
    +'<button class="da-btn" onclick="openInSalesTool()"><i class="ti ti-ruler-measure" aria-hidden="true"></i> Post layout</button>'
    +'<button class="da-btn danger" onclick="deleteQuote(\''+id+'\')" style="margin-left:auto"><i class="ti ti-trash" aria-hidden="true"></i> Delete</button>'
    +'</div>';

  // Body
  const SNAP_LABELS = ['Front','Left side','Back','Right side'];
  const snapshots = _snapCache[id] || q.snapshots || [];
  const snapHtml = snapshots.length >= 4
    ? '<div class="snap-grid-sm">'
      + snapshots.slice(0,4).map((src,i) =>
          `<div class="snap" onclick="openLb(${i},_cq)"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block"><div class="snap-label">${SNAP_LABELS[i]}</div></div>`
        ).join('')
      + '</div>'
    : '<div class="snap-grid-sm" id="snap-grid-'+id+'"></div>';


  document.getElementById('d-body').innerHTML =
    '<div class="spec-hero">'
    +'<div class="spec-dims">'+(dims||'—')+'</div>'
    +'<div class="spec-sub">'+[truss,pitch,oh].filter(Boolean).join(' · ')+'</div>'
    +'<div class="spec-chips">'
    +(ff.roofColor?'<span class="spec-chip">'+ff.roofColor+' roof</span>':'')
    +(ff.wallColor?'<span class="spec-chip">'+ff.wallColor+' walls</span>':'')
    +(ff.trimColor?'<span class="spec-chip">'+ff.trimColor+' trim</span>':'')
    +(ff.roofMetal?'<span class="spec-chip">'+ff.roofMetal+'</span>':'')
    +'</div></div>'

    +(gdCount||wdCount||winCount ?
      '<div class="sec-t">Openings</div>'
      +'<div class="grid3">'
      +(gdCount?'<div class="cell"><div class="cell-l">Overhead doors</div><div class="cell-v">'+(gds.length?gds.join(', '):gdCount+' door'+(gdCount>1?'s':''))+'</div></div>':'')
      +(wdCount?'<div class="cell"><div class="cell-l">Walk doors</div><div class="cell-v">'+(wds.length?wds.join(', '):wdCount+' door'+(wdCount>1?'s':''))+'</div></div>':'')
      +(winCount?'<div class="cell"><div class="cell-l">Windows</div><div class="cell-v">'+(wins.length?wins.join(', '):winCount+' window'+(winCount>1?'s':''))+'</div></div>':'')
      +'</div>'
    : '')

    +(shedStr ? '<div class="sec-t">Side sheds / extensions</div><div style="background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--text2);margin-bottom:4px">'+shedStr+'</div>' : '')

    +(upg.length ? '<div class="sec-t">Upgrades & options</div><div style="background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;margin-bottom:4px">'+upgRows+'</div>' : '')

    +'<div class="sec-t">Quoted pricing — '+showV.length+' variant'+(showV.length!==1?'s':'')+'</div>'
    +'<div class="price-block">'+(pricingRows||'<div style="padding:12px;color:var(--text3);font-size:12px">No pricing saved.</div>')+'</div>'

    +'<div class="sec-t">CRM status</div>'
    +'<div class="status-btns" style="margin-bottom:14px">'
    +STATUSES.map(s=>{ const cls='st-btn'+(s===q.status?' on'+(s==='Sold'||s==='Shipped'?' sold':s==='Dead'?' dead':''):''); return '<button class="'+cls+'" onclick="setStatus(\\"'+id+'\\",\\"'+s+'\\")">'+ s+'</button>'; }).join('')
    +'</div>'

    +'<div class="crm-fields">'
    +'<div class="f-group"><label class="f-label">Follow-Up Date</label><input type="date" class="f-ctrl dpf" data-id="'+id+'" data-field="follow_up_date" value="'+(q.follow_up_date||'')+'" oninput="debouncePatch(this)"></div>'
    +'<div class="f-group"><label class="f-label">Ship / Invoice Date</label><input type="date" class="f-ctrl dpf" data-id="'+id+'" data-field="ship_date" value="'+(q.ship_date||'')+'" oninput="debouncePatch(this)"></div>'
    +'<div class="f-group"><label class="f-label">Final Material</label><input type="number" step="0.01" class="f-ctrl dpf" data-id="'+id+'" data-field="final_material" placeholder="0.00" value="'+(q.final_material||'')+'" oninput="debouncePatch(this)"></div>'
    +'<div class="f-group"><label class="f-label">CS Amount</label><input type="number" step="0.01" class="f-ctrl dpf" data-id="'+id+'" data-field="cs_amount" placeholder="0.00" value="'+(q.cs_amount||'')+'" oninput="debouncePatch(this)"></div>'
    +'<div class="f-group full"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="dpf-chk" data-id="'+id+'" data-field="mat_only" '+(q.mat_only?'checked':'')+' style="width:15px;height:15px;accent-color:var(--amber)" onchange="dpPatchChk(this)"><span style="font-size:13px;color:var(--text2)">Material Only</span></label></div>'
    +'</div>'

    +'<div class="sec-t">Building views</div>'
    +(snapshots.length >= 4 ? snapHtml : '<div class="snap-grid-sm" id="snap-grid-'+id+'"></div>')
    +'<div class="sec-t">Contact log</div>'
    +'<div id="dp-notes">'+renderNotes(notes)+'</div>'
    +'<div class="note-add">'
    +'<select id="nt-type" class="note-type-sel"><option value="note">Note</option><option value="call">Call</option><option value="text">Text</option><option value="email">Email</option></select>'
    +'<input id="nt-body" class="f-ctrl nt-input" data-qid="'+id+'" style="flex:1" placeholder="Add a note or call log">'
    +'<button class="da-btn primary" id="nt-add-btn" data-qid="'+id+'">Add</button>'
    +'</div>';

  // Load real 3D snapshots via iframe capture if not already cached
  if (snapshots.length < 4) {
    setTimeout(() => loadSnapPreviews(id), 100);
  }
  } catch(e) {
    console.error('[CRM] openDetail error:', e);
    document.getElementById('d-body').innerHTML = '<div style="padding:20px;color:var(--red)">Error loading quote: '+e.message+'</div>';
    document.getElementById('detail-empty').style.display='none';
    document.getElementById('detail-content').style.display='flex';
  }
}

function renderNotes(notes) {
  if(!notes||!notes.length) return '<div style="color:var(--text3);font-size:12px;margin-bottom:8px">No contact history yet.</div>';
  return notes.map(n=>`
    <div class="log-entry ${n.type||'note'}">
      <div class="log-time"><span class="log-type">${n.type||'note'}</span>${fmtDate((n.created_at||'').substring(0,10))}</div>
      <div class="log-body">${n.body||''}</div>
    </div>`).join('');
}

async function addNote(id) {
  const body=(document.getElementById('nt-body').value||'').trim();
  const type=document.getElementById('nt-type').value;
  if(!body)return;
  await saveNote(id,type,body);
  document.getElementById('nt-body').value='';
  const notes=await loadNotes(id);
  document.getElementById('dp-notes').innerHTML=renderNotes(notes);
}

async function dpPatch(id,field,val) {
  await patchCrm(id,{[field]:val});
  renderList();
}

async function deleteQuote(id) {
  if (!confirm('Permanently delete this quote? This cannot be undone.')) return;
  try {
    await sbFetch('quotes?id=eq.'+enc(id), { method:'DELETE', headers:{'Prefer':'return=minimal'} });
    QQ = QQ.filter(q => q.id !== id);
    closeDetail();
    renderList();
    renderPipeline();
  } catch(e) { alert('Delete failed: ' + e.message); }
}

function closeDetail() {
  _selectedId = null;
  _cq = null;
  document.getElementById('detail-empty').style.display='flex';
  document.getElementById('detail-content').style.display='none';
  document.getElementById('md-layout').classList.remove('detail-open');
  renderList();
  renderPipeline();
}

function maybeCloseDetail(e) {}

// ── 3D SNAPSHOT CAPTURE VIA IFRAME ───────────────────────────────────────────
const _snapCache = {}; // id → [img, img, img, img]
const _snapPending = {}; // id → [callbacks]

window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'crm_snapshots') return;
  const {id, snapshots, error} = e.data;
  // Remove iframe
  const fr = document.getElementById('_snap_iframe_'+id);
  if (fr) fr.remove();
  if (error) { console.warn('[CRM Snap] Error for', id, error); }
  if (snapshots && snapshots.length >= 4) {
    _snapCache[id] = snapshots;
    // Update any waiting grids
    const grid = document.getElementById('snap-grid-'+id);
    if (grid) renderSnapGrid(grid, id, snapshots);
  }
  // Fire callbacks
  (_snapPending[id]||[]).forEach(function(cb){ cb(snapshots||null); });
  delete _snapPending[id];
});

function requestSnapshots(id) {
  if (_snapCache[id]) return;
  if (document.getElementById('_snap_iframe_'+id)) return; // already loading
  const fr = document.createElement('iframe');
  fr.id = '_snap_iframe_'+id;
  fr.src = SALES + '?capture=1&quote=' + encodeURIComponent(id);
  fr.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:800px;height:600px;border:none;opacity:0;pointer-events:none;';
  document.body.appendChild(fr);
}

const SNAP_LABELS_ALL = ['Front','Left side','Back','Right side'];

function renderSnapGrid(grid, id, snapshots) {
  grid.className = 'snap-grid-sm';
  grid.innerHTML = snapshots.slice(0,4).map(function(src, i) {
    return '<div class="snap" onclick="openLb('+i+',_cq)">'
      + '<img src="'+src+'" style="width:100%;height:100%;object-fit:cover;display:block">'
      + '<div class="snap-label">'+SNAP_LABELS_ALL[i]+'</div>'
      + '</div>';
  }).join('');
}

function loadSnapPreviews(id) {
  if (_snapCache[id]) {
    const grid = document.getElementById('snap-grid-'+id);
    if (grid) renderSnapGrid(grid, id, _snapCache[id]);
    return;
  }
  const grid = document.getElementById('snap-grid-'+id);
  if (grid) {
    grid.className = 'snap-grid-sm';
    grid.innerHTML = SNAP_LABELS_ALL.map(function(lbl) {
      return '<div class="snap-placeholder"><i class="ti ti-rotate-clockwise-2" aria-hidden="true"></i><span>'+lbl+'</span></div>';
    }).join('');
  }
  requestSnapshots(id);
}

function openLb(startIdx, q) {
  _lbIdx = startIdx;
  document.getElementById('lb-overlay').classList.add('open');
  renderLb(q);
}
function closeLb(){ document.getElementById('lb-overlay').classList.remove('open'); }
function lbStep(d){ _lbIdx=(_lbIdx+d+4)%4; renderLb(_cq); }
function renderLb(q){
  if (!q) return;
  const snaps = _snapCache[q.id] || q.snapshots || [];
  const labels = SNAP_LABELS_ALL;
  const lbc = document.getElementById('lb-canvas');
  if (snaps.length >= 4) {
    const img = new Image();
    img.onload = function(){
      lbc.width = img.naturalWidth || 700;
      lbc.height = img.naturalHeight || 525;
      lbc.getContext('2d').drawImage(img, 0, 0, lbc.width, lbc.height);
    };
    img.src = snaps[_lbIdx];
  } else {
    lbc.width=700; lbc.height=525;
    const ctx=lbc.getContext('2d');
    ctx.fillStyle='var(--bg3)'; ctx.fillRect(0,0,700,525);
    ctx.fillStyle='#6b7a90'; ctx.font='14px Barlow,sans-serif'; ctx.textAlign='center';
    ctx.fillText('Loading…', 350, 262);
  }
  document.getElementById('lb-label').textContent = labels[_lbIdx];
  document.getElementById('lb-dots').innerHTML = labels.map((_,i)=>'<button class="lb-dot'+(i===_lbIdx?' on':'')+'" onclick="lbGoTo('+i+')"></button>').join('');
}
window.lbGoTo=function(i){_lbIdx=i;renderLb(_cq);};
function openInSalesTool(){alert("Open the quote in the sales tool to generate PDFs and post layout.");}
function setStatus(id,s){dpPatch(id,'status',s);document.querySelectorAll('.st-btn').forEach(b=>{b.classList.remove('on','sold','dead');if(b.textContent===s){b.classList.add('on');if(s==='Sold'||s==='Shipped')b.classList.add('sold');if(s==='Dead')b.classList.add('dead');}});}
let _dpTimer=null;
function debouncePatch(el){clearTimeout(_dpTimer);_dpTimer=setTimeout(()=>{const v=el.type==='number'?+el.value:el.value;dpPatch(el.dataset.id,el.dataset.field,v);},600);}
function dpPatchChk(el){dpPatch(el.dataset.id,el.dataset.field,el.checked);}

// Note input wiring via event delegation on detail body
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList.contains('nt-input')){
    const qid=e.target.dataset.qid; if(qid) _addNoteFromDom(qid);
  }
});
document.addEventListener('click',function(e){
  if(e.target.id==='nt-add-btn'||e.target.closest('#nt-add-btn')){
    const btn=e.target.id==='nt-add-btn'?e.target:e.target.closest('#nt-add-btn');
    _addNoteFromDom(btn.dataset.qid);
  }
});
async function _addNoteFromDom(qid){
  const body=(document.getElementById('nt-body')||{}).value||'';
  const type=(document.getElementById('nt-type')||{}).value||'note';
  if(!body.trim())return;
  await saveNote(qid,type,body.trim());
  document.getElementById('nt-body').value='';
  const notes=await loadNotes(qid);
  const el=document.getElementById('dp-notes');
  if(el)el.innerHTML=renderNotes(notes);
}


// ── CONFIG DECODER ────────────────────────────────────────────────────────────
async function safeDecodeAsync(str) {
  try {
    var b64 = str.replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64); var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    try {
      var ds = new DecompressionStream('deflate-raw');
      var w = ds.writable.getWriter(); w.write(bytes); w.close();
      var out = await new Response(ds.readable).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(out));
    } catch(e) {
      return JSON.parse(new TextDecoder().decode(bytes));
    }
  } catch(e) { return null; }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
if(restoreSession()) startApp();
