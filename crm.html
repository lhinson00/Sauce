<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gridiron — Tecmo × Retro Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --turf:#2e7d43; --steel:#2c3742; --home:#2b4cc4; --home-lt:#4f74e8; --ol:#213a95;
    --away:#b02a26; --away-lt:#d85852; --chalk:#dfe8ff; --board:#1a2740; --board-lt:#26385c;
    --good:#4ade80; --amber:#ffcf4a; --cyan:#38e0e0; --txt:#f2f5f8; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0a0d10;color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;height:100%;aspect-ratio:540/810;max-width:100%;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--turf);
    border-radius:6px;box-shadow:0 0 0 3px #0a0d10,0 0 0 5px var(--steel),0 18px 50px rgba(0,0,0,.6);}
  .hint{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:11px;color:#9fb0be;pointer-events:none;padding:0 10px;line-height:1.5;}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c" width="540" height="810"></canvas></div></div>
<div class="hint" id="hint"></div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,FW=53.3,FL=120,PPY0=W/FW,ZOOM=0.88,TILT=1.0,PPY=PPY0*ZOOM,CX=26.65;
const DPR=Math.min(2,(window.devicePixelRatio||1)); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
const GAME_SPEED=0.52;  // <1 = slower, everything develops
const hintEl=document.getElementById('hint');
function gv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let AC=null; function actx(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function beep(freq,dur,type,vol,slideTo){ const c=actx(); if(!c) return; const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02); }
function sfx(n){ switch(n){
  case 'snap': beep(180,0.09,'square',0.11,140); break;
  case 'throw': beep(520,0.11,'square',0.09,900); break;
  case 'catch': beep(720,0.06,'square',0.13); setTimeout(()=>beep(980,0.07,'square',0.12),55); break;
  case 'tackle': beep(150,0.13,'sawtooth',0.16,60); break;
  case 'juke': beep(640,0.05,'square',0.09,880); break;
  case 'first': beep(660,0.08,'square',0.11); setTimeout(()=>beep(880,0.1,'square',0.11),85); break;
  case 'td': [523,659,784,1047,1047].forEach((fq,i)=>setTimeout(()=>beep(fq,0.13,'square',0.13),i*110)); break;
  case 'inc': beep(230,0.13,'square',0.09,160); break;
  case 'pick': beep(300,0.1,'square',0.12,520); setTimeout(()=>beep(700,0.12,'square',0.12),90); break;
  case 'bighit': beep(85,0.2,'sawtooth',0.22,42); setTimeout(()=>beep(190,0.08,'square',0.13),25); break;
  case 'fire': [420,560,740,990,1240].forEach((fq,i)=>setTimeout(()=>beep(fq,0.1,'square',0.14),i*70)); break; } }

let focusY=35, focusX=CX;
function clampCam(){ focusY=Math.max(8,Math.min(114,focusY)); const hw=(W/2)/PPY; focusX=Math.max(hw-2.5,Math.min(FW-hw+2.5,focusX)); }
function camFollow(dt){
  let ty;
  if(G.carrier && G.phase==='run'){ ty=G.carrier.y+(G.carrier.vy||0)*0.35+3; }
  else if(G.phase==='air'&&G.ball){ ty=(G.los+G.ball.y)*0.5+2; }
  else { ty=G.los+4; }
  focusY += (ty-focusY)*Math.min(1,dt*2.5);
  focusX=CX;
}
const HZ=-H*0.4, PB=42, PN=20, PK=(H*0.55-HZ)*PB;   // perspective: horizon, camera-back, near-plane
const sx=fx=>W/2+(fx-focusX)*PPY;
const sy=fy=>{ let d=(fy-(focusY-PB)); if(d<PN)d=PN; return HZ+PK/d; };
const toFX=px=>focusX+(px-W/2)/PPY;
const toFY=py=>{ const yy=Math.max(py,HZ+1); return (focusY-PB)+PK/(yy-HZ); };
function pdepth(fy){ let d=(fy-(focusY-PB)); if(d<PN)d=PN; return Math.max(0.5,Math.min(1.9, PB/d)); }

function rnd(a,b){ return a+Math.random()*(b-a); }
function accFor(pos){ return ({WR:40,CB:40,RB:43,TE:34,S:36,LB:33,QB:38,DL:30,OL:26}[pos]||36)*0.35; }
function spdFromRating(sr){ return (Math.max(5.4, sr*0.12 - 1.5))*1.42*GAME_SPEED; }
function ratingsFor(pos){ const R=(a,b)=>Math.round(rnd(a,b)); switch(pos){
  case 'WR': return {spd:R(84,95),str:R(52,68),sta:R(80,92),cat:R(80,93),acc:0,tps:0,tkl:R(45,60)};
  case 'CB': return {spd:R(85,95),str:R(52,66),sta:R(80,90),cat:R(62,80),acc:0,tps:0,tkl:R(60,74)};
  case 'RB': return {spd:R(83,93),str:R(70,86),sta:R(78,90),cat:R(60,78),acc:0,tps:0,tkl:R(45,58)};
  case 'TE': return {spd:R(72,82),str:R(78,90),sta:R(75,86),cat:R(72,86),acc:0,tps:0,tkl:R(55,68)};
  case 'S' : return {spd:R(80,89),str:R(68,82),sta:R(78,88),cat:R(66,80),acc:0,tps:0,tkl:R(76,88)};
  case 'LB': return {spd:R(75,85),str:R(80,92),sta:R(78,88),cat:R(52,66),acc:0,tps:0,tkl:R(84,94)};
  case 'QB': return {spd:R(68,80),str:R(58,72),sta:R(80,90),cat:0,acc:R(74,93),tps:R(76,95),tkl:R(40,55)};
  case 'DL': return {spd:R(66,79),str:R(86,96),sta:R(72,84),cat:0,acc:0,tps:0,tkl:R(80,92)};
  case 'OL': return {spd:R(58,70),str:R(84,95),sta:R(74,86),cat:0,acc:0,tps:0,tkl:R(50,62)};
  default: return {spd:78,str:75,sta:80,cat:70,acc:70,tps:70,tkl:70}; } }
function speedFor(pos){ switch(pos){
  case 'WR': return {spd:rnd(8.2,8.9),acc:40}; case 'CB': return {spd:rnd(8.2,8.7),acc:40};
  case 'RB': return {spd:rnd(8.1,8.7),acc:43}; case 'TE': return {spd:rnd(7.4,7.9),acc:34};
  case 'S' : return {spd:rnd(7.5,8.1),acc:36}; case 'LB': return {spd:rnd(7.1,7.8),acc:33};
  case 'QB': return {spd:rnd(6.9,7.5),acc:38}; case 'DL': return {spd:rnd(6.4,7.1),acc:30};
  case 'OL': return {spd:rnd(5.9,6.6),acc:26}; default: return {spd:8,acc:36}; } }
const BALLSPD=48*GAME_SPEED;
function steer(o,dx,dy,des,acc,dt){ const m=Math.hypot(dx,dy); let tvx=0,tvy=0;
  if(m>1e-4){ tvx=dx/m*des; tvy=dy/m*des; } o.vx=o.vx||0; o.vy=o.vy||0;
  const ax=tvx-o.vx,ay=tvy-o.vy,am=Math.hypot(ax,ay),mx=acc*dt;
  if(am>mx&&am>1e-6){ o.vx+=ax/am*mx; o.vy+=ay/am*mx; } else { o.vx=tvx; o.vy=tvy; } o.x+=o.vx*dt; o.y+=o.vy*dt; }
function seek(o,tx,ty,frac,dt){ const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  const des=o.spd*(frac==null?1:frac)*(d<1.2?d/1.2:1); steer(o,dx,dy,des,o.acc,dt); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function route(name,sX,los){ const inw=sX<CX?1:-1,out=-inw,P=[];
  switch(name){
    case 'go':P.push([sX,los+3],[sX,los+48]);break; case 'seam':P.push([sX,los+3],[sX,los+44]);break;
    case 'slant':P.push([sX,los+3],[sX+inw*13,los+10]);break; case 'curl':P.push([sX,los+13],[sX+inw*1,los+11]);break;
    case 'out':P.push([sX,los+10],[sX+out*12,los+10]);break; case 'corner':P.push([sX,los+13],[sX+out*12,los+24]);break;
    case 'post':P.push([sX,los+14],[sX+inw*12,los+26]);break; case 'dig':P.push([sX,los+13],[sX+inw*18,los+13]);break;
    case 'cross':P.push([sX,los+5],[sX+inw*27,los+11]);break; case 'flat':P.push([sX,los+1],[sX+out*12,los+3]);break;
    case 'hitch':P.push([sX,los+6],[sX,los+5]);break; case 'comeback':P.push([sX,los+16],[sX+out*4,los+13]);break;
    case 'shallow':P.push([sX,los+1],[sX+inw*24,los+4]);break;
    case 'swing':P.push([44,los-1],[50,los+5]);break; case 'check':P.push([sX,los-1],[sX+2,los+5]);break;
    default:P.push([sX,los+8]); } return P; }

const SYM=[{l:'A',c:'#4ade80'},{l:'B',c:'#f0645c'},{l:'X',c:'#5aa2ff'},{l:'Y',c:'#ffcf4a'},{l:'C',c:'#c07af0'}];
const FORMS={
  TWINS:  {X:5,  TE:17,   Y:37, Z:48, RB:24},
  TRIPS_R:{X:5,  TE:34.5, Y:39, Z:44, RB:24},
  TRIPS_L:{X:9,  TE:14,   Y:18.5, Z:48, RB:24},
  BUNCH_R:{X:6,  TE:37,   Y:40, Z:43, RB:24},
  PRO:    {X:5,  TE:35,   Y:41, Z:48, RB:24},
  SPREAD: {X:4,  TE:16,   Y:38, Z:49, RB:24},
  EMPTY:  {X:4,  TE:15,   Y:38, Z:49, RB:11},
};
const PASS=[
  { name:'CURL-FLAT', tag:'twins · curls hi-low', form:'TWINS',  r:{X:'curl',TE:'flat',Y:'flat',Z:'curl',RB:'block'} },
  { name:'SMASH',     tag:'3-man · corner over hitch', form:'TWINS', r:{X:'block',TE:'flat',Y:'hitch',Z:'corner',RB:'block'} },
  { name:'FLOOD',     tag:'trips · 3 levels right', form:'TRIPS_R', r:{X:'comeback',TE:'flat',Y:'out',Z:'go',RB:'block'} },
  { name:'MESH',      tag:'bunch · crossers', form:'BUNCH_R', r:{X:'go',TE:'cross',Y:'cross',Z:'curl',RB:'block'} },
  { name:'4 VERTS',   tag:'spread · take the top', form:'SPREAD', r:{X:'go',TE:'seam',Y:'seam',Z:'go',RB:'check'} },
  { name:'DAGGER',    tag:'3-man · seam clears dig', form:'TWINS', r:{X:'dig',TE:'block',Y:'seam',Z:'comeback',RB:'block'} },
  { name:'STICK',     tag:'trips · quick sticks', form:'TRIPS_R', r:{X:'slant',TE:'flat',Y:'hitch',Z:'out',RB:'block'} },
  { name:'SLANTS',    tag:'spread · beat pressure', form:'SPREAD', r:{X:'slant',TE:'slant',Y:'slant',Z:'slant',RB:'block'} },
  { name:'PA SHOT',   tag:'pro · max protect deep', form:'PRO', pa:true, roll:'R', r:{X:'post',TE:'block',Y:'block',Z:'go',RB:'block'} },
  { name:'HB SCREEN', tag:'pro · screen the back', form:'PRO', screen:true, r:{X:'block',TE:'block',Y:'flat',Z:'block',RB:'swing'} },
];
const RUN=[
  { name:'ISO', tag:'i-form · FB leads', poa:CX, pull:null, delay:0.5, fb:true },
  { name:'POWER RT', tag:'i-form · pull + kick', poa:32, pull:'LG', delay:0.68, fb:true },
  { name:'COUNTER LT', tag:'i-form · misdirection', poa:22, pull:'RG', delay:0.64, fb:true },
  { name:'INSIDE ZONE', tag:'read & cut back', poa:29, pull:null, delay:0.5, zone:true },
  { name:'STRETCH RT', tag:'reach the edge', poa:36, pull:null, delay:0.44, stretch:true },
  { name:'TOSS RT', tag:'pitch & sweep', poa:42, pull:'RG', delay:0.38, toss:true },
  { name:'DRAW', tag:'delayed draw', poa:CX, pull:null, delay:0.78, draw:true },
  { name:'TRAP RT', tag:'trap the tackle', poa:28, pull:'LG', delay:0.5 },
  { name:'ZONE READ', tag:'KEEP or give', poa:30, pull:null, delay:0.6, read:true },
  { name:'QB POWER', tag:'QB keeper + FB', poa:CX, pull:'LG', delay:0.42, qbrun:true, fb:true },
];
const COVS=[
  {name:'MAN',tag:'press · 1 deep'},{name:'COVER 2',tag:'2 deep halves'},{name:'COVER 3',tag:'3 deep zone'},
  {name:'COVER 4',tag:'quarters'},{name:'TAMPA 2',tag:'MLB deep mid'},{name:'COVER 6',tag:'quarter-half'},
  {name:'FIRE ZONE',tag:'zone blitz'},{name:'BLITZ',tag:'bring 6'},
];
const FRONTS=['BASE','CRASH','LB BLITZ','CONTAIN','SLANT RT','SLANT LT','SAFETY DOWN'];

let G, keys={}, aim=null, shake=0, flash=null, flashT=0, flashCol='#fff', assist=false;
const MASS={OL:2.5,DL:2.3,LB:1.8,TE:1.7,RB:1.45,S:1.35,QB:1.25,CB:1.15,WR:1.05};
function mk(x,y,pos,num,extra){ const rt=ratingsFor(pos); return Object.assign({x,y,pos,num,x0:x,y0:y,vx:0,vy:0,rt,spd:spdFromRating(rt.spd),acc:accFor(pos),down:0,_mass:(MASS[pos]||1.4)},extra||{}); }
function offenseIsUser(){ return G.userSide==='off'; }

function setupPlay(){
  const L=G.los; G.offCPU=(G.userSide==='def'); G.defUser=(G.userSide==='def'); G.control=null;
  // choose offensive play
  let P, isRun;
  if(G.userSide==='off'){ isRun=(G.tab==='run'); P=(isRun?RUN:PASS)[G.sel[G.tab]]; }
  else { isRun=Math.random()<0.45; P=(isRun?RUN:PASS)[(Math.random()*(isRun?RUN:PASS).length)|0]; }
  G.isRun=isRun; G.play=P; aim=null; G.t=0; G.ball=null; G.carrier=null; G.puff=null; G.pa=!!P.pa; G.roll=P.roll||null; G.paT=P.pa?0.5:0; G.rag=[]; G.parts=[]; G.flash2=0; G.shock=null; G.fb=null; G.qbKeep=false; G.readPlay=false; G.qbRun=false;
  const C_=mk(CX,L-1,'OL','55'),LG=mk(23.4,L-1,'OL','66'),RG=mk(29.9,L-1,'OL','68'),LT=mk(20.4,L-1,'OL','70'),RT=mk(32.9,L-1,'OL','74');
  G.ol=[LT,LG,C_,RG,RT]; G.qb=mk(CX,L-4,'QB','7');
  const X=mk(6,L-1,'WR','11'),TE=mk(18,L-1,'TE','88'),Y=mk(40,L-2,'WR','83'),Z=mk(47,L-1,'WR','80');
  G.skill={X,Z,Y,TE};
  if(isRun){ G.poaX=P.poa; G.runDir=P.poa>CX+1?'R':(P.poa<CX-1?'L':'M'); G.pull=P.pull==='LG'?LG:P.pull==='RG'?RG:null;
    const fb=!!P.fb; G.rb=mk(P.toss?(P.poa>CX?31:22):(fb?CX:24), L-(fb?8:7),'RB','22'); G.handoffT=P.delay*0.85+0.05; G.recv=[];
    G.fb = fb ? mk(CX, L-5.2,'RB','44') : null; G.readPlay=!!P.read; G.qbRun=!!P.qbrun;
  } else { const F=FORMS[P.form]||FORMS.TWINS; const empty=(P.form==='EMPTY');
    place(X,F.X,L-1); place(TE,F.TE,L-1); place(Y,F.Y,L-2); place(Z,F.Z,L-1);
    G.rb=mk(empty?F.RB:24, empty?L-1:L-7,'RB','22'); G.pull=null; G.recv=[];
    for(const k of ['X','TE','Y','Z']){ const pl=G.skill[k],rn=P.r[k]; if(rn&&rn!=='block'){ pl.route=route(rn,pl.x,L); pl.wp=0; G.recv.push(pl); } else pl.block=true; }
    const rbr=P.r.RB; if(rbr&&rbr!=='block'){ G.rb.route=route(rbr,G.rb.x,L); G.rb.wp=0; G.recv.push(G.rb); } else G.rb.block=true; }
  G.recv.forEach((r,i)=>{ r.btn=SYM[i%SYM.length]; }); G.off=[...G.ol,G.qb,G.rb,X,TE,Y,Z]; if(G.fb) G.off.push(G.fb);
  const LE=mk(21,L+1,'DL','91'),DTa=mk(24.5,L+1,'DL','94'),DTb=mk(28.8,L+1,'DL','97'),RE=mk(32,L+1,'DL','99');
  G.dl=[LE,DTa,DTb,RE];
  const WLB=mk(18,L+4.5,'LB','52'),MLB=mk(CX,L+5,'LB','54'),SLB=mk(36,L+4.5,'LB','58');
  const CBL=mk(7,L+6,'CB','24'),CBR=mk(46,L+6,'CB','21'),FS=mk(24,L+13,'S','31'),SS=mk(34,L+11,'S','29');
  G.def=[LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS];
  const refs={LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS,X,TE,Y,Z};
  G.cov = (G.userSide==='def') ? COVS[G.selDef].name : COVS[(Math.random()*COVS.length)|0].name;
  G.front = FRONTS[(Math.random()*FRONTS.length)|0];
  assignCoverage(G.cov,refs); assignFront(G.front,refs);
  if(G.defUser){ G.control = nearestDef(G.qb); }
  G.rushFree=0.22; G.goForIt=false; G.phase='presnap'; focusY=L+4; focusX=CX;
}
function job(d,o){ d.job=o; } function place(d,x,y){ d.x=x; d.y=y; d.x0=x; d.y0=y; }
function nearestDef(ref){ let best=null,bd=9e9; for(const d of G.def){ const dd=dist(d,ref); if(dd<bd){bd=dd;best=d;} } return best; }
function assignCoverage(cov,p){ const {LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS,X,TE,Y,Z}=p, L=G.los;
  G.dl.forEach(d=>job(d,{t:'rush'}));
  if(cov==='MAN'){ place(CBL,7,L+2); place(CBR,46,L+2); place(FS,CX,L+14); place(SS,40,L+7);
    job(CBL,{t:'man',tgt:X}); job(CBR,{t:'man',tgt:Z}); job(SS,{t:'man',tgt:Y}); job(MLB,{t:'man',tgt:TE}); job(WLB,{t:'man',tgt:G.rb}); job(SLB,{t:'spy'}); job(FS,{t:'zoneD',lm:{x:CX,y:L+16}});
  } else if(cov==='BLITZ'){ place(CBL,7,L+2); place(CBR,46,L+2); place(FS,30,L+6); place(SS,20,L+6); place(MLB,CX,L+3); place(SLB,34,L+3);
    job(CBL,{t:'man',tgt:X}); job(CBR,{t:'man',tgt:Z}); job(SS,{t:'man',tgt:Y}); job(WLB,{t:'man',tgt:TE}); job(FS,{t:'man',tgt:G.rb}); job(MLB,{t:'rush'}); job(SLB,{t:'rush'});
  } else if(cov==='COVER 3'){ place(CBL,8,L+7); place(CBR,45,L+7); place(FS,CX,L+13); place(SS,38,L+8);
    job(CBL,{t:'zoneD',lm:{x:9,y:L+18}}); job(CBR,{t:'zoneD',lm:{x:44,y:L+18}}); job(FS,{t:'zoneD',lm:{x:CX,y:L+19}});
    job(WLB,{t:'zoneU',lm:{x:14,y:L+8}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+9}}); job(SLB,{t:'zoneU',lm:{x:38,y:L+8}}); job(SS,{t:'zoneU',lm:{x:48,y:L+6}});
  } else if(cov==='COVER 4'){ place(CBL,8,L+7); place(CBR,45,L+7); place(FS,20,L+13); place(SS,33,L+13);
    job(CBL,{t:'carry',tgt:X}); job(CBR,{t:'carry',tgt:Z}); job(FS,{t:'carry',tgt:TE}); job(SS,{t:'carry',tgt:Y});
    job(WLB,{t:'zoneU',lm:{x:16,y:L+7}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+8}}); job(SLB,{t:'zoneU',lm:{x:38,y:L+7}});
  } else if(cov==='TAMPA 2'){ place(FS,18,L+14); place(SS,36,L+14); place(CBL,7,L+5); place(CBR,46,L+5); place(MLB,CX,L+5);
    job(FS,{t:'zoneD',lm:{x:16,y:L+18}}); job(SS,{t:'zoneD',lm:{x:37,y:L+18}}); job(MLB,{t:'zoneD',lm:{x:CX,y:L+20}});
    job(CBL,{t:'zoneU',lm:{x:7,y:L+5}}); job(CBR,{t:'zoneU',lm:{x:47,y:L+5}}); job(WLB,{t:'zoneU',lm:{x:18,y:L+9}}); job(SLB,{t:'zoneU',lm:{x:36,y:L+9}});
  } else if(cov==='COVER 6'){ place(CBL,8,L+7); place(FS,17,L+13); place(SS,36,L+14); place(CBR,46,L+5);

function passDiagram(p,x,y,w,h){ const base=y+h-2; ctx.strokeStyle='rgba(223,232,255,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,base-2); ctx.lineTo(x+w,base-2); ctx.stroke();
  const F=(typeof FORMS!=='undefined'&&FORMS[p.form])||{X:6,TE:18,Y:38,Z:47}; const cols={X:x+(F.X/53.3)*w,TE:x+(F.TE/53.3)*w,Y:x+(F.Y/53.3)*w,Z:x+(F.Z/53.3)*w};
  for(const k of ['X','TE','Y','Z']){ const rn=p.r[k],bx=cols[k]; ctx.fillStyle=gv('--home-lt'); ctx.beginPath(); ctx.arc(bx,base-6,3.4,0,7); ctx.fill();
    if(!rn||rn==='block'){ ctx.strokeStyle='rgba(180,190,210,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(bx-3,base-1); ctx.lineTo(bx+3,base-5); ctx.stroke(); continue; }
    const inw=(bx<x+w/2)?1:-1,out=-inw; let ox=bx,oy=base-6; ctx.strokeStyle=gv('--amber'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ox,oy);
    const seg={go:[[0,-1]],seam:[[0,-1]],slant:[[0,-.25],[inw*.5,-.5]],curl:[[0,-.8],[0,.08]],out:[[0,-.55],[out*.55,0]],corner:[[0,-.6],[out*.5,-.5]],dig:[[0,-.7],[inw*.7,0]],cross:[[0,-.3],[inw*.9,-.3]],flat:[[0,-.1],[out*.6,0]],post:[[0,-.6],[inw*.5,-.5]],hitch:[[0,-.5],[0,.06]],comeback:[[0,-.8],[out*.3,.15]],shallow:[[0,-.15],[inw*.8,-.1]]}[rn]||[[0,-.7]];
    for(const [dx,dy] of seg){ ox+=dx*w*0.5; oy+=dy*h*0.9; ctx.lineTo(ox,oy);} ctx.stroke(); } }
function runDiagram(p,x,y,w,h){ const base=y+h-2, cx=x+w/2; ctx.strokeStyle='rgba(223,232,255,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,base-2); ctx.lineTo(x+w,base-2); ctx.stroke();
  ctx.fillStyle='#7d8aa8'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(cx+(i-2)*w*0.13,base-6,3,0,7); ctx.fill(); }
  const holeX=cx+((p.poa-CX)/12)*w*0.5; ctx.fillStyle='rgba(255,207,74,0.18)'; ctx.fillRect(holeX-w*0.06,y+4,w*0.12,h-10);
  ctx.strokeStyle=gv('--good'); ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx,base-2); ctx.lineTo(cx,base-h*0.35); ctx.lineTo(holeX,y+6); ctx.stroke();
  ctx.fillStyle=gv('--good'); ctx.beginPath(); ctx.moveTo(holeX,y+2); ctx.lineTo(holeX-4,y+11); ctx.lineTo(holeX+4,y+11); ctx.fill();
  if(p.pull){ ctx.strokeStyle='#7ac8ff'; ctx.lineWidth=2; ctx.setLineDash([2,3]); const gx=cx+(p.pull==='LG'?-1:1)*w*0.13; ctx.beginPath(); ctx.moveTo(gx,base-6); ctx.lineTo(holeX,base-h*0.35); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle=gv('--home'); ctx.beginPath(); ctx.arc(cx,base+6,3.6,0,7); ctx.fill(); }
function drawHUD(){ const h=52; ctx.fillStyle='rgba(10,13,16,0.93)'; ctx.fillRect(0,0,W,h); ctx.fillStyle=gv('--steel'); ctx.fillRect(0,h-3,W,3);
  const you=String(G.you).padStart(2,'0'), cpu=String(G.cpu).padStart(2,'0'), uCol=gv('--home-lt'), cCol=gv('--away-lt'); ctx.textAlign='center';
  ctx.fillStyle=uCol; ctx.font="11px 'Press Start 2P',monospace"; ctx.fillText('YOU',W*0.13,20); ctx.fillStyle='#fff'; ctx.font="17px 'Press Start 2P',monospace"; ctx.fillText(you,W*0.13,41);
  ctx.fillStyle=cCol; ctx.font="11px 'Press Start 2P',monospace"; ctx.fillText('CPU',W*0.87,20); ctx.fillStyle='#fff'; ctx.font="17px 'Press Start 2P',monospace"; ctx.fillText(cpu,W*0.87,41);
  if(G.phase!=='select'){ const toGo=G.first>=110?'GOAL':Math.max(0,Math.round(G.first-G.los)),dn=['1ST','2ND','3RD','4TH'][Math.min(3,G.down-1)];
    ctx.fillStyle=gv('--txt'); ctx.font="14px 'Press Start 2P',monospace"; ctx.fillText(dn+' & '+toGo,W/2,24);
    ctx.fillStyle=G.userSide==='off'?uCol:cCol; ctx.font='9px ui-monospace,monospace'; ctx.fillText((G.userSide==='off'?'OFFENSE':'DEFENSE')+'  ·  DRIVE '+G.drives,W/2,42); }
  else { ctx.fillStyle=G.userSide==='off'?uCol:cCol; ctx.font="12px 'Press Start 2P',monospace"; ctx.fillText(G.userSide==='off'?'OFFENSE':'DEFENSE',W/2,31); }
  ctx.textAlign='left'; }
function banner(big,small){ ctx.textAlign='center'; ctx.fillStyle='rgba(10,13,16,0.55)'; ctx.fillRect(0,H*0.44,W,86);
  ctx.fillStyle=gv('--amber'); ctx.font="18px 'Press Start 2P',monospace"; ctx.fillText(big,W/2,H*0.44+40);
  if(small){ ctx.fillStyle='#cdd8e2'; ctx.font='11px ui-monospace,monospace'; ctx.fillText(small,W/2,H*0.44+66);} ctx.textAlign='left'; }
function drawBtn(b,label,col){ ctx.fillStyle='rgba(10,13,16,0.58)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke(); ctx.fillStyle=col; ctx.textAlign='center'; ctx.font="10px 'Press Start 2P',monospace"; ctx.fillText(label,b.x,b.y+4); ctx.textAlign='left'; }
function badge(x,y,b){ const px=sx(x),py=sy(y)-PPY*2.0; ctx.fillStyle=b.c; ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(px,py,9.5,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle='#0a0d10'; ctx.font="bold 9px 'Press Start 2P',monospace"; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.l,px,py+1); ctx.textBaseline='alphabetic'; ctx.textAlign='left'; }
function turboMeter(){ const p=G.onFire?1:(G.turbo||0), bx=W/2-64, by=H-24; ctx.fillStyle='rgba(10,13,16,0.6)'; ctx.fillRect(bx,by,128,9); ctx.fillStyle=G.onFire?'#ff8a3c':'#38e0e0'; ctx.fillRect(bx,by,128*p,9); ctx.strokeStyle='#2c3742'; ctx.strokeRect(bx,by,128,9); ctx.fillStyle=G.onFire?'#ff8a3c':'#9fb0be'; ctx.font="7px ui-monospace,monospace"; ctx.textAlign='center'; ctx.fillText(G.onFire?'ON FIRE':'TURBO',W/2,by-3); ctx.textAlign='left'; }
function drawHelpBtn(){ const b=BTN.help; ctx.fillStyle='rgba(10,13,16,0.7)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle='#9fb0be'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#cdd8e2'; ctx.font="12px 'Press Start 2P',monospace"; ctx.textAlign='center'; ctx.fillText(G.showHelp?'x':'?',b.x,b.y+5); ctx.textAlign='left'; }
function drawHelp(){ ctx.fillStyle='rgba(6,10,16,0.9)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle=gv('--amber'); ctx.font="15px 'Press Start 2P',monospace"; ctx.fillText('CONTROLS',W/2,120);
  const L=[['PASS','tap a receiver button'],['','quick tap = LOB · hold = LASER'],['','RUN button = tuck & scramble'],
    ['RUN','drag to steer'],['','JUKE · SPIN · hold TURBO'],['','turbo + power = TRUCK a defender'],
    ['DEFENSE','pre-snap: tap a defender to pick'],['','drag to move · SWITCH · DIVE'],
    ['DESKTOP','WASD · 1-5 throw · Space juke · C spin'],['','Shift turbo · E switch · H help']];
  ctx.font='11px ui-monospace,monospace'; let y=170;
  for(const [a,b] of L){ if(a){ ctx.fillStyle=gv('--cyan'); ctx.fillText(a,W/2,y); y+=20; } ctx.fillStyle='#cdd8e2'; ctx.fillText(b,W/2,y); y+=(a?26:22); }
  ctx.fillStyle='#9fb0be'; ctx.font='10px ui-monospace,monospace'; ctx.fillText('tap  x  to close',W/2,y+16); ctx.textAlign='left'; }
function drawTouchUI(){ drawHelpBtn(); if(G.showHelp){ drawHelp(); return; } if(G.phase==='select'||G.phase==='dead') return;
  if(G.defUser){ if(G.phase==='presnap'){ drawBtn(BTN.main,'SNAP',gv('--good')); } else { drawBtn(BTN.main,'SWITCH',gv('--cyan')); drawBtn(BTN.sub,'DIVE',gv('--amber')); drawBtn(BTN.turbo,'TURBO',(turboHeld||G.onFire)?'#7ff0f0':'#38e0e0'); turboMeter(); } return; }
  if((G.phase==='presnap'||G.phase==='live')&&!G.isRun){ for(const r of (G.recv||[])){ if(r!==G.carrier&&r.btn) badge(r.x,r.y,r.btn); } }
  if(G.phase==='presnap') return;
  if(G.phase==='live'){ drawBtn(BTN.scr,'RUN',gv('--good'));
    if(G.charge){ const p=Math.min(1,G.charge.dur/0.45),bx=W/2-72,by=H-42; ctx.fillStyle='rgba(10,13,16,0.6)'; ctx.fillRect(bx,by,144,12); ctx.fillStyle=p>0.66?'#f0645c':(p>0.33?'#ffcf4a':'#4ade80'); ctx.fillRect(bx,by,144*p,12); ctx.strokeStyle='#2c3742'; ctx.strokeRect(bx,by,144,12); ctx.fillStyle='#cdd8e2'; ctx.font='8px ui-monospace,monospace'; ctx.textAlign='center'; ctx.fillText(p<0.4?'LOB':(p>0.7?'LASER':'TOUCH'),W/2,by-4); ctx.textAlign='left'; }
    for(const b of recvButtons()){ ctx.fillStyle='rgba(10,13,16,0.62)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle=b.btn.c; ctx.lineWidth=3.5; ctx.stroke(); ctx.fillStyle=b.btn.c; ctx.textAlign='center'; ctx.font="bold 15px 'Press Start 2P',monospace"; ctx.fillText(b.btn.l,b.x,b.y+6); ctx.textAlign='left'; } return; }
  if(G.phase==='handoff'&&G.readPlay){ drawBtn(BTN.main,G.qbKeep?'KEEP!':'KEEP',gv('--good')); ctx.fillStyle=gv('--good'); ctx.font="9px 'Press Start 2P',monospace"; ctx.textAlign='center'; ctx.fillText('READ THE END — KEEP OR GIVE',W/2,H*0.5); ctx.textAlign='left'; turboMeter(); return; }
  if(G.phase==='run'||G.phase==='handoff'){ drawBtn(BTN.main,'JUKE',gv('--amber')); drawBtn(BTN.sub,'SPIN',gv('--cyan')); drawBtn(BTN.turbo,'TURBO',(turboHeld||G.onFire)?'#7ff0f0':'#38e0e0'); turboMeter(); } }
function drawFlash(){ const a=Math.min(1,flashT/0.5); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.fillStyle=flashCol; ctx.font="24px 'Press Start 2P',monospace"; ctx.fillText(flash,W/2,H*0.36); ctx.globalAlpha=1; ctx.textAlign='left'; }

function frame(now){ let dt=Math.min(0.033,(now-last)/1000); last=now; if((G.freeze||0)>0){ G.freeze-=dt; if(shake>0) shake=Math.max(0,shake-dt*60); } else { update(dt); } draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if(hintEl){ hintEl.innerHTML=''; if(hintEl.style) hintEl.style.display='none'; }
if(typeof globalThis!=='undefined') globalThis.__hooks={ setupPlay,snap,throwBall,update,draw,getG:()=>G,keys:()=>keys,pick:(tab,idx)=>{G.tab=tab;G.sel[tab]=idx;},setSide:s=>{G.userSide=s;},setDef:i=>{G.selDef=i;},sw:switchDefender, throwToReceiver:(r)=>throwToReceiver(r), nearestRecv:(x,y)=>nearestRecv(x,y) };
