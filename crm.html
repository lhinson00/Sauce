<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM Sales CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--bg2:#12161c;--bg3:#1a1f28;--bg4:#222834;
  --border:#222834;--border2:#2d3748;
  --amber:#ff8c00;--amber2:#e07800;--amber-dim:rgba(255,140,0,.12);--amber-glow:rgba(255,140,0,.06);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --yellow:#eab308;--yellow-dim:rgba(234,179,8,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --text:#f0f4fc;--text2:#b8c4d8;--text3:#7a8799;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;min-height:100vh;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:40px;width:360px;max-width:95vw;}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.login-sub{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
.login-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block;}
.login-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .15s;margin-bottom:14px;color-scheme:dark;}
.login-input:focus{border-color:var(--amber2);}
.login-btn{width:100%;background:var(--amber);color:#000;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:12px;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--amber2);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:18px;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:100;}
.hlogo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--amber);text-transform:uppercase;}
.hbadge{font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;border-left:1px solid var(--border2);padding-left:14px;}
.hnav{display:flex;gap:2px;margin-left:auto;}
.hnav-btn{padding:5px 14px;border-radius:6px;border:1px solid transparent;background:none;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.hnav-btn:hover{background:var(--bg3);}
.hnav-btn.active{color:var(--amber);background:var(--amber-dim);border-color:var(--amber2);}
.huser{font-size:11px;color:var(--text3);margin-left:8px;padding-left:14px;border-left:1px solid var(--border2);}
.hlogout{background:none;border:1px solid var(--border2);color:var(--text3);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:'Barlow',sans-serif;margin-left:8px;transition:all .15s;}
.hlogout:hover{color:var(--red);border-color:var(--red);}

/* SHELL */
#app{display:none;}
.view{display:none;height:calc(100vh - 52px);overflow-y:auto;}
.view.active{display:block;}
.page-pad{padding:20px;}

/* SHARED */
.section-hd{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text3);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block;}
.btn-primary{background:var(--amber);color:#000;}
.btn-primary:hover{background:var(--amber2);}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text);}
.btn-ghost:hover{border-color:var(--text3);}
.btn-sm{padding:5px 12px;font-size:11px;}

/* BADGES */
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
.badge-Quoted   {background:var(--bg4);color:var(--text2);border:1px solid var(--border2);}
.badge-Contacted{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(234,179,8,.3);}
.badge-Hot      {background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber2);}
.badge-Sold     {background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.badge-Shipped  {background:rgba(34,197,94,.06);color:#86efac;border:1px solid rgba(134,239,172,.2);}
.badge-Dead     {background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.badge-matonly  {background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber2);font-size:9px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--amber-glow) 0%,transparent 60%);pointer-events:none;}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.kpi-value{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1;}
.kpi-value.amber{color:var(--amber);}.kpi-value.green{color:var(--green);}.kpi-value.red{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px;}

/* MONTH CARDS */
.vtoggle-row{display:flex;gap:6px;margin-bottom:12px;}
.vtoggle{padding:4px 12px;border-radius:5px;border:1px solid var(--border2);background:none;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.vtoggle.active{background:var(--amber-dim);border-color:var(--amber2);color:var(--amber);}
.months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-bottom:20px;}
.month-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s;}
.month-card:hover{border-color:var(--border2);background:var(--bg3);}
.month-card.cur{border-color:var(--amber2);background:var(--amber-dim);}
.mc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.mc-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;}
.mc-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--text);line-height:1;margin-bottom:6px;}
.mc-bar-wrap{height:3px;background:var(--border2);border-radius:2px;margin-bottom:7px;}
.mc-bar{height:3px;border-radius:2px;background:var(--amber);}
.mc-stats{display:flex;gap:12px;font-size:11px;color:var(--text3);}
.mc-stats span{color:var(--text2);font-weight:500;}

/* FOLLOW-UP QUEUE */
.fup-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;flex-wrap:wrap;}
.fup-row:hover{background:var(--bg3);}
.fup-row:last-child{border-bottom:none;}
.fup-overdue .fup-date{color:var(--red)!important;}
.fup-soon    .fup-date{color:var(--yellow)!important;}
.fup-date{font-size:11px;font-weight:700;min-width:90px;}
.fup-name{font-weight:500;flex:1;min-width:120px;}
.fup-desc{font-size:12px;color:var(--text3);flex:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.fup-actions{display:flex;gap:6px;flex-shrink:0;}
.fup-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;cursor:pointer;font-family:'Barlow',sans-serif;text-decoration:none;display:inline-block;transition:all .15s;}
.fup-btn:hover{border-color:var(--amber2);color:var(--amber);}

/* PIPELINE TABLE */
.toolbar{display:flex;gap:10px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;flex-shrink:0;}
.tb-select,.tb-input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:7px 12px;outline:none;transition:border-color .15s;color-scheme:dark;accent-color:var(--amber);}
.tb-select:focus,.tb-input:focus{border-color:var(--amber2);}
.tb-input{flex:1;min-width:180px;}
.pipe-shell{display:flex;flex-direction:column;height:100%;}
.tbl-wrap{flex:1;overflow-y:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;background:var(--bg2);z-index:10;}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--text2);}
.si{margin-left:4px;opacity:.4;font-size:9px;}
.si.asc::after{content:'\25B2';opacity:1;color:var(--amber);}
.si.desc::after{content:'\25BC';opacity:1;color:var(--amber);}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);white-space:nowrap;}
tr.trow:hover td{background:var(--bg3);cursor:pointer;}
tr.row-hot td{border-left:3px solid var(--amber);}
tr.row-dead td{opacity:.5;}
.td-name{color:var(--text);font-weight:500;}
.td-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;}
.td-green{color:var(--green);}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;transition:all .15s;text-decoration:none;display:inline-block;}
.icon-btn:hover{color:var(--amber);}
.status-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:4px 8px;outline:none;cursor:pointer;color-scheme:dark;}
.empty-state{text-align:center;padding:60px;color:var(--text3);}

/* DETAIL OVERLAY */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);z-index:500;overflow-y:auto;padding:16px;}
.detail-overlay.open{display:flex;align-items:flex-start;justify-content:center;}
.dp{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:880px;margin:auto;}
.dp-hd{background:var(--bg3);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:14px;}
.dp-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;flex:1;}
.dp-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px;}
.dp-close:hover{color:var(--text);}
.dp-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.dp-body{grid-template-columns:1fr;}}
.dp-full{grid-column:1/-1;}
.dp-sec{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.f-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.f-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);}
.f-ctrl{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 12px;outline:none;transition:border-color .15s;color-scheme:dark;accent-color:var(--amber);}
.f-ctrl:focus{border-color:var(--amber2);}
textarea.f-ctrl{resize:vertical;min-height:60px;}
.dp-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;background:var(--bg3);border-top:1px solid var(--border);border-radius:0 0 12px 12px;}
.act-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:all .15s;}
.act-link:hover{border-color:var(--amber2);color:var(--amber);}
.act-link.green{border-color:rgba(34,197,94,.3);color:var(--green);}
.act-link.green:hover{background:var(--green-dim);}

/* BUILDING GRID */
.bld-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.bld-item{background:var(--bg3);border-radius:5px;padding:8px 10px;}
.bld-lbl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.bld-val{font-size:13px;color:var(--text);font-weight:500;}

/* PRICE ROWS */
.price-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
.price-row:last-child{border-bottom:none;}
.price-lbl{font-size:12px;color:var(--text3);}
.price-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--text);font-weight:600;}

/* CONTACT LOG */
.log-entry{border-left:2px solid var(--border2);padding:6px 0 6px 12px;margin-bottom:8px;position:relative;}
.log-entry::before{content:'';position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--border2);}
.log-entry.call::before{background:var(--green);}
.log-entry.text::before{background:var(--amber);}
.log-entry.email::before{background:var(--purple);}
.log-entry.status_change::before{background:var(--yellow);}
.log-time{font-size:10px;color:var(--text3);margin-bottom:2px;}
.log-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-right:5px;}
.log-body{font-size:13px;color:var(--text2);}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">STM Sales</div>
    <div class="login-sub">CRM &amp; Pipeline</div>
    <label class="login-label">Username</label>
    <input class="login-input" id="l-user" type="text" autocomplete="username" placeholder="username">
    <label class="login-label">Password</label>
    <input class="login-input" id="l-pass" type="password" autocomplete="current-password" placeholder="password">
    <button class="login-btn" id="l-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="hlogo">STM Sales</div>
    <div class="hbadge">CRM</div>
    <nav class="hnav">
      <button class="hnav-btn active" onclick="showView('dashboard')">Dashboard</button>
      <button class="hnav-btn" onclick="showView('pipeline')">Pipeline</button>
      <button class="hnav-btn" onclick="showView('commission')">Commission</button>
    </nav>
    <span class="huser" id="h-user"></span>
    <button class="hlogout" onclick="doLogout()">Sign Out</button>
  </div>

  <!-- DASHBOARD -->
  <div class="view active" id="view-dashboard">
    <div class="page-pad">
      <div class="kpi-row" id="dash-kpis"></div>

      <div class="section-hd" style="display:flex;justify-content:space-between;align-items:center">
        <span>Follow-Up Queue</span>
        <span id="fup-count" style="font-size:11px;color:var(--text3)"></span>
      </div>
      <div class="card" style="margin-bottom:20px;padding:0"><div id="fup-list"></div></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text3)" id="mv-label">All Months — by Quote Date</span>
        <div class="vtoggle-row" style="margin:0">
          <button class="vtoggle active" id="vt-quoted"   onclick="setMV('quoted')">Quoted</button>
          <button class="vtoggle"        id="vt-sold"     onclick="setMV('sold')">Sold</button>
          <button class="vtoggle"        id="vt-shipping" onclick="setMV('shipping')">Shipping</button>
        </div>
      </div>
      <div class="months-grid" id="dash-months"></div>
    </div>
  </div>

  <!-- PIPELINE -->
  <div class="view" id="view-pipeline">
    <div class="pipe-shell">
      <div class="toolbar">
        <select class="tb-select" id="f-status" onchange="renderPipeline()">
          <option value="">All Statuses</option>
          <option>Quoted</option><option>Contacted</option><option>Hot</option>
          <option>Sold</option><option>Shipped</option><option>Dead</option>
        </select>
        <select class="tb-select" id="f-month" onchange="renderPipeline()">
          <option value="">All Months</option>
        </select>
        <input class="tb-input" id="f-search" placeholder="Search name, quote #, city, building…" oninput="renderPipeline()">
        <a class="btn btn-primary btn-sm" href="sales-tool.html" target="_blank">+ New Quote</a>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="psort('date')">Date<span class="si" data-col="date"></span></th>
              <th onclick="psort('name')">Customer<span class="si" data-col="name"></span></th>
              <th>Building</th>
              <th onclick="psort('total')">Quoted $<span class="si" data-col="total"></span></th>
              <th>Status</th>
              <th onclick="psort('follow_up_date')">Follow-Up<span class="si" data-col="follow_up_date"></span></th>
              <th>Quick Actions</th>
            </tr>
          </thead>
          <tbody id="pipe-body"></tbody>
        </table>
        <div id="pipe-empty" class="empty-state" style="display:none">No quotes found.</div>
      </div>
    </div>
  </div>

  <!-- COMMISSION -->
  <div class="view" id="view-commission">
    <div class="page-pad">
      <div class="section-hd">Commission Tracker — Sold &amp; Shipped</div>
      <div class="kpi-row" id="comm-kpis"></div>
      <div class="months-grid" id="comm-months"></div>
    </div>
  </div>
</div>

<!-- DETAIL OVERLAY -->
<div class="detail-overlay" id="detail-overlay">
  <div class="dp" id="dp">
    <div class="dp-hd">
      <div style="flex:1">
        <div class="dp-title" id="dp-title">—</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px" id="dp-sub"></div>
      </div>
      <div id="dp-badge"></div>
      <button class="dp-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="dp-body" id="dp-body"></div>
    <div class="dp-actions" id="dp-actions"></div>
  </div>
</div>

<script>
// CONFIG
const SB_URL  = 'https://rvhzploxeeqgggjefsif.supabase.co';
const SB_KEY  = 'sb_publishable_JFnksTNbexbFQ0LZtC3Olg_Tf2baKx4';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
const SALES   = 'sales-tool.html';
const MONTHS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STATUSES= ['Quoted','Contacted','Hot','Sold','Shipped','Dead'];

// STATE
let CU = null;         // currentUser
let QQ = [];           // all quotes
let _mv = 'quoted';    // month view
let _ps = {col:'date',dir:-1}; // pipeline sort
let _cq = null;        // current quote in detail

// ── AUTH ──────────────────────────────────────────────────────────────────────
function restoreSession() {
  try {
    const raw = localStorage.getItem('sauce_user') || sessionStorage.getItem('sauce_user');
    if (!raw) return false;
    const u = JSON.parse(raw);
    if (!u || !u.token || (u.loginExpiry && Date.now() > u.loginExpiry)) return false;
    CU = u; return true;
  } catch(e) { return false; }
}

async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const err = document.getElementById('l-err');
  const btn = document.getElementById('l-btn');
  if (!u || !p) { err.textContent = 'Enter username and password.'; return; }
  btn.textContent = 'Signing in…'; btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'login', username:u, password:p }) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Login failed');
    CU = { username:u, fullName:d.fullName||u, email:d.email||'', token:d.token||'',
           loginExpiry: Date.now() + 24*3600*1000 };
    localStorage.setItem('sauce_user', JSON.stringify(CU));
    startApp();
  } catch(e) {
    err.textContent = e.message || 'Login failed';
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    ...opts, headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if (r.status === 204) return null;
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

async function loadQuotes() {
  const rows = await sbFetch(
    `quotes?salesman=eq.${enc(CU.username)}&select=id,date,name,phone,email,city,total,specs,status,form_fields,pricing_results,config_encoded,updated_at,crm_data,snapshot,display_summary&order=updated_at.desc&limit=500`
  );
  return (rows||[]).map(norm);
}

function norm(r) {
  const c    = r.crm_data || {};
  const snap = r.snapshot  || {};
  const ds   = r.display_summary || snap.displaySummary || {};
  return {
    id: r.id||'', date: r.date||'', updated_at: r.updated_at||'',
    name: r.name||'', phone: r.phone||'', email: r.email||'', city: r.city||'',
    total: (parseMoney(r.total) > 0 ? r.total : null) || (r.pricing_results||{}).totalCombined || (r.pricing_results||{}).total || '', specs: r.specs||'',
    status:          c.status          || r.status || 'Quoted',
    follow_up_date:  c.follow_up_date  || '',
    ship_date:       c.ship_date       || '',
    final_material:  c.final_material  || 0,
    cs_amount:       c.cs_amount       || 0,
    mat_only:        c.mat_only        || false,
    selected_variants: c.selected_variants || r.pricing_results?.selectedVariants || [],
    form_fields:     r.form_fields     || {},
    pricing_results: r.pricing_results || {},
    config_encoded:  r.config_encoded  || '',
    display_summary: ds,
    snapshot:        snap,
  };
}

async function patchCrm(id, patch) {
  // Read existing crm_data, merge, write back
  const rows = await sbFetch(`quotes?id=eq.${enc(id)}&select=crm_data`);
  const existing = (rows&&rows[0]&&rows[0].crm_data) || {};
  const merged = { ...existing, ...patch };
  await sbFetch(`quotes?id=eq.${enc(id)}`, {
    method:'PATCH', body:JSON.stringify({ crm_data:merged, updated_at:new Date().toISOString() }),
    headers:{'Prefer':'return=minimal'}
  });
  const q = QQ.find(q=>q.id===id);
  if (q) Object.assign(q, patch);
}

async function loadNotes(qid) {
  try {
    const rows = await sbFetch(`crm_notes?quote_id=eq.${enc(qid)}&order=created_at.desc`);
    return rows || [];
  } catch(e) { return []; }
}

async function saveNote(qid, type, body) {
  try {
    await sbFetch('crm_notes', { method:'POST',
      body: JSON.stringify({ quote_id:qid, salesman:CU.username, type, body, created_at:new Date().toISOString() }),
      headers:{'Prefer':'return=minimal'}
    });
  } catch(e) { console.warn('Note save failed (crm_notes table may not exist yet):', e.message); }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
const enc  = s => encodeURIComponent(s);
const fmt$ = n => '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => {
  const v=Math.abs(+n||0);
  if(v>=1000000) return '$'+(n/1000000).toFixed(2)+'M';
  if(v>=1000)    return '$'+(n/1000).toFixed(0)+'K';
  return fmt$(n);
};
function parseMoney(s) {
  if(typeof s==='number') return isNaN(s) ? 0 : s;
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[$,\s]/g,''));
  return isNaN(n) ? 0 : n;
}
function qMonth(q) {
  const s = (q.date||'').trim();
  if(!s) return '';
  // Strip time portion if present: "05/05/2026 11:57" → "05/05/2026"
  const datePart = s.split(' ')[0];
  let d;
  if(datePart.includes('/')) {
    const p = datePart.split('/');
    if(+p[0] > 31) d = new Date(+p[0], +p[1]-1, +p[2]); // YYYY/MM/DD
    else           d = new Date(+p[2], +p[0]-1, +p[1]);  // M/D/YYYY
  } else {
    d = new Date(datePart+'T00:00:00');
  }
  if(isNaN(d)) return '';
  return MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function shipMonth(q) {
  if(!q.ship_date) return '';
  const d=new Date(q.ship_date+'T00:00:00');
  if(isNaN(d)) return '';
  return MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function curMonth() { const d=new Date(); return MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function fmtDate(s) {
  if(!s) return '—';
  const d=new Date((s.includes('T')?s:s+'T00:00:00'));
  if(isNaN(d)) return s;
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function fuClass(s) {
  if(!s) return '';
  const d=new Date(s+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const diff=(d-now)/86400000;
  if(diff<0) return 'fup-overdue';
  if(diff<=3) return 'fup-soon';
  return '';
}
function badge(status) {
  return `<span class="badge badge-${status||'Quoted'}">${status||'Quoted'}</span>`;
}
function monthSort(a,b) {
  const da=new Date(a.split(' ')[1],MONTHS.indexOf(a.split(' ')[0]));
  const db=new Date(b.split(' ')[1],MONTHS.indexOf(b.split(' ')[0]));
  return db-da;
}

  const sold=QQ.filter(q=>['Sold','Shipped'].includes(q.status));

  sold.forEach(q=>{
    const m=q.status==='Shipped'?(shipMonth(q)||qMonth(q)):qMonth(q);

          <div class="mc-val">${fmtK(s.mat)}</div>

            <div>Comm: <span style="color:var(--green)">${fmtK(s.comm)}</span></div>
            <div>CS: <span style="color:var(--red)">${s.cs>0?fmt$(s.cs):'—'}</span></div>
          </div>
        </div>`;
      }).join('');

// ── DETAIL ────────────────────────────────────────────────────────────────────
async function openDetail(id) {
  const q=QQ.find(q=>q.id===id); if(!q)return;
  _cq=q;
  try {
  const ff  = q.form_fields     || {};
  const pr  = q.pricing_results || {};
  const ds  = q.display_summary || {};
  const snap= q.snapshot        || {};

  document.getElementById('dp-title').textContent = q.name||'Unknown Customer';
  document.getElementById('dp-sub').textContent   = q.id+' · Quoted '+fmtDate(q.date)+(q.city?' · '+q.city:'');
  document.getElementById('dp-badge').innerHTML   = badge(q.status)+(q.mat_only?' <span class="badge badge-matonly">Mat Only</span>':'');

  const notes = await loadNotes(id);

  // Pricing variants
  const VMAP = [
    {key:'totalNoOH',    label:'Post Frame — No Overhang'},
    {key:'totalOH',      label:'Post Frame — 12" Soffit'},
    {key:'totalSteel',   label:'Steel Truss'},
    {key:'totalStud',    label:'Stud Frame'},
    {key:'totalCypress', label:'Cypress Board & Batten'},
    {key:'totalBB',      label:'Metal Board & Batten'},
  ];
  const storedTotal = parseMoney(q.total) || parseMoney(pr.totalCombined) || parseMoney(pr.total);
  const savedV = q.selected_variants || [];
  let presentedKey = null;
  if (savedV.length > 0) {
    const m = savedV.find(k => { const vt = parseMoney(pr[k]); return vt > 0 && Math.abs(vt - storedTotal) < 5; });
    presentedKey = m || savedV[0];
  } else if (storedTotal > 0) {
    const m = VMAP.find(v => { const vt = parseMoney(pr[v.key]); return vt > 0 && Math.abs(vt - storedTotal) < 5; });
    if (m) presentedKey = m.key;
  }
  // Final fallback — if totalCombined matches a variant, mark that as presented
  if (!presentedKey && pr.totalCombined) {
    const ref = parseMoney(pr.totalCombined);
    const m = VMAP.find(v => { const vt = parseMoney(pr[v.key]); return vt > 0 && Math.abs(vt - ref) < 5; });
    if (m) presentedKey = m.key;
  }
  const showV = savedV.length > 0
    ? VMAP.filter(v=>savedV.includes(v.key)&&pr[v.key])
    : VMAP.filter(v=>pr[v.key]&&parseMoney(pr[v.key])>0);

  // Building
  const dims  = [ff.width,ff.length,ff.height].filter(Boolean).map(d=>d+"'").join(' x ');
  const pitch = ff.roofPitch ? ff.roofPitch+'/12' : '';
  const truss = ff.truss || ds.truss || '';
  const oh    = ds.oh && ds.oh!=='0' ? ds.oh+'" Soffit' : 'No Soffit';

  // Parse doors/windows from form_fields, decode SKUs to readable format
  function decodeGD(sku) {
    if (!sku) return null;
    const s = String(sku);
    // Raw format from dropdown: "9x7", "12x10", "9x7IN", "9x7INS"
    const raw = s.match(/^(\d+)x(\d+)(IN|INS)?$/i);
    if (raw) return raw[1]+"'×"+raw[2]+"'"+(raw[3]?' Insulated':'');
    // SKU format: GD{w}{h}[IN|INS]W — w and h concatenated from dropdown parts
    // e.g. GD97W=9'×7', GD1210W=12'×10', GD1210INW=12'×10' Insulated
    // Width is 1-2 digits, height is 1-2 digits, insulation optional
    const skuM = s.match(/^GD(\d{1,2})(\d{1,2})(IN|INS)?W$/i);
    if (skuM) return skuM[1]+"'×"+skuM[2]+"'"+(skuM[3]?' Insulated':'');
    // Drum door: GDDD{w}{h}[IN]
    const drum = s.match(/^GDDD(\d+)(\d+)(IN)?$/i);
    if (drum) return drum[1]+"'×"+drum[2]+"' Drum"+(drum[3]?' Insulated':'');
    return s; // show raw if nothing matched
  }
  function decodeWD(val) {
    if (!val) return null;
    // Already readable — walk door types are full descriptions or "3x6" dimension format
    const m = String(val).match(/^(\d+)x(\d+)$/i);
    return m ? m[1]+"'×"+m[2]+"'" : val;
  }

  const gds  = Object.keys(ff).filter(k=>k.startsWith('garageDoor')&&k.endsWith('Type')).map(k=>decodeGD(ff[k])).filter(Boolean);
  const wds  = Object.keys(ff).filter(k=>k.startsWith('walkDoor')  &&k.endsWith('Type')).map(k=>decodeWD(ff[k])).filter(Boolean);
  const wins = Object.keys(ff).filter(k=>k.startsWith('window')    &&k.endsWith('Type')).map(k=>decodeWD(ff[k])).filter(Boolean);

  // If form_fields missing door detail, show counts from display_summary
  const gdCount  = gds.length || +ds.garageDoors || 0;
  const wdCount  = wds.length || +ds.walkDoors   || 0;
  const winCount = wins.length|| +ds.windows      || 0;

  const upg=[];
  if(ff.insulation&&ff.insulation!=='None') upg.push('Insulation: '+ff.insulation);
  if(ff.insulationRoof==='Yes') upg.push('Roof Insulation');
  if(ff.insulationWalls==='Yes') upg.push('Wall Insulation');
  if(ff.concrete&&ff.concrete!=='None') upg.push('Concrete: '+ff.concrete);
  if(ff.wainscot==='Yes') upg.push('Wainscot'+(ds.wainscotColor?' ('+ds.wainscotColor+')':''));
  if(ff.postWraps==='Yes') upg.push('Post Wraps');
  if(ff.lvlHeaders==='Yes') upg.push('LVL Headers');
  if(ff.gutters==='Yes') upg.push('Gutters'+(ds.gutterType?' — '+ds.gutterType:'')+(ds.gutterGuard?' w/ Guard':''));
  if(ff.barjoist==='Yes') upg.push('Bar Joist'+(ff.barjoistType?' ('+ff.barjoistType+')':''));
  if(ff.wetSetPosts==='Yes') upg.push('Wet-Set Posts');
  if(ff.postProtectors==='Yes') upg.push('Post Protectors');
  if(ff.rockWainscot==='Yes') upg.push('Stone Wainscot');
  if(ds.cupolaOn) upg.push('Cupola '+ds.cupolaSize+'" x '+ds.cupolaQty);
  if(ff.pitch612==='Yes') upg.push('6/12 Pitch (Steel)');
  if(ff.manualNotes) upg.push('Notes: '+ff.manualNotes);

  const pricingRows = showV.map(v => {
    const isp = v.key===presentedKey;
    const bg  = isp ? 'background:rgba(255,140,0,.09);' : '';
    const clr = isp ? 'color:var(--amber)' : 'color:var(--text2)';
    const lclr= isp ? 'color:var(--text);font-weight:600' : 'color:var(--text2)';
    const pBadge = isp ? '<span style="font-size:9px;font-weight:700;letter-spacing:1px;color:var(--amber);text-transform:uppercase;margin-left:8px;background:var(--amber-dim);padding:1px 6px;border-radius:3px;border:1px solid var(--amber2)">PRESENTED</span>' : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);'+bg+'">'
      + '<div style="font-size:13px;'+lclr+'">'+v.label+pBadge+'</div>'
      + '<div style="font-family:Barlow Condensed,sans-serif;font-size:20px;font-weight:700;'+clr+'">'+pr[v.key]+'</div>'
      + '</div>';
  }).join('');

  const upgRows = upg.map(u =>
    '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)">'
    +'<span style="color:var(--green);flex-shrink:0">✓</span>'+u+'</div>'
  ).join('');

  const bldGrid = [
    ff.roofColor  ? ['Roof Color', ff.roofColor]   : null,
    ff.wallColor  ? ['Wall Color', ff.wallColor]   : null,
    ff.trimColor  ? ['Trim Color', ff.trimColor]   : null,
    ff.roofMetal  ? ['Roof Metal', ff.roofMetal]   : null,
    ff.wallMetal  ? ['Wall Metal', ff.wallMetal]   : null,
    ff.mbPostSize ? ['Post Size',  ff.mbPostSize]  : null,
    ff.eavePostSpacing ? ['Eave Spacing', ff.eavePostSpacing+"'"] : null,
    ff.trussSpacing    ? ['Truss Spacing', ff.trussSpacing+"'"]  : null,
  ].filter(Boolean).map(([lbl,val]) =>
    '<div class="bld-item"><div class="bld-lbl">'+lbl+'</div><div class="bld-val">'+val+'</div></div>'
  ).join('');

  document.getElementById('dp-body').innerHTML =
    '<div>'
    +'<div class="dp-sec">Customer</div>'
    +'<div class="card-sm" style="margin-bottom:14px">'
    +'<div style="font-size:17px;font-weight:600;color:var(--text);margin-bottom:10px">'+q.name+'</div>'
    +(q.phone?'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="color:var(--text2)">📱 '+q.phone+'</span><a class="fup-btn" style="font-size:11px;padding:2px 8px" href="sms:'+q.phone.replace(/\D/g,'')+'">Text</a></div>':'')
    +(q.email?'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="color:var(--text2)">✉️ '+q.email+'</span><a class="fup-btn" style="font-size:11px;padding:2px 8px" href="mailto:'+q.email+'?subject=Your Pole Barn Quote '+q.id+'">Email</a></div>':'')
    +(q.city?'<div style="color:var(--text2)">📍 '+q.city+'</div>':'')
    +'</div>'
    +'<div class="dp-sec">CRM Status</div>'
    +'<div class="f-group"><label class="f-label">Status</label>'
    +'<select class="f-ctrl" onchange="dpPatch(\''+id+'\',\'status\',this.value);document.getElementById(\'dp-badge\').innerHTML=badge(this.value)">'
    +STATUSES.map(s=>'<option'+(s===q.status?' selected':'')+'>'+s+'</option>').join('')
    +'</select></div>'
    +'<div class="f-group"><label class="f-label">Follow-Up Date</label><input type="date" class="f-ctrl" value="'+(q.follow_up_date||'')+'" onchange="dpPatch(\''+id+'\',\'follow_up_date\',this.value)"></div>'
    +'<div class="f-group"><label class="f-label">Ship / Invoice Date</label><input type="date" class="f-ctrl" value="'+(q.ship_date||'')+'" onchange="dpPatch(\''+id+'\',\'ship_date\',this.value)"></div>'
    +'<div class="f-group"><label class="f-label">Final Material Total</label><input type="number" step="0.01" class="f-ctrl" placeholder="0.00" value="'+(q.final_material||'')+'" onchange="dpPatch(\''+id+'\',\'final_material\',+this.value)"></div>'
    +'<div class="f-group"><label class="f-label">CS Amount</label><input type="number" step="0.01" class="f-ctrl" placeholder="0.00" value="'+(q.cs_amount||'')+'" onchange="dpPatch(\''+id+'\',\'cs_amount\',+this.value)"></div>'
    +'<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:4px">'
    +'<input type="checkbox" '+(q.mat_only?'checked':'')+' style="width:15px;height:15px;accent-color:var(--amber)" onchange="dpPatch(\''+id+'\',\'mat_only\',this.checked)">'
    +'<span style="font-size:13px;color:var(--text2)">Material Only</span></label>'
    +'</div>'

    +'<div>'
    +'<div class="dp-sec">What Was Quoted</div>'
    +'<div style="background:var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">'
    +'<div style="font-family:Barlow Condensed,sans-serif;font-size:32px;font-weight:700;color:var(--text);letter-spacing:.5px;margin-bottom:4px">'+(dims||'—')+'</div>'
    +'<div style="font-size:14px;color:var(--text2);margin-bottom:14px">'+[truss,pitch,oh].filter(Boolean).join(' · ')+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">'+bldGrid+'</div>'
    +'</div>'

    +(gdCount||wdCount||winCount ?
      '<div class="dp-sec">Openings</div>'
      +'<div style="background:var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;border:1px solid var(--border2)">'
      +(gdCount?'<div style="margin-bottom:10px"><div class="bld-lbl" style="margin-bottom:5px">Overhead Doors ('+gdCount+')</div><div style="color:var(--text2);font-size:13px">'+(gds.length?gds.join(' · '):'—')+'</div></div>':'')
      +(wdCount?'<div style="margin-bottom:10px"><div class="bld-lbl" style="margin-bottom:5px">Walk Doors ('+wdCount+')</div><div style="color:var(--text2);font-size:13px">'+(wds.length?wds.join(' · '):'—')+'</div></div>':'')
      +(winCount?'<div><div class="bld-lbl" style="margin-bottom:5px">Windows ('+winCount+')</div><div style="color:var(--text2);font-size:13px">'+(wins.length?wins.join(' · '):'—')+'</div></div>':'')
      +'</div>'
    : '')

    +((() => {
      let shedStr = ds.sheds || '';
      if (!shedStr) {
        const parts = [];
        if (ff.ssWidth)  parts.push(ff.ssWidth+"' × "+(ff.ssLength||'?')+"' Side Shed");
        if (ff.ss2Width) parts.push(ff.ss2Width+"' × "+(ff.ss2Length||'?')+"' Side Shed");
        shedStr = parts.join(', ');
      }
      return shedStr
        ? '<div class="dp-sec">Side Sheds / Extensions</div>'
          +'<div style="background:var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;border:1px solid var(--border2);color:var(--text2);font-size:13px">'+shedStr+'</div>'
        : '';
    })())

    +(upg.length ?
      '<div class="dp-sec">Upgrades & Options</div>'
      +'<div style="background:var(--bg3);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;border:1px solid var(--border2)">'+upgRows+'</div>'
    : '')

    +'<div class="dp-sec">Quoted Pricing — '+showV.length+' Variant'+(showV.length!==1?'s':'')+'</div>'
    +'<div style="background:var(--bg3);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border2);margin-bottom:12px">'
    +(pricingRows||'<div style="padding:14px;color:var(--text3);font-size:12px">No pricing saved with this quote.</div>')
    +'</div>'
    +'</div>'

    +'<div class="dp-full">'
    +'<div class="dp-sec">Contact Log</div>'
    +'<div id="dp-notes">'+renderNotes(notes)+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<select id="nt-type" class="f-ctrl" style="flex-shrink:0;width:110px">'
    +'<option value="note">Note</option><option value="call">Call</option>'
    +'<option value="text">Text</option><option value="email">Email</option>'
    +'</select>'
    +'<input id="nt-body" class="f-ctrl" style="flex:1" placeholder="Add a note, call log, or follow-up…" onkeydown="if(event.key===\'Enter\')addNote(\''+id+'\')">'
    +'<button class="btn btn-primary btn-sm" onclick="addNote(\''+id+'\')">Add</button>'
    +'</div>'
    +'</div>';

  document.getElementById('dp-actions').innerHTML =
    (q.phone?'<a class="act-link green" href="sms:'+q.phone.replace(/\D/g,'')+'" onclick="saveNote(\''+id+'\',\'text\',\'Sent text message\')">📱 Text</a>':'')
    +(q.email?'<a class="act-link green" href="mailto:'+q.email+'?subject=Your Pole Barn Quote '+q.id+'" onclick="saveNote(\''+id+'\',\'email\',\'Sent email\')">✉️ Email</a>':'')
    +(q.config_encoded?'<a class="act-link" href="'+SALES+'?quote='+q.id+'" target="_blank">🔗 Open in Sales Tool</a>':'')
    +'<a class="act-link" href="'+SALES+'" target="_blank">➕ New Quote</a>'
    +'<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="closeDetail()">Close</button>'
    +'<button class="btn btn-sm" style="background:var(--red-dim);border:1px solid var(--red);color:var(--red)" onclick="deleteQuote(\''+id+'\')">🗑 Delete Quote</button>';

  document.getElementById('detail-overlay').classList.add('open');
  } catch(e) {
    console.error('[CRM] openDetail error:', e);
    document.getElementById('dp-body').innerHTML = '<div style="padding:20px;color:var(--red)">Error loading quote details: '+e.message+'</div>';
    document.getElementById('detail-overlay').classList.add('open');
  }
}

function renderNotes(notes) {
  if(!notes||!notes.length) return '<div style="color:var(--text3);font-size:12px;margin-bottom:8px">No contact history yet.</div>';
  return notes.map(n=>`
    <div class="log-entry ${n.type||'note'}">
      <div class="log-time"><span class="log-type">${n.type||'note'}</span>${fmtDate((n.created_at||'').substring(0,10))}</div>
      <div class="log-body">${n.body||''}</div>
    </div>`).join('');
}

async function addNote(id) {
  const body=(document.getElementById('nt-body').value||'').trim();
  const type=document.getElementById('nt-type').value;
  if(!body)return;
  await saveNote(id,type,body);
  document.getElementById('nt-body').value='';
  const notes=await loadNotes(id);
  document.getElementById('dp-notes').innerHTML=renderNotes(notes);
}

async function dpPatch(id,field,val) {
  await patchCrm(id,{[field]:val});
  renderDashboard(); renderCommission();
}

async function deleteQuote(id) {
  if (!confirm('Permanently delete this quote? This cannot be undone.')) return;
  try {
    await sbFetch('quotes?id=eq.'+enc(id), { method:'DELETE', headers:{'Prefer':'return=minimal'} });
    QQ = QQ.filter(q => q.id !== id);
    closeDetail();
    renderDashboard();
    renderPipeline();
  } catch(e) { alert('Delete failed: ' + e.message); }
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  _cq=null;
  renderPipeline();
  renderDashboard();
}

document.getElementById('detail-overlay').addEventListener('click', function(e) {
  if(e.target===this) closeDetail();
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
if(restoreSession()) startApp();
</script>
</body>
</html>
