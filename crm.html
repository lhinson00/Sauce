<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gridiron — Tecmo × Retro Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --turf:#2e7d43; --steel:#2c3742; --home:#2b4cc4; --home-lt:#4f74e8; --ol:#213a95;
    --away:#b02a26; --away-lt:#d85852; --chalk:#dfe8ff; --board:#1a2740; --board-lt:#26385c;
    --good:#4ade80; --amber:#ffcf4a; --cyan:#38e0e0; --txt:#f2f5f8; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0a0d10;color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;height:100%;aspect-ratio:540/810;max-width:100%;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--turf);
    border-radius:6px;box-shadow:0 0 0 3px #0a0d10,0 0 0 5px var(--steel),0 18px 50px rgba(0,0,0,.6);}
  .hint{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:11px;color:#9fb0be;pointer-events:none;padding:0 10px;line-height:1.5;}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c" width="540" height="810"></canvas></div></div>
<div class="hint" id="hint"></div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,FW=53.3,FL=120,PPY=W/FW,CX=26.65;
const hintEl=document.getElementById('hint');
function gv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

let focusY=35;
function clampCam(){ const t=H*0.60/PPY,b=H*0.40/PPY; focusY=Math.max(b,Math.min(FL-t,focusY)); }
const sx=fx=>fx*PPY, sy=fy=>H*0.60-(fy-focusY)*PPY, toFX=px=>px/PPY, toFY=py=>focusY+(H*0.60-py)/PPY;

function rnd(a,b){ return a+Math.random()*(b-a); }
function speedFor(pos){ switch(pos){
  case 'WR': return {spd:rnd(8.2,8.9),acc:40}; case 'CB': return {spd:rnd(8.2,8.7),acc:40};
  case 'RB': return {spd:rnd(8.1,8.7),acc:43}; case 'TE': return {spd:rnd(7.4,7.9),acc:34};
  case 'S' : return {spd:rnd(7.5,8.1),acc:36}; case 'LB': return {spd:rnd(7.1,7.8),acc:33};
  case 'QB': return {spd:rnd(6.9,7.5),acc:38}; case 'DL': return {spd:rnd(6.4,7.1),acc:30};
  case 'OL': return {spd:rnd(5.9,6.6),acc:26}; default: return {spd:8,acc:36}; } }
const BALLSPD=30;
function steer(o,dx,dy,des,acc,dt){ const m=Math.hypot(dx,dy); let tvx=0,tvy=0;
  if(m>1e-4){ tvx=dx/m*des; tvy=dy/m*des; } o.vx=o.vx||0; o.vy=o.vy||0;
  const ax=tvx-o.vx,ay=tvy-o.vy,am=Math.hypot(ax,ay),mx=acc*dt;
  if(am>mx&&am>1e-6){ o.vx+=ax/am*mx; o.vy+=ay/am*mx; } else { o.vx=tvx; o.vy=tvy; } o.x+=o.vx*dt; o.y+=o.vy*dt; }
function seek(o,tx,ty,frac,dt){ const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  const des=o.spd*(frac==null?1:frac)*(d<1.2?d/1.2:1); steer(o,dx,dy,des,o.acc,dt); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function route(name,sX,los){ const inw=sX<CX?1:-1,out=-inw,P=[];
  switch(name){
    case 'go':P.push([sX,los+3],[sX,los+48]);break; case 'seam':P.push([sX,los+3],[sX,los+44]);break;
    case 'slant':P.push([sX,los+3],[sX+inw*13,los+10]);break; case 'curl':P.push([sX,los+13],[sX+inw*1,los+11]);break;
    case 'out':P.push([sX,los+10],[sX+out*12,los+10]);break; case 'corner':P.push([sX,los+13],[sX+out*12,los+24]);break;
    case 'post':P.push([sX,los+14],[sX+inw*12,los+26]);break; case 'dig':P.push([sX,los+13],[sX+inw*18,los+13]);break;
    case 'cross':P.push([sX,los+5],[sX+inw*27,los+11]);break; case 'flat':P.push([sX,los+1],[sX+out*12,los+3]);break;
    case 'hitch':P.push([sX,los+6],[sX,los+5]);break; case 'comeback':P.push([sX,los+16],[sX+out*4,los+13]);break;
    case 'shallow':P.push([sX,los+1],[sX+inw*24,los+4]);break;
    case 'swing':P.push([44,los-1],[50,los+5]);break; case 'check':P.push([sX,los-1],[sX+2,los+5]);break;
    default:P.push([sX,los+8]); } return P; }

const SYM=[{l:'A',c:'#4ade80'},{l:'B',c:'#f0645c'},{l:'X',c:'#5aa2ff'},{l:'Y',c:'#ffcf4a'},{l:'C',c:'#c07af0'}];
const PASS=[
  { name:'FOUR VERTS', tag:'vs 1-high', r:{X:'go',TE:'seam',Y:'seam',Z:'go',RB:'block'} },
  { name:'SMASH', tag:'hi-low vs zone', r:{X:'dig',TE:'curl',Y:'flat',Z:'corner',RB:'block'} },
  { name:'MESH', tag:'crossers vs man', r:{X:'cross',TE:'curl',Y:'cross',Z:'go',RB:'swing'} },
  { name:'FLOOD', tag:'3 levels', r:{X:'dig',TE:'flat',Y:'out',Z:'go',RB:'block'} },
  { name:'SLANTS', tag:'quick vs blitz', r:{X:'slant',TE:'hitch',Y:'slant',Z:'slant',RB:'check'} },
  { name:'DRIVE', tag:'shallow + dig', r:{X:'post',TE:'dig',Y:'shallow',Z:'comeback',RB:'check'} },
  { name:'STICK', tag:'quick vs zone', r:{X:'out',TE:'hitch',Y:'flat',Z:'hitch',RB:'check'} },
  { name:'PA BOOT', tag:'play-action roll', pa:true, roll:'R', r:{X:'post',TE:'flat',Y:'corner',Z:'comeback',RB:'block'} },
];
const RUN=[
  { name:'DIVE', tag:'A-gap quick', poa:CX,   pull:null, delay:0.42 },
  { name:'POWER RT', tag:'pull & punch', poa:31, pull:'LG', delay:0.75 },
  { name:'COUNTER LT', tag:'misdirection', poa:23, pull:'LG', delay:0.68 },
  { name:'STRETCH RT', tag:'reach & read', poa:35, pull:null, delay:0.45, stretch:true },
  { name:'TOSS RT', tag:'get the edge', poa:42, pull:'RG', delay:0.4, toss:true },
  { name:'DRAW', tag:'delayed', poa:CX, pull:null, delay:0.75, draw:true },
  { name:'TRAP RT', tag:'trap block', poa:28, pull:'LG', delay:0.5 },
  { name:'STRETCH LT', tag:'reach & read', poa:18, pull:null, delay:0.45, stretch:true },
];
const COVS=[
  {name:'MAN',tag:'press · 1 deep'},{name:'COVER 2',tag:'2 deep halves'},{name:'COVER 3',tag:'3 deep zone'},
  {name:'COVER 4',tag:'quarters'},{name:'TAMPA 2',tag:'MLB deep mid'},{name:'COVER 6',tag:'quarter-half'},
  {name:'FIRE ZONE',tag:'zone blitz'},{name:'BLITZ',tag:'bring 6'},
];
const FRONTS=['BASE','CRASH','LB BLITZ','CONTAIN','SLANT RT','SLANT LT','SAFETY DOWN'];

let G, keys={}, aim=null, shake=0, flash=null, flashT=0, flashCol='#fff', assist=false;
function mk(x,y,pos,num,extra){ const s=speedFor(pos); return Object.assign({x,y,pos,num,x0:x,y0:y,vx:0,vy:0,spd:s.spd,acc:s.acc,down:0},extra||{}); }
function offenseIsUser(){ return G.userSide==='off'; }

function setupPlay(){
  const L=G.los; G.offCPU=(G.userSide==='def'); G.defUser=(G.userSide==='def'); G.control=null;
  // choose offensive play
  let P, isRun;
  if(G.userSide==='off'){ isRun=(G.tab==='run'); P=(isRun?RUN:PASS)[G.sel[G.tab]]; }
  else { isRun=Math.random()<0.45; P=(isRun?RUN:PASS)[(Math.random()*(isRun?RUN:PASS).length)|0]; }
  G.isRun=isRun; G.play=P; aim=null; G.t=0; G.ball=null; G.carrier=null; G.puff=null; G.pa=!!P.pa; G.roll=P.roll||null; G.paT=P.pa?0.5:0;
  const C_=mk(CX,L-1,'OL','55'),LG=mk(23.4,L-1,'OL','66'),RG=mk(29.9,L-1,'OL','68'),LT=mk(20.4,L-1,'OL','70'),RT=mk(32.9,L-1,'OL','74');
  G.ol=[LT,LG,C_,RG,RT]; G.qb=mk(CX,L-4,'QB','7');
  const X=mk(6,L-1,'WR','11'),TE=mk(18,L-1,'TE','88'),Y=mk(40,L-2,'WR','83'),Z=mk(47,L-1,'WR','80');
  G.skill={X,Z,Y,TE};
  if(isRun){ G.poaX=P.poa; G.runDir=P.poa>CX+1?'R':(P.poa<CX-1?'L':'M'); G.pull=P.pull==='LG'?LG:P.pull==='RG'?RG:null;
    G.rb=mk(P.toss?(P.poa>CX?31:22):24,L-7,'RB','22'); G.handoffT=P.delay; G.recv=[];
  } else { G.rb=mk(24,L-7,'RB','22'); G.pull=null; G.recv=[];
    for(const k of ['X','TE','Y','Z']){ const pl=G.skill[k],rn=P.r[k]; if(rn&&rn!=='block'){ pl.route=route(rn,pl.x,L); pl.wp=0; G.recv.push(pl); } else pl.block=true; }
    const rbr=P.r.RB; if(rbr&&rbr!=='block'){ G.rb.route=route(rbr,G.rb.x,L); G.rb.wp=0; G.recv.push(G.rb); } else G.rb.block=true; }
  G.recv.forEach((r,i)=>{ r.btn=SYM[i%SYM.length]; }); G.off=[...G.ol,G.qb,G.rb,X,TE,Y,Z];
  const LE=mk(21,L+1,'DL','91'),DTa=mk(24.5,L+1,'DL','94'),DTb=mk(28.8,L+1,'DL','97'),RE=mk(32,L+1,'DL','99');
  G.dl=[LE,DTa,DTb,RE];
  const WLB=mk(18,L+4.5,'LB','52'),MLB=mk(CX,L+5,'LB','54'),SLB=mk(36,L+4.5,'LB','58');
  const CBL=mk(7,L+6,'CB','24'),CBR=mk(46,L+6,'CB','21'),FS=mk(24,L+13,'S','31'),SS=mk(34,L+11,'S','29');
  G.def=[LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS];
  const refs={LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS,X,TE,Y,Z};
  G.cov = (G.userSide==='def') ? COVS[G.selDef].name : COVS[(Math.random()*COVS.length)|0].name;
  G.front = FRONTS[(Math.random()*FRONTS.length)|0];
  assignCoverage(G.cov,refs); assignFront(G.front,refs);
  if(G.defUser){ G.control = nearestDef(G.qb); }
  G.rushFree=0.2; G.phase='presnap'; focusY=L+6;
}
function job(d,o){ d.job=o; } function place(d,x,y){ d.x=x; d.y=y; d.x0=x; d.y0=y; }
function nearestDef(ref){ let best=null,bd=9e9; for(const d of G.def){ const dd=dist(d,ref); if(dd<bd){bd=dd;best=d;} } return best; }
function assignCoverage(cov,p){ const {LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS,X,TE,Y,Z}=p, L=G.los;
  G.dl.forEach(d=>job(d,{t:'rush'}));
  if(cov==='MAN'){ place(CBL,7,L+2); place(CBR,46,L+2); place(FS,CX,L+14); place(SS,40,L+7);
    job(CBL,{t:'man',tgt:X}); job(CBR,{t:'man',tgt:Z}); job(SS,{t:'man',tgt:Y}); job(MLB,{t:'man',tgt:TE}); job(WLB,{t:'man',tgt:G.rb}); job(SLB,{t:'spy'}); job(FS,{t:'zoneD',lm:{x:CX,y:L+16}});
  } else if(cov==='BLITZ'){ place(CBL,7,L+2); place(CBR,46,L+2); place(FS,30,L+6); place(SS,20,L+6); place(MLB,CX,L+3); place(SLB,34,L+3);
    job(CBL,{t:'man',tgt:X}); job(CBR,{t:'man',tgt:Z}); job(SS,{t:'man',tgt:Y}); job(WLB,{t:'man',tgt:TE}); job(FS,{t:'man',tgt:G.rb}); job(MLB,{t:'rush'}); job(SLB,{t:'rush'});
  } else if(cov==='COVER 3'){ place(CBL,8,L+7); place(CBR,45,L+7); place(FS,CX,L+13); place(SS,38,L+8);
    job(CBL,{t:'zoneD',lm:{x:9,y:L+18}}); job(CBR,{t:'zoneD',lm:{x:44,y:L+18}}); job(FS,{t:'zoneD',lm:{x:CX,y:L+19}});
    job(WLB,{t:'zoneU',lm:{x:14,y:L+8}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+9}}); job(SLB,{t:'zoneU',lm:{x:38,y:L+8}}); job(SS,{t:'zoneU',lm:{x:48,y:L+6}});
  } else if(cov==='COVER 4'){ place(CBL,8,L+7); place(CBR,45,L+7); place(FS,20,L+13); place(SS,33,L+13);
    job(CBL,{t:'carry',tgt:X}); job(CBR,{t:'carry',tgt:Z}); job(FS,{t:'carry',tgt:TE}); job(SS,{t:'carry',tgt:Y});
    job(WLB,{t:'zoneU',lm:{x:16,y:L+7}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+8}}); job(SLB,{t:'zoneU',lm:{x:38,y:L+7}});
  } else if(cov==='TAMPA 2'){ place(FS,18,L+14); place(SS,36,L+14); place(CBL,7,L+5); place(CBR,46,L+5); place(MLB,CX,L+5);
    job(FS,{t:'zoneD',lm:{x:16,y:L+18}}); job(SS,{t:'zoneD',lm:{x:37,y:L+18}}); job(MLB,{t:'zoneD',lm:{x:CX,y:L+20}});
    job(CBL,{t:'zoneU',lm:{x:7,y:L+5}}); job(CBR,{t:'zoneU',lm:{x:47,y:L+5}}); job(WLB,{t:'zoneU',lm:{x:18,y:L+9}}); job(SLB,{t:'zoneU',lm:{x:36,y:L+9}});
  } else if(cov==='COVER 6'){ place(CBL,8,L+7); place(FS,17,L+13); place(SS,36,L+14); place(CBR,46,L+5);
    job(CBL,{t:'carry',tgt:X}); job(FS,{t:'zoneD',lm:{x:16,y:L+18}}); job(SS,{t:'zoneD',lm:{x:38,y:L+18}}); job(CBR,{t:'zoneU',lm:{x:47,y:L+5}});
    job(WLB,{t:'zoneU',lm:{x:16,y:L+8}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+9}}); job(SLB,{t:'zoneU',lm:{x:36,y:L+8}});
  } else { place(SLB,35,L+3);
    job(LE,{t:'rush'}); job(DTa,{t:'rush'}); job(DTb,{t:'rush'}); job(SLB,{t:'rush'}); job(RE,{t:'zoneU',lm:{x:34,y:L+7}});
    place(CBL,8,L+7); place(CBR,45,L+7); place(FS,CX,L+13);
    job(CBL,{t:'zoneD',lm:{x:9,y:L+18}}); job(CBR,{t:'zoneD',lm:{x:44,y:L+18}}); job(FS,{t:'zoneD',lm:{x:CX,y:L+19}});
    job(WLB,{t:'zoneU',lm:{x:15,y:L+8}}); job(MLB,{t:'zoneU',lm:{x:CX,y:L+9}}); job(SS,{t:'zoneU',lm:{x:47,y:L+6}});
  }
}
/* run-fit fronts — variety vs the run */
function assignFront(front,p){ const {LE,DTa,DTb,RE,WLB,MLB,SLB,CBL,CBR,FS,SS}=p, L=G.los;
  const F=(d,gap,mode,edge,delay)=>{ d.fit={gap,mode:mode||'fill',edge:edge||0,delay:delay||0}; };
  // defaults
  F(LE,18,'fill',0,0); F(DTa,24,'fill'); F(DTb,29.5,'fill'); F(RE,35,'fill');
  F(WLB,21,'fill',0,0.05); F(MLB,CX,'fill',0,0.05); F(SLB,32,'fill',0,0.05);
  F(CBL,7,'contain',-1,0.4); F(CBR,46,'contain',1,0.4);
  F(FS,CX,'support',0,0.7); F(SS,36,'support',0,0.6);
  if(front==='CRASH'){ F(LE,22,'fill'); F(DTa,25.5,'fill'); F(DTb,28,'fill'); F(RE,31,'fill'); F(WLB,14,'fill',0,0.1); F(SLB,39,'fill',0,0.1); }
  else if(front==='LB BLITZ'){ const lbs=[WLB,MLB,SLB], b=lbs[(Math.random()*3)|0]; F(b, b.x, 'blitz', 0, 0); }
  else if(front==='CONTAIN'){ F(LE,16,'contain',-1); F(RE,37,'contain',1); F(DTa,24,'fill'); F(DTb,29.5,'fill'); }
  else if(front==='SLANT RT'){ F(LE,21,'fill'); F(DTa,27,'fill'); F(DTb,32,'fill'); F(RE,38,'fill'); }
  else if(front==='SLANT LT'){ F(LE,15,'fill'); F(DTa,21,'fill'); F(DTb,26,'fill'); F(RE,32,'fill'); }
  else if(front==='SAFETY DOWN'){ F(SS,30,'fill',0,0.2); G.safDown=true; }
}
function resetGame(){ G={you:0,cpu:0,userSide:'off',tab:'pass',sel:{pass:0,run:0},selDef:0,phase:'select',los:35,down:1,first:45,drives:1}; }
resetGame();
function flipPossession(){ G.userSide=G.userSide==='off'?'def':'off'; G.los=35; G.down=1; G.first=45; G.drives++; }

addEventListener('keydown', e=>{ const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k)) e.preventDefault(); keys[k]=true;
  if(k==='t'){ assist=!assist; return; }
  if(G.phase==='select'){
    if(G.userSide==='def'){ const n=COVS.length;
      if(k==='arrowleft'||k==='a') G.selDef=(G.selDef+n-1)%n; if(k==='arrowright'||k==='d') G.selDef=(G.selDef+1)%n;
      if(k==='arrowup') G.selDef=(G.selDef+n-2)%n; if(k==='arrowdown') G.selDef=(G.selDef+2)%n;
      if(k===' '||k==='enter') setupPlay();
    } else { const list=(G.tab==='run'?RUN:PASS), n=list.length;
      if(k==='tab'||k==='q'){ G.tab=G.tab==='pass'?'run':'pass'; return; }
      if(k==='arrowleft'||k==='a') G.sel[G.tab]=(G.sel[G.tab]+n-1)%n; if(k==='arrowright'||k==='d') G.sel[G.tab]=(G.sel[G.tab]+1)%n;
      if(k==='arrowup') G.sel[G.tab]=(G.sel[G.tab]+n-2)%n; if(k==='arrowdown') G.sel[G.tab]=(G.sel[G.tab]+2)%n;
      if(k===' '||k==='enter') setupPlay(); }
  } else if(G.phase==='presnap' && (k===' '||k==='enter')) snap();
  else if(G.phase==='dead' && (k===' '||k==='enter')) G.phase='select';
  else if(/^[1-5]$/.test(k) && G.phase==='live' && !G.offCPU){ const r=(G.recv||[])[(+k)-1]; if(r) throwToReceiver(r); }
  else if(k==='e' && G.defUser && (G.phase==='live'||G.phase==='air'||G.phase==='run'||G.phase==='handoff')) switchDefender();
  else if(k===' ' && (G.phase==='run'||G.phase==='handoff'||G.phase==='live'||G.phase==='air')){ if(offenseIsUser()){ if(G.phase==='run') triggerJuke(); } else userDive(); }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function switchDefender(){ const ref=G.carrier||(G.ball?{x:G.ball.tx,y:G.ball.ty}:G.qb); let best=null,bd=9e9;
  for(const d of G.def){ if(d===G.control||d.blocked||(d.down||0)>0)continue; const dd=dist(d,ref); if(dd<bd){bd=dd;best=d;} } if(best) G.control=best; }
let joyId=null,joyCx=0,joyCy=0,joyVec={x:0,y:0},JR=76;
const BTN={ main:{x:W-76,y:H-120,r:58}, sub:{x:W-76,y:H-236,r:48}, scr:{x:84,y:H-120,r:54} };
function recvButtons(){ const arr=[],cx=W-96,cy=H-152,pos=[[0,-48],[-48,2],[48,2],[-26,50],[26,50]];
  const rc=G.recv||[]; for(let i=0;i<rc.length;i++){ const q=pos[i]||[0,0]; arr.push({x:cx+q[0],y:cy+q[1],r:31,recv:rc[i],btn:rc[i].btn}); } return arr; }
function inBtn(p,b){ return Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.08; }
function nearestRecv(fx,fy){ let best=null,bd=9e9; for(const r of (G.recv||[])){ if(r===G.carrier)continue; const d=Math.hypot(r.x-fx,r.y-fy); if(d<bd){bd=d;best=r;} } return best; }
function throwToReceiver(r){ if(!r||G.phase!=='live') return; let t=dist(G.qb,r)/BALLSPD; for(let i=0;i<2;i++){ const px=r.x+(r.vx||0)*t,py=r.y+(r.vy||0)*t; t=Math.hypot(px-G.qb.x,py-G.qb.y)/BALLSPD; } throwBall(r.x+(r.vx||0)*t*1.05, r.y+(r.vy||0)*t*1.08); }
function userDive(){ const d=G.control; if(d&&!d.dive&&(d.down||0)<=0&&G.carrier){ d.dive={t:0.36,dx:G.carrier.x+(G.carrier.vx||0)*0.16,dy:G.carrier.y+(G.carrier.vy||0)*0.16}; } }
function userTuck(){ if(G.phase==='live'&&!G.offCPU){ G.carrier=G.qb; G.phase='run'; } }
function evPos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}; }
function updateJoy(p){ let dx=p.x-joyCx,dy=p.y-joyCy,m=Math.hypot(dx,dy)||1; const c=Math.min(m,JR)/JR; joyVec={x:dx/m*c,y:dy/m*c}; }
function joyStart(p,e){ joyId=e.pointerId; joyCx=p.x; joyCy=p.y; joyVec={x:0,y:0}; }
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); const p=evPos(e);
  if(G.phase==='select'){ if(G.userSide==='def'){ const i=defCardHit(p); if(i>=0){ G.selDef=i; setupPlay(); } return; }
    const tb=tabHit(p); if(tb){ G.tab=tb; return; } const i=cardHit(p); if(i>=0){ G.sel[G.tab]=i; setupPlay(); } return; }
  if(G.phase==='presnap'){ snap(); return; } if(G.phase==='dead'){ G.phase='select'; return; }
  if(G.defUser){ if(inBtn(p,BTN.main)){ switchDefender(); return; } if(inBtn(p,BTN.sub)){ userDive(); return; } joyStart(p,e); return; }
  if(G.phase==='live'){ for(const b of recvButtons()){ if(inBtn(p,b)){ throwToReceiver(b.recv); return; } }
    if(inBtn(p,BTN.scr)){ userTuck(); return; }
    const r=nearestRecv(toFX(p.x),toFY(p.y)); if(r&&Math.hypot(sx(r.x)-p.x,sy(r.y)-p.y)<PPY*3.2) throwToReceiver(r); return; }
  if(G.phase==='run'||G.phase==='handoff'){ if(inBtn(p,BTN.main)){ triggerJuke(); return; } joyStart(p,e); return; } });
cv.addEventListener('pointermove', e=>{ const p=evPos(e);
  if(G.phase==='select'){ if(G.userSide==='def'){ const i=defCardHit(p); if(i>=0) G.selDef=i; return; } const i=cardHit(p); if(i>=0) G.sel[G.tab]=i; return; }
  if(e.pointerId===joyId) updateJoy(p); });
function pEnd(e){ if(e.pointerId===joyId){ joyId=null; joyVec={x:0,y:0}; } }
cv.addEventListener('pointerup', pEnd); cv.addEventListener('pointercancel', pEnd);
function tabHit(p){ const y=168; if(p.y<y-22||p.y>y+8) return null; if(p.x>W/2-150&&p.x<W/2-6) return 'pass'; if(p.x>W/2+6&&p.x<W/2+150) return 'run'; return null; }
function cardHit(p){ const list=(G.tab==='run'?RUN:PASS); for(let i=0;i<list.length;i++){ const r=cardRect(i); if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h) return i; } return -1; }
function defCardHit(p){ for(let i=0;i<COVS.length;i++){ const r=defCardRect(i); if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h) return i; } return -1; }

function snap(){ if(G.phase!=='presnap') return; G.t=0; if(G.isRun){ G.phase='handoff'; G.carrier=G.qb; G.qb.hasBall=true; } else { G.phase='live'; G.dropDone=false; } }
function throwBall(tx,ty){ if(G.phase!=='live') return; tx=Math.max(1,Math.min(FW-1,tx)); ty=Math.max(1,Math.min(FL-1,ty));
  const d=Math.hypot(tx-G.qb.x,ty-G.qb.y); G.ball={x:G.qb.x,y:G.qb.y,sxp:G.qb.x,syp:G.qb.y,tx,ty,t:0,dur:Math.max(.4,d/BALLSPD)}; G.phase='air'; }
function triggerJuke(){ const c=G.carrier; if(!c||(c._jukeCd||0)>0) return; c._jukeT=0.42; c._jukeCd=0.85; bumpShake(2); }
function setFlash(t,c){ flash=t; flashCol=c; flashT=1.1; } function bumpShake(a){ shake=Math.max(shake,a); }
function puffAt(x,y){ G.puff={x,y,t:0.35}; }
function controlVec(){ let x=0,y=0;
  if(keys['arrowleft']||keys['a'])x-=1; if(keys['arrowright']||keys['d'])x+=1;
  if(keys['arrowup']||keys['w'])y+=1; if(keys['arrowdown']||keys['s'])y-=1;
  if(joyId!==null){ x+=joyVec.x; y+=-joyVec.y; } const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} return {x,y}; }
const sprintF=()=>keys['shift']?1.3:1;
function moveReceiver(o,dt){
  if(G.carrier&&G.carrier.pos==='QB'){ let nd=null,nb=9e9; for(const d of G.def){ const dd=dist(d,o); if(dd<nb){nb=dd;nd=d;} }
    const tx=Math.max(2,Math.min(FW-2,o.x+(nd&&nd.x>o.x?-5:5))),ty=o.y+7; seek(o,tx,ty,1,dt); return; }
  if(!o.route) return; const wp=o.route[o.wp]; if(!wp) return; seek(o,wp[0],wp[1],1,dt);
  if(Math.hypot(wp[0]-o.x,wp[1]-o.y)<0.8){ if(o.wp<o.route.length-1) o.wp++; else { const pv=o.route[Math.max(0,o.wp-1)]; let dx=wp[0]-pv[0],dy=wp[1]-pv[1],m=Math.hypot(dx,dy)||1; o.route.push([wp[0]+dx/m*22,wp[1]+dy/m*22]); o.wp++; } } }

/* blocking */
function assignAndBlock(blockers,targets,dt,plan){
  for(const b of blockers) b._tgt=null;
  for(const d of targets){ let best=null,bd=9e9; for(const b of blockers){ if(b._tgt) continue; const dd=dist(b,d); if(dd<bd){bd=dd;best=b;} } if(best) best._tgt=d; }
  for(const b of blockers){ const d=b._tgt; if(!d||d._beat) continue; const p=plan(d);
    seek(b,p.bx,p.by,1.2,dt);
    if(dist(b,d)<1.35){ d.blocked=true; if(b._sus===undefined) b._sus=p.sus; b._eng=(b._eng||0)+dt;
      const am=Math.hypot(p.ax,p.ay)||1; d.vx=(d.vx||0)*0.5+(p.ax/am)*0.85; d.vy=(d.vy||0)*0.5+(p.ay/am)*0.85; d.x+=d.vx*dt; d.y+=d.vy*dt;
      if(b._eng>b._sus){ d._beat=true; d.blocked=false; } }
    else b._eng=Math.max(0,(b._eng||0)-dt*0.5); } }
function resolveBlocks(dt,isPass){
  for(const d of G.def) d.blocked=false;
  if(isPass){ const protect=G.qb; const targets=G.def.filter(d=>d.job&&d.job.t==='rush'&&!d._beat);
    const blockers=[...G.ol]; if(G.rb.block) blockers.push(G.rb); if(G.skill.TE.block) blockers.push(G.skill.TE);
    assignAndBlock(blockers,targets,dt,d=>{ const dx=protect.x-d.x,dy=protect.y-d.y,m=Math.hypot(dx,dy)||1; return { bx:d.x+dx/m*0.8, by:d.y+dy/m*0.8, ax:-dx/m, ay:-dy/m, sus:2.7+Math.random()*1.1 }; });
  } else { const poaX=G.poaX;
    const dl=G.def.filter(d=>d.pos==='DL'&&!d._beat).sort((a,b)=>Math.abs(a.x-poaX)-Math.abs(b.x-poaX));
    const lb=G.def.filter(d=>d.pos==='LB'&&!d._beat).sort((a,b)=>Math.abs(a.x-poaX)-Math.abs(b.x-poaX));
    const targets=[...dl,...lb]; const down=G.ol.filter(b=>b!==G.pull); if(G.skill.TE) down.push(G.skill.TE);
    assignAndBlock(down,targets,dt,d=>{ const seal=G.runDir==='R'?-1:(G.runDir==='L'?1:(d.x<poaX?-1:1)); return { bx:d.x-seal*0.9, by:d.y-0.4, ax:seal, ay:0.45, sus:2.3+Math.random()*1.0 }; });
    if(G.pull){ const pt={x:poaX,y:G.los+2}; let tgt=null,bd=9e9;
      for(const d of G.def){ if(d.blocked||d._beat||d.pos==='CB'||d.pos==='S') continue; const dd=Math.hypot(d.x-pt.x,d.y-pt.y)*(d.pos==='LB'?0.6:1); if(dd<bd){bd=dd;tgt=d;} }
      if(tgt&&bd<8){ const dx=pt.x-tgt.x,dy=pt.y-tgt.y,m=Math.hypot(dx,dy)||1; seek(G.pull,tgt.x+dx/m*0.7,tgt.y+dy/m*0.7,1.25,dt);
        if(dist(G.pull,tgt)<1.5){ tgt.blocked=true; tgt.vx=(tgt.vx||0)*0.5-dx/m*0.7; tgt.vy=(tgt.vy||0)*0.5-dy/m*0.7; tgt.x+=tgt.vx*dt; tgt.y+=tgt.vy*dt; } }
      else seek(G.pull,pt.x,pt.y,1.1,dt); }
    const runPt=(G.carrier&&G.carrier.pos==='RB')?G.carrier:{x:poaX,y:G.los+2};
    const dbs=G.def.filter(d=>(d.pos==='CB'||d.pos==='S')&&!d._beat); const wrs=[G.skill.X,G.skill.Y,G.skill.Z].filter(Boolean);
    assignAndBlock(wrs,dbs,dt,d=>{ const dx=runPt.x-d.x,dy=runPt.y-d.y,m=Math.hypot(dx,dy)||1; return { bx:d.x+dx/m*0.9, by:d.y+dy/m*0.9, ax:-dx/m, ay:-dy/m, sus:1.6+Math.random()*0.9 }; });
  } }

/* CPU offense */
function cpuQB(dt){
  let bestR=null,bestSep=-1; for(const r of G.recv){ let m=9e9; for(const d of G.def) m=Math.min(m,dist(d,r)); if(m>bestSep){bestSep=m;bestR=r;} }
  const pressure=G.def.some(d=>d.job&&d.job.t==='rush'&&!d.blocked&&dist(d,G.qb)<2.6);
  if(G.t>1.1 && bestR && bestSep>2.7){ throwBall(bestR.x+(bestR.vx||0)*0.35,bestR.y+(bestR.vy||0)*0.4); return; }
  if((pressure||G.t>3.6) && bestR){ if(bestSep>1.9){ throwBall(bestR.x+(bestR.vx||0)*0.3,bestR.y+(bestR.vy||0)*0.35); return; } G.qb._scr=true; }
  if(G.qb._scr){ seek(G.qb, G.qb.x+(G.qb.x<CX?4:-4), G.los-1, 0.85, dt); if(G.qb.y>G.los+0.3){ G.carrier=G.qb; G.phase='run'; } }
}
function cpuRun(c,dt){ let nd=null,nb=9e9; for(const d of G.def){ if(d.blocked)continue; const dd=dist(d,c); if(dd<nb){nb=dd;nd=d;} }
  let tx=c.x; if(nd&&nb<6) tx=c.x+(nd.x>c.x?-3.5:3.5); tx=Math.max(2,Math.min(FW-2,tx));
  steer(c,tx-c.x,(c.y+9)-c.y,c.spd,c.acc*1.3,dt); if(nb<2.1&&(c._jukeCd||0)<=0) triggerJuke(); }

/* user-controlled defender */
function userDefMove(d,dt){ const v=controlVec(); const des=Math.hypot(v.x,v.y)>0.05?d.spd*1.08:0; steer(d,v.x,v.y,des,d.acc*2.5,dt);
  if(keys[' '] && !d.dive && (d.down||0)<=0 && G.carrier && dist(d,G.carrier)<3.2){ d.dive={t:0.34,dx:G.carrier.x+(G.carrier.vx||0)*0.15,dy:G.carrier.y+(G.carrier.vy||0)*0.15}; } }

/* run fit AI */
function runFit(d,c,dt){ const f=d.fit; if(!f){ seek(d,c.x,c.y,1,dt); return; }
  if(f.delay&&G.t<f.delay) return;
  const committed = c.y>G.los-1 || dist(d,c)<5;
  if(f.mode==='blitz'){ if(c.y<G.los+1){ seek(d,f.gap,G.los-2,1,dt); } else seek(d,c.x,c.y,1,dt); return; }
  if(f.mode==='contain'){ const beat=(f.edge>0&&c.x>d.x+0.5)||(f.edge<0&&c.x<d.x-0.5);
    if(beat) seek(d,c.x,c.y,1,dt); else seek(d,c.x+f.edge*2.6,Math.max(c.y,d.y-1),1,dt); return; }
  if(f.mode==='support'){ if(committed) seek(d,c.x,c.y,1,dt); else seek(d,f.gap,d.y-1,0.6,dt); return; }
  if(!committed) seek(d,f.gap,G.los+0.5,0.95,dt); else seek(d,c.x,c.y,1,dt); }

let last=performance.now();
function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*60); if(flashT>0) flashT-=dt; if(G.puff&&G.puff.t>0) G.puff.t-=dt;
  if(G.phase==='presnap'||G.phase==='select'||G.phase==='dead') return;
  G.t+=dt; const carry=(G.phase==='run'||G.phase==='handoff');

  if(!G.isRun){ for(const r of G.recv){ if(r===G.carrier) continue; moveReceiver(r,dt); (r.hist=r.hist||[]).push({x:r.x,y:r.y}); if(r.hist.length>22) r.hist.shift(); } }

  if(G.phase==='live'){
    if(G.pa&&G.paT>0){ G.paT-=dt; seek(G.qb,CX,G.los-3,0.5,dt); }              // ride the fake
    else if(G.roll&&G.t<1.85){ G.dropDone=true; seek(G.qb,G.roll==='R'?38:16,G.los-3,0.9,dt); }  // bootleg rollout
    else if(!G.dropDone){ seek(G.qb,CX,G.los-7,0.85,dt); if(dist(G.qb,{x:CX,y:G.los-7})<0.6||G.t>0.95) G.dropDone=true; }
    else if(G.offCPU){ cpuQB(dt); }
    else { const v=controlVec(),des=Math.hypot(v.x,v.y)>0.05?G.qb.spd*sprintF():0; steer(G.qb,v.x,v.y,des,G.qb.acc*2.1,dt);
      G.qb.x=Math.max(2,Math.min(FW-2,G.qb.x)); G.qb.y=Math.max(G.los-16,G.qb.y); if(G.qb.y>G.los+0.3){ G.carrier=G.qb; G.phase='run'; } } }

  if(G.phase==='live'||G.phase==='air'){
    resolveBlocks(dt,true); const rushOn=G.t>G.rushFree;
    for(const d of G.def){ const J=d.job; if(!J||d.blocked) continue;
      if(d===G.control){ userDefMove(d,dt); continue; }
      if(G.pa&&G.paT>0&&d.pos==='LB'&&(J.t==='zoneU'||J.t==='man'||J.t==='carry')){ seek(d,d.x,G.los+2,0.9,dt); continue; }
      if((d.down||0)>0){ d.down-=dt; continue; }
      if(J.t==='rush'){ if(rushOn) seek(d,G.qb.x,G.qb.y,1,dt); if(G.phase==='live'&&dist(d,G.qb)<1.0){ puffAt(G.qb.x,G.qb.y); return endPlay('SACK',G.qb.y); }
      } else if(J.t==='spy'){ seek(d,G.qb.x,Math.min(G.qb.y+3,G.los+3),0.9,dt);
      } else if(J.t==='man'){ const w=J.tgt; let tx=w.x,ty=w.y-0.5; if(w.hist&&w.hist.length>15){ const h=w.hist[w.hist.length-16]; tx=h.x; ty=h.y-0.5; } if(G.phase==='air'){ tx=G.ball.tx; ty=G.ball.ty; } seek(d,tx,ty,0.99,dt);
      } else if(J.t==='carry'){ const w=J.tgt; let tx=w.x,ty=w.y+1.5; if(w.hist&&w.hist.length>8){ const h=w.hist[w.hist.length-9]; tx=h.x*0.5+w.x*0.5; } if(G.phase==='air'){ tx=G.ball.tx; ty=G.ball.ty; } seek(d,tx,ty,0.99,dt);
      } else if(J.t==='zoneD'||J.t==='zoneU'){ let tx=J.lm.x,ty=J.lm.y,th=null,best=9e9;
        for(const r of G.recv){ const dd=Math.hypot(r.x-J.lm.x,r.y-J.lm.y); if(dd<11&&dd<best){best=dd;th=r;} }
        if(th){ const cap=J.t==='zoneD'?8:6; tx=J.lm.x+Math.max(-cap,Math.min(cap,th.x-J.lm.x)); ty=J.t==='zoneD'?Math.max(J.lm.y,th.y+3):Math.min(J.lm.y,th.y); }
        if(G.phase==='air'){ const dB=Math.hypot(d.x-G.ball.tx,d.y-G.ball.ty); if(dB<14){tx=G.ball.tx;ty=G.ball.ty;} } seek(d,tx,ty,0.9,dt); } }
    if(G.phase==='air'){ const b=G.ball; b.t+=dt; const u=Math.min(1,b.t/b.dur); b.x=b.sxp+(b.tx-b.sxp)*u; b.y=b.syp+(b.ty-b.syp)*u; if(u>=1) resolveCatch(); }
  }

  if(carry){
    if(G.phase==='handoff'){ G.handoffT-=dt; seek(G.qb,CX-1.4,G.los-6,0.5,dt); seek(G.rb,G.poaX,G.los-1,1,dt);
      if(G.handoffT<=0){ G.qb.hasBall=false; G.carrier=G.rb; G.rb.hasBall=true; G.phase='run'; } }
    else { const c=G.carrier;
      if(G.offCPU){ cpuRun(c,dt); } else { const v=controlVec(); if((c._jukeCd||0)>0)c._jukeCd-=dt; if((c._jukeT||0)>0)c._jukeT-=dt;
        const jb=(c._jukeT>0)?1.75:1, des=Math.hypot(v.x,v.y)>0.05?c.spd*sprintF()*jb:0; steer(c,v.x,v.y,des,c.acc*2.5,dt); }
      c.x=Math.max(1,Math.min(FW-1,c.x)); focusY=c.y; }
    resolveBlocks(dt,false);
    const c=G.carrier;
    for(const d of G.def){ if(d.blocked) continue;
      if((d.down||0)>0){ d.down-=dt; continue; }
      if(d.dive){ d.dive.t-=dt; steer(d,d.dive.dx-d.x,d.dive.dy-d.y,d.spd*1.8,d.acc*2.4,dt); if(dist(d,c)<1.55){ puffAt(c.x,c.y); return endPlay('TACKLE',c.y); } if(d.dive.t<=0){ d.dive=null; d.down=0.85; } continue; }
      if(d===G.control){ userDefMove(d,dt); }
      else { runFit(d,c,dt); if(G.phase==='run'&&dist(d,c)<2.4&&dist(d,c)>1.0&&Math.random()<0.07){ d.dive={t:0.32,dx:c.x+(c.vx||0)*0.16,dy:c.y+(c.vy||0)*0.16}; } }
      const dd=dist(d,c), tackR=(c._jukeT>0)?0.7:1.15; if(dd<=tackR){ puffAt(c.x,c.y); return endPlay('TACKLE',c.y); } }
    if(c.y>=110) return score();
  } else if(G.phase==='live'){ focusY+=(G.los+6-focusY)*Math.min(1,dt*4); }
  clampCam();
}
function resolveCatch(){ const {tx,ty}=G.ball;
  let bW=null,bw=9e9; for(const w of G.recv){ const d=Math.hypot(w.x-tx,w.y-ty); if(d<bw){bw=d;bW=w;} }
  let bD=null,bd=9e9; for(const d of G.def){ const q=Math.hypot(d.x-tx,d.y-ty); if(q<bd){bd=q;bD=d;} }
  const CATCH=2.8,CONTEST=2.3, userPick=(bD&&bD===G.control);
  if(bW&&bw<=CATCH){ if(bD&&bd<bw&&bd<CONTEST){ if(Math.random()<(userPick?0.55:0.30)){ endPlay('INTERCEPTED',ty); return; } endPlay('INCOMPLETE',G.los); return; }
    bW.caught=true; G.carrier=bW; G.phase='run'; return; }
  endPlay('INCOMPLETE',G.los); }
function score(){ if(offenseIsUser()) G.you+=7; else G.cpu+=7; bumpShake(9); setFlash('TOUCHDOWN!','#ffcf4a'); flipPossession(); G.phase='dead'; G.deadTxt='TOUCHDOWN'; }
function endPlay(kind,spotY){ if(G.phase==='dead') return; bumpShake(kind==='SACK'||kind==='TACKLE'?6:3); let turn=false;
  if(kind==='INTERCEPTED'){ turn=true; setFlash(offenseIsUser()?'PICKED OFF':'INTERCEPTED!',offenseIsUser()?'#d85852':'#4ade80'); }
  else if(kind==='SACK') setFlash('SACK!','#d85852'); else if(kind==='INCOMPLETE') setFlash('INCOMPLETE','#dfe8ff');
  const gain=Math.round(spotY-G.los);
  if(turn){ flipPossession(); G.deadTxt='TURNOVER'; G.phase='dead'; return; }
  if(spotY>=110){ score(); return; } G.los=Math.max(1,Math.min(109,spotY));
  if(G.los>=G.first){ G.down=1; G.first=Math.min(G.los+10,110); G.deadTxt=`FIRST DOWN  •  ${kind==='TACKLE'?(gain>=0?'+'+gain:''+gain)+' yds':kind}`; }
  else { G.down++; if(G.down>4){ flipPossession(); G.deadTxt='TURNOVER ON DOWNS'; G.phase='dead'; return; } G.deadTxt=kind==='TACKLE'?(gain>=0?`+${gain} yds`:`${gain} yds`):kind; }
  G.phase='dead'; }

/* sprites */
function shade(hex,amt){ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const cl=v=>Math.max(0,Math.min(255,v))|0; return `rgb(${cl(parseInt(hex.slice(0,2),16)+amt)},${cl(parseInt(hex.slice(2,4),16)+amt)},${cl(parseInt(hex.slice(4,6),16)+amt)})`; }
function lerpAng(a,b,t){ let d=((b-a+Math.PI)%(2*Math.PI))-Math.PI; return a+d*t; }
function rrp(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawPlayer(o,jersey,opts){ opts=opts||{}; const px=sx(o.x),py=sy(o.y),R=PPY*1.26*(opts.big?1.06:1);
  if(o._ang===undefined) o._ang=opts.def?Math.PI/2:-Math.PI/2;
  const sp=Math.hypot(o.vx||0,o.vy||0), moving=sp>0.4; if(moving){ o._ang=lerpAng(o._ang,Math.atan2(-(o.vy||0),(o.vx||0)),0.28); o._leg=(o._leg||0)+sp*0.035; }

  if((G.phase==='presnap'||G.phase==='live')&&!G.isRun){ for(const r of (G.recv||[])){ if(r!==G.carrier&&r.btn) badge(r.x,r.y,r.btn); } }
  if(G.phase==='presnap') return;
  if(G.phase==='live'){ drawBtn(BTN.scr,'RUN',gv('--good'));
    for(const b of recvButtons()){ ctx.fillStyle='rgba(10,13,16,0.62)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle=b.btn.c; ctx.lineWidth=3.5; ctx.stroke(); ctx.fillStyle=b.btn.c; ctx.textAlign='center'; ctx.font="bold 15px 'Press Start 2P',monospace"; ctx.fillText(b.btn.l,b.x,b.y+6); ctx.textAlign='left'; } return; }
  if(G.phase==='run'||G.phase==='handoff'){ drawBtn(BTN.main,'JUKE',gv('--amber')); } }
function drawFlash(){ const a=Math.min(1,flashT/0.5); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.fillStyle=flashCol; ctx.font="24px 'Press Start 2P',monospace"; ctx.fillText(flash,W/2,H*0.36); ctx.globalAlpha=1; ctx.textAlign='left'; }

function frame(now){ const dt=Math.min(0.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
hintEl.innerHTML='<b>PASS</b> tap a receiver to throw · SCRMBL to tuck &amp; run &nbsp;|&nbsp; <b>RUN</b> drag to steer · JUKE to cut &nbsp;|&nbsp; <b>DEFENSE</b> drag to move · SWITCH · DIVE &nbsp;(desktop: WASD, click a receiver, Space, E)';
if(typeof globalThis!=='undefined') globalThis.__hooks={ setupPlay,snap,throwBall,update,draw,getG:()=>G,keys:()=>keys,pick:(tab,idx)=>{G.tab=tab;G.sel[tab]=idx;},setSide:s=>{G.userSide=s;},setDef:i=>{G.selDef=i;},sw:switchDefender, throwToReceiver:(r)=>throwToReceiver(r), nearestRecv:(x,y)=>nearestRecv(x,y) };
</script>
