<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Building Quote — Summertown Metals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#1c1917;color:#e7e0d5;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(180,130,50,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(120,100,70,.03) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;position:relative;z-index:1;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.06);border-top-color:#b4822e;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:#6b6460;}
.err{text-align:center;padding:60px 20px;position:relative;z-index:1;}.err h2{color:#c05040;font-family:'Outfit',sans-serif;margin-bottom:8px;}.err p{color:#6b6460;font-size:14px;}

/* Preview bar (salesman only) */
.preview-bar{background:linear-gradient(135deg,#b4822e,#d4a843);padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:12px;position:sticky;top:0;z-index:50;}
.preview-bar .pb-dot{width:8px;height:8px;border-radius:50%;background:#1c1917;animation:ppulse 2s infinite;}
@keyframes ppulse{0%,100%{opacity:1}50%{opacity:.4}}
.preview-bar .pb-t{font-weight:800;color:#1c1917;font-family:'Outfit',sans-serif;}.preview-bar .pb-s{color:rgba(0,0,0,.5);margin-left:auto;font-size:11px;font-weight:600;}
.preview-bar .pub-btn{margin-left:12px;padding:6px 18px;background:#1c1917;color:#d4a843;border:none;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.preview-bar .pub-btn:hover{background:#242220;}

/* Header */
.hdr{text-align:center;padding:32px 16px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(180,130,50,.06) 0%,transparent 60%);position:relative;z-index:1;}
.hdr-logo{display:inline-flex;width:44px;height:44px;background:linear-gradient(135deg,#b4822e,#d4a843);border-radius:10px;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:900;font-size:16px;color:#1c1917;margin-bottom:12px;box-shadow:0 2px 12px rgba(180,130,50,.25);}
.hdr h1{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;margin-bottom:4px;letter-spacing:-0.5px;}.hdr h1 span{color:#d4a843;}
.hdr .sub{font-size:12px;color:#8c8379;font-weight:500;}.hdr .qid{font-size:10px;color:#5a534d;font-weight:500;margin-top:6px;}

/* Expiry */
.expiry{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:11px;color:#8c8379;font-weight:500;position:relative;z-index:1;}
.expiry .dot{width:6px;height:6px;border-radius:50%;background:#5a9a6a;}.expiry.warn .dot{background:#b4822e;}.expiry.expired .dot{background:#c05040;}

/* Personal message card */
.msg-card{max-width:700px;margin:0 auto 16px;padding:18px;background:rgba(180,130,50,.04);border:1px solid rgba(180,130,50,.12);border-radius:14px;position:relative;z-index:1;}
.msg-card .mc-from{font-size:10px;font-weight:700;color:#b4822e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.msg-card .mc-txt{font-size:14px;color:#c4bab0;line-height:1.7;}
.msg-edit{width:100%;min-height:80px;background:#1c1917;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:12px;color:#e7e0d5;font-size:14px;font-family:'Inter',sans-serif;line-height:1.6;resize:vertical;outline:none;}
.msg-edit:focus{border-color:rgba(180,130,50,.3);}
.msg-edit-hint{font-size:10px;color:#5a534d;margin-top:4px;}

/* 3D Viewer */
.viewer{width:calc(100% - 32px);max-width:900px;margin:0 auto 16px;height:380px;background:#242220;position:relative;border-radius:14px;overflow:hidden;z-index:1;border:1px solid rgba(255,255,255,.04);}
.viewer canvas{display:block;width:100%!important;height:100%!important;}
.v-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;background:rgba(28,25,23,.7);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:5px 10px;z-index:2;backdrop-filter:blur(8px);}
.v-dot{width:5px;height:5px;border-radius:50%;background:#b4822e;animation:ppulse 2s infinite;}
.v-t{font-size:9px;font-weight:600;color:#8c8379;text-transform:uppercase;letter-spacing:1px;}
.v-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;color:#5a534d;background:rgba(28,25,23,.7);padding:4px 10px;border-radius:5px;z-index:2;}

/* Container */
.container{max-width:780px;margin:0 auto;padding:16px;position:relative;z-index:1;}
.sec{background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;}
.sec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#b4822e,transparent);border-radius:0 2px 2px 0;}
.sec-t{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#8c8379;margin-bottom:12px;display:flex;align-items:center;gap:6px;}.sec-t::before{content:'';width:3px;height:10px;background:#b4822e;border-radius:2px;}

/* Spec items */
.spec-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);}.spec-item:last-child{border-bottom:none;}
.spec-item .si-icon{font-size:16px;width:28px;text-align:center;flex-shrink:0;}
.spec-item .si-name{font-size:13px;font-weight:600;flex:1;color:#c4bab0;}.spec-item .si-val{font-size:12px;color:#8c8379;font-weight:500;}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
@media(max-width:500px){.spec-grid{grid-template-columns:1fr;}}

/* Pricing */
.price-row{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);}.price-row:last-child{border-bottom:none;}
.price-row .pr-l{font-size:13px;color:#c4bab0;}.price-row .pr-v{font-size:13px;font-weight:700;font-family:'Outfit',sans-serif;color:#d4a843;}
.price-total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#1c1917;border:1px solid rgba(180,130,50,.15);border-radius:10px;margin-top:8px;}
.price-total .pt-l{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;color:#e7e0d5;}.price-total .pt-v{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:#d4a843;}

/* CTA */
.cta{text-align:center;padding:28px 20px;margin:12px auto;max-width:780px;background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:14px;position:relative;z-index:1;}
.cta .ct{font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;margin-bottom:4px;color:#f5f0e8;}
.cta .cs{font-size:12px;color:#8c8379;margin-bottom:18px;}
.cta-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.cta-btn{padding:12px 28px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;text-decoration:none;display:inline-block;}
.cta-btn.accept{background:linear-gradient(135deg,#b4822e,#d4a843);color:#1c1917;box-shadow:0 4px 16px rgba(180,130,50,.3);}
.cta-btn.accept:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(180,130,50,.4);}
.cta-btn.changes{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#8c8379;}
.cta-btn.changes:hover{border-color:rgba(180,130,50,.2);color:#d4a843;}
.cta .phone{margin-top:8px;font-size:11px;color:#5a534d;}
.cta .phone strong{color:#d4a843;}

/* Chat */
.chat-sec{max-width:780px;margin:0 auto 16px;position:relative;z-index:1;}
.chat-card{background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
.chat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#b4822e,transparent);border-radius:0 2px 2px 0;}
.chat-title{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#8c8379;margin-bottom:12px;}
.chat-msgs{max-height:250px;overflow-y:auto;margin-bottom:12px;}
.chat-msg{padding:10px 14px;border-radius:10px;margin-bottom:6px;max-width:80%;}
.chat-msg.them{background:rgba(180,130,50,.08);border:1px solid rgba(180,130,50,.1);margin-right:auto;}
.chat-msg.me{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);margin-left:auto;}
.chat-msg .cm-name{font-size:10px;font-weight:700;color:#b4822e;margin-bottom:2px;}
.chat-msg.me .cm-name{color:#8c8379;}
.chat-msg .cm-txt{font-size:13px;color:#c4bab0;line-height:1.5;}
.chat-msg .cm-time{font-size:9px;color:#5a534d;margin-top:4px;}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;padding:10px 14px;background:#1c1917;border:1px solid rgba(255,255,255,.06);border-radius:8px;color:#e7e0d5;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
.chat-input input:focus{border-color:rgba(180,130,50,.3);}
.chat-input input::placeholder{color:#5a534d;}
.chat-input button{padding:10px 20px;background:linear-gradient(135deg,#b4822e,#d4a843);color:#1c1917;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}

/* Salesman card */
.sc{max-width:780px;margin:0 auto 16px;padding:16px 18px;background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:12px;display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.sc-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#b4822e,#d4a843);display:flex;align-items:center;justify-content:center;font-weight:900;color:#1c1917;font-size:18px;font-family:'Outfit',sans-serif;flex-shrink:0;}
.sc-n{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:#e7e0d5;}.sc-d{font-size:11px;color:#6b6460;margin-top:1px;}

/* Footer */
.footer{text-align:center;padding:24px 16px;font-size:11px;color:#5a534d;border-top:1px solid rgba(255,255,255,.04);margin-top:20px;position:relative;z-index:1;}
.sig-name{font-family:'Outfit',sans-serif;font-weight:800;font-size:13px;color:#8c8379;}

/* Status toast */
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;background:#242220;border:1px solid rgba(180,130,50,.2);border-radius:10px;font-size:13px;font-weight:600;color:#d4a843;z-index:100;transform:translateX(120%);transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.toast.show{transform:translateX(0);}

@media(max-width:640px){.viewer{height:260px;}.cta-btns{flex-direction:column;}.cta-btn{width:100%;}}
</style>
</head>
<body>

<div class="loading" id="ls"><div class="spinner"></div><p>Loading your quote...</p></div>
<div id="pc" style="display:none"></div>
<div id="es" class="err" style="display:none"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var SU='https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
var P=new URLSearchParams(window.location.search),qId=P.get('q')||'',md=P.get('mode')||'';

// Check for preview data from 3D designer
var previewData = null;
try { previewData = JSON.parse(sessionStorage.getItem('sauce_portal_data')); } catch(e) {}

if (previewData && md === 'preview') {
    // PREVIEW MODE — render from sessionStorage
    renderPortal(buildPreviewPayload(previewData));
} else if (qId) {
    // CUSTOMER MODE — load from API
    loadQuote();
} else {
    showErr('No quote ID', 'Check the link you received.');
}

function showErr(t,m) { document.getElementById('ls').style.display='none'; var e=document.getElementById('es'); e.style.display='block'; e.innerHTML='<h2>'+t+'</h2><p>'+m+'</p>'; }
function f$(n) { return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000); }
function escH(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function buildPreviewPayload(pd) {
    // Convert 3D designer data into same shape as API response
    var ft=[],pr=[];
    var dims=pd.w+"'×"+pd.l+"'×"+pd.h+"'";

    // Specs from features
    ft.push({i:'📐',n:'Building Size',v:dims});
    ft.push({i:'🏗️',n:'Sidewall',v:pd.h+"'"});
    ft.push({i:'⛰️',n:'Peak',v:Math.round((pd.h+(pd.w/2)*(pd.pitch/12))*10)/10+"'"});
    ft.push({i:'📐',n:'Pitch',v:pd.pitch+'/12'});
    ft.push({i:'🏗️',n:'Post Spacing',v:pd.postSpacing+"'"});
    if(pd.roofColor) ft.push({i:'🎨',n:'Roof Color',v:pd.roofColor});

    // Doors from 3D designer
    if(pd.doors) pd.doors.forEach(function(d) {
        ft.push({i:'🚪',n:(d.type||'Door')+' — '+d.size,v:(d.wall||'')+', '+d.offset+"' offset"});
    });

    // Features
    var fe=pd.features||{};
    if(fe.walkDoors) fe.walkDoors.forEach(function(w) { ft.push({i:'🚪',n:'Walk Door — '+w.type,v:'×'+w.qty}); });
    if(fe.windows) fe.windows.forEach(function(w) { ft.push({i:'🪟',n:'Window — '+w.type,v:'×'+w.qty}); });
    if(fe.insulation && fe.insulation.type && fe.insulation.type!=='None') {
        var loc=''; if(fe.insulation.roof) loc+='Roof '; if(fe.insulation.walls) loc+='Walls';
        ft.push({i:'🧊',n:'Insulation — '+fe.insulation.type,v:loc.trim()});
    }
    if(fe.concrete && fe.concrete.main) ft.push({i:'🏗️',n:'Concrete',v:fe.concrete.main});
    if(fe.wainscot) ft.push({i:'🎨',n:"4' Wainscot",v:'Included'});
    if(fe.gutters) ft.push({i:'🌧️',n:'Gutters',v:'Included'});
    if(fe.postProtectors) ft.push({i:'🛡️',n:'Post Protectors',v:'Included'});
    if(fe.rockWainscot) ft.push({i:'🧱',n:'Rock Wainscot',v:'Included'});
    if(fe.finishedCeiling) ft.push({i:'🏗️',n:'Finished Ceiling',v:'Included'});
    if(fe.postsOnTop) ft.push({i:'📐',n:'Posts On Top',v:'Included'});
    if(fe.postWraps) ft.push({i:'🏗️',n:'Post Wraps',v:'Included'});
    if(fe.lvlHeaders) ft.push({i:'🪵',n:'LVL Headers',v:'Included'});
    if(fe.cupola && fe.cupola.size) ft.push({i:'🏛️',n:'Cupola — '+fe.cupola.size+'"',v:'×'+(fe.cupola.qty||1)});

    // Line items → pricing rows
    if(pd.lineItems) pd.lineItems.forEach(function(li) {
        if(li.price > 0) pr.push({label:li.name,amount:li.price});
    });

    // Get user info
    var user = {};
    try { user = JSON.parse(sessionStorage.getItem('sauce_user')||'{}'); } catch(e) {}

    return {
        isPreview: true,
        customerName: pd.customerName || 'Customer',
        quoteId: 'QT-PREVIEW',
        createdDate: new Date().toISOString(),
        expiryDate: new Date(Date.now()+30*864e5).toISOString(),
        calcType: pd.truss + ' Truss Post Frame',
        specs: ft,
        pricing: pr,
        totalAmount: pd.pricing ? pd.pricing.total : 0,
        message: '',
        userSig: { sigName: user.name||'', sigPhone: user.phone||'', sigEmail: user.email||'', sigCompany: user.company||'Summertown Metals' },
        buildingData: { w:pd.w, l:pd.l, h:pd.h, pitch:pd.pitch, postSpacing:pd.postSpacing, oh:pd.oh||18, frameType:pd.frameType||'post',
            roofColor:pd.roofColor, wallColor:pd.wallColor, trimColor:pd.trimColor, wainscotColor:pd.wainscotColor, hasWainscot:pd.hasWainscot },
        walls: pd.walls,
        doors: pd.doors,
        sheds: pd.sheds
    };
}

async function loadQuote() {
    try {
        var r = await fetch(SU, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'getQuote',quoteId:qId})});
        var d = await r.json();
        if (!d.success) { showErr('Quote not found', d.error||'This quote may have expired.'); return; }
        // Transform API data and render
        var qd=d.quoteData||{},sp=qd.specs||{};
        var ft=[],pr=qd.pricing||[];
        // Build features from specs (same logic as existing portal)
        var dims=(sp.width||'?')+"'×"+(sp.length||'?')+"'×"+(sp.height||'?')+"'";
        function aF(i,n,v){if(v&&v!=='None'&&v!=='No'&&v!=='0'&&v!=='')ft.push({i:i,n:n,v:v});}
        aF('📐','Building Size',dims); aF('🏗️','Sidewall',(sp.height||'14')+"'");
        var pkH=(parseFloat(sp.height)||14)+((parseFloat(sp.width)||40)/2)*((parseFloat(sp.roofPitch)||4)/12);
        aF('⛰️','Peak',Math.round(pkH*10)/10+"'"); aF('📐','Pitch',(sp.roofPitch||'4')+'/12');
        aF('🏗️','Posts',(sp.eavePostSpacing||'12')+"'"); aF('🎨','Roof',sp.roofColor);
        for(var i=1;i<=4;i++){var t=sp['garageDoor'+i+'Type'],q=parseInt(sp['garageDoor'+i+'Qty'])||0;if(t&&t!=='None'&&q>0)aF('🚪','Garage Door',t+' ×'+q);}
        for(var i=1;i<=2;i++){var t=sp['walkDoor'+i+'Type'],q=parseInt(sp['walkDoor'+i+'Qty'])||0;if(t&&t!=='None'&&q>0)aF('🚪','Walk Door',t+' ×'+q);}
        for(var i=1;i<=3;i++){var t=sp['window'+i+'Type'],q=parseInt(sp['window'+i+'Qty'])||0;if(t&&t!=='None'&&q>0)aF('🪟','Window',t+' ×'+q);}
        if(sp.insulation&&sp.insulation!=='None'){var loc='';if(sp.insulationRoof==='Yes')loc+='Roof ';if(sp.insulationWalls==='Yes')loc+='Walls';aF('🧊','Insulation',sp.insulation+(loc?' — '+loc.trim():''));}
        aF('🌧️','Gutters',sp.gutters); aF('🛡️','Post Protectors',sp.postProtectors); aF('🧱','Rock Wainscot',sp.rockWainscot);
        aF('📐','Posts On Top',sp.postsOnTop); aF('🎨','Wainscot',sp.wainscot);
        if(sp.cupola&&sp.cupola!=='None'&&parseInt(sp.cupolaQty)>0)aF('🏛️','Cupola',sp.cupola+'" ×'+sp.cupolaQty);
        if(parseInt(sp.ssWidth)>0)aF('🏘️','Shed 1',sp.ssWidth+"'×"+sp.ssLength+"'");
        if(parseInt(sp.ss2Width)>0)aF('🏘️','Shed 2',sp.ss2Width+"'×"+sp.ss2Length+"'");

        renderPortal({
            isPreview: md==='preview',
            customerName: d.customerName||'Customer',
            quoteId: qId,
            createdDate: d.createdDate || new Date().toISOString(),
            expiryDate: d.expiryDate || new Date(Date.now()+30*864e5).toISOString(),
            calcType: d.calcType || 'Post Frame',
            specs: ft,
            pricing: pr.filter(function(p){return parseFloat(p.amount)>0;}),
            totalAmount: parseFloat(qd.totalAmount)||0,
            message: qd.message||'',
            userSig: qd.userSig||{},
            buildingData: { w:parseFloat(sp.width)||40, l:parseFloat(sp.length)||60, h:parseFloat(sp.height)||14, pitch:parseFloat(sp.roofPitch)||4, postSpacing:parseFloat(sp.eavePostSpacing)||12 },
            chatMessages: d.chatMessages||[]
        });
    } catch(e) { showErr('Connection error','Unable to load. Try again.'); }
}

function renderPortal(data) {
    document.getElementById('ls').style.display='none';
    var c=document.getElementById('pc'); c.style.display='block';
    var bd=data.buildingData||{}, sig=data.userSig||{};
    var cd=new Date(data.createdDate), ed=new Date(data.expiryDate);
    var dl=Math.max(0,Math.ceil((ed-Date.now())/864e5)), exp=dl===0;
    var dims=bd.w+"'×"+bd.l+"'×"+bd.h+"'";
    var eC=dl<=7?(exp?'expired':'warn'):'';
    var eT=exp?'This quote has expired':'Quote valid for '+dl+' more day'+(dl!==1?'s':'');

    // Specs HTML
    var fH=(data.specs||[]).map(function(f){return '<div class="spec-item"><div class="si-icon">'+f.i+'</div><div class="si-name">'+f.n+'</div><div class="si-val">'+f.v+'</div></div>';}).join('');

    // Pricing HTML
    var pH=(data.pricing||[]).map(function(p){return '<div class="price-row"><div class="pr-l">'+p.label+'</div><div class="pr-v">'+f$(p.amount)+'</div></div>';}).join('');
    var tot=data.totalAmount||0;

    // Preview bar

    // Chat section (customer mode only)

    if(!data.isPreview) {
        var msgs=(data.chatMessages||[]).map(function(m) {
            var isMe = !m.fromSalesman;

        }).join('');
        chatH='<div class="chat-sec"><div class="chat-card"><div class="chat-title">💬 Messages</div><div class="chat-msgs" id="chatMsgs">'+msgs+(msgs?'':'<div style="text-align:center;padding:16px;color:#5a534d;font-size:12px;">No messages yet. Ask a question below.</div>')+'</div><div class="chat-input"><input id="chatInput" placeholder="Type a message..." onkeydown="if(event.key===\'Enter\')sendChat()"><button onclick="sendChat()">Send</button></div></div></div>';
    }

    // Salesman card
    var sH=sig.sigName?'<div class="sc"><div class="sc-av">'+(sig.sigName||'S')[0].toUpperCase()+'</div><div><div class="sc-n">'+sig.sigName+'</div>'+(sig.sigPhone?'<div class="sc-d">'+sig.sigPhone+'</div>':'')+(sig.sigEmail?'<div class="sc-d">'+sig.sigEmail+'</div>':'')+(sig.sigCompany?'<div class="sc-d">'+sig.sigCompany+'</div>':'')+'</div></div>':'';

    c.innerHTML = pvB +
        '<div class="hdr"><div class="hdr-logo">SM</div><h1>Your <span>'+dims+'</span> Building</h1><div class="sub">'+(data.calcType||'Post Frame')+' — '+data.customerName+'</div><div class="qid">'+data.quoteId+' · '+cd.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div></div>' +
        '<div class="expiry '+eC+'"><div class="dot"></div>'+eT+'</div>' +
        mH +
        '<div class="viewer" id="v3d"><div class="v-badge"><div class="v-dot"></div><div class="v-t">3D Preview</div></div><div class="v-hint">Drag to rotate · Scroll to zoom</div></div>' +
        '<div class="container"><div class="sec"><div class="sec-t">Building Specifications</div><div class="spec-grid">'+fH+'</div></div><div class="sec"><div class="sec-t">Investment Summary</div>'+pH+'<div class="price-total"><div class="pt-l">Total Investment</div><div class="pt-v">'+f$(tot)+'</div></div></div>'+ctH+'</div>' +
        chatH + sH +
        '<div class="footer"><div class="sig-name">SUMMERTOWN METALS</div><div style="color:#6b6460">Quality Post Frame Buildings</div><div style="margin-top:8px;font-size:10px">© '+new Date().getFullYear()+' Summertown Metals</div></div>';

    // Build 3D
    setTimeout(function(){ build3D(bd, data.doors, data.walls, data.sheds); },200);

}

function formatTime(ts) {
    if(!ts) return '';
    var d=new Date(ts), now=new Date(), diff=(now-d)/1000;
    if(diff<60) return 'Just now'; if(diff<3600) return Math.floor(diff/60)+'m ago';
    if(diff<86400) return Math.floor(diff/3600)+'h ago'; if(diff<172800) return 'Yesterday';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// === 3D RENDERER ===
function build3D(bd, doors, wallCfgs, shedCfgs) {
    var c=document.getElementById('v3d'); if(!c) return;
    var W=bd.w||40, L=bd.l||60, H=bd.h||14, pi=bd.pitch||4, ps=bd.postSpacing||12, ovh=(bd.oh||18)/12;

    // Color lookup
    var _ch={'Galvalume':'#9CA3AF','White':'#F5F5F0','Ivory':'#FFFDD0','Light Stone':'#C8BFA9','Tan':'#BFA983','Burnished Slate':'#4A4843','Charcoal':'#3B3B3B','Black':'#1C1C1C','Barn Red':'#7B1818','Burgundy':'#5C1626','Rustic Red':'#6B2020','Forest Green':'#2C4A2C','Hunter Green':'#355E3B','Gallery Blue':'#4A6A8A','Ocean Blue':'#2A5280','Clay':'#967B5E','Brown':'#5C4033','Copper':'#B87333'};
    function pc(name){return new THREE.Color(_ch[name]||'#5a534d');}

    var roofColorName=bd.roofColor||'Charcoal', wallColorName=bd.wallColor||'Light Stone', trimColorName=bd.trimColor||'White', wsColorName=bd.wainscotColor||'Tan';
    var hasWainscot=!!bd.hasWainscot;

    var sc=new THREE.Scene(); sc.background=new THREE.Color(0x141820); sc.fog=new THREE.Fog(0x141820,40,90);
    var cm=new THREE.PerspectiveCamera(38,c.clientWidth/c.clientHeight,.1,200);
    var rr=new THREE.WebGLRenderer({antialias:true}); rr.setSize(c.clientWidth,c.clientHeight); rr.setPixelRatio(Math.min(window.devicePixelRatio,2)); rr.shadowMap.enabled=true; c.appendChild(rr.domElement);
    sc.add(new THREE.AmbientLight(0x8899bb,.5)); var sn=new THREE.DirectionalLight(0xffeedd,1.1); sn.position.set(10,18,8); sn.castShadow=true; sc.add(sn);
    var gd=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x1a1a2a,roughness:1})); gd.rotation.x=-Math.PI/2; gd.position.y=-.01; gd.receiveShadow=true; sc.add(gd);
    sc.add(new THREE.GridHelper(60,60,0x242240,0x1a1a2a));

    var S=.1,sw=W*S,sl=L*S,sh=H*S,sr=(H+(W/2)*(pi/12))*S,oh=ovh*S;
    var mR=new THREE.MeshStandardMaterial({color:pc(roofColorName),roughness:.85,metalness:.1,side:2});
    var mW=new THREE.MeshStandardMaterial({color:pc(wallColorName),roughness:.6,metalness:.2,side:2});
    var mP=new THREE.MeshStandardMaterial({color:0xb4822e,roughness:.7});
    var mSof=new THREE.MeshStandardMaterial({color:0x8c8379,roughness:.8,side:2});
    var mC=new THREE.MeshStandardMaterial({color:0x5a534d,roughness:.9});
    var mE=new THREE.LineBasicMaterial({color:0xb4822e,transparent:true,opacity:.5});
    var mTrim=new THREE.LineBasicMaterial({color:pc(trimColorName),transparent:true,opacity:.8,linewidth:2});
    var mWS=hasWainscot?new THREE.MeshStandardMaterial({color:pc(wsColorName),roughness:.6,metalness:.2,side:2}):mW;
    var mSR=new THREE.MeshStandardMaterial({color:pc(roofColorName),roughness:.85,metalness:.1,side:2});
    var mDoor=new THREE.MeshStandardMaterial({color:0x8c8379,roughness:.5,metalness:.3});

    function mQ(v,m){var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();var o=new THREE.Mesh(g,m);o.castShadow=true;return o;}
    function mL(p,m){return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),m);}

    // Slab
    var sb=new THREE.Mesh(new THREE.BoxGeometry(sw+.04,.04,sl+.04),mC);sb.position.y=.02;sb.receiveShadow=true;sc.add(sb);

    // Shed slabs
    (shedCfgs||[]).forEach(function(ssc){
        var ssw=ssc.w*S,ssl=ssc.l*S;
        var m=new THREE.Mesh(new THREE.BoxGeometry(ssw+.02,.04,ssl+.02),mC);
        if(ssc.wall==='left')m.position.set(-sw/2-ssw/2,.02,0);
        else if(ssc.wall==='right')m.position.set(sw/2+ssw/2,.02,0);
        else if(ssc.wall==='front'){m.geometry=new THREE.BoxGeometry(ssl+.02,.04,ssw+.02);m.position.set(0,.02,-sl/2-ssw/2);}
        else{m.geometry=new THREE.BoxGeometry(ssl+.02,.04,ssw+.02);m.position.set(0,.02,sl/2+ssw/2);}
        m.receiveShadow=true;sc.add(m);
    });

    // Posts per wall
    var pz=.05;
    var wcs=wallCfgs&&wallCfgs.length?wallCfgs:[{id:'front',encl:'enclosed',postSpacing:ps},{id:'back',encl:'enclosed',postSpacing:ps},{id:'left',encl:'enclosed',postSpacing:ps},{id:'right',encl:'enclosed',postSpacing:ps}];
    wcs.forEach(function(wc){
        var isG=(wc.id==='front'||wc.id==='back');
        var wLen=isG?W:L, num=Math.max(1,Math.round(wLen/(wc.postSpacing||ps)));
        var wd=(doors||[]).filter(function(d){return d.wall===wc.id;});
        for(var i=0;i<=num;i++){
            if(isG){
                var xFt=i*(wLen/num),xP=(-wLen/2+xFt)*S;
                var zP=wc.id==='front'?-sl/2:sl/2;
                var blocked=false;wd.forEach(function(d){if(xFt>(d.offset||0)-.3&&xFt<(d.offset||0)+(d.w||10)+.3)blocked=true;});
                if(blocked)continue;
                var dC=Math.abs(xFt-wLen/2),pH=(H+(wLen/2-dC)*(pi/12))*S;
                var p=new THREE.Mesh(new THREE.BoxGeometry(pz,pH,pz),mP);p.position.set(xP,pH/2,zP);p.castShadow=true;sc.add(p);
            }else{
                var z=-sl/2+(sl*i/num);
                var xP=wc.id==='left'?-sw/2:sw/2;
                var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sh,pz),mP);p.position.set(xP,sh/2,z);p.castShadow=true;sc.add(p);
            }
        }
    });

    // Shed posts
    (shedCfgs||[]).forEach(function(ssc){
        var ssw=ssc.w*S,ssl=ssc.l*S,sSh=(H-3)*S;
        var numSP=Math.max(1,Math.round(ssc.l/(ps||10)));
        if(ssc.type==='gable'){
            if(ssc.wall==='left'||ssc.wall==='right'){var oX=ssc.wall==='left'?-sw/2-ssw:sw/2+ssw;
                var p1=new THREE.Mesh(new THREE.BoxGeometry(pz,sh,pz),mP);p1.position.set(oX,sh/2,-ssl/2);p1.castShadow=true;sc.add(p1);
                var p2=new THREE.Mesh(new THREE.BoxGeometry(pz,sh,pz),mP);p2.position.set(oX,sh/2,ssl/2);p2.castShadow=true;sc.add(p2);}
            else{var oZ=ssc.wall==='front'?-sl/2-ssw:sl/2+ssw;
                var p1=new THREE.Mesh(new THREE.BoxGeometry(pz,sh,pz),mP);p1.position.set(-ssl/2,sh/2,oZ);p1.castShadow=true;sc.add(p1);
                var p2=new THREE.Mesh(new THREE.BoxGeometry(pz,sh,pz),mP);p2.position.set(ssl/2,sh/2,oZ);p2.castShadow=true;sc.add(p2);}
        }else if(ssc.type==='wrap'){
            if(ssc.wall==='left'||ssc.wall==='right'){
                var oX=ssc.wall==='left'?-sw/2-ssw:sw/2+ssw;
                for(var i=0;i<=numSP;i++){var z=-ssl/2+(ssl*i/numSP);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(oX,sSh/2,z);p.castShadow=true;sc.add(p);}
                var ww=ssc.wrapDir==='cw'?'front':'back';var secLen=(ssc.wrapLeg||0)*S;
                if(secLen>0){var numSec=Math.max(1,Math.round((ssc.wrapLeg||0)/(ps||10)));var oZ=ww==='front'?-sl/2-ssw:sl/2+ssw;
                for(var i=0;i<=numSec;i++){var x=-sw/2+(sw*i/numSec);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(x,sSh/2,oZ);p.castShadow=true;sc.add(p);}
                var hip=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);hip.position.set(oX,sSh/2,oZ);hip.castShadow=true;sc.add(hip);}
            }else{
                var oZ=ssc.wall==='front'?-sl/2-ssw:sl/2+ssw;
                for(var i=0;i<=numSP;i++){var x=-ssl/2+(ssl*i/numSP);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(x,sSh/2,oZ);p.castShadow=true;sc.add(p);}
                var secLen=(ssc.wrapLeg||0)*S;
                if(secLen>0){var numSec=Math.max(1,Math.round((ssc.wrapLeg||0)/(ps||10)));var ww=ssc.wrapDir==='cw'?'left':'right';var oX=ww==='left'?-sw/2-ssw:sw/2+ssw;
                for(var i=0;i<=numSec;i++){var z=-sl/2+(sl*i/numSec);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(oX,sSh/2,z);p.castShadow=true;sc.add(p);}
                var hip=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);hip.position.set(oX,sSh/2,oZ);hip.castShadow=true;sc.add(hip);}
            }
        }else{
            if(ssc.wall==='left'||ssc.wall==='right'){var oX=ssc.wall==='left'?-sw/2-ssw:sw/2+ssw;for(var i=0;i<=numSP;i++){var z=-ssl/2+(ssl*i/numSP);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(oX,sSh/2,z);p.castShadow=true;sc.add(p);}}
            else{var oZ=ssc.wall==='front'?-sl/2-ssw:sl/2+ssw;for(var i=0;i<=numSP;i++){var x=-ssl/2+(ssl*i/numSP);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sSh,pz),mP);p.position.set(x,sSh/2,oZ);p.castShadow=true;sc.add(p);}}
        }
    });

    // Walls with door cutouts and wainscot
    wcs.forEach(function(wc){
        var isG=(wc.id==='front'||wc.id==='back');
        var wLen=isG?W:L;
        var zP=wc.id==='front'?-sl/2:wc.id==='back'?sl/2:0;
        var xP=wc.id==='left'?-sw/2:wc.id==='right'?sw/2:0;
        var wH=wc.encl==='partial'?sh*.35:sh;
        var wsH=hasWainscot?Math.min(4*S,wH):0;
        var wd=(doors||[]).filter(function(d){return d.wall===wc.id;}).sort(function(a,b){return(a.offset||0)-(b.offset||0);});

        if(isG){var tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-sw/2,sh,zP,sw/2,sh,zP,0,sr,zP]),3));tg.setIndex([0,1,2]);tg.computeVertexNormals();sc.add(new THREE.Mesh(tg,mW));}
        if(wc.encl==='open') return;

        function addSeg(x1,x2,y0,y1,isGable){
            if(y1<=y0)return;
            if(hasWainscot&&wsH>y0&&y0===0&&y1>wsH){
                if(isGable){sc.add(mQ([x1,0,zP,x2,0,zP,x2,wsH,zP,x1,wsH,zP],mWS));sc.add(mQ([x1,wsH,zP,x2,wsH,zP,x2,y1,zP,x1,y1,zP],mW));}
                else{sc.add(mQ([xP,0,x1,xP,0,x2,xP,wsH,x2,xP,wsH,x1],mWS));sc.add(mQ([xP,wsH,x1,xP,wsH,x2,xP,y1,x2,xP,y1,x1],mW));}
            }else{
                var mat=(hasWainscot&&y1<=wsH)?mWS:mW;
                if(isGable)sc.add(mQ([x1,y0,zP,x2,y0,zP,x2,y1,zP,x1,y1,zP],mat));
                else sc.add(mQ([xP,y0,x1,xP,y0,x2,xP,y1,x2,xP,y1,x1],mat));
            }
        }

        if(isG){
            var x=0;
            wd.forEach(function(d){var dL=d.offset||0,dR=dL+(d.w||10),dh=Math.min((d.h||8)*S,wH);
                if(dL>x)addSeg((-wLen/2+x)*S,(-wLen/2+dL)*S,0,wH,true);
                if(dh<wH)sc.add(mQ([(-wLen/2+dL)*S,dh,zP,(-wLen/2+dR)*S,dh,zP,(-wLen/2+dR)*S,wH,zP,(-wLen/2+dL)*S,wH,zP],mW));
                x=dR;});
            if(x<wLen)addSeg((-wLen/2+x)*S,(wLen/2)*S,0,wH,true);
        }else{
            var z=0;
            wd.forEach(function(d){var dL=d.offset||0,dR=dL+(d.w||10),dh=Math.min((d.h||8)*S,wH);
                if(dL>z)addSeg((-wLen/2+z)*S,(-wLen/2+dL)*S,0,wH,false);
                if(dh<wH)sc.add(mQ([xP,dh,(-wLen/2+dL)*S,xP,dh,(-wLen/2+dR)*S,xP,wH,(-wLen/2+dR)*S,xP,wH,(-wLen/2+dL)*S],mW));
                z=dR;});
            if(z<wLen)addSeg((-wLen/2+z)*S,(wLen/2)*S,0,wH,false);
        }
    });

    // Corner trim
    var co=.01;
    sc.add(mL([new THREE.Vector3(-sw/2-co,0,-sl/2-co),new THREE.Vector3(-sw/2-co,sh,-sl/2-co)],mTrim));
    sc.add(mL([new THREE.Vector3(sw/2+co,0,-sl/2-co),new THREE.Vector3(sw/2+co,sh,-sl/2-co)],mTrim));
    sc.add(mL([new THREE.Vector3(-sw/2-co,0,sl/2+co),new THREE.Vector3(-sw/2-co,sh,sl/2+co)],mTrim));
    sc.add(mL([new THREE.Vector3(sw/2+co,0,sl/2+co),new THREE.Vector3(sw/2+co,sh,sl/2+co)],mTrim));

    // Doors
    (doors||[]).forEach(function(d){
        var isG=(d.wall==='front'||d.wall==='back');
        var wLen=isG?W:L;
        var dL=(d.offset||0)*S,dW=(d.w||10)*S,dH=Math.min((d.h||8)*S,sh);
        var cX=(-wLen/2)*S+dL+dW/2, cY=dH/2;
        if(isG){var zz=d.wall==='front'?-sl/2:sl/2;var off=d.wall==='front'?-.01:.01;
            var dm=new THREE.Mesh(new THREE.PlaneGeometry(dW,dH),mDoor);dm.position.set(cX,cY,zz+off);if(d.wall==='back')dm.rotation.y=Math.PI;sc.add(dm);
            sc.add(mL([new THREE.Vector3(cX-dW/2,0,zz+off),new THREE.Vector3(cX-dW/2,dH,zz+off),new THREE.Vector3(cX+dW/2,dH,zz+off),new THREE.Vector3(cX+dW/2,0,zz+off)],mTrim));
        }else{var xx=d.wall==='left'?-sw/2:sw/2;var off=d.wall==='left'?-.01:.01;
            var dm=new THREE.Mesh(new THREE.PlaneGeometry(dW,dH),mDoor);dm.rotation.y=Math.PI/2;dm.position.set(xx+off,cY,(-wLen/2)*S+dL+dW/2);sc.add(dm);
            var z1=(-wLen/2)*S+dL,z2=z1+dW;
            sc.add(mL([new THREE.Vector3(xx+off,0,z1),new THREE.Vector3(xx+off,dH,z1),new THREE.Vector3(xx+off,dH,z2),new THREE.Vector3(xx+off,0,z2)],mTrim));
        }
    });

    // Roof
    sc.add(mQ([-sw/2-oh,sh-.01,-sl/2-oh,0,sr,-sl/2-oh,0,sr,sl/2+oh,-sw/2-oh,sh-.01,sl/2+oh],mR));
    sc.add(mQ([sw/2+oh,sh-.01,sl/2+oh,0,sr,sl/2+oh,0,sr,-sl/2-oh,sw/2+oh,sh-.01,-sl/2-oh],mR));
    if(oh>.001){
        sc.add(mQ([-sw/2,sh,-sl/2-oh,-sw/2-oh,sh,-sl/2-oh,-sw/2-oh,sh,sl/2+oh,-sw/2,sh,sl/2+oh],mSof));
        sc.add(mQ([sw/2+oh,sh,-sl/2-oh,sw/2,sh,-sl/2-oh,sw/2,sh,sl/2+oh,sw/2+oh,sh,sl/2+oh],mSof));
    }
    sc.add(mL([new THREE.Vector3(0,sr,-sl/2-oh),new THREE.Vector3(0,sr,sl/2+oh)],mE));
    sc.add(mL([new THREE.Vector3(-sw/2-oh,sh,-sl/2-oh),new THREE.Vector3(-sw/2-oh,sh,sl/2+oh)],mE));
    sc.add(mL([new THREE.Vector3(sw/2+oh,sh,-sl/2-oh),new THREE.Vector3(sw/2+oh,sh,sl/2+oh)],mE));

    // Shed roofs + walls
    (shedCfgs||[]).forEach(function(ssc){
        var ssw=ssc.w*S,ssl=ssc.l*S,sSh=(H-3)*S;
        function addLeanto(wall,sW,sL){
            if(wall==='left'){var oX=-sw/2-sW,aX=-sw/2;sc.add(mQ([oX,sSh,sL/2,aX,sh,sL/2,aX,sh,-sL/2,oX,sSh,-sL/2],mSR));sc.add(mL([new THREE.Vector3(oX,sSh,-sL/2),new THREE.Vector3(oX,sSh,sL/2)],mE));}
            else if(wall==='right'){var oX=sw/2+sW,aX=sw/2;sc.add(mQ([oX,sSh,-sL/2,aX,sh,-sL/2,aX,sh,sL/2,oX,sSh,sL/2],mSR));sc.add(mL([new THREE.Vector3(oX,sSh,-sL/2),new THREE.Vector3(oX,sSh,sL/2)],mE));}
            else if(wall==='front'){var oZ=-sl/2-sW,aZ=-sl/2;sc.add(mQ([sL/2,sSh,oZ,sL/2,sh,aZ,-sL/2,sh,aZ,-sL/2,sSh,oZ],mSR));sc.add(mL([new THREE.Vector3(-sL/2,sSh,oZ),new THREE.Vector3(sL/2,sSh,oZ)],mE));}
            else{var oZ=sl/2+sW,aZ=sl/2;sc.add(mQ([-sL/2,sSh,oZ,-sL/2,sh,aZ,sL/2,sh,aZ,sL/2,sSh,oZ],mSR));sc.add(mL([new THREE.Vector3(-sL/2,sSh,oZ),new THREE.Vector3(sL/2,sSh,oZ)],mE));}
        }
        if(ssc.type==='leanto')addLeanto(ssc.wall,ssw,ssl);
        else if(ssc.type==='wrap'){
            addLeanto(ssc.wall,ssw,ssl);
            var isEave=(ssc.wall==='left'||ssc.wall==='right');
            var wrapWall=isEave?(ssc.wrapDir==='cw'?'front':'back'):(ssc.wrapDir==='cw'?'left':'right');
            var secLen=(ssc.wrapLeg||0)*S;
            if(secLen>0){
                addLeanto(wrapWall,ssw,secLen);
                // Hip triangles at the corner where two lean-to legs meet
                var hipOX,hipOZ,hipAX,hipAZ;
                if(ssc.wall==='left'){hipOX=-sw/2-ssw;hipAX=-sw/2;}else if(ssc.wall==='right'){hipOX=sw/2+ssw;hipAX=sw/2;}
                if(wrapWall==='front'){hipOZ=-sl/2-ssw;hipAZ=-sl/2;}else if(wrapWall==='back'){hipOZ=sl/2+ssw;hipAZ=sl/2;}
                else if(wrapWall==='left'){hipOX=-sw/2-ssw;hipAX=-sw/2;}else if(wrapWall==='right'){hipOX=sw/2+ssw;hipAX=sw/2;}
                if(ssc.wall==='front'){hipOZ=-sl/2-ssw;hipAZ=-sl/2;}else if(ssc.wall==='back'){hipOZ=sl/2+ssw;hipAZ=sl/2;}
                // Two triangles filling the hip corner
                if(hipOX!==undefined&&hipOZ!==undefined){
                    var tg1=new THREE.BufferGeometry();tg1.setAttribute('position',new THREE.BufferAttribute(new Float32Array([hipOX,sSh,hipAZ,hipAX,sh,hipAZ,hipOX,sSh,hipOZ]),3));tg1.setIndex([0,1,2]);tg1.computeVertexNormals();sc.add(new THREE.Mesh(tg1,mSR));
                    var tg2=new THREE.BufferGeometry();tg2.setAttribute('position',new THREE.BufferAttribute(new Float32Array([hipAX,sSh,hipOZ,hipAX,sh,hipAZ,hipOX,sSh,hipOZ]),3));tg2.setIndex([0,1,2]);tg2.computeVertexNormals();sc.add(new THREE.Mesh(tg2,mSR));
                    sc.add(mL([new THREE.Vector3(hipAX,sh,hipAZ),new THREE.Vector3(hipOX,sSh,hipOZ)],mE));
                }
            }
        }else if(ssc.type==='gable'){
            if(ssc.wall==='left'||ssc.wall==='right'){
                var oX=ssc.wall==='left'?-sw/2-ssw:sw/2+ssw;var aX=ssc.wall==='left'?-sw/2:sw/2;
                var ridgeH=sh+(ssw/2)*(pi/12)*S;
                sc.add(mQ([oX,sh,ssl/2,aX,sh,ssl/2,aX,ridgeH,0,oX,ridgeH,0],mSR));
                sc.add(mQ([oX,ridgeH,0,aX,ridgeH,0,aX,sh,-ssl/2,oX,sh,-ssl/2],mSR));
                // Gable end triangles (wall fill at each end)
                var tgf=new THREE.BufferGeometry();tgf.setAttribute('position',new THREE.BufferAttribute(new Float32Array([oX,sh,-ssl/2,aX,sh,-ssl/2,(oX+aX)/2,ridgeH,-ssl/2]),3));tgf.setIndex([0,1,2]);tgf.computeVertexNormals();sc.add(new THREE.Mesh(tgf,mW));
                var tgb=new THREE.BufferGeometry();tgb.setAttribute('position',new THREE.BufferAttribute(new Float32Array([oX,sh,ssl/2,aX,sh,ssl/2,(oX+aX)/2,ridgeH,ssl/2]),3));tgb.setIndex([0,1,2]);tgb.computeVertexNormals();sc.add(new THREE.Mesh(tgb,mW));
                sc.add(mL([new THREE.Vector3(oX,ridgeH,0),new THREE.Vector3(aX,ridgeH,0)],mE));
            }else{
                var oZ=ssc.wall==='front'?-sl/2-ssw:sl/2+ssw;var aZ=ssc.wall==='front'?-sl/2:sl/2;
                var ridgeH=sh+(ssw/2)*(pi/12)*S;
                sc.add(mQ([-ssl/2,sh,oZ,-ssl/2,sh,aZ,0,ridgeH,aZ,0,ridgeH,oZ],mSR));
                sc.add(mQ([0,ridgeH,oZ,0,ridgeH,aZ,ssl/2,sh,aZ,ssl/2,sh,oZ],mSR));
                var tgf=new THREE.BufferGeometry();tgf.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-ssl/2,sh,oZ,-ssl/2,sh,aZ,-ssl/2,ridgeH,(oZ+aZ)/2]),3));tgf.setIndex([0,1,2]);tgf.computeVertexNormals();sc.add(new THREE.Mesh(tgf,mW));
                var tgb=new THREE.BufferGeometry();tgb.setAttribute('position',new THREE.BufferAttribute(new Float32Array([ssl/2,sh,oZ,ssl/2,sh,aZ,ssl/2,ridgeH,(oZ+aZ)/2]),3));tgb.setIndex([0,1,2]);tgb.computeVertexNormals();sc.add(new THREE.Mesh(tgb,mW));
                sc.add(mL([new THREE.Vector3(0,ridgeH,oZ),new THREE.Vector3(0,ridgeH,aZ)],mE));
            }
        }
        if(ssc.encl==='enclosed'||ssc.encl==='partial'){
            var isEave=(ssc.wall==='left'||ssc.wall==='right');
            if(isEave){
                var oX=ssc.wall==='left'?-sw/2-ssw:sw/2+ssw;var aX=ssc.wall==='left'?-sw/2:sw/2;
                sc.add(mQ([oX,0,-ssl/2,oX,sSh,-ssl/2,oX,sSh,ssl/2,oX,0,ssl/2],mW));
                sc.add(mQ([oX,0,-ssl/2,oX,sSh,-ssl/2,aX,sh,-ssl/2,aX,0,-ssl/2],mW));
                sc.add(mQ([aX,0,ssl/2,aX,sh,ssl/2,oX,sSh,ssl/2,oX,0,ssl/2],mW));
                sc.add(mL([new THREE.Vector3(oX,0,-ssl/2),new THREE.Vector3(oX,sSh,-ssl/2),new THREE.Vector3(oX,sSh,ssl/2),new THREE.Vector3(oX,0,ssl/2)],mTrim));
                sc.add(mL([new THREE.Vector3(oX,sSh,-ssl/2),new THREE.Vector3(aX,sh,-ssl/2)],mTrim));
                sc.add(mL([new THREE.Vector3(oX,sSh,ssl/2),new THREE.Vector3(aX,sh,ssl/2)],mTrim));
            }else{
                var oZ=ssc.wall==='front'?-sl/2-ssw:sl/2+ssw;var aZ=ssc.wall==='front'?-sl/2:sl/2;
                sc.add(mQ([-ssl/2,0,oZ,-ssl/2,sSh,oZ,ssl/2,sSh,oZ,ssl/2,0,oZ],mW));
                sc.add(mQ([-ssl/2,0,oZ,-ssl/2,sSh,oZ,-ssl/2,sh,aZ,-ssl/2,0,aZ],mW));
                sc.add(mQ([ssl/2,0,aZ,ssl/2,sh,aZ,ssl/2,sSh,oZ,ssl/2,0,oZ],mW));
                sc.add(mL([new THREE.Vector3(-ssl/2,0,oZ),new THREE.Vector3(-ssl/2,sSh,oZ),new THREE.Vector3(ssl/2,sSh,oZ),new THREE.Vector3(ssl/2,0,oZ)],mTrim));
                sc.add(mL([new THREE.Vector3(-ssl/2,sSh,oZ),new THREE.Vector3(-ssl/2,sh,aZ)],mTrim));
                sc.add(mL([new THREE.Vector3(ssl/2,sSh,oZ),new THREE.Vector3(ssl/2,sh,aZ)],mTrim));
            }
        }
    });

    // Dimension labels
    function dLbl(t,sz){var cv=document.createElement('canvas');cv.width=256;cv.height=64;var cx=cv.getContext('2d');cx.fillStyle='rgba(20,24,32,.8)';cx.beginPath();cx.roundRect(16,8,224,48,8);cx.fill();cx.fillStyle='#d4a843';cx.font='bold 26px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,128,32);return new THREE.Mesh(new THREE.PlaneGeometry(sz,sz*.25),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,side:2,depthTest:false}));}
    var dO=.4,dM=new THREE.LineBasicMaterial({color:0x6b6460,transparent:true,opacity:.6});
    var labels=[];
    var lb=dLbl(W+"' wide",1.2);lb.position.set(0,.05,-sl/2-oh-dO-.2);sc.add(lb);labels.push(lb);sc.add(mL([new THREE.Vector3(-sw/2,.05,-sl/2-oh-dO),new THREE.Vector3(sw/2,.05,-sl/2-oh-dO)],dM));
    lb=dLbl(L+"' long",1.2);lb.position.set(sw/2+oh+dO+.2,.05,0);lb.rotation.y=-Math.PI/2;sc.add(lb);labels.push(lb);sc.add(mL([new THREE.Vector3(sw/2+oh+dO,.05,-sl/2),new THREE.Vector3(sw/2+oh+dO,.05,sl/2)],dM));
    lb=dLbl(H+"' wall",1);lb.position.set(-sw/2-oh-dO-.5,sh/2,sl/2+oh+dO);sc.add(lb);labels.push(lb);sc.add(mL([new THREE.Vector3(-sw/2-oh-dO,0,sl/2+oh+dO),new THREE.Vector3(-sw/2-oh-dO,sh,sl/2+oh+dO)],dM));

    // Camera orbit
    var th=Math.PI*.22,ph=Math.PI*.14,di=15,dr=false,pm={x:0,y:0};
    function sC(){cm.position.set(di*Math.sin(th)*Math.cos(ph),di*Math.sin(ph)+2,di*Math.cos(th)*Math.cos(ph));cm.lookAt(0,sh*.4,0);}sC();
    rr.domElement.addEventListener('pointerdown',function(e){dr=true;pm={x:e.clientX,y:e.clientY};});
    window.addEventListener('pointermove',function(e){if(!dr)return;th-=(e.clientX-pm.x)*.005;ph=Math.max(.05,Math.min(Math.PI*.45,ph+(e.clientY-pm.y)*.005));pm={x:e.clientX,y:e.clientY};});
    window.addEventListener('pointerup',function(){dr=false;});
    rr.domElement.addEventListener('wheel',function(e){e.preventDefault();di=Math.max(5,Math.min(25,di+e.deltaY*.012));},{passive:false});
    (function an(){requestAnimationFrame(an);if(!dr)th+=.0015;sC();labels.forEach(function(l){l.quaternion.copy(cm.quaternion);});rr.render(sc,cm);})();
    window.addEventListener('resize',function(){cm.aspect=c.clientWidth/c.clientHeight;cm.updateProjectionMatrix();rr.setSize(c.clientWidth,c.clientHeight);});
}
</script>
