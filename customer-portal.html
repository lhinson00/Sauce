<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Building Quote — Summertown Metals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0c0f14;--bg2:#141820;--bg3:#1a1f2a;--bg4:#1f2937;--amber:#f59e0b;--a2:#fbbf24;--a3:#d97706;--green:#22c55e;--red:#ef4444;--t1:#f8fafc;--t2:#cbd5e1;--t3:#64748b;--t4:#475569;--bdr:rgba(255,255,255,.06);}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--t3);}
.err{text-align:center;padding:60px 20px;}.err h2{color:var(--red);margin-bottom:8px;}.err p{color:var(--t3);font-size:14px;}
.preview-bar{background:linear-gradient(135deg,#7c3aed,#6d28d9);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:12px;position:sticky;top:0;z-index:50;}
.preview-bar .pb-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:ppulse 2s infinite;}
@keyframes ppulse{0%,100%{opacity:1}50%{opacity:.4}}
.preview-bar .pb-t{font-weight:700;}.preview-bar .pb-s{color:rgba(255,255,255,.6);margin-left:auto;font-size:11px;}
.hdr{text-align:center;padding:28px 16px 20px;background:radial-gradient(ellipse at 50% 0%,rgba(245,158,11,.06) 0%,transparent 60%);}
.hdr-logo{display:inline-flex;width:40px;height:40px;background:var(--amber);border-radius:9px;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;color:var(--bg);margin-bottom:10px;}
.hdr h1{font-size:22px;font-weight:800;margin-bottom:4px;}.hdr h1 span{color:var(--amber);}
.hdr .sub{font-size:12px;color:var(--t3);}.hdr .qid{font-size:9px;color:var(--t4);font-family:'Space Mono',monospace;margin-top:6px;}
.expiry{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:11px;color:var(--t3);}
.expiry .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}.expiry.warn .dot{background:var(--amber);}.expiry.expired .dot{background:var(--red);}
.msg-card{max-width:680px;margin:0 auto 16px;padding:16px;background:linear-gradient(135deg,rgba(245,158,11,.06),rgba(245,158,11,.02));border:1px solid rgba(245,158,11,.15);border-radius:12px;}
.msg-card .mc-from{font-size:9px;font-weight:600;color:var(--a3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.msg-card .mc-txt{font-size:14px;color:var(--t2);line-height:1.6;}
.viewer{width:calc(100% - 32px);max-width:900px;margin:0 auto;height:360px;background:var(--bg2);position:relative;border-radius:12px;overflow:hidden;}
.viewer canvas{display:block;width:100%!important;height:100%!important;}
.v-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:5px 10px;z-index:2;}
.v-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:ppulse 2s infinite;}
.v-t{font-size:8px;font-family:'Space Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:1px;}
.v-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--t4);font-family:'Space Mono',monospace;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:4px;z-index:2;}
.container{max-width:780px;margin:0 auto;padding:16px;}
.sec{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin-bottom:12px;}
.sec-t{font-size:10px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);margin-bottom:12px;display:flex;align-items:center;gap:6px;}.sec-t::before{content:'';width:3px;height:10px;background:var(--amber);border-radius:2px;}
.spec-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);}.spec-item:last-child{border-bottom:none;}
.spec-item .si-icon{font-size:16px;width:28px;text-align:center;flex-shrink:0;}
.spec-item .si-name{font-size:13px;font-weight:600;flex:1;}.spec-item .si-val{font-size:12px;color:var(--t3);font-family:'Space Mono',monospace;}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}

.price-row{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);}.price-row:last-child{border-bottom:none;}
.price-row .pr-l{font-size:13px;color:var(--t2);}.price-row .pr-v{font-size:13px;font-weight:600;font-family:'Space Mono',monospace;}
.price-total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bg3);border:1px solid rgba(245,158,11,.2);border-radius:10px;margin-top:8px;}
.price-total .pt-l{font-size:13px;font-weight:700;}.price-total .pt-v{font-size:22px;font-weight:800;font-family:'Space Mono',monospace;color:var(--amber);}
.cta{text-align:center;padding:28px 16px;margin:12px auto;max-width:780px;background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;}
.cta .ct{font-size:18px;font-weight:800;margin-bottom:4px;}.cta .cs{font-size:12px;color:var(--t3);margin-bottom:16px;}
.cta .cb{display:inline-block;padding:12px 28px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;}
.cta .phone{margin-top:8px;font-size:11px;color:var(--t4);}
.footer{text-align:center;padding:24px 16px;font-size:11px;color:var(--t4);border-top:1px solid var(--bdr);margin-top:20px;}
.sig-name{font-weight:700;font-size:13px;color:var(--t2);}
.sc{max-width:780px;margin:0 auto 16px;padding:14px 16px;background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;display:flex;align-items:center;gap:12px;}
.sc-av{width:40px;height:40px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg);font-size:16px;flex-shrink:0;}
.sc-n{font-size:14px;font-weight:700;}.sc-d{font-size:11px;color:var(--t3);}
</style>
</head>

[[s1w,s1l,'l'],[s2w,s2l,'r']].forEach(function(a){var ssw=a[0],ssl=a[1],wl=a[2];if(ssw<=0||ssl<=0)return;var sS=ssw*S,lS=ssl*S,sH=(H-3)*S;var oX=wl==='l'?-sw/2-sS:sw/2+sS;var aX=wl==='l'?-sw/2:sw/2;var m=new THREE.Mesh(new THREE.BoxGeometry(sS+.02,.04,lS+.02),mC);m.position.set(wl==='l'?-sw/2-sS/2:sw/2+sS/2,.02,0);m.receiveShadow=true;sc.add(m);var nSP=Math.round(ssl/S/ps);for(var i=0;i<=nSP;i++){var z=-lS/2+(lS*i/nSP);var p=new THREE.Mesh(new THREE.BoxGeometry(pz,sH,pz),mP);p.position.set(oX,sH/2,z);p.castShadow=true;sc.add(p);}sc.add(mQ([oX,sH,lS/2,aX,sh,lS/2,aX,sh,-lS/2,oX,sH,-lS/2],mH));sc.add(mL([new THREE.Vector3(oX,sH,-lS/2),new THREE.Vector3(oX,sH,lS/2)],mE));sc.add(mL([new THREE.Vector3(oX,sH,-lS/2),new THREE.Vector3(aX,sh,-lS/2)],mE));sc.add(mL([new THREE.Vector3(oX,sH,lS/2),new THREE.Vector3(aX,sh,lS/2)],mE));});
