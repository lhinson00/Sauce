<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summertown Metals | Ultimate Building Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --gold: #D4AF37;
            --gold-dark: #B8941F;
            --navy: #0A1929;
            --navy-light: #1A2F3F;
            --cream: #F5F1E8;
            --white: #FFFFFF;
            --shadow: rgba(10, 25, 41, 0.15);
            --accent: #C8102E;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, #FFFFFF 100%);
            color: var(--navy);
            overflow: hidden;
            height: 100vh;
        }
        
        /* Premium Header */
        .header {
            background: var(--navy);
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px var(--shadow);
            position: relative;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        
        .logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 0.5px;
        }
        
        .logo-text p {
            font-size: 11px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn-header {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-save {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
        }
        
        .btn-save:hover {
            background: var(--gold);
            color: var(--navy);
        }
        
        .btn-quote {
            background: var(--gold);
            color: var(--navy);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        
        .btn-quote:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        
        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 96px);
        }
        
        /* Sidebar */
        .sidebar {
            width: 380px;
            background: var(--white);
            box-shadow: 4px 0 20px var(--shadow);
            overflow-y: auto;
            padding: 32px 24px;
            z-index: 50;
        }
        
        .sidebar::-webkit-scrollbar {
            width: 8px;
        }
        
        .sidebar::-webkit-scrollbar-track {
            background: var(--cream);
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }
        
        .section {
            background: var(--cream);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }
        
        .section:hover {
            box-shadow: 0 8px 24px var(--shadow);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .section-icon {
            width: 36px;
            height: 36px;
            background: var(--gold);
            color: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
        }
        
        .section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 14px;
            background: var(--white);
            border: 2px solid rgba(10, 25, 41, 0.1);
            border-radius: 8px;
            color: var(--navy);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        
        .color-swatches {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        
        .color-swatch {
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .color-swatch::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: brightness(0.95);
        }
        
        .color-swatch span {
            position: relative;
            z-index: 1;
        }
        
        .color-swatch:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--shadow);
        }
        
        .color-swatch.selected {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            border: none;
            border-radius: 8px;
            color: var(--navy);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        
        .btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        
        .btn-secondary {
            background: var(--white);
            border: 2px solid var(--navy);
            color: var(--navy);
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: var(--navy);
            color: var(--white);
        }
        
        .item-list {
            margin-top: 16px;
        }
        
        .item {
            background: var(--white);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: grab;
        }
        
        .item:hover {
            border-color: var(--gold);
            box-shadow: 0 4px 12px var(--shadow);
        }
        
        .item-info strong {
            display: block;
            font-size: 14px;
            color: var(--navy);
            margin-bottom: 4px;
        }
        
        .item-info small {
            font-size: 12px;
            color: #666;
        }
        
        .btn-delete {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-delete:hover {
            background: #A00D25;
            transform: scale(1.05);
        }
        
        /* Viewport */
        .viewport-container {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #E8F4F8 0%, #FFFFFF 100%);
        }
        
        #viewport {
            width: 100%;
            height: 100%;
        }
        
        /* Stats Panel */
        .stats-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--shadow);
            border: 1px solid rgba(212, 175, 55, 0.2);
            min-width: 200px;
        }
        
        .stats-panel h4 {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--navy);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gold);
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        
        .stat-value {
            color: var(--navy);
            font-weight: 700;
        }
        
        /* Controls Hint */
        .controls-hint {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(10, 25, 41, 0.9);
            color: var(--white);
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .controls-hint strong {
            color: var(--gold);
        }
        
        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .checkbox-group:hover {
            background: var(--cream);
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🏗️</div>
            <div class="logo-text">
                <h1>Summertown Metals</h1>
                <p>Building Designer Pro</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header btn-save" onclick="saveDesign()">💾 Save Design</button>
            <button class="btn-header btn-quote" onclick="getQuote()">📋 Get Quote</button>
        </div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <!-- Dimensions -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">📐</div>
                    <h3>Building Dimensions</h3>
                </div>
                <div class="control-group">
                    <label>Width (ft)</label>
                    <input type="number" id="width" value="30" min="10" max="100" step="2">
                </div>
                <div class="control-group">
                    <label>Length (ft)</label>
                    <input type="number" id="length" value="40" min="10" max="100" step="2">
                </div>
                <div class="control-group">
                    <label>Wall Height (ft)</label>
                    <input type="number" id="height" value="12" min="8" max="20" step="1">
                </div>
                <div class="control-group">
                    <label>Roof Pitch</label>
                    <select id="roofPitch">
                        <option value="3/12">3:12 Pitch</option>
                        <option value="4/12" selected>4:12 Pitch (Standard)</option>
                        <option value="5/12">5:12 Pitch</option>
                        <option value="6/12">6:12 Pitch (Steep)</option>
                    </select>
                </div>
            </div>
            
            <!-- Colors -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">🎨</div>
                    <h3>Color Selection</h3>
                </div>
                <div class="control-group">
                    <label>Roof Color</label>
                    <div class="color-swatches" id="roofColors"></div>
                </div>
                <div class="control-group">
                    <label>Wall Color</label>
                    <div class="color-swatches" id="wallColors"></div>
                </div>
                <div class="control-group">
                    <label>Trim Color</label>
                    <div class="color-swatches" id="trimColors"></div>
                </div>
            </div>
            
            <!-- Doors -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">🚪</div>
                    <h3>Doors</h3>
                </div>
                <button class="btn" onclick="addDoor()">+ Add Door</button>
                <div class="item-list" id="doorsList"></div>
            </div>
            
            <!-- Windows -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">🪟</div>
                    <h3>Windows</h3>
                </div>
                <button class="btn" onclick="addWindow()">+ Add Window</button>
                <div class="item-list" id="windowsList"></div>
            </div>
            
            <!-- Side Sheds -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">🏠</div>
                    <h3>Side Sheds</h3>
                </div>
                <button class="btn" onclick="addSideShed()">+ Add Side Shed</button>
                <div class="item-list" id="shedsList"></div>
            </div>
            
            <!-- Options -->
            <div class="section">
                <div class="section-header">
                    <div class="section-icon">⚙️</div>
                    <h3>Options</h3>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="wainscot">
                    <label for="wainscot">Add 4ft Wainscot</label>
                </div>
            </div>
        </div>
        
        <div class="viewport-container">
            <div id="viewport"></div>
            
            <div class="stats-panel">
                <h4>Building Stats</h4>
                <div class="stat-row">
                    <span class="stat-label">Width:</span>
                    <span class="stat-value" id="statWidth">30'</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Length:</span>
                    <span class="stat-value" id="statLength">40'</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Wall Height:</span>
                    <span class="stat-value" id="statHeight">12'</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Peak Height:</span>
                    <span class="stat-value" id="statPeak">17'</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Square Feet:</span>
                    <span class="stat-value" id="statSqFt">1,200</span>
                </div>
            </div>
            
            <div class="controls-hint">
                <strong>Controls:</strong> Drag to rotate • Scroll to zoom • Double-click to reset
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Premium Color Palettes
        const roofColors = {
            'Barn Red': 0x8B1A1A,
            'Charcoal': 0x2F4F4F,
            'Slate Gray': 0x708090,
            'Galvalume': 0xC0C0C0,
            'Forest Green': 0x2C5F2D,
            'Rustic Brown': 0x654321
        };
        
        const wallColors = {
            'Pure White': 0xFFFFFF,
            'Ivory': 0xFFFFF0,
            'Light Stone': 0xD3D3D3,
            'Sahara Tan': 0xC19A6B,
            'Sage Green': 0x9CAF88,
            'Charcoal': 0x36454F
        };
        
        const trimColors = {
            'Pure White': 0xFFFFFF,
            'Charcoal': 0x2F4F4F,
            'Barn Red': 0x8B1A1A,
            'Gold': 0xD4AF37
        };
        
        // Building Config
        let config = {
            width: 30,
            length: 40,
            height: 12,
            roofPitch: '4/12',
            roofColor: 'Barn Red',
            wallColor: 'Pure White',
            trimColor: 'Pure White',
            wainscot: false,
            doors: [],
            windows: [],
            sideSheds: []
        };
        
        // Three.js
        let scene, camera, renderer, building, ground;
        
        function init() {
            const viewport = document.getElementById('viewport');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xE8F4F8);
            scene.fog = new THREE.Fog(0xE8F4F8, 80, 200);
            
            camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(65, 50, 65);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            viewport.appendChild(renderer.domElement);
            
            // Lighting - Premium setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.0);
            sunLight.position.set(60, 80, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.near = 1;
            sunLight.shadow.camera.far = 300;
            sunLight.shadow.camera.left = -100;
            sunLight.shadow.camera.right = 100;
            sunLight.shadow.camera.top = 100;
            sunLight.shadow.camera.bottom = -100;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);
            
            const fillLight = new THREE.HemisphereLight(0x87CEEB, 0x4A7C59, 0.5);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
            rimLight.position.set(-30, 20, -30);
            scene.add(rimLight);
            
            // Premium grass ground
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x4A7C59,
                roughness: 0.95,
                metalness: 0.0
            });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const gridHelper = new THREE.GridHelper(300, 60, 0x2d4a2d, 0x3a5a3a);
            gridHelper.material.opacity = 0.15;
            gridHelper.material.transparent = true;
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
            
            setupControls();
            buildScene();
            animate();
            
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('dblclick', resetCamera);
        }
        
        function setupControls() {
            let isDragging = false;
            let prevMouse = { x: 0, y: 0 };
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                
                const radius = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
                let angle = Math.atan2(camera.position.z, camera.position.x);
                angle -= dx * 0.005;
                
                camera.position.x = radius * Math.cos(angle);
                camera.position.z = radius * Math.sin(angle);
                camera.position.y = Math.max(15, camera.position.y - dy * 0.3);
                
                camera.lookAt(0, config.height / 2, 0);
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('mouseleave', () => isDragging = false);
            
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(delta);
                camera.position.y = Math.max(20, Math.min(120, camera.position.y));
            });
        }
        
        function resetCamera() {
            camera.position.set(65, 50, 65);
            camera.lookAt(0, config.height / 2, 0);
        }
        
        function buildScene() {
            if (building) scene.remove(building);
            building = new THREE.Group();
            
            const w = config.width;
            const l = config.length;
            const h = config.height;
            const pitch = eval(config.roofPitch.replace('/', '/'));
            const peakH = h + (w / 2) * pitch;
            
            const roofMat = new THREE.MeshStandardMaterial({ 
                color: roofColors[config.roofColor],
                roughness: 0.5,
                metalness: 0.5
            });
            
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: wallColors[config.wallColor],
                roughness: 0.8,
                metalness: 0.1
            });
            
            const trimMat = new THREE.MeshStandardMaterial({ 
                color: trimColors[config.trimColor],
                roughness: 0.6,
                metalness: 0.2
            });
            
            // Walls
            const wallThick = 0.3;
            
            const frontGeo = new THREE.BoxGeometry(w, h, wallThick);
            const frontWall = new THREE.Mesh(frontGeo, wallMat);
            frontWall.position.set(0, h/2, -l/2);
            frontWall.castShadow = true;
            frontWall.receiveShadow = true;
            building.add(frontWall);
            
            const backWall = frontWall.clone();
            backWall.position.z = l/2;
            building.add(backWall);
            
            const sideGeo = new THREE.BoxGeometry(wallThick, h, l);
            const leftWall = new THREE.Mesh(sideGeo, wallMat);
            leftWall.position.set(-w/2, h/2, 0);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            building.add(leftWall);
            
            const rightWall = leftWall.clone();
            rightWall.position.x = w/2;
            building.add(rightWall);
            
            // ROOF - Proper A-frame using Shape + Extrude
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-w/2, h);      // Left eave
            roofShape.lineTo(0, peakH);      // Peak
            roofShape.lineTo(w/2, h);        // Right eave
            roofShape.lineTo(-w/2, h);       // Close shape
            
            const extrudeSettings = {
                depth: l,
                bevelEnabled: false
            };
            
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.z = -l/2;
            roof.castShadow = true;
            roof.receiveShadow = true;
            building.add(roof);
            
            // Gable ends
            const gableGeo = new THREE.BufferGeometry();
            const gableVerts = new Float32Array([
                -w/2, h, 0,  w/2, h, 0,  0, peakH, 0
            ]);
            gableGeo.setAttribute('position', new THREE.BufferAttribute(gableVerts, 3));
            gableGeo.computeVertexNormals();
            
            const gableFront = new THREE.Mesh(gableGeo, trimMat);
            gableFront.position.z = -l/2;
            gableFront.castShadow = true;
            building.add(gableFront);
            
            const gableBack = gableFront.clone();
            gableBack.position.z = l/2;
            building.add(gableBack);
            
            // Wainscot
            if (config.wainscot) {
                const wMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
                const wH = 4;
                
                [
                    [w, wH, 0.4, 0, wH/2, -l/2],
                    [w, wH, 0.4, 0, wH/2, l/2],
                    [0.4, wH, l, -w/2, wH/2, 0],
                    [0.4, wH, l, w/2, wH/2, 0]
                ].forEach(([gw, gh, gd, x, y, z]) => {
                    const geo = new THREE.BoxGeometry(gw, gh, gd);
                    const mesh = new THREE.Mesh(geo, wMat);
                    mesh.position.set(x, y, z);
                    mesh.castShadow = true;
                    building.add(mesh);
                });
            }
            
            // Doors
            config.doors.forEach(door => addDoorMesh(door));
            
            // Windows
            config.windows.forEach(win => addWindowMesh(win));
            
            // Side Sheds
            config.sideSheds.forEach(shed => addShedMesh(shed));
            
            scene.add(building);
            updateStats();
        }
        
        function addDoorMesh(door) {
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.7 });
            const geo = new THREE.BoxGeometry(door.width, door.height, 0.25);
            const mesh = new THREE.Mesh(geo, doorMat);
            
            if (door.wall === 'front') mesh.position.set(door.position, door.height/2, -config.length/2);
            else if (door.wall === 'back') mesh.position.set(door.position, door.height/2, config.length/2);
            else if (door.wall === 'left') {
                mesh.position.set(-config.width/2, door.height/2, door.position);
                mesh.rotation.y = Math.PI/2;
            } else {
                mesh.position.set(config.width/2, door.height/2, door.position);
                mesh.rotation.y = Math.PI/2;
            }
            
            mesh.castShadow = true;
            building.add(mesh);
        }
        
        function addWindowMesh(win) {
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const glassMat = new THREE.MeshStandardMaterial({ 
                color: 0x87CEEB,
                transparent: true,
                opacity: 0.5,
                metalness: 0.9,
                roughness: 0.05
            });
            
            const frame = new THREE.Mesh(new THREE.BoxGeometry(win.width, win.height, 0.2), frameMat);
            const glass = new THREE.Mesh(new THREE.PlaneGeometry(win.width - 0.3, win.height - 0.3), glassMat);
            
            const yPos = win.height/2 + 5;
            
            if (win.wall === 'front') {
                frame.position.set(win.position, yPos, -config.length/2);
                glass.position.set(win.position, yPos, -config.length/2 - 0.15);
            } else if (win.wall === 'back') {
                frame.position.set(win.position, yPos, config.length/2);
                glass.position.set(win.position, yPos, config.length/2 + 0.15);
            } else if (win.wall === 'left') {
                frame.position.set(-config.width/2, yPos, win.position);
                frame.rotation.y = Math.PI/2;
                glass.position.set(-config.width/2 - 0.15, yPos, win.position);
                glass.rotation.y = Math.PI/2;
            } else {
                frame.position.set(config.width/2, yPos, win.position);
                frame.rotation.y = Math.PI/2;
                glass.position.set(config.width/2 + 0.15, yPos, win.position);
                glass.rotation.y = Math.PI/2;
            }
            
            frame.castShadow = true;
            building.add(frame, glass);
        }
        
        function addShedMesh(shed) {
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: wallColors[config.wallColor],
                roughness: 0.8
            });
            const roofMat = new THREE.MeshStandardMaterial({ 
                color: roofColors[config.roofColor],
                roughness: 0.5,
                metalness: 0.5
            });
            
            const sw = shed.width;
            const sl = shed.length;
            const sh = config.height;
            const wallThick = 0.3;
            
            // Position shed attached to main building
            const shedGroup = new THREE.Group();
            const xPos = shed.side === 'left' ? -config.width/2 : config.width/2;
            
            // Three walls (front, back, outer)
            const frontGeo = new THREE.BoxGeometry(sw, sh, wallThick);
            const frontWall = new THREE.Mesh(frontGeo, wallMat);
            frontWall.position.set(0, sh/2, -sl/2);
            frontWall.castShadow = true;
            shedGroup.add(frontWall);
            
            const backWall = frontWall.clone();
            backWall.position.z = sl/2;
            shedGroup.add(backWall);
            
            const outerWallGeo = new THREE.BoxGeometry(wallThick, sh, sl);
            const outerWall = new THREE.Mesh(outerWallGeo, wallMat);
            const outerX = shed.side === 'left' ? -sw : sw;
            outerWall.position.set(outerX, sh/2, 0);
            outerWall.castShadow = true;
            shedGroup.add(outerWall);
            
            // SINGLE SLOPE ROOF - from building eave (high) to shed outer wall (low)
            const roofShape = new THREE.Shape();
            roofShape.moveTo(0, sh);              // At building wall (high point)
            roofShape.lineTo(outerX, sh);         // Outer wall (low point, same height for now)
            roofShape.lineTo(outerX, sh);         // Could add slight slope here
            roofShape.lineTo(0, sh);
            
            const roofExtrudeSettings = {
                depth: sl,
                bevelEnabled: false
            };
            
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, roofExtrudeSettings);
            const shedRoof = new THREE.Mesh(roofGeo, roofMat);
            shedRoof.position.z = -sl/2;
            shedRoof.castShadow = true;
            shedGroup.add(shedRoof);
            
            // Position entire shed group
            shedGroup.position.x = shed.side === 'left' ? xPos - sw/2 : xPos + sw/2;
            building.add(shedGroup);
        }
        
        function addDoor() {
            config.doors.push({
                id: Date.now(),
                width: 9,
                height: 8,
                wall: 'front',
                position: 0
            });
            updateDoorsList();
            buildScene();
        }
        
        function addWindow() {
            config.windows.push({
                id: Date.now(),
                width: 3,
                height: 3,
                wall: 'front',
                position: 5
            });
            updateWindowsList();
            buildScene();
        }
        
        function addSideShed() {
            config.sideSheds.push({
                id: Date.now(),
                width: 10,
                length: 20,
                side: 'left'
            });
            updateShedsList();
            buildScene();
        }
        
        function updateDoorsList() {
            const list = document.getElementById('doorsList');
            list.innerHTML = config.doors.map(d => `
                <div class="item">
                    <div class="item-info">
                        <strong>Door ${d.id % 1000}</strong>
                        <small>${d.width}' × ${d.height}' on ${d.wall} wall</small>
                    </div>
                    <button class="btn-delete" onclick="deleteDoor(${d.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function updateWindowsList() {
            const list = document.getElementById('windowsList');
            list.innerHTML = config.windows.map(w => `
                <div class="item">
                    <div class="item-info">
                        <strong>Window ${w.id % 1000}</strong>
                        <small>${w.width}' × ${w.height}' on ${w.wall} wall</small>
                    </div>
                    <button class="btn-delete" onclick="deleteWindow(${w.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function updateShedsList() {
            const list = document.getElementById('shedsList');
            list.innerHTML = config.sideSheds.map(s => `
                <div class="item">
                    <div class="item-info">
                        <strong>Shed ${s.id % 1000}</strong>
                        <small>${s.width}' × ${s.length}' on ${s.side} side</small>
                    </div>
                    <button class="btn-delete" onclick="deleteShed(${s.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function deleteDoor(id) {
            config.doors = config.doors.filter(d => d.id !== id);
            updateDoorsList();
            buildScene();
        }
        
        function deleteWindow(id) {
            config.windows = config.windows.filter(w => w.id !== id);
            updateWindowsList();
            buildScene();
        }
        
        function deleteShed(id) {
            config.sideSheds = config.sideSheds.filter(s => s.id !== id);
            updateShedsList();
            buildScene();
        }
        
        function updateStats() {
            const pitch = eval(config.roofPitch.replace('/', '/'));
            const peakH = config.height + (config.width / 2) * pitch;
            const sqFt = config.width * config.length;
            
            document.getElementById('statWidth').textContent = config.width + "'";
            document.getElementById('statLength').textContent = config.length + "'";
            document.getElementById('statHeight').textContent = config.height + "'";
            document.getElementById('statPeak').textContent = Math.round(peakH) + "'";
            document.getElementById('statSqFt').textContent = sqFt.toLocaleString();
        }
        
        function initColors() {
            const roofDiv = document.getElementById('roofColors');
            Object.keys(roofColors).forEach(name => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (name === config.roofColor ? ' selected' : '');
                swatch.style.background = `#${roofColors[name].toString(16).padStart(6, '0')}`;
                swatch.innerHTML = `<span style="color: ${roofColors[name] > 0x808080 ? '#000' : '#fff'}">${name}</span>`;
                swatch.onclick = () => {
                    config.roofColor = name;
                    buildScene();
                    initColors();
                };
                roofDiv.appendChild(swatch);
            });
            
            const wallDiv = document.getElementById('wallColors');
            Object.keys(wallColors).forEach(name => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (name === config.wallColor ? ' selected' : '');
                swatch.style.background = `#${wallColors[name].toString(16).padStart(6, '0')}`;
                swatch.innerHTML = `<span style="color: ${wallColors[name] > 0x808080 ? '#000' : '#fff'}">${name}</span>`;
                swatch.onclick = () => {
                    config.wallColor = name;
                    buildScene();
                    initColors();
                };
                wallDiv.appendChild(swatch);
            });
            
            const trimDiv = document.getElementById('trimColors');
            Object.keys(trimColors).forEach(name => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (name === config.trimColor ? ' selected' : '');
                swatch.style.background = `#${trimColors[name].toString(16).padStart(6, '0')}`;
                swatch.innerHTML = `<span style="color: ${trimColors[name] > 0x808080 ? '#000' : '#fff'}">${name}</span>`;
                swatch.onclick = () => {
                    config.trimColor = name;
                    buildScene();
                    initColors();
                };
                trimDiv.appendChild(swatch);
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        function onResize() {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        }
        
        function saveDesign() {
            const json = JSON.stringify(config, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `building-design-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function getQuote() {
            alert('Quote Request:\n\n' + 
                  `${config.width}' × ${config.length}' Building\n` +
                  `Wall Height: ${config.height}'\n` +
                  `Roof: ${config.roofPitch} pitch\n` +
                  `Colors: ${config.roofColor} roof, ${config.wallColor} walls\n` +
                  `Doors: ${config.doors.length}\n` +
                  `Windows: ${config.windows.length}\n` +
                  `Side Sheds: ${config.sideSheds.length}\n\n` +
                  'Contact sales for detailed pricing!');
        }
        
        // Event Listeners
        document.getElementById('width').addEventListener('input', (e) => {
            config.width = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('length').addEventListener('input', (e) => {
            config.length = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('height').addEventListener('input', (e) => {
            config.height = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('roofPitch').addEventListener('change', (e) => {
            config.roofPitch = e.target.value;
            buildScene();
        });
        
        document.getElementById('wainscot').addEventListener('change', (e) => {
            config.wainscot = e.target.checked;
            buildScene();
        });
        
        // Initialize
        init();
        initColors();
    </script>
</body>
</html>
