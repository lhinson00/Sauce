<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Building Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-main: #0a0b0d;
            --bg-panel: #12141a;
            --bg-card: #1a1d26;
            --accent-primary: #00ffff;
            --accent-secondary: #ff00ff;
            --accent-glow: rgba(0, 255, 255, 0.3);
            --text-bright: #ffffff;
            --text-normal: #e0e6ed;
            --text-dim: #7d8590;
            --border: #2d3139;
            --success: #00ff88;
            --warning: #ffaa00;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-normal);
            overflow: hidden;
            height: 100vh;
        }
        
        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .header {
            position: relative;
            z-index: 10;
            padding: 20px 40px;
            background: linear-gradient(135deg, var(--bg-panel) 0%, var(--bg-card) 100%);
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .main-container {
            position: relative;
            display: flex;
            height: calc(100vh - 82px);
        }
        
        .sidebar {
            width: 350px;
            background: var(--bg-panel);
            border-right: 2px solid var(--border);
            overflow-y: auto;
            padding: 20px;
        }
        
        .viewport-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #0f1419 0%, var(--bg-main) 100%);
        }
        
        #viewport {
            width: 100%;
            height: 100%;
        }
        
        .section {
            background: rgba(18, 20, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-bright);
            font-size: 14px;
            transition: all 0.2s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        
        input[type="range"] {
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 3px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-primary), #0088cc);
            border: none;
            border-radius: 8px;
            color: var(--bg-main);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 255, 0.3);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--border), var(--bg-card));
            color: var(--text-bright);
            margin-top: 10px;
        }
        
        .door-item,
        .window-item,
        .shed-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            transition: all 0.2s;
        }
        
        .door-item:hover,
        .window-item:hover,
        .shed-item:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 255, 255, 0.05);
        }
        
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(18, 20, 26, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
        }
        
        .stats div {
            margin-bottom: 8px;
            color: var(--text-dim);
        }
        
        .stats span {
            color: var(--accent-primary);
            font-weight: 700;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        
        .color-option {
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .color-option:hover {
            border-color: var(--accent-primary);
        }
        
        .color-option.selected {
            border-color: var(--success);
            background: rgba(0, 255, 136, 0.1);
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="header">
        <h1>🏗️ Professional Building Designer</h1>
        <div style="font-family: Orbitron; font-size: 12px; color: var(--text-dim);">
            v3.0 | Full Featured
        </div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <!-- Building Dimensions -->
            <div class="section">
                <h3>📐 Building Dimensions</h3>
                <div class="control-group">
                    <label>Width (ft)</label>
                    <input type="number" id="width" value="30" min="10" max="100" step="2">
                </div>
                <div class="control-group">
                    <label>Length (ft)</label>
                    <input type="number" id="length" value="40" min="10" max="100" step="2">
                </div>
                <div class="control-group">
                    <label>Wall Height (ft)</label>
                    <input type="number" id="height" value="12" min="8" max="20" step="1">
                </div>
                <div class="control-group">
                    <label>Roof Pitch</label>
                    <select id="roofPitch">
                        <option value="3/12">3/12</option>
                        <option value="4/12" selected>4/12</option>
                        <option value="5/12">5/12</option>
                        <option value="6/12">6/12</option>
                    </select>
                </div>
            </div>
            
            <!-- Colors -->
            <div class="section">
                <h3>🎨 Colors</h3>
                <div class="control-group">
                    <label>Roof Color</label>
                    <div class="color-grid" id="roofColorGrid"></div>
                </div>
                <div class="control-group">
                    <label>Wall Color</label>
                    <div class="color-grid" id="wallColorGrid"></div>
                </div>
                <div class="control-group">
                    <label>Trim Color</label>
                    <div class="color-grid" id="trimColorGrid"></div>
                </div>
            </div>
            
            <!-- Doors -->
            <div class="section">
                <h3>🚪 Doors</h3>
                <button class="btn" onclick="addDoor()">Add Door</button>
                <div id="doorsList" style="margin-top: 15px;"></div>
            </div>
            
            <!-- Windows -->
            <div class="section">
                <h3>🪟 Windows</h3>
                <button class="btn" onclick="addWindow()">Add Window</button>
                <div id="windowsList" style="margin-top: 15px;"></div>
            </div>
            
            <!-- Side Sheds -->
            <div class="section">
                <h3>🏠 Side Sheds</h3>
                <button class="btn" onclick="addSideShed()">Add Side Shed</button>
                <div id="shedsList" style="margin-top: 15px;"></div>
            </div>
            
            <!-- Options -->
            <div class="section">
                <h3>⚙️ Options</h3>
                <div class="control-group">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="wainscot" style="width: auto;">
                        Add Wainscot (4ft)
                    </label>
                </div>
            </div>
        </div>
        
        <div class="viewport-container">
            <div id="viewport"></div>
            <div class="stats">
                <div>Width: <span id="statWidth">30'</span></div>
                <div>Length: <span id="statLength">40'</span></div>
                <div>Height: <span id="statHeight">12'</span></div>
                <div>Peak: <span id="statPeak">17'</span></div>
                <div>Sq Ft: <span id="statSqFt">1200</span></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Color Palettes
        const roofColors = {
            'Barn Red': 0x8B2500,
            'Charcoal': 0x36454F,
            'Burnished Slate': 0x5C6B73,
            'Galvalume': 0xC0C0C0,
            'Polar White': 0xF8F8FF,
            'Clay': 0xB87333
        };
        
        const wallColors = {
            'Pure White': 0xFFFFFF,
            'Ivory': 0xFFFFF0,
            'Light Stone': 0xD3D3D3,
            'Sahara Tan': 0xC9B58C,
            'Slate Gray': 0x708090,
            'Black': 0x1C1C1C
        };
        
        const trimColors = {
            'Pure White': 0xFFFFFF,
            'Charcoal': 0x36454F,
            'Barn Red': 0x8B2500,
            'Black': 0x000000
        };
        
        // Building Configuration
        let buildingConfig = {
            width: 30,
            length: 40,
            height: 12,
            roofPitch: '4/12',
            roofColor: 'Barn Red',
            wallColor: 'Pure White',
            trimColor: 'Pure White',
            wainscot: false,
            doors: [],
            windows: [],
            sideSheds: []
        };
        
        // Three.js Scene
        let scene, camera, renderer;
        let building, ground;
        let draggedItem = null;
        
        function initThreeJS() {
            const viewport = document.getElementById('viewport');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0b0d);
            scene.fog = new THREE.Fog(0x0a0b0d, 50, 200);
            
            camera = new THREE.PerspectiveCamera(
                45,
                viewport.clientWidth / viewport.clientHeight,
                0.1,
                1000
            );
            camera.position.set(60, 45, 60);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(window.devicePixelRatio);
            viewport.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 80, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.near = 1;
            sunLight.shadow.camera.far = 300;
            sunLight.shadow.camera.left = -100;
            sunLight.shadow.camera.right = 100;
            sunLight.shadow.camera.top = 100;
            sunLight.shadow.camera.bottom = -100;
            scene.add(sunLight);
            
            const fillLight = new THREE.HemisphereLight(0x87CEEB, 0x4A7C59, 0.4);
            scene.add(fillLight);
            
            const accentLight = new THREE.PointLight(0x00ffff, 0.2, 150);
            accentLight.position.set(-30, 25, -30);
            scene.add(accentLight);
            
            // BEAUTIFUL GRASS GROUND
            const groundGeometry = new THREE.PlaneGeometry(250, 250);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4A7C59, // Rich grass green
                roughness: 0.9,
                metalness: 0.0
            });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid overlay on grass
            const gridHelper = new THREE.GridHelper(250, 50, 0x2d4a2d, 0x3a5a3a);
            gridHelper.material.opacity = 0.25;
            gridHelper.material.transparent = true;
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
            
            setupControls();
            buildScene();
            animate();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function setupControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            const rotationSpeed = 0.005;
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    const radius = Math.sqrt(
                        camera.position.x ** 2 + 
                        camera.position.z ** 2
                    );
                    
                    let angle = Math.atan2(camera.position.z, camera.position.x);
                    angle -= deltaX * rotationSpeed;
                    
                    camera.position.x = radius * Math.cos(angle);
                    camera.position.z = radius * Math.sin(angle);
                    camera.position.y = Math.max(10, camera.position.y - deltaY * 0.2);
                    
                    camera.lookAt(0, buildingConfig.height / 2, 0);
                    
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.1;
                const delta = e.deltaY > 0 ? 1 + zoomSpeed : 1 - zoomSpeed;
                
                camera.position.multiplyScalar(delta);
                camera.position.y = Math.max(15, Math.min(100, camera.position.y));
            });
        }
        
        function buildScene() {
            if (building) scene.remove(building);
            
            building = new THREE.Group();
            
            const w = buildingConfig.width;
            const l = buildingConfig.length;
            const h = buildingConfig.height;
            const pitch = eval(buildingConfig.roofPitch.replace('/', '/'));
            const peakH = h + (w / 2) * pitch;
            
            // Materials
            const roofMat = new THREE.MeshStandardMaterial({ 
                color: roofColors[buildingConfig.roofColor],
                roughness: 0.6,
                metalness: 0.4
            });
            
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: wallColors[buildingConfig.wallColor],
                roughness: 0.7,
                metalness: 0.1
            });
            
            const trimMat = new THREE.MeshStandardMaterial({ 
                color: trimColors[buildingConfig.trimColor],
                roughness: 0.5,
                metalness: 0.2
            });
            
            // Main Building Walls
            const wallThickness = 0.3;
            
            // Front/Back Walls
            const wallGeo = new THREE.BoxGeometry(w, h, wallThickness);
            const frontWall = createWall(wallGeo, wallMat, 0, h/2, -l/2);
            const backWall = createWall(wallGeo, wallMat, 0, h/2, l/2);
            building.add(frontWall, backWall);
            
            // Side Walls
            const sideWallGeo = new THREE.BoxGeometry(wallThickness, h, l);
            const leftWall = createWall(sideWallGeo, wallMat, -w/2, h/2, 0);
            const rightWall = createWall(sideWallGeo, wallMat, w/2, h/2, 0);
            building.add(leftWall, rightWall);
            
            // Roof (solid A-frame using BoxGeometry rotated at angle)
            const rise = peakH - h;
            const run = w / 2;
            const roofSlant = Math.sqrt(rise * rise + run * run);
            const roofAngle = Math.atan2(rise, run);
            
            // Left roof panel (as a thin box)
            const leftRoofGeo = new THREE.BoxGeometry(roofSlant, l, 0.2);
            const leftRoof = new THREE.Mesh(leftRoofGeo, roofMat);
            leftRoof.rotation.x = Math.PI / 2;
            leftRoof.rotation.y = roofAngle;
            leftRoof.position.set(-w/4, h + rise/2, 0);
            leftRoof.castShadow = true;
            leftRoof.receiveShadow = true;
            building.add(leftRoof);
            
            // Right roof panel (as a thin box)
            const rightRoofGeo = new THREE.BoxGeometry(roofSlant, l, 0.2);
            const rightRoof = new THREE.Mesh(rightRoofGeo, roofMat);
            rightRoof.rotation.x = Math.PI / 2;
            rightRoof.rotation.y = -roofAngle;
            rightRoof.position.set(w/4, h + rise/2, 0);
            rightRoof.castShadow = true;
            rightRoof.receiveShadow = true;
            building.add(rightRoof);
            
            // Gable ends
            const gableGeo = new THREE.BufferGeometry();
            const gableVertices = new Float32Array([
                -w/2, h, 0,
                w/2, h, 0,
                0, peakH, 0
            ]);
            gableGeo.setAttribute('position', new THREE.BufferAttribute(gableVertices, 3));
            gableGeo.computeVertexNormals();
            
            const gableFront = new THREE.Mesh(gableGeo, trimMat);
            gableFront.position.z = -l/2;
            gableFront.castShadow = true;
            building.add(gableFront);
            
            const gableBack = new THREE.Mesh(gableGeo, trimMat);
            gableBack.position.z = l/2;
            gableBack.castShadow = true;
            building.add(gableBack);
            
            // Wainscot
            if (buildingConfig.wainscot) {
                addWainscot(w, l, h);
            }
            
            // Doors
            buildingConfig.doors.forEach(door => {
                addDoorMesh(door);
            });
            
            // Windows
            buildingConfig.windows.forEach(window => {
                addWindowMesh(window);
            });
            
            // Side Sheds
            buildingConfig.sideSheds.forEach(shed => {
                addSideShedMesh(shed);
            });
            
            scene.add(building);
            updateStats();
        }
        
        function createWall(geo, mat, x, y, z) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        function addWainscot(w, l, h) {
            const wainscotMat = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a2a,
                roughness: 0.8,
                metalness: 0.2
            });
            const wainscotH = 4;
            const thickness = 0.35;
            
            // Front/Back
            const wGeo1 = new THREE.BoxGeometry(w, wainscotH, thickness);
            const w1 = new THREE.Mesh(wGeo1, wainscotMat);
            w1.position.set(0, wainscotH/2, -l/2);
            w1.castShadow = true;
            building.add(w1);
            
            const w2 = new THREE.Mesh(wGeo1, wainscotMat);
            w2.position.set(0, wainscotH/2, l/2);
            w2.castShadow = true;
            building.add(w2);
            
            // Sides
            const wGeo2 = new THREE.BoxGeometry(thickness, wainscotH, l);
            const w3 = new THREE.Mesh(wGeo2, wainscotMat);
            w3.position.set(-w/2, wainscotH/2, 0);
            w3.castShadow = true;
            building.add(w3);
            
            const w4 = new THREE.Mesh(wGeo2, wainscotMat);
            w4.position.set(w/2, wainscotH/2, 0);
            w4.castShadow = true;
            building.add(w4);
        }
        
        function addDoorMesh(door) {
            const doorMat = new THREE.MeshStandardMaterial({ 
                color: 0x654321,
                roughness: 0.7,
                metalness: 0.1
            });
            const doorGeo = new THREE.BoxGeometry(door.width, door.height, 0.2);
            const doorMesh = new THREE.Mesh(doorGeo, doorMat);
            
            // Position based on wall
            if (door.wall === 'front') {
                doorMesh.position.set(door.position, door.height/2, -buildingConfig.length/2);
            } else if (door.wall === 'back') {
                doorMesh.position.set(door.position, door.height/2, buildingConfig.length/2);
            } else if (door.wall === 'left') {
                doorMesh.position.set(-buildingConfig.width/2, door.height/2, door.position);
                doorMesh.rotation.y = Math.PI / 2;
            } else if (door.wall === 'right') {
                doorMesh.position.set(buildingConfig.width/2, door.height/2, door.position);
                doorMesh.rotation.y = Math.PI / 2;
            }
            
            doorMesh.castShadow = true;
            building.add(doorMesh);
        }
        
        function addWindowMesh(window) {
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const glassMat = new THREE.MeshStandardMaterial({ 
                color: 0x87CEEB,
                transparent: true,
                opacity: 0.4,
                metalness: 0.9,
                roughness: 0.1
            });
            
            const frameGeo = new THREE.BoxGeometry(window.width, window.height, 0.15);
            const frame = new THREE.Mesh(frameGeo, frameMat);
            
            const glassGeo = new THREE.PlaneGeometry(window.width - 0.2, window.height - 0.2);
            const glass = new THREE.Mesh(glassGeo, glassMat);
            
            // Position based on wall
            if (window.wall === 'front') {
                frame.position.set(window.position, window.height/2 + 4, -buildingConfig.length/2);
                glass.position.set(window.position, window.height/2 + 4, -buildingConfig.length/2 - 0.1);
            } else if (window.wall === 'back') {
                frame.position.set(window.position, window.height/2 + 4, buildingConfig.length/2);
                glass.position.set(window.position, window.height/2 + 4, buildingConfig.length/2 + 0.1);
            } else if (window.wall === 'left') {
                frame.position.set(-buildingConfig.width/2, window.height/2 + 4, window.position);
                frame.rotation.y = Math.PI / 2;
                glass.position.set(-buildingConfig.width/2 - 0.1, window.height/2 + 4, window.position);
                glass.rotation.y = Math.PI / 2;
            } else if (window.wall === 'right') {
                frame.position.set(buildingConfig.width/2, window.height/2 + 4, window.position);
                frame.rotation.y = Math.PI / 2;
                glass.position.set(buildingConfig.width/2 + 0.1, window.height/2 + 4, window.position);
                glass.rotation.y = Math.PI / 2;
            }
            
            frame.castShadow = true;
            building.add(frame, glass);
        }
        
        function addSideShedMesh(shed) {
            const shedGroup = new THREE.Group();
            
            const shedWallMat = new THREE.MeshStandardMaterial({ 
                color: wallColors[buildingConfig.wallColor],
                roughness: 0.7,
                metalness: 0.1
            });
            const shedRoofMat = new THREE.MeshStandardMaterial({ 
                color: roofColors[buildingConfig.roofColor],
                roughness: 0.6,
                metalness: 0.4
            });
            
            const shedW = shed.width;
            const shedL = shed.length;
            const shedH = buildingConfig.height;
            
            // Shed walls
            const wallGeo = new THREE.BoxGeometry(shedW, shedH, 0.3);
            const shedFront = new THREE.Mesh(wallGeo, shedWallMat);
            const shedBack = new THREE.Mesh(wallGeo, shedWallMat);
            
            const sideGeo = new THREE.BoxGeometry(0.3, shedH, shedL);
            const shedOuter = new THREE.Mesh(sideGeo, shedWallMat);
            
            // Shed roof (lean-to)
            const roofSlope = 0.2;
            const roofGeo = new THREE.PlaneGeometry(shedW, shedL);
            const shedRoof = new THREE.Mesh(roofGeo, shedRoofMat);
            
            if (shed.side === 'left') {
                shedFront.position.set(-buildingConfig.width/2 - shedW/2, shedH/2, -shedL/2);
                shedBack.position.set(-buildingConfig.width/2 - shedW/2, shedH/2, shedL/2);
                shedOuter.position.set(-buildingConfig.width/2 - shedW, shedH/2, 0);
                shedRoof.position.set(-buildingConfig.width/2 - shedW/2, shedH, 0);
                shedRoof.rotation.x = -Math.PI / 2 + roofSlope;
                shedRoof.rotation.z = -roofSlope;
            } else {
                shedFront.position.set(buildingConfig.width/2 + shedW/2, shedH/2, -shedL/2);
                shedBack.position.set(buildingConfig.width/2 + shedW/2, shedH/2, shedL/2);
                shedOuter.position.set(buildingConfig.width/2 + shedW, shedH/2, 0);
                shedRoof.position.set(buildingConfig.width/2 + shedW/2, shedH, 0);
                shedRoof.rotation.x = -Math.PI / 2 - roofSlope;
                shedRoof.rotation.z = roofSlope;
            }
            
            shedFront.castShadow = true;
            shedBack.castShadow = true;
            shedOuter.castShadow = true;
            shedRoof.castShadow = true;
            
            shedGroup.add(shedFront, shedBack, shedOuter, shedRoof);
            building.add(shedGroup);
        }
        
        function addDoor() {
            const doorId = Date.now();
            buildingConfig.doors.push({
                id: doorId,
                width: 9,
                height: 7,
                wall: 'front',
                position: 0
            });
            updateDoorsList();
            buildScene();
        }
        
        function addWindow() {
            const windowId = Date.now();
            buildingConfig.windows.push({
                id: windowId,
                width: 3,
                height: 3,
                wall: 'front',
                position: 5
            });
            updateWindowsList();
            buildScene();
        }
        
        function addSideShed() {
            const shedId = Date.now();
            buildingConfig.sideSheds.push({
                id: shedId,
                width: 10,
                length: 20,
                side: 'left'
            });
            updateShedsList();
            buildScene();
        }
        
        function updateDoorsList() {
            const list = document.getElementById('doorsList');
            list.innerHTML = buildingConfig.doors.map(door => `
                <div class="door-item" draggable="true" ondragstart="startDrag(event, 'door', ${door.id})">
                    <div>
                        <strong>Door ${door.id % 1000}</strong><br>
                        <small>${door.width}' × ${door.height}' on ${door.wall}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteDoor(${door.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function updateWindowsList() {
            const list = document.getElementById('windowsList');
            list.innerHTML = buildingConfig.windows.map(window => `
                <div class="window-item" draggable="true" ondragstart="startDrag(event, 'window', ${window.id})">
                    <div>
                        <strong>Window ${window.id % 1000}</strong><br>
                        <small>${window.width}' × ${window.height}' on ${window.wall}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteWindow(${window.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function updateShedsList() {
            const list = document.getElementById('shedsList');
            list.innerHTML = buildingConfig.sideSheds.map(shed => `
                <div class="shed-item">
                    <div>
                        <strong>Shed ${shed.id % 1000}</strong><br>
                        <small>${shed.width}' × ${shed.length}' on ${shed.side}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteShed(${shed.id})">Delete</button>
                </div>
            `).join('');
        }
        
        function deleteDoor(id) {
            buildingConfig.doors = buildingConfig.doors.filter(d => d.id !== id);
            updateDoorsList();
            buildScene();
        }
        
        function deleteWindow(id) {
            buildingConfig.windows = buildingConfig.windows.filter(w => w.id !== id);
            updateWindowsList();
            buildScene();
        }
        
        function deleteShed(id) {
            buildingConfig.sideSheds = buildingConfig.sideSheds.filter(s => s.id !== id);
            updateShedsList();
            buildScene();
        }
        
        function startDrag(event, type, id) {
            draggedItem = { type, id };
            event.dataTransfer.effectAllowed = 'move';
        }
        
        function updateStats() {
            const pitch = eval(buildingConfig.roofPitch.replace('/', '/'));
            const peakH = buildingConfig.height + (buildingConfig.width / 2) * pitch;
            const sqFt = buildingConfig.width * buildingConfig.length;
            
            document.getElementById('statWidth').textContent = buildingConfig.width + "'";
            document.getElementById('statLength').textContent = buildingConfig.length + "'";
            document.getElementById('statHeight').textContent = buildingConfig.height + "'";
            document.getElementById('statPeak').textContent = Math.round(peakH) + "'";
            document.getElementById('statSqFt').textContent = sqFt.toLocaleString();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        }
        
        // Initialize color grids
        function initColorGrids() {
            const roofGrid = document.getElementById('roofColorGrid');
            Object.keys(roofColors).forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-option';
                if (color === buildingConfig.roofColor) div.classList.add('selected');
                div.textContent = color.replace(' ', '\n');
                div.style.background = `#${roofColors[color].toString(16).padStart(6, '0')}`;
                div.style.color = roofColors[color] > 0x808080 ? '#000' : '#fff';
                div.onclick = () => {
                    buildingConfig.roofColor = color;
                    buildScene();
                    initColorGrids();
                };
                roofGrid.appendChild(div);
            });
            
            const wallGrid = document.getElementById('wallColorGrid');
            Object.keys(wallColors).forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-option';
                if (color === buildingConfig.wallColor) div.classList.add('selected');
                div.textContent = color.replace(' ', '\n');
                div.style.background = `#${wallColors[color].toString(16).padStart(6, '0')}`;
                div.style.color = wallColors[color] > 0x808080 ? '#000' : '#fff';
                div.onclick = () => {
                    buildingConfig.wallColor = color;
                    buildScene();
                    initColorGrids();
                };
                wallGrid.appendChild(div);
            });
            
            const trimGrid = document.getElementById('trimColorGrid');
            Object.keys(trimColors).forEach(color => {
                const div = document.createElement('div');
                div.className = 'color-option';
                if (color === buildingConfig.trimColor) div.classList.add('selected');
                div.textContent = color.replace(' ', '\n');
                div.style.background = `#${trimColors[color].toString(16).padStart(6, '0')}`;
                div.style.color = trimColors[color] > 0x808080 ? '#000' : '#fff';
                div.onclick = () => {
                    buildingConfig.trimColor = color;
                    buildScene();
                    initColorGrids();
                };
                trimGrid.appendChild(div);
            });
        }
        
        // Event listeners
        document.getElementById('width').addEventListener('input', (e) => {
            buildingConfig.width = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('length').addEventListener('input', (e) => {
            buildingConfig.length = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('height').addEventListener('input', (e) => {
            buildingConfig.height = parseFloat(e.target.value);
            buildScene();
        });
        
        document.getElementById('roofPitch').addEventListener('change', (e) => {
            buildingConfig.roofPitch = e.target.value;
            buildScene();
        });
        
        document.getElementById('wainscot').addEventListener('change', (e) => {
            buildingConfig.wainscot = e.target.checked;
            buildScene();
        });
        
        // Initialize
        initThreeJS();
        initColorGrids();
    </script>
</body>
</html>
