<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauce Estimator — Sign In</title>
    <script>
        // IF ALREADY LOGGED IN, GO STRAIGHT TO HOME
        (function() {
            const savedUser = sessionStorage.getItem('sauce_user');
            if (savedUser) {
                window.location.replace('home.html');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --amber-500: #f59e0b;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(245, 158, 11, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(30, 41, 59, 0.8) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 0 24px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: var(--amber-500);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--slate-900);
            font-family: 'Space Mono', monospace;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(245, 158, 11, 0.25);
        }
        .brand-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            font-size: 14px;
            color: var(--slate-400);
            margin-top: 6px;
        }

        .login-card {
            background: var(--white);
            border-radius: 12px;
            padding: 36px 32px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-top: 3px solid var(--amber-500);
        }
        .login-card h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--slate-900);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate-600);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--slate-900);
            background: var(--slate-50);
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--amber-500);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
            background: var(--white);
        }
        .form-group input::placeholder {
            color: var(--slate-400);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--slate-900);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .login-btn:hover {
            background: var(--slate-800);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
        }
        .login-btn:active {
            transform: translateY(1px);
        }

        .error-message {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .copyright {
            text-align: center;
            margin-top: 32px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--slate-600);
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .login-wrapper { padding: 0 16px; }
            .login-card { padding: 28px 24px 24px; }
            .brand-name { font-size: 24px; }
            .brand-logo { width: 48px; height: 48px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-logo">SE</div>
            <div class="brand-name">Sauce Estimator</div>
            <div class="brand-tagline">Building Quote System</div>
        </div>

        <div class="login-card">
            <h2>Sign in to your account</h2>
            <div class="error-message" id="errorMessage"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>

        <div class="copyright">&copy; 2025 Sauce Estimator. All rights reserved.</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        username: username,
                        password: password
                    }),
                    headers: { 'Content-Type': 'text/plain' }
                });

                const data = await response.json();

                if (data.success) {
                    // Save user to sessionStorage
                    sessionStorage.setItem('sauce_user', JSON.stringify({
                        username: data.username,
                        name: data.fullName,
                        email: data.email,
                        phone: data.phone || '',
                        company: data.company || ''
                    }));

                    // Redirect to home
                    window.location.replace('home.html');
                } else {
                    errorMessage.textContent = data.error || 'Invalid credentials';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Login failed. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
    </script>

</body>
</html>
