<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauce Estimator — Sign In</title>
    <script>
        (function() {
            const savedUser = sessionStorage.getItem('sauce_user');
            if (savedUser) {
                try {
                    const u = JSON.parse(savedUser);
                    if (u && u.username) { window.location.replace('home.html'); }
                    else { sessionStorage.removeItem('sauce_user'); }
                } catch(e) { sessionStorage.removeItem('sauce_user'); }
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #1c1917;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(180,130,50,.06) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 70%, rgba(100,80,40,.04) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px; padding: 0 24px;
        }
        .brand { text-align: center; margin-bottom: 44px; }
        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #b4822e, #d4a843);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px; color: #1c1917;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 22px;
            box-shadow: 0 4px 24px rgba(180, 130, 50, 0.3);
        }
        .brand-name { font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 900; color: #f5f0e8; letter-spacing: -0.5px; }
        .brand-tagline { font-size: 13px; font-weight: 500; color: #8c8379; margin-top: 6px; }
        .login-card {
            background: #242220; border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,.05);
            border-top: 3px solid #b4822e;
        }
        .login-card h2 { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: #e7e0d5; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #8c8379; margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
        .form-group input {
            width: 100%; padding: 13px 16px;
            border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
            font-size: 15px; font-family: 'Inter', sans-serif;
            color: #e7e0d5; background: #1c1917; transition: all 0.2s;
        }
        .form-group input:focus { outline: none; border-color: rgba(180, 130, 50, .4); box-shadow: 0 0 0 3px rgba(180, 130, 50, 0.08); }
        .form-group input::placeholder { color: #5a534d; }
        .login-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #b4822e, #d4a843);
            color: #1c1917; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 800; font-family: 'Outfit', sans-serif;
            cursor: pointer; transition: all 0.2s; margin-top: 6px;
            box-shadow: 0 4px 16px rgba(180, 130, 50, 0.25);
        }
        .login-btn:hover { box-shadow: 0 6px 24px rgba(180, 130, 50, 0.35); transform: translateY(-1px); }
        .login-btn:active { transform: translateY(0); }
        .error-message {
            display: none;
            background: rgba(200, 80, 60, .1); border: 1px solid rgba(200, 80, 60, .2);
            color: #d4796a; padding: 11px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600; margin-bottom: 18px;
        }
        .copyright { text-align: center; margin-top: 36px; font-size: 11px; color: #5a534d; font-weight: 500; }
        @media (max-width: 480px) {
            .login-wrapper { padding: 0 16px; }
            .login-card { padding: 32px 24px 28px; }
            .brand-name { font-size: 26px; }
            .brand-logo { width: 52px; height: 52px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-logo">SE</div>
            <div class="brand-name">Sauce Estimator</div>
            <div class="brand-tagline">Building Quote Platform</div>
        </div>
        <div class="login-card">
            <h2>Sign in to your account</h2>
            <div class="error-message" id="errorMessage"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required autofocus placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
        <div class="copyright">&copy; 2026 Sauce Estimator. All rights reserved.</div>
    </div>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username, password }),
                    headers: { 'Content-Type': 'text/plain' }
                });
                const data = await response.json();
                if (data.success) {
                    sessionStorage.setItem('sauce_user', JSON.stringify({
                        username: data.username, name: data.fullName,
                        email: data.email, phone: data.phone || '', company: data.company || ''
                    }));
                    window.location.replace('home.html');
                } else {
                    errorMessage.textContent = data.error || 'Invalid credentials';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Login failed. Please try again.';
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
