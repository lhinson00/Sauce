<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sauce Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b2b2b; --panel:#3a3a3a; --line:#5e5e5e;
    --text:#f0f3f7; --muted:#8f8f8f;
    --accent:#FF8200; --house:#5b9dd9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Outfit',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; min-height:100dvh;
    background-image:
      radial-gradient(1100px 620px at 50% -12%, rgba(255,130,0,.08), transparent 62%),
      radial-gradient(820px 520px at 92% 108%, rgba(91,157,217,.07), transparent 60%);
  }

  .wrap{width:100%; max-width:760px;}

  header{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .mark{
    width:40px;height:40px;border-radius:10px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;flex:0 0 auto;
  }
  h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .sub{font-size:12px;color:var(--muted);margin-top:1px;}

  #who{
    margin:18px 0 14px; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:18px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#86efac;display:inline-block;}
  #who b{color:var(--text);font-weight:700;}
  .signout{
    background:none;border:none;color:var(--muted);font-size:11px;
    text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;
  }
  .signout:hover{color:var(--text);}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){ .cards{grid-template-columns:1fr;} }

  .card{
    position:relative; display:block; text-align:left; cursor:pointer;
    background:var(--panel); color:inherit; font-family:inherit;
    border:1px solid var(--line); border-radius:14px;
    border-top:3px solid var(--accent);
    padding:20px 20px 18px;
    transition:transform .13s ease, border-color .13s ease, background .13s ease;
  }
  .card:hover{transform:translateY(-2px); background:#414141;}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .card.house{border-top-color:var(--house);}

  .card h2{font-size:16px;font-weight:800;margin:0 0 5px;}
  .card p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 13px;}
  .card ul{margin:0;padding:0;list-style:none;}
  .card li{
    font-size:11px;color:#c8c8c8;padding:2px 0 2px 14px;position:relative;
  }
  .card li:before{
    content:''; position:absolute; left:0; top:9px;
    width:4px;height:4px;border-radius:50%;background:var(--accent);
  }
  .card.house li:before{background:var(--house);}

  .icon{margin-bottom:12px;display:block;}

  .tag{
    position:absolute; top:14px; right:14px;
    font-size:8.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase;
    padding:3px 8px; border-radius:20px;
  }
  .tag.live{background:rgba(134,239,172,.13); color:#86efac; border:1px solid rgba(134,239,172,.35);}
  .tag.soon{background:rgba(255,255,255,.06); color:var(--muted); border:1px solid var(--line);}

  .card[disabled]{opacity:.55; cursor:not-allowed;}
  .card[disabled]:hover{transform:none; background:var(--panel);}

  footer{
    margin-top:20px; font-size:10px; color:var(--muted);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  footer a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">SE</div>
    <div>
      <h1>Sauce Estimator</h1>
      <div class="sub">Design it, price it, quote it.</div>
    </div>
  </header>

  <div id="who"></div>

  <div class="cards">

    <button class="card" onclick="go('barn')">
      <span class="tag live">Ready</span>
      <svg class="icon" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#FF8200" stroke-width="1.7" stroke-linejoin="round">
        <path d="M4 15 17 6l13 9"/>
        <path d="M6 15v13h22V15"/>
        <path d="M13 28v-8h8v8"/>
      </svg>
      <h2>Barn &amp; Garage</h2>
      <p>Post-frame buildings, shops and garages. Rectangular footprints with lean-tos and sheds.</p>
      <ul>
        <li>Wood, steel and stud framing</li>
        <li>Sheds, lofts, awnings, wainscot</li>
        <li>Full material list and quote</li>
      </ul>
    </button>

    <button class="card house" onclick="go('house')" id="houseCard">
      <span class="tag soon" id="houseTag">In development</span>
      <svg class="icon" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#5b9dd9" stroke-width="1.7" stroke-linejoin="round">
        <path d="M3 16 12 8l7 6 5-4 6 5"/>
        <path d="M5 16v12h24V16"/>
        <path d="M12 28v-7h5v7"/>
        <path d="M21 20h4v4h-4z"/>
      </svg>
      <h2>House &amp; Barndominium</h2>
      <p>Stick-framed homes and barndos. Any footprint — draw it, or trace a customer's plan.</p>
      <ul>
        <li>L, T and custom shapes</li>
        <li>Interior walls and multiple floors</li>
        <li>Stud-by-stud material take-off</li>
      </ul>
    </button>

  </div>

  <footer>
    <span id="lastUsed"></span>
    <span>&copy; <span id="yr"></span> Sauce Estimator</span>
  </footer>

</div>

<script>
(function(){
  'use strict';

  // Where each tool lives. Change these if the filenames change.
  var TOOLS = {
    barn:  'sales-tool.html',
    house: 'house-tool.html'
  };

  // The house tool does not exist yet. Flip this to true once it is uploaded.
  var HOUSE_READY = true;

  document.getElementById('yr').textContent = new Date().getFullYear();

  // ── who is signed in ─────────────────────────────────────────────────────
  // The tools own sign-in; the launcher only reports what it finds so nobody
  // is asked to sign in twice. It never writes to the session.
  function currentUser() {
    try {
      var raw = sessionStorage.getItem('sauce_user');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    try {
      var sess = JSON.parse(localStorage.getItem('sauce_session') || 'null');
      if (sess && sess.user) return { name: '', email: sess.user.email || '' };
    } catch(e) {}
    return null;
  }

  var who = document.getElementById('who');
  var u = currentUser();
  if (u) {
    var label = u.fullName || u.name || u.username || u.email || 'Signed in';
    who.innerHTML = '<span class="dot"></span><span>Signed in as <b></b></span>'
      + '<button class="signout" id="soBtn">Sign out</button>';
    who.querySelector('b').textContent = label;   // textContent, never innerHTML
    document.getElementById('soBtn').onclick = function() {
      try { localStorage.removeItem('sauce_session'); } catch(e) {}
      try { sessionStorage.removeItem('sauce_session'); } catch(e) {}
      try { sessionStorage.removeItem('sauce_user'); } catch(e) {}
      location.reload();
    };
  } else {
    who.innerHTML = '<span>Choose a tool — you will be asked to sign in.</span>';
  }

  // ── the house card stays visibly unfinished until it is not ─────────────
  if (!HOUSE_READY) {
    var card = document.getElementById('houseCard');
    card.setAttribute('disabled', 'disabled');
    card.setAttribute('aria-disabled', 'true');
  } else {
    document.getElementById('houseTag').className = 'tag live';
    document.getElementById('houseTag').textContent = 'Ready';
  }

  // ── last used ────────────────────────────────────────────────────────────
  var LAST = 'sauce_last_tool';
  try {
    var last = localStorage.getItem(LAST);
    if (last && TOOLS[last]) {
      document.getElementById('lastUsed').textContent =
        'Last used: ' + (last === 'barn' ? 'Barn & Garage' : 'House & Barndominium');
    }
  } catch(e) {}

  window.go = function(which) {
    if (which === 'house' && !HOUSE_READY) return;
    try { localStorage.setItem(LAST, which); } catch(e) {}
    location.href = TOOLS[which];
  };
})();
</script>
</body>
</html>
