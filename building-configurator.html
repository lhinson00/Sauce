<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Building Designer — Sauce Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#1c1917;color:#e7e0d5;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(180,130,50,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(120,100,70,.03) 0%,transparent 50%);pointer-events:none;z-index:0;}

.topbar{background:linear-gradient(180deg,rgba(28,25,23,.98),rgba(28,25,23,.92));padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(180,130,50,.15);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.topbar-brand{display:flex;align-items:center;gap:14px;}
.topbar-logo{width:40px;height:40px;background:linear-gradient(135deg,#b4822e,#d4a843);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#1c1917;font-family:'Outfit',sans-serif;box-shadow:0 2px 12px rgba(180,130,50,.25);}
.topbar-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;color:#f5f0e8;}
.topbar-subtitle{font-size:10px;font-weight:600;color:#b4822e;letter-spacing:2px;text-transform:uppercase;}
.topbar-right a{padding:8px 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;color:#8c8379;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:all .15s;}
.topbar-right a:hover{border-color:rgba(180,130,50,.2);color:#d4a843;}

/* Standalone dimension entry form */
.entry-overlay{position:relative;z-index:1;max-width:600px;margin:60px auto;padding:0 20px;}
.entry-card{background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:32px;border-top:3px solid #b4822e;}
.entry-card h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:#f5f0e8;margin-bottom:4px;}
.entry-card p{font-size:13px;color:#6b6460;margin-bottom:24px;}
.entry-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.entry-field label{display:block;font-size:11px;font-weight:700;color:#8c8379;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.entry-field input,.entry-field select{width:100%;padding:11px 14px;background:#1c1917;border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#e7e0d5;font-size:14px;font-family:'Inter',sans-serif;font-weight:600;outline:none;transition:border .2s;}
.entry-field input:focus,.entry-field select:focus{border-color:rgba(180,130,50,.4);}
.entry-field input::placeholder{color:#5a534d;}
.entry-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.entry-btn{width:100%;padding:16px;background:linear-gradient(135deg,#b4822e,#d4a843);color:#1c1917;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(180,130,50,.3);transition:all .2s;}
.entry-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(180,130,50,.4);}
.entry-mode{text-align:center;margin-top:12px;font-size:11px;color:#5a534d;}
.entry-mode span{color:#d4a843;font-weight:600;}

/* 3D Generator container - takes full page when active */
#quoteGenOverlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:#1c1917;overflow-y:auto;display:none;}
#quoteGenOverlay.active{display:block;}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-brand">
        <div class="topbar-logo">SE</div>
        <div><div class="topbar-title">3D Building Designer</div><div class="topbar-subtitle">Sauce Estimator</div></div>
    </div>
    <div class="topbar-right">
        <a href="home.html">← Dashboard</a>
    </div>
</div>

<!-- STANDALONE ENTRY FORM (hidden when launched from calculator) -->
<div class="entry-overlay" id="entryForm">
    <div class="entry-card">
        <h2>Design a Building</h2>
        <p>Enter dimensions to start building the 3D model. No pricing required.</p>
        <div class="entry-grid">
            <div class="entry-field">
                <label>Width (ft)</label>
                <input type="number" id="entryW" value="40" placeholder="40">
            </div>
            <div class="entry-field">
                <label>Length (ft)</label>
                <input type="number" id="entryL" value="60" placeholder="60">
            </div>
            <div class="entry-field">
                <label>Sidewall Height (ft)</label>
                <input type="number" id="entryH" value="14" placeholder="14">
            </div>
        </div>
        <div class="entry-row">
            <div class="entry-field">
                <label>Roof Pitch</label>
                <select id="entryPitch">
                    <option value="2">2/12</option><option value="3">3/12</option>
                    <option value="4" selected>4/12</option><option value="5">5/12</option>
                    <option value="6">6/12</option><option value="8">8/12</option>
                </select>
            </div>
            <div class="entry-field">
                <label>Post Spacing (ft)</label>
                <input type="number" id="entryPS" value="10" placeholder="10">
            </div>
        </div>
        <div class="entry-row">
            <div class="entry-field">
                <label>Customer Name</label>
                <input type="text" id="entryCust" placeholder="Optional">
            </div>
            <div class="entry-field">
                <label>Truss Type</label>
                <select id="entryTruss">
                    <option value="Wood" selected>Wood</option><option value="Steel">Steel</option>
                </select>
            </div>
            <div class="entry-field">
                <label>Frame Type</label>
                <select id="entryFrame">
                    <option value="post" selected>Post Frame</option>
                    <option value="stud">Stud Frame (2×6 @ 16" OC)</option>
                </select>
            </div>
        </div>
        <button class="entry-btn" onclick="launchStandalone()">▶ &nbsp;Open 3D Designer</button>
        <div class="entry-mode">Design-only mode — <span>no pricing attached</span></div>
    </div>
</div>

<!-- 3D GENERATOR OVERLAY -->
<div id="quoteGenOverlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === ENTRY POINT LOGIC ===
// Check if we have calculator data in sessionStorage
const calcData = sessionStorage.getItem('sauce_3d_data');

if (calcData) {
    // CALCULATOR PATH — hide entry form, launch immediately
    document.getElementById('entryForm').style.display = 'none';
    try {
        const Q = JSON.parse(calcData);
        sessionStorage.removeItem('sauce_3d_data'); // one-time use
        launchDesigner(Q);
    } catch(e) {
        console.error('Bad calculator data:', e);
        document.getElementById('entryForm').style.display = '';
    }
}

function launchStandalone() {
    const Q = {
        w: parseFloat(document.getElementById('entryW').value) || 40,
        l: parseFloat(document.getElementById('entryL').value) || 60,
        h: parseFloat(document.getElementById('entryH').value) || 14,
        pitch: parseFloat(document.getElementById('entryPitch').value) || 4,
        postSpacing: parseFloat(document.getElementById('entryPS').value) || 10,
        truss: document.getElementById('entryTruss').value || 'Wood',
        frameType: document.getElementById('entryFrame').value || 'post',
        oh: 18, soffit: false,
        customerName: document.getElementById('entryCust').value || 'Customer',
        garageDoors: [], barnDoors: [],
        shed: null, shed2: null,
        lineItems: [],
        pricing: { total: 0 }
    };
    if (!Q.w || !Q.l || !Q.h) { alert('Please enter width, length, and height.'); return; }
    document.getElementById('entryForm').style.display = 'none';
    launchDesigner(Q);
}

function launchDesigner(Q) {
    const overlay = document.getElementById('quoteGenOverlay');
    overlay.classList.add('active');
    buildQuoteGenerator(overlay, Q);
}

function buildQuoteGenerator(overlay, Q) {
    const WALLS = [
        { id: 'front', label: 'Front Gable', len: Q.w, color: '#b4822e', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'back', label: 'Back Gable', len: Q.w, color: '#d4a843', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'left', label: 'Left Eave', len: Q.l, color: '#5a8a6a', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'right', label: 'Right Eave', len: Q.l, color: '#7a6a5a', encl: 'enclosed', postSpacing: Q.postSpacing },
    ];

    let allDoors = [];
    let nextDoorId = 0;
    // Doors are now added manually by the salesman in the configurator below
    // Q.garageDoors and Q.barnDoors from calculator are ignored for 3D model

    let activeDD = null;

    function fmt(ft) {
        if (ft == null) return '';
        const f = Math.floor(ft), inc = Math.round((ft - f) * 12);
        if (inc === 0 || inc === 12) return (inc === 12 ? f + 1 : f) + "'";
        return f + "'" + inc + '"';
    }

    function parseOff(val) {
        val = val.trim();
        const m1 = val.match(/^(\d+)['']?\s*(\d+)?[""]?$/);
        const m2 = val.match(/^(\d+\.?\d*)$/);
        let ft = 0;
        if (m1) { ft = parseInt(m1[1]); if (m1[2]) ft += parseInt(m1[2]) / 12; }
        else if (m2) ft = parseFloat(m2[1]);
        return Math.round(ft * 10) / 10;
    }

    function wallLabel(id) { return WALLS.find(w => w.id === id)?.label || id; }

    const peakH = Q.h + (Q.w / 2) * (Q.pitch / 12);

    // Build HTML
    overlay.innerHTML = `
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');
        .qg *{margin:0;padding:0;box-sizing:border-box;}
        .qg{font-family:'Inter',sans-serif;color:#e7e0d5;background:#1c1917;}
        /* Subtle warmth overlay */
        .qg::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(180,130,50,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(120,100,70,.03) 0%,transparent 50%);pointer-events:none;z-index:0;}
        /* TOP BAR */
        .qg-hdr{display:flex;align-items:center;gap:14px;padding:14px 24px;background:linear-gradient(180deg,rgba(28,25,23,.98),rgba(28,25,23,.92));border-bottom:1px solid rgba(180,130,50,.15);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
        .qg-logo{width:40px;height:40px;background:linear-gradient(135deg,#b4822e,#d4a843);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:900;font-size:14px;color:#1c1917;box-shadow:0 2px 8px rgba(180,130,50,.25);}
        .qg-ht{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:#e7e0d5;letter-spacing:-0.3px;}.qg-hs{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#b4822e;}
        .qg-close{margin-left:auto;padding:8px 18px;background:#242220;border:1px solid rgba(255,255,255,.06);border-radius:8px;color:#8c8379;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;}
        .qg-close:hover{border-color:rgba(180,130,50,.3);color:#d4a843;}
        .qg-body{max-width:1060px;margin:0 auto;padding:20px 20px 50px;position:relative;z-index:1;}
        .qg-top{margin-bottom:18px;}
        .qg-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#b4822e;margin-bottom:6px;}
        .qg-badge::before{content:'';width:6px;height:6px;background:#b4822e;border-radius:50%;}
        .qg-top h2{font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;color:#f5f0e8;letter-spacing:-0.5px;line-height:1.2;}.qg-top h2 span{color:#d4a843;}
        .qg-top p{font-size:13px;color:#8c8379;margin-top:4px;}
        .qg-specs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
        .qg-sp{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:7px 14px;font-size:12px;color:#a89e93;}.qg-sp b{color:#d4a843;font-weight:700;}
        .qg-lay{display:flex;flex-direction:column;gap:12px;}
        .qg-tray{width:100%;position:relative;z-index:5;}
        /* SECTIONS */
        .qg-sec{background:#242220;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;}
        .qg-sec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#b4822e,transparent);border-radius:0 2px 2px 0;}
        .qg-st{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#8c8379;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .qg-st .ct{color:#d4a843;font-size:11px;}
        .qg-uchip{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#1c1917;border:1px solid rgba(255,255,255,.04);border-radius:7px;margin-bottom:4px;font-size:10px;}
        .qg-uchip .ic{font-size:14px;}.qg-uchip .nm{font-weight:600;flex:1;}
        .qg-abtn{padding:2px 7px;background:#b4822e;color:#1c1917;border:none;border-radius:4px;font-size:8px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
        .qg-dd{position:fixed;z-index:10001;background:#242220;border:1px solid rgba(180,130,50,.2);border-radius:7px;padding:3px;box-shadow:0 6px 20px rgba(0,0,0,.4);min-width:130px;}
        .qg-dd-opt{padding:5px 8px;font-size:10px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:5px;color:#e7e0d5;transition:background .1s;}
        .qg-dd-opt:hover{background:rgba(180,130,50,.1);}
        .qg-dd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
        /* WALL HEADERS */
        .qg-whdr{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;font-weight:600;color:#c4bab0;}
        .qg-wdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .qg-wcnt{margin-left:auto;font-size:10px;color:#6b6460;font-weight:500;}
        /* DOOR/PLACEMENT */
        .qg-pd{display:flex;align-items:center;gap:5px;padding:5px 7px;background:#1c1917;border:1px solid rgba(255,255,255,.04);border-radius:6px;margin-bottom:3px;font-size:9px;}
        .qg-pd .pi{font-size:12px;}.qg-pd .pinfo{flex:1;}.qg-pd .pn{font-weight:600;font-size:9px;}.qg-pd .poff{display:flex;align-items:center;gap:2px;margin-top:2px;}
        .qg-pd .poff label{font-size:7px;color:#6b6460;white-space:nowrap;}
        .qg-pd input.oft{width:30px;padding:1px 3px;background:#242220;border:1px solid rgba(255,255,255,.06);border-radius:3px;color:#d4a843;font-family:'Inter',sans-serif;font-size:9px;text-align:center;outline:none;}
        .qg-pd input.oft:focus{border-color:rgba(180,130,50,.3);}
        .qg-pd .pend{font-size:7px;color:#6b6460;}
        .qg-pd .pdel{color:#7f4e4e;cursor:pointer;font-size:10px;padding:1px 3px;opacity:.4;}.qg-pd .pdel:hover{opacity:1;}
        .qg-conflict{background:rgba(200,80,60,.08);border:1px solid rgba(200,80,60,.2);border-radius:6px;padding:6px 10px;font-size:10px;color:#c05040;margin-bottom:6px;display:none;align-items:center;gap:4px;}.qg-conflict.on{display:flex;}
        /* FOOTPRINT */
        .qg-fpa{width:100%;position:relative;z-index:1;overflow:hidden;padding:10px;}
        .qg-fpl{font-size:9px;font-weight:600;color:#6b6460;text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:1.5px;}
        .qg-fp{position:relative;background:#1c1917;border:2px solid rgba(255,255,255,.05);border-radius:12px;margin:0 auto;}
        .qg-fw{position:absolute;transition:all .15s;}.qg-fw.hz{left:6%;right:6%;height:5px;border-radius:2px;}.qg-fw.vt{top:6%;bottom:6%;width:5px;border-radius:2px;}
        .qg-fw.ft{top:0;transform:translateY(-50%);}.qg-fw.bk{bottom:0;transform:translateY(50%);}.qg-fw.lt{left:0;transform:translateX(-50%);}.qg-fw.rt{right:0;transform:translateX(50%);}
        .qg-fw{background:rgba(140,131,121,.2);}.qg-fw.act{background:#b4822e;box-shadow:0 0 6px rgba(180,130,50,.3);}
        .qg-fwl{position:absolute;font-size:8px;font-weight:500;color:#6b6460;white-space:nowrap;}
        .qg-fwl.tp{top:-14px;left:50%;transform:translateX(-50%);}.qg-fwl.bt{bottom:-14px;left:50%;transform:translateX(-50%);}
        .qg-fwl.lf{left:-7px;top:50%;transform:translateY(-50%) rotate(-90deg);}.qg-fwl.rf{right:-7px;top:50%;transform:translateY(-50%) rotate(90deg);}
        .qg-post{position:absolute;width:5px;height:5px;border-radius:1px;background:#b4822e;opacity:.5;transform:translate(-50%,-50%);z-index:1;}
        .qg-fpd{position:absolute;height:8px;background:#d4a843;border-radius:2px;z-index:3;transition:all .2s;}.qg-fpd.barn{background:#6a8a9a;}
        .qg-fpd.vt{width:8px;height:auto;}
        .qg-fpdl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:6px;color:#d4a843;white-space:nowrap;}
        .qg-shed{position:absolute;background:rgba(90,138,106,.06);border:1.5px dashed rgba(90,138,106,.25);border-radius:3px;z-index:0;pointer-events:none;}
        .qg-shed-l{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:7px;color:#5a8a6a;text-align:center;pointer-events:none;}
        .qg-dim{position:absolute;font-size:11px;font-weight:700;color:#d4a843;}
        .qg-dim.dw{bottom:-24px;left:50%;transform:translateX(-50%);}.qg-dim.dl{right:-32px;top:50%;transform:translateY(-50%) rotate(90deg);}
        .qg-fint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
        .qg-fint strong{display:block;font-size:13px;color:#6b6460;font-family:'Outfit',sans-serif;font-weight:700;}.qg-fint span{font-size:9px;color:#5a534d;}
        /* BUILD BUTTONS */
        .qg-bsec{text-align:center;margin-top:24px;padding:20px 0;}
        .qg-bbtn{padding:16px 48px;background:linear-gradient(135deg,#b4822e 0%,#d4a843 100%);color:#1c1917;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(180,130,50,.3),inset 0 1px 0 rgba(255,255,255,.2);letter-spacing:0.3px;}
        .qg-bbtn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(180,130,50,.4),inset 0 1px 0 rgba(255,255,255,.2);}
        .qg-bbtn:active{transform:translateY(0);}
        .qg-bhint{font-size:11px;color:#5a534d;margin-top:8px;}
        /* REPLAY / 3D VIEW */
        .qg-rep{display:none;}.qg-rep.on{display:block;}
        .qg-rx{position:fixed;top:12px;right:12px;width:38px;height:38px;border-radius:8px;background:#242220;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;z-index:10002;color:#8c8379;transition:all .15s;}.qg-rx:hover{border-color:rgba(180,130,50,.3);color:#d4a843;}
        .qg-rv{width:100%;max-width:900px;margin:0 auto;height:460px;background:#1c1917;position:relative;border-radius:0 0 14px 14px;overflow:hidden;}
        .qg-rv canvas{display:block;width:100%!important;height:100%!important;}
        .qg-rvb{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;background:rgba(28,25,23,.7);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:5px 10px;backdrop-filter:blur(8px);}
        .qg-rvd{width:5px;height:5px;border-radius:50%;background:#b4822e;animation:qgp 2s infinite;}
        @keyframes qgp{0%,100%{opacity:1}50%{opacity:.4}}
        .qg-rvt{font-size:9px;font-weight:500;color:#6b6460;text-transform:uppercase;letter-spacing:1px;}
        .qg-rvh{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9px;color:#5a534d;font-weight:500;background:rgba(28,25,23,.7);padding:4px 10px;border-radius:5px;backdrop-filter:blur(8px);}
        .qg-rh{text-align:center;padding:24px 16px 16px;background:radial-gradient(ellipse at 50% 0%,rgba(180,130,50,.04) 0%,transparent 60%);}
        .qg-rh h2{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;color:#f5f0e8;margin-bottom:4px;}.qg-rh h2 span{color:#d4a843;}
        .qg-rh .rs{font-size:12px;color:#8c8379;}.qg-rh .rd{font-size:10px;color:#5a534d;margin-top:4px;font-weight:500;}
        /* LINE ITEMS */
        .qg-rlw{max-width:780px;margin:10px auto;padding:0 14px;}
        .qg-rl{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#242220;border:1px solid rgba(255,255,255,.03);border-radius:10px;margin-bottom:5px;opacity:0;transform:translateX(-14px);}
        .qg-rl.on{opacity:1;transform:translateX(0);transition:all .4s cubic-bezier(.22,.61,.36,1);}

    function buildShedConfigUI() {

            <div style="flex:1;min-width:280px;background:#1c1917;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:10px;">

                        <input id="shedW${i}" type="number" value="${sc.w}" style="${inputStyle}width:100%;" onchange="window._shedCfgChange(${i})">
                    </div>
                    <div style="flex:1;min-width:70px;">
                        <div style="${lblStyle}">Primary Leg</div>

                        <div style="${lblStyle}">Wrap Leg</div>
                        <input id="shedWrapLen${i}" type="number" value="${sc.wrapLeg || 0}" style="${inputStyle}width:100%;" onchange="window._shedCfgChange(${i})">
                    </div>
                </div>
                <div id="shedTotal${i}" style="font-size:8px;color:#6b6460;font-family:'Outfit',monospace;margin-bottom:6px;display:${sc.type === 'wrap' ? 'block' : 'none'};">
                    Model total: <span style="color:#d4a843;">${sc.l + (sc.wrapLeg || 0)}'</span> of ${sc.origL}' from sheet
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:90px;">
                        <div style="${lblStyle}">Attach Wall</div>

                            <option value="right" ${sc.wall==='right'?'selected':''}>Right Eave</option>
                            <option value="front" ${sc.wall==='front'?'selected':''}>Front Gable</option>
                            <option value="back" ${sc.wall==='back'?'selected':''}>Back Gable</option>
                        </select>
                    </div>
                    <div style="flex:1;min-width:90px;">
                        <div style="${lblStyle}">Roof Type</div>
                        <select id="shedType${i}" onchange="window._shedCfgChange(${i})" style="${selStyle}">
                            <option value="leanto" ${sc.type==='leanto'?'selected':''}>Lean-to</option>
                            <option value="wrap" ${sc.type==='wrap'?'selected':''}>Wrap-around (Hip)</option>
                            <option value="gable" ${sc.type==='gable'?'selected':''}>Gable Extension</option>
                        </select>
                    </div>
                    <div id="shedWrapLbl${i}" style="flex:1;min-width:90px;display:${sc.type==='wrap'?'block':'none'};">

                            <option value="ccw">Back Gable</option>

    function updateWrapOptions() {
        shedConfigs.forEach((sc, i) => {
            const wrapSel = document.getElementById('shedWrap' + i);

            const w = sc.wall;
            let opts = '';
            if (w === 'left' || w === 'right') {
                opts = '<option value="cw">Front Gable</option><option value="ccw">Back Gable</option>';
            } else {
                opts = '<option value="cw">Left Eave</option><option value="ccw">Right Eave</option>';
            }
            wrapSel.innerHTML = opts;
        });

        shedConfigs[i].wall = document.getElementById('shedWall' + i).value;

        if (wrapLenEl) shedConfigs[i].wrapLeg = parseFloat(wrapLenEl.value) || 0;

        // Show/hide wrap fields
        const isWrap = shedConfigs[i].type === 'wrap';
        const wrapLbl = document.getElementById('shedWrapLbl' + i);
        if (wrapLbl) wrapLbl.style.display = isWrap ? 'block' : 'none';
        const wrapLenLbl = document.getElementById('shedWrapLenLbl' + i);
        if (wrapLenLbl) wrapLenLbl.style.display = isWrap ? 'block' : 'none';
        const totalEl = document.getElementById('shedTotal' + i);
        if (totalEl) {
            totalEl.style.display = isWrap ? 'block' : 'none';
            const modelTotal = shedConfigs[i].l + shedConfigs[i].wrapLeg;
            const orig = shedConfigs[i].origL;
            const match = Math.abs(modelTotal - orig) < 1;
            totalEl.innerHTML = 'Model total: <span style="color:' + (match ? '#5a9a6a' : '#d4a843') + ';">' + modelTotal + "'</span> of " + orig + "' from sheet" + (match ? ' ✓' : '');
        }

        updateWrapOptions();

    // === ADD DOOR LOGIC ===

        const el = document.getElementById('qgDoorList');

    window._doorField = function(id, field, val) {
        const d = allDoors.find(x => x.id === id);
        if (!d) return;
        if (field === 'type') {
            d.type = val;
            d.icon = val === 'barn' ? '🚜' : '🚪';
        } else if (field === 'size') {
            const sz = doorSizes[val];
            if (sz) { d.w = sz.w; d.h = sz.h; d.sizeKey = val; d.size = sz.w + "'x" + sz.h + "'"; d.label = (d.type === 'garage' ? 'Garage ' : 'Barn ') + d.size; }
        } else if (field === 'wall') {
            d.wall = val;
            // Re-center on new wall if no custom offset
            const wallLen = WALLS.find(w => w.id === val)?.len || 40;
            d.offset = Math.round((wallLen - d.w) / 2 * 10) / 10;
        } else if (field === 'offset') {
            d.offset = val ? parseOff(val) : null;
        }
        renderDoorList();
        renderWalls();
        renderFPPosts();
        renderFPDoors();
    };
    window._removeDoor = function(id) { removeDoor(id); };

        buildShedConfigUI();
        renderFPPosts();
        if (typeof renderConcreteShed === 'function') renderConcreteShed();

    renderDoorList();

    // === WALK DOORS ===
    const walkDoors = [];

                <span onclick="walkDoors.splice(${i},1);renderWalkDoors();" style="color:#ef4444;cursor:pointer;font-size:14px;opacity:.5;padding:2px 4px;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.5">✕</span>

    // === GATHER ALL FEATURES FOR SPEC SUMMARY ===
    function gatherFeatures() {
        const feats = [];
        // Walk doors
        walkDoors.forEach(wd => { if (wd.qty > 0) feats.push({ icon: '🚪', name: 'Walk Door — ' + wd.type, desc: '×' + wd.qty }); });
        // Windows
        windows.forEach(wi => { if (wi.qty > 0) feats.push({ icon: '🪟', name: 'Window — ' + wi.type, desc: '×' + wi.qty }); });
        // Insulation
        const insType = document.getElementById('qgInsType').value;
        if (insType) {
            const iR = document.getElementById('qgInsRoof').checked, iW = document.getElementById('qgInsWalls').checked;
            feats.push({ icon: '🧊', name: 'Insulation — ' + insType, desc: (iR ? 'Roof ' : '') + (iW ? 'Walls' : '') || 'TBD' });
        }
        // Concrete
        const concMain = document.getElementById('qgConcreteMain').value;
        if (concMain) feats.push({ icon: '🏗️', name: 'Concrete — ' + concMain, desc: 'Main building' });
        shedConfigs.forEach((sc, i) => {
            const sel = document.getElementById('qgConcShed' + i);
            if (sel && sel.value) feats.push({ icon: '🏗️', name: 'Concrete — ' + sel.value, desc: sc.label });
        });
        // Checkboxes
        if (document.getElementById('qgWainscot').checked) feats.push({ icon: '🎨', name: "4' Wainscot", desc: 'Two-tone exterior' });
        if (document.getElementById('qgGutters').checked) feats.push({ icon: '🌧️', name: 'Gutters & Downspouts', desc: 'Full perimeter' });
        if (document.getElementById('qgRockWainscot').checked) feats.push({ icon: '🧱', name: 'Rock Wainscot', desc: 'Exterior base' });
        if (document.getElementById('qgPostProtectors').checked) feats.push({ icon: '🛡️', name: 'Post Protectors', desc: 'All posts' });
        if (document.getElementById('qgFinCeiling').checked) feats.push({ icon: '🏠', name: 'Finished Ceiling', desc: 'Interior' });
        if (document.getElementById('qgPostsOnTop').checked) feats.push({ icon: '📐', name: 'Posts On Top', desc: 'Concrete pier mounting' });
        if (document.getElementById('qgPostWraps').checked) feats.push({ icon: '🔲', name: 'Post Wraps', desc: 'All posts' });
        if (document.getElementById('qgLVL').checked) feats.push({ icon: '🪵', name: 'LVL Headers', desc: 'Engineered lumber' });
        // Cupola
        const cupSz = document.getElementById('qgCupolaSize').value;
        const cupQty = parseInt(document.getElementById('qgCupolaQty').value) || 0;
        if (cupSz && cupQty > 0) feats.push({ icon: '🏛️', name: 'Cupola — ' + cupSz + '"', desc: '×' + cupQty });
        // Roof color
        feats.push({ icon: '🎨', name: 'Roof Color', desc: document.getElementById('qgRoofColor').value });
        // Side sheds
        shedConfigs.forEach(sc => {
            const typeLabel = sc.type === 'leanto' ? 'Lean-to' : sc.type === 'wrap' ? 'Wrap-around' : 'Gable Extension';
            const enclLabel = sc.encl === 'roofonly' ? 'Roof Only' : sc.encl === 'enclosed' ? 'Fully Enclosed' : 'Partial';
            feats.push({ icon: '🏘️', name: sc.w + "'×" + sc.l + "' " + typeLabel, desc: wallLabel(sc.wall) + ' · ' + enclLabel });
        });
        // Wall states
        WALLS.forEach(w => {
            if (w.encl !== 'enclosed') feats.push({ icon: w.encl === 'open' ? '🌬️' : '½', name: w.label + ' — ' + (w.encl === 'open' ? 'Open' : 'Partial'), desc: w.postSpacing + "' post spacing" });
        });
        return feats;
    }

    // Footprint sizing
    const fp = document.getElementById('qgFP');
    const fpa = document.querySelector('.qg-fpa');
    // Scale down to leave room for side shed extensions
    const hasShed = shedConfigs.length > 0;
    const maxFW = Math.min(fpa.clientWidth - (hasShed ? 120 : 60), 500);
    const ratio = Q.l / Q.w;
    fp.style.width = maxFW + 'px';
    fp.style.height = Math.min(maxFW * ratio, 400) + 'px';
    fp.style.margin = '20px auto';

    document.getElementById('qgDW').textContent = Q.w + "'";
    document.getElementById('qgDL').textContent = Q.l + "'";
    document.getElementById('qgSqft').textContent = (Q.w * Q.l).toLocaleString() + ' sqft';
    document.getElementById('qgHts').innerHTML = `SW: ${Q.h}' · Peak: ${Math.round(peakH * 10) / 10}'`;

    // Posts + sheds on footprint
    function renderFPPosts() {
        document.querySelectorAll('.qg-post').forEach(p => p.remove());
        const fpi = document.getElementById('qgFPI');
        // Track corner positions to avoid duplicates
        const placed = new Set();
        function addPost(xPct, yPct, color, opacity) {
            const key = Math.round(xPct * 10) + ',' + Math.round(yPct * 10);
            if (placed.has(key)) return;
            placed.add(key);
            const d = document.createElement('div'); d.className = 'qg-post';
            d.style.left = xPct + '%'; d.style.top = yPct + '%';
            if (color) d.style.background = color;
            if (opacity) d.style.opacity = opacity;
            fpi.appendChild(d);
        }
        // Eave wall posts (left/right) — includes corners
        ['left', 'right'].forEach(wallId => {
            const wCfg = WALLS.find(w => w.id === wallId);
            const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
            const numBays = Math.floor(Q.l / wPS);
            const xPct = wallId === 'left' ? 3 : 97;
            for (let i = 0; i <= numBays; i++) {
                const pct = 6 + (i / numBays) * 88;
                addPost(xPct, pct);
            }
        });
        // Gable posts (front/back) — skip corners (already placed by eave walls)
        ['front', 'back'].forEach(wallId => {
            const wCfg = WALLS.find(w => w.id === wallId);
            const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
            const numBays = Math.floor(Q.w / wPS);
            const wd = allDoors.filter(d => d.wall === wallId);
            const yPct = wallId === 'front' ? 6 : 94;
            for (let i = 0; i <= numBays; i++) {
                const xFt = i * (Q.w / numBays);
                let blocked = false;
                wd.forEach(d => { const dL = d.offset || 0; if (xFt > dL - 0.5 && xFt < dL + d.w + 0.5) blocked = true; });
                if (!blocked) {
                    const xPct = 6 + (xFt / Q.w) * 88;
                    addPost(xPct, yPct, '#92400e', '.6');
                }
            }
        });
    }

    function renderFPSheds() {
        document.querySelectorAll('.qg-shed').forEach(s => s.remove());
        shedConfigs.forEach(sc => {
            const el = document.createElement('div'); el.className = 'qg-shed';
            const w = sc.wall;
            const sW = sc.w, sL = sc.l;

            if (sc.type === 'leanto' || sc.type === 'gable') {
                // Simple rectangle on the chosen wall
                if (w === 'left') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100, lS = ((Q.l - sL) / 2 / Q.l) * 100;
                    el.style.cssText = 'left:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                } else if (w === 'right') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100, lS = ((Q.l - sL) / 2 / Q.l) * 100;
                    el.style.cssText = 'right:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                } else if (w === 'front') {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100, lS = ((Q.w - sL) / 2 / Q.w) * 100;
                    el.style.cssText = 'top:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                } else {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100, lS = ((Q.w - sL) / 2 / Q.w) * 100;
                    el.style.cssText = 'bottom:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                }
                if (sc.type === 'gable') el.style.borderColor = 'rgba(34,197,94,.3)';
                el.innerHTML = '<div class="qg-shed-l">' + sW + 'x' + sL + (sc.type === 'gable' ? '<br>Gable' : '') + '</div>';
                document.getElementById('qgFPI').appendChild(el);
            } else if (sc.type === 'wrap') {
                // Wrap-around: L-shape on footprint
                const el2 = document.createElement('div'); el2.className = 'qg-shed';
                el2.style.borderColor = 'rgba(168,85,247,.3)'; el2.style.background = 'rgba(168,85,247,.04)';
                el.style.borderColor = 'rgba(168,85,247,.3)'; el.style.background = 'rgba(168,85,247,.04)';
                const wrapDir = sc.wrapDir;
                const wL = sc.wrapLeg || 0;
                if (w === 'left' || w === 'right') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100;
                    const lS = ((Q.l - sL) / 2 / Q.l) * 100;
                    if (w === 'left') el.style.cssText = 'left:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                    else el.style.cssText = 'right:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                    // Wrap leg along gable
                    const wrapWP = (sW / Q.l) * 100;
                    const wrapLP = (wL / Q.w) * 100 * .88;
                    const wrapLS = ((Q.w - wL) / 2 / Q.w) * 100;
                    if (wrapDir === 'cw') el2.style.cssText = 'top:' + (-wrapWP - 2) + '%;height:' + wrapWP + '%;left:' + (6 + wrapLS * .88) + '%;width:' + wrapLP + '%';
                    else el2.style.cssText = 'bottom:' + (-wrapWP - 2) + '%;height:' + wrapWP + '%;left:' + (6 + wrapLS * .88) + '%;width:' + wrapLP + '%';
                } else {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100;
                    const lS = ((Q.w - sL) / 2 / Q.w) * 100;
                    if (w === 'front') el.style.cssText = 'top:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                    else el.style.cssText = 'bottom:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                    const wrapWP = (sW / Q.w) * 100;

                    const wrapLS = ((Q.l - wL) / 2 / Q.l) * 100;
                    if (wrapDir === 'cw') el2.style.cssText = 'left:' + (-wrapWP - 2) + '%;width:' + wrapWP + '%;top:' + (6 + wrapLS * .88) + '%;height:' + wrapLP + '%';
                    else el2.style.cssText = 'right:' + (-wrapWP - 2) + '%;width:' + wrapWP + '%;top:' + (6 + wrapLS * .88) + '%;height:' + wrapLP + '%';
                }

                document.getElementById('qgFPI').appendChild(el);

            }
        });

        WALLS.forEach(w => {

    function build3DReplay(placed, shedCfgs, wallCfgs) {
        const c = document.getElementById('qgRV');
        const old = c.querySelector('canvas'); if (old) old.remove();
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x141820); scene.fog = new THREE.Fog(0x141820, 40, 90);
        const cam = new THREE.PerspectiveCamera(38, c.clientWidth / c.clientHeight, 0.1, 200);
        rrx = new THREE.WebGLRenderer({ antialias: true }); rrx.setSize(c.clientWidth, c.clientHeight); rrx.setPixelRatio(Math.min(window.devicePixelRatio, 2)); rrx.shadowMap.enabled = true;
        c.appendChild(rrx.domElement);

        scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
        const sun = new THREE.DirectionalLight(0xffeedd, 1.1); sun.position.set(10, 18, 8); sun.castShadow = true; scene.add(sun);

        const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x151a22, roughness: 1 }));
        gnd.rotation.x = -Math.PI / 2; gnd.position.y = -0.01; gnd.receiveShadow = true; scene.add(gnd);
        scene.add(new THREE.GridHelper(60, 60, 0x1c2230, 0x181d28));

        const Sc = 0.1, sw = Q.w * Sc, sl = Q.l * Sc, sh = Q.h * Sc;
        const sr = (Q.h + (Q.w / 2) * (Q.pitch / 12)) * Sc, oh = (Q.oh / 12) * Sc;

        const mW = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: .5, metalness: .5, side: THREE.DoubleSide });
        const mR = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: .35, metalness: .6, side: THREE.DoubleSide });
        const mP = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: .7 });
        const mS = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: .8, side: THREE.DoubleSide });
        const mD = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: .4, metalness: .3 });
        const mBD = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: .6 });
        const mSh = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: .5, metalness: .4, side: THREE.DoubleSide });
        const mE = new THREE.LineBasicMaterial({ color: 0xb4822e, transparent: true, opacity: .5 });
        const mDF = new THREE.LineBasicMaterial({ color: 0xd4a843, transparent: true, opacity: .8 });
        const mC = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: .9 });

        function mkQ(v, m) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3)); g.setIndex([0, 1, 2, 0, 2, 3]); g.computeVertexNormals(); const ms = new THREE.Mesh(g, m); ms.castShadow = true; return ms; }
        function mkL(pts, m) { return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), m); }

        const grps = { slab: new THREE.Group(), posts: new THREE.Group(), walls: new THREE.Group(), roof: new THREE.Group(), doors: new THREE.Group(), dims: new THREE.Group(), shed: new THREE.Group() };
        const dimLabels = [];
        Object.values(grps).forEach(g => { g.visible = false; scene.add(g); });

        // Slab
        grps.slab.add(new THREE.Mesh(new THREE.BoxGeometry(sw + .04, .04, sl + .04), mC));
        grps.slab.children[0].position.y = .02; grps.slab.children[0].receiveShadow = true;

        // Shed slabs from config
        (shedCfgs || []).forEach(sc => {
            const ssw = sc.w * Sc, ssl = sc.l * Sc;
            const m = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, ssl + .02), mC);
            // Position based on wall
            if (sc.wall === 'left') m.position.set(-sw / 2 - ssw / 2, .02, 0);
            else if (sc.wall === 'right') m.position.set(sw / 2 + ssw / 2, .02, 0);
            else if (sc.wall === 'front') { m.geometry = new THREE.BoxGeometry(ssl + .02, .04, ssw + .02); m.position.set(0, .02, -sl / 2 - ssw / 2); }
            else { m.geometry = new THREE.BoxGeometry(ssl + .02, .04, ssw + .02); m.position.set(0, .02, sl / 2 + ssw / 2); }
            if (sc.type === 'wrap') {
                // Add second leg slab
                const m2 = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, ssw + .02), mC);
                // Corner position depends on wrap direction
                const isEave = (sc.wall === 'left' || sc.wall === 'right');
                if (isEave) {
                    const gZ = sc.wrapDir === 'cw' ? -sl / 2 - ssw / 2 : sl / 2 + ssw / 2;
                    const eX = sc.wall === 'left' ? -sw / 2 - ssw / 2 : sw / 2 + ssw / 2;
                    m2.geometry = new THREE.BoxGeometry(sw + ssw + .02, .04, ssw + .02);
                    m2.position.set((sc.wall === 'left' ? -ssw / 2 : ssw / 2) / 2, .02, gZ);
                } else {
                    const eX = sc.wrapDir === 'cw' ? -sw / 2 - ssw / 2 : sw / 2 + ssw / 2;
                    m2.geometry = new THREE.BoxGeometry(ssw + .02, .04, sl + ssw + .02);
                    m2.position.set(eX, .02, (sc.wall === 'front' ? -ssw / 2 : ssw / 2) / 2);
                }
                m2.receiveShadow = true; grps.slab.add(m2);
            }
            m.receiveShadow = true; grps.slab.add(m);
        });

        // === FRAMING — Post Frame vs Stud Frame ===
        const ps = .05; // post size
        const postPositions = new Set();
        const isStudFrame = currentFrameType === 'stud';

        if (isStudFrame) {
            // STUD FRAME: 2×6 studs at 16" OC (1.333 ft)
            const studSpacing = 16 / 12; // 16 inches in feet
            const studW = 0.012; // 2×6 visual width at scale (~1.5" actual)
            const studD = 0.018; // depth (~5.5" actual)
            const mStud = new THREE.MeshStandardMaterial({ color: 0xc8a060, roughness: .65 }); // lighter wood tone for studs
            const mPlate = new THREE.MeshStandardMaterial({ color: 0xa08040, roughness: .7 }); // slightly darker for plates

            // Bottom & top plates for each wall (continuous horizontal members)
            ['left', 'right'].forEach(wallId => {
                const xSide = wallId === 'left' ? -sw / 2 : sw / 2;
                // Bottom plate
                const bp = new THREE.Mesh(new THREE.BoxGeometry(studD, studW, sl), mPlate);
                bp.position.set(xSide, studW / 2, 0); bp.castShadow = true; grps.posts.add(bp);
                // Top plate (double)
                const tp = new THREE.Mesh(new THREE.BoxGeometry(studD, studW * 2, sl), mPlate);
                tp.position.set(xSide, sh - studW, 0); tp.castShadow = true; grps.posts.add(tp);
                // Studs along eave walls
                const numStuds = Math.floor(Q.l / studSpacing);
                for (let i = 0; i <= numStuds; i++) {
                    const z = -sl / 2 + (sl * i / numStuds);
                    const stud = new THREE.Mesh(new THREE.BoxGeometry(studD, sh - studW * 3, studW), mStud);
                    stud.position.set(xSide, sh / 2, z); stud.castShadow = true; grps.posts.add(stud);
                }
            });

            // Gable wall studs (height varies with pitch)
            ['front', 'back'].forEach(wallId => {
                const zPos = wallId === 'front' ? -sl / 2 : sl / 2;
                const wd = placed.filter(d => d.wall === wallId);
                // Bottom plate
                const bp = new THREE.Mesh(new THREE.BoxGeometry(sw, studW, studD), mPlate);
                bp.position.set(0, studW / 2, zPos); bp.castShadow = true; grps.posts.add(bp);
                // Top plate follows pitch — skip for simplicity, studs go to rafters
                const numStuds = Math.floor(Q.w / studSpacing);
                for (let i = 0; i <= numStuds; i++) {
                    const xFt = i * (Q.w / numStuds);
                    const xPos = (-Q.w / 2 + xFt) * Sc;
                    // Check door blocking
                    let blocked = false;
                    wd.forEach(d => { if (xFt > (d.offset || 0) - 0.3 && xFt < (d.offset || 0) + d.w + 0.3) blocked = true; });
                    if (blocked) continue;
                    const distC = Math.abs(xFt - Q.w / 2);
                    const studH = (Q.h + (Q.w / 2 - distC) * (Q.pitch / 12)) * Sc;
                    const stud = new THREE.Mesh(new THREE.BoxGeometry(studW, studH - studW, studD), mStud);
                    stud.position.set(xPos, (studH - studW) / 2 + studW, zPos); stud.castShadow = true; grps.posts.add(stud);
                }
            });

            // Corner posts (king studs — slightly beefier at corners)
            const cornerPS = .04;
            [[-sw/2, -sl/2], [-sw/2, sl/2], [sw/2, -sl/2], [sw/2, sl/2]].forEach(([x, z]) => {
                const cp = new THREE.Mesh(new THREE.BoxGeometry(cornerPS, sh, cornerPS), mP);
                cp.position.set(x, sh / 2, z); cp.castShadow = true; grps.posts.add(cp);
            });

        } else {
            // POST FRAME: Standard posts at configurable spacing
            ['left', 'right'].forEach(wallId => {
                const wCfg = wallCfgs.find(w => w.id === wallId);
                const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
                const numBays = Math.floor(Q.l / wPS);
                const xSide = wallId === 'left' ? -sw / 2 : sw / 2;
                for (let i = 0; i <= numBays; i++) {
                    const z = -sl / 2 + (sl * i / numBays);
                    const key = Math.round(xSide * 1000) + ',' + Math.round(z * 1000);
                    if (!postPositions.has(key)) {
                        postPositions.add(key);
                        const p = new THREE.Mesh(new THREE.BoxGeometry(ps, sh, ps), mP);
                        p.position.set(xSide, sh / 2, z); p.castShadow = true; grps.posts.add(p);
                    }
                }
            });

            ['front', 'back'].forEach(wallId => {
                const wCfg = wallCfgs.find(w => w.id === wallId);
                const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
                const zPos = wallId === 'front' ? -sl / 2 : sl / 2;
                const wd = placed.filter(d => d.wall === wallId);
                const numBays = Math.floor(Q.w / wPS);
                for (let i = 0; i <= numBays; i++) {
                    const xFt = i * (Q.w / numBays);
                    const xPos = (-Q.w / 2 + xFt) * Sc;
                    const key = Math.round(xPos * 1000) + ',' + Math.round(zPos * 1000);
                    if (postPositions.has(key)) continue;
                    let blocked = false;
                    wd.forEach(d => { if (xFt > (d.offset || 0) - 0.5 && xFt < (d.offset || 0) + d.w + 0.5) blocked = true; });
                    if (!blocked) {
                        postPositions.add(key);
                        const distC = Math.abs(xFt - Q.w / 2);
                        const pH = (Q.h + (Q.w / 2 - distC) * (Q.pitch / 12)) * Sc;
                        const p = new THREE.Mesh(new THREE.BoxGeometry(ps, pH, ps), mP);
                        p.position.set(xPos, pH / 2, zPos); p.castShadow = true; grps.posts.add(p);
                    }
                }
            });
        }

        // Shed posts from config
        (shedCfgs || []).forEach(sc => {
            const ssw = sc.w * Sc, ssl = sc.l * Sc;
            const shedSh = (Q.h - 3) * Sc;
            const numSP = Math.round(sc.l / Q.postSpacing);
            if (sc.wall === 'left' || sc.wall === 'right') {
                const outerX = sc.wall === 'left' ? -sw / 2 - ssw : sw / 2 + ssw;
                for (let i = 0; i <= numSP; i++) { const z = -ssl / 2 + (ssl * i / numSP); const p = new THREE.Mesh(new THREE.BoxGeometry(ps, shedSh, ps), mP); p.position.set(outerX, shedSh / 2, z); p.castShadow = true; grps.posts.add(p); }

                    grps.shed.add(mkQ([aX, sh, halfLen, midX, ridgeH, halfLen, midX, ridgeH, -halfLen, aX, sh, -halfLen], mSh));
                    // Ridge line
                    grps.shed.add(mkL([new THREE.Vector3(midX, ridgeH, -halfLen), new THREE.Vector3(midX, ridgeH, halfLen)], mE));
                    // Eave edges
                    grps.shed.add(mkL([new THREE.Vector3(oX, sSh, -halfLen), new THREE.Vector3(oX, sSh, halfLen)], mE));
                    // Gable end triangles (front and back)
                    for (var s = -1; s <= 1; s += 2) {
                        var gz = s * halfLen;
                        var tg = new THREE.BufferGeometry();
                        tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([oX, sSh, gz, aX, sh, gz, midX, ridgeH, gz]), 3));
                        tg.setIndex([0, 1, 2]); tg.computeVertexNormals(); grps.shed.add(new THREE.Mesh(tg, mW));
                    }
                } else {
                    // Gable off front/back — extends the main ridge outward
                    // Ridge continues along Z axis (same direction as main ridge)
                    // Roof slopes down left/right matching the building's width span
                    var oZ = sc.wall === 'front' ? -sl / 2 - ssw : sl / 2 + ssw;
                    var aZ = sc.wall === 'front' ? -sl / 2 : sl / 2;
                    // Ridge at same height as main ridge, spanning from attach wall to outer edge
                    // Extension width = ssl (the "length" from calculator, used as how wide it spans)
                    // Use min of ssl and sw so it doesn't exceed building width
                    var halfSpan = Math.min(ssl, sw) / 2;
                    // Ridge runs from aZ to oZ at main ridge height (sr)
                    // Eave height at the sides = sh (same as main building sidewall)
                    // Left roof plane
                    grps.shed.add(mkQ([-halfSpan, sh, oZ, 0, sr, oZ, 0, sr, aZ, -halfSpan, sh, aZ], mSh));
                    // Right roof plane  
                    grps.shed.add(mkQ([halfSpan, sh, aZ, 0, sr, aZ, 0, sr, oZ, halfSpan, sh, oZ], mSh));
                    // Ridge line
                    grps.shed.add(mkL([new THREE.Vector3(0, sr, aZ), new THREE.Vector3(0, sr, oZ)], mE));
                    // Eave lines
                    grps.shed.add(mkL([new THREE.Vector3(-halfSpan, sh, aZ), new THREE.Vector3(-halfSpan, sh, oZ)], mE));
                    grps.shed.add(mkL([new THREE.Vector3(halfSpan, sh, aZ), new THREE.Vector3(halfSpan, sh, oZ)], mE));
                    // Outer gable triangle
                    var tg = new THREE.BufferGeometry();
                    tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-halfSpan, sh, oZ, halfSpan, sh, oZ, 0, sr, oZ]), 3));
                    tg.setIndex([0, 1, 2]); tg.computeVertexNormals(); grps.shed.add(new THREE.Mesh(tg, mW));
                }
            }
        });

        // Animate phases
        const phases = [grps.slab, grps.posts, grps.walls, grps.roof, grps.dims, grps.doors];
        if (shedCfgs && shedCfgs.length > 0) phases.push(grps.shed);
        let phase = 0;
        function bNext() {
            if (phase >= phases.length) return;
            setTimeout(() => { const g = phases[phase]; g.visible = true; g.scale.set(.01, .01, .01); const t0 = performance.now(); (function grow() { const p = Math.min((performance.now() - t0) / 600, 1); const e = 1 - Math.pow(1 - p, 3); g.scale.set(e, e, e); if (p < 1) requestAnimationFrame(grow); })(); phase++; bNext(); }, phase === 0 ? 400 : 500);
        }
        bNext();

        // Camera orbit
        let th = Math.PI * .22, ph = Math.PI * .14, di = 15, dr = false, pm = { x: 0, y: 0 };
        function setC() { cam.position.set(di * Math.sin(th) * Math.cos(ph), di * Math.sin(ph) + 2, di * Math.cos(th) * Math.cos(ph)); cam.lookAt(0, sh * .4, 0); }
        setC();
        rrx.domElement.addEventListener('pointerdown', e => { dr = true; pm = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointermove', e => { if (!dr) return; th -= (e.clientX - pm.x) * .005; ph = Math.max(.05, Math.min(Math.PI * .45, ph + (e.clientY - pm.y) * .005)); pm = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointerup', () => { dr = false; });
        rrx.domElement.addEventListener('wheel', e => { e.preventDefault(); di = Math.max(5, Math.min(25, di + e.deltaY * .012)); }, { passive: false });
        (function anim() { if (!rrx) return; requestAnimationFrame(anim); if (!dr) th += .0015; setC(); dimLabels.forEach(function(lbl) { lbl.quaternion.copy(cam.quaternion); }); rrx.render(scene, cam); })();
    }
}

</script>
