<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Building Designer — Sauce Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sora',sans-serif;background:linear-gradient(180deg,#f0f2f7 0%,#e8ecf4 50%,#f0f2f7 100%);color:#1a2744;min-height:100vh;}


.topbar{background:#1a2744;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a3d66;backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.topbar-brand{display:flex;align-items:center;gap:14px;}
.topbar-logo{width:40px;height:40px;background:#1a2744;border:1px solid #2a3d66;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#d4a843;font-family:'Outfit',sans-serif;box-shadow:0 2px 12px rgba(26,39,68,.15);}
.topbar-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;color:#f0f3f7;}
.topbar-subtitle{font-size:10px;font-weight:600;color:#d4a843;letter-spacing:2px;text-transform:uppercase;}
.topbar-right a{padding:8px 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;color:#7a8aa5;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);transition:all .15s;}
.topbar-right a:hover{border-color:#d4a843;color:#d4a843;}

/* Standalone dimension entry form */
.entry-overlay{position:relative;z-index:1;max-width:600px;margin:60px auto;padding:0 20px;}
.entry-card{background:linear-gradient(135deg,#ffffff 0%,#fafbfd 100%);border:1px solid #dde3ed;border-radius:16px;padding:32px;border-top:3px solid #d4a843;box-shadow:0 2px 8px rgba(26,39,68,.07);}
.entry-card h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:#1a2744;margin-bottom:4px;}
.entry-card p{font-size:13px;color:#7a8aa5;margin-bottom:24px;}
.entry-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.entry-field label{display:block;font-size:11px;font-weight:700;color:#7a8aa5;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.entry-field input,.entry-field select{width:100%;padding:11px 14px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:8px;color:#1a2744;font-size:14px;font-family:'Sora',sans-serif;font-weight:600;outline:none;transition:border .2s;}
.entry-field input:focus,.entry-field select:focus{border-color:#d4a843;}
.entry-field input::placeholder{color:#a0aec0;}
.entry-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.entry-btn{width:100%;padding:16px;background:linear-gradient(135deg,#b8860b,#d4a843);color:#1a2744;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(184,134,11,.25);transition:all .2s;}
.entry-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(184,134,11,.35);}
.entry-mode{text-align:center;margin-top:12px;font-size:11px;color:#a0aec0;}
.entry-mode span{color:#d4a843;font-weight:600;}

/* 3D Generator container - takes full page when active */
#quoteGenOverlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:linear-gradient(180deg,#f0f2f7 0%,#e8ecf4 50%,#f0f2f7 100%);overflow-y:auto;display:none;}
#quoteGenOverlay.active{display:block;}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-brand">
        <div class="topbar-logo">SE</div>
        <div><div class="topbar-title">3D Building Designer</div><div class="topbar-subtitle">Sauce Estimator</div></div>
    </div>
    <div class="topbar-right">
        <a href="home.html">← Dashboard</a>
    </div>
</div>

<!-- STANDALONE ENTRY FORM (hidden — auto-launch into configurator) -->
<div class="entry-overlay" id="entryForm" style="display:none;"></div>

<!-- 3D GENERATOR OVERLAY -->
<div id="quoteGenOverlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// === GLOBAL ERROR HANDLER ===
window.onerror = function(msg, url, line, col, err) {
    console.error('JS Error:', msg, 'at line', line, ':', col);
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:white;padding:12px 20px;z-index:99999;font-size:13px;font-family:monospace;';
    d.textContent = 'Error: ' + msg + ' (line ' + line + ')';
    document.body.prepend(d);
};

// === ENTRY POINT LOGIC ===
const calcData = sessionStorage.getItem('sauce_3d_data');

if (calcData) {
    // CALCULATOR PATH — launch with pricing data
    try {
        const Q = JSON.parse(calcData);
        sessionStorage.removeItem('sauce_3d_data');
        // Apply defaults for fields calculators may not send
        Q.pitch = Q.pitch || 4;
        Q.oh = Q.oh || 18;
        Q.soffit = Q.soffit !== undefined ? Q.soffit : true;
        Q.postSpacing = Q.postSpacing || 10;
        Q.truss = Q.truss || 'Steel';
        Q.frameType = Q.frameType || 'post';
        Q.roofColor = Q.roofColor || 'Charcoal';
        Q.garageDoors = Q.garageDoors || [];
        Q.barnDoors = Q.barnDoors || [];
        Q.shed = Q.shed || null;
        Q.shed2 = Q.shed2 || null;
        Q.lineItems = Q.lineItems || [];
        Q.pricing = Q.pricing || { total: 0 };
        launchDesigner(Q);
    } catch(e) {
        console.error('Bad calculator data:', e);
        launchDesigner(getDefaultQ());
    }
} else {
    // STANDALONE PATH — launch with defaults immediately
    launchDesigner(getDefaultQ());
}

function getDefaultQ() {
    return {
        w: 40, l: 60, h: 14, pitch: 4,
        postSpacing: 10, truss: 'Wood', frameType: 'post',
        oh: 18, soffit: true,
        customerName: '', roofColor: 'Charcoal',
        garageDoors: [], barnDoors: [],
        shed: null, shed2: null,
        lineItems: [], pricing: { total: 0 }
    };
}

function launchDesigner(Q) {
    const overlay = document.getElementById('quoteGenOverlay');
    overlay.classList.add('active');
    buildQuoteGenerator(overlay, Q);
}

function buildQuoteGenerator(overlay, Q) {
  try {
    const WALLS = [
        { id: 'front', label: 'Back Gable', len: Q.w, color: '#b4822e', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'back', label: 'Front Gable', len: Q.w, color: '#d4a843', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'left', label: 'Left Eave', len: Q.l, color: '#5a8a6a', encl: 'enclosed', postSpacing: Q.postSpacing },
        { id: 'right', label: 'Right Eave', len: Q.l, color: '#7a6a5a', encl: 'enclosed', postSpacing: Q.postSpacing },
    ];
    window._Q = Q; window._WALLS = WALLS;

    let allDoors = [];
    window._allDoors = allDoors;
    let nextDoorId = 0;
    // Doors are now added manually by the salesman in the configurator below
    // Q.garageDoors and Q.barnDoors from calculator are ignored for 3D model

    let activeDD = null;

    function fmt(ft) {
        if (ft == null) return '';
        const f = Math.floor(ft), inc = Math.round((ft - f) * 12);
        if (inc === 0 || inc === 12) return (inc === 12 ? f + 1 : f) + "'";
        return f + "'" + inc + '"';
    }

    function parseOff(val) {
        val = val.trim();
        const m1 = val.match(/^(\d+)['']?\s*(\d+)?[""]?$/);
        const m2 = val.match(/^(\d+\.?\d*)$/);
        let ft = 0;
        if (m1) { ft = parseInt(m1[1]); if (m1[2]) ft += parseInt(m1[2]) / 12; }
        else if (m2) ft = parseFloat(m2[1]);
        return Math.round(ft * 10) / 10;
    }

    function wallLabel(id) { return WALLS.find(w => w.id === id)?.label || id; }

    const peakH = Q.h + (Q.w / 2) * (Q.pitch / 12);

    // Build HTML
    overlay.innerHTML = `
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap');
        .qg *{margin:0;padding:0;box-sizing:border-box;}
        .qg{font-family:'Sora',sans-serif;color:#1a2744;background:linear-gradient(180deg,#f0f2f7 0%,#e8ecf4 50%,#f0f2f7 100%);}
        /* Subtle warmth overlay */
        
        /* TOP BAR */
        .qg-hdr{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#1a2744;border-bottom:1px solid #2a3d66;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
        .qg-logo{width:40px;height:40px;background:#1a2744;border:1px solid #2a3d66;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:900;font-size:14px;color:#d4a843;box-shadow:0 2px 8px rgba(26,39,68,.15);}
        .qg-ht{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:#f0f3f7;letter-spacing:-0.3px;}.qg-hs{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#b8860b;}
        .qg-close{margin-left:auto;padding:8px 18px;background:#fff;border:1px solid #e8ecf2;border-radius:8px;color:#7a8aa5;cursor:pointer;font-size:12px;font-family:'Sora',sans-serif;font-weight:600;transition:all .15s;}
        .qg-close:hover{border-color:#d4a843;color:#d4a843;}
        .qg-body{max-width:1060px;margin:0 auto;padding:20px 20px 50px;position:relative;z-index:1;}
        .qg-top{margin-bottom:18px;}
        .qg-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#b8860b;margin-bottom:6px;}
        .qg-badge::before{content:'';width:6px;height:6px;background:#b8860b;border-radius:50%;}
        .qg-top h2{font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;color:#1a2744;letter-spacing:-0.5px;line-height:1.2;}.qg-top h2 span{color:#d4a843;}
        .qg-top p{font-size:13px;color:#7a8aa5;margin-top:4px;}
        .qg-specs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
        .qg-sp{background:#f4f6f8;border:1px solid #e8ecf2;border-radius:8px;padding:7px 14px;font-size:12px;color:#3d4f6f;}.qg-sp b{color:#d4a843;font-weight:700;}
        .qg-lay{display:flex;flex-direction:column;gap:12px;}
        .qg-tray{width:100%;position:relative;z-index:5;}
        /* SECTIONS */
        .qg-sec{background:linear-gradient(135deg,#ffffff 0%,#fafbfd 100%);border:1px solid #dde3ed;border-radius:14px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(26,39,68,.07),0 1px 2px rgba(26,39,68,.04);}
        .qg-sec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#d4a843,transparent);border-radius:0 2px 2px 0;}
        .qg-st{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#7a8aa5;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .qg-st .ct{color:#d4a843;font-size:11px;}
        .qg-uchip{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:7px;margin-bottom:4px;font-size:10px;}
        .qg-uchip .ic{font-size:14px;}.qg-uchip .nm{font-weight:600;flex:1;}
        .qg-abtn{padding:2px 7px;background:#b8860b;color:#fff;border:none;border-radius:4px;font-size:8px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;}
        .qg-dd{position:fixed;z-index:10001;background:#fff;border:1px solid #e8ecf2;border-radius:7px;padding:3px;box-shadow:0 6px 20px rgba(26,39,68,.1);min-width:130px;}
        .qg-dd-opt{padding:5px 8px;font-size:10px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:5px;color:#1a2744;transition:background .1s;}
        .qg-dd-opt:hover{background:rgba(26,39,68,.05);}
        .qg-dd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
        /* WALL HEADERS */
        .qg-whdr{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;font-weight:600;color:#3d4f6f;}
        .qg-wdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .qg-wcnt{margin-left:auto;font-size:10px;color:#7a8aa5;font-weight:500;}
        /* DOOR/PLACEMENT */
        .qg-pd{display:flex;align-items:center;gap:5px;padding:5px 7px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:6px;margin-bottom:3px;font-size:9px;}
        .qg-pd .pi{font-size:12px;}.qg-pd .pinfo{flex:1;}.qg-pd .pn{font-weight:600;font-size:9px;}.qg-pd .poff{display:flex;align-items:center;gap:2px;margin-top:2px;}
        .qg-pd .poff label{font-size:7px;color:#7a8aa5;white-space:nowrap;}
        .qg-pd input.oft{width:30px;padding:1px 3px;background:#fff;border:1px solid #e8ecf2;border-radius:3px;color:#d4a843;font-family:'Sora',sans-serif;font-size:9px;text-align:center;outline:none;}
        .qg-pd input.oft:focus{border-color:#d4a843;}
        .qg-pd .pend{font-size:7px;color:#7a8aa5;}
        .qg-pd .pdel{color:#7f4e4e;cursor:pointer;font-size:10px;padding:1px 3px;opacity:.4;}.qg-pd .pdel:hover{opacity:1;}
        .qg-conflict{background:rgba(200,80,60,.08);border:1px solid rgba(200,80,60,.2);border-radius:6px;padding:6px 10px;font-size:10px;color:#c05040;margin-bottom:6px;display:none;align-items:center;gap:4px;}.qg-conflict.on{display:flex;}
        /* FOOTPRINT */
        .qg-fpa{width:100%;position:relative;z-index:1;overflow:hidden;padding:10px;}
        .qg-fpl{font-size:9px;font-weight:600;color:#7a8aa5;text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:1.5px;}
        .qg-fp{position:relative;background:#f4f6f8;border:2px solid #e8ecf2;border-radius:12px;margin:0 auto;}
        .qg-fw{position:absolute;transition:all .15s;}.qg-fw.hz{left:6%;right:6%;height:5px;border-radius:2px;}.qg-fw.vt{top:6%;bottom:6%;width:5px;border-radius:2px;}
        .qg-fw.ft{top:0;transform:translateY(-50%);}.qg-fw.bk{bottom:0;transform:translateY(50%);}.qg-fw.lt{left:0;transform:translateX(-50%);}.qg-fw.rt{right:0;transform:translateX(50%);}
        .qg-fw{background:rgba(140,131,121,.2);}.qg-fw.act{background:#b8860b;box-shadow:0 0 6px rgba(184,134,11,.3);}
        .qg-fwl{position:absolute;font-size:8px;font-weight:500;color:#7a8aa5;white-space:nowrap;}
        .qg-fwl.tp{top:-14px;left:50%;transform:translateX(-50%);}.qg-fwl.bt{bottom:-14px;left:50%;transform:translateX(-50%);}
        .qg-fwl.lf{left:-7px;top:50%;transform:translateY(-50%) rotate(-90deg);}.qg-fwl.rf{right:-7px;top:50%;transform:translateY(-50%) rotate(90deg);}
        .qg-post{position:absolute;width:5px;height:5px;border-radius:1px;background:#b8860b;opacity:.5;transform:translate(-50%,-50%);z-index:1;}
        .qg-fpd{position:absolute;height:8px;background:#d4a843;border-radius:2px;z-index:3;transition:all .2s;}.qg-fpd.barn{background:#6a8a9a;}
        .qg-fpd.vt{width:8px;height:auto;}
        .qg-fpdl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:6px;color:#d4a843;white-space:nowrap;}
        .qg-shed{position:absolute;background:rgba(90,138,106,.06);border:1.5px dashed rgba(90,138,106,.25);border-radius:3px;z-index:0;pointer-events:none;}
        .qg-shed-l{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:7px;color:#5a8a6a;text-align:center;pointer-events:none;}
        .qg-dim{position:absolute;font-size:11px;font-weight:700;color:#d4a843;}
        .qg-dim.dw{bottom:-24px;left:50%;transform:translateX(-50%);}.qg-dim.dl{right:-32px;top:50%;transform:translateY(-50%) rotate(90deg);}
        .qg-fint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
        .qg-fint strong{display:block;font-size:13px;color:#7a8aa5;font-family:'Outfit',sans-serif;font-weight:700;}.qg-fint span{font-size:9px;color:#a0aec0;}
        /* BUILD BUTTONS */
        .qg-bsec{text-align:center;margin-top:24px;padding:20px 0;}
        /* FORM ELEMENTS */
        .qg-sel{width:100%;padding:9px 10px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:8px;color:#1a2744;font-size:12px;font-family:'Sora',sans-serif;outline:none;cursor:pointer;transition:border-color .15s;appearance:auto;-webkit-appearance:auto;}
        .qg-sel:focus{border-color:#d4a843;box-shadow:0 0 0 2px rgba(212,168,67,.1);}
        .qg-sel option{background:#fafbfd;color:#1a2744;}
        .qg-inp{padding:8px 10px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:8px;color:#d4a843;font-size:13px;font-family:'Outfit',sans-serif;font-weight:700;text-align:center;outline:none;transition:border-color .15s;}
        .qg-inp:focus{border-color:#d4a843;box-shadow:0 0 0 2px rgba(212,168,67,.1);}
        .qg-fl{font-size:10px;font-weight:700;color:#7a8aa5;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
        .qg-addbtn{padding:6px 14px;background:rgba(26,39,68,.04);border:1px solid rgba(26,39,68,.15);border-radius:7px;color:#d4a843;font-size:11px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s;}
        .qg-addbtn:hover{background:rgba(26,39,68,.06);border-color:#d4a843;}
        .qg-chk{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:1px solid #e8ecf2;border-radius:8px;cursor:pointer;font-size:12px;color:#7a8aa5;transition:all .15s;margin-bottom:4px;}
        .qg-chk:hover{border-color:#d8dee8;}
        .qg-chk input{accent-color:#b8860b;width:16px;height:16px;}
        .wall-btn{padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #e8ecf2;background:#f4f6f8;color:#7a8aa5;font-family:'Sora',sans-serif;font-weight:500;transition:all .15s;}
        .wall-btn:hover{border-color:#d8dee8;color:#3d4f6f;}
        .wall-btn.active{border-color:#d4a843;background:rgba(184,134,11,.08);color:#d4a843;font-weight:700;}
        .qg-bbtn{padding:16px 48px;background:linear-gradient(135deg,#b8860b,#d4a843);color:#1a2744;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(184,134,11,.25),inset 0 1px 0 rgba(255,255,255,.2);letter-spacing:0.3px;}
        .qg-bbtn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(184,134,11,.35),inset 0 1px 0 rgba(255,255,255,.2);}
        .qg-bbtn:active{transform:translateY(0);}
        .qg-bhint{font-size:11px;color:#a0aec0;margin-top:8px;}
        /* REPLAY / 3D VIEW */
        .qg-rep{display:none;}.qg-rep.on{display:block;}
        .qg-rx{position:fixed;top:12px;right:12px;padding:8px 16px;border-radius:8px;background:#fff;border:1px solid #e8ecf2;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;font-family:'Sora',sans-serif;z-index:10002;color:#7a8aa5;transition:all .15s;}.qg-rx:hover{border-color:#d4a843;color:#d4a843;}
        .qg-rplay{position:fixed;top:12px;left:12px;padding:8px 16px;border-radius:8px;background:#fff;border:1px solid #e8ecf2;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Outfit',sans-serif;z-index:10002;color:#d4a843;transition:all .15s;}.qg-rplay:hover{background:rgba(26,39,68,.04);border-color:#d4a843;box-shadow:0 2px 10px rgba(26,39,68,.08);}
        .qg-rv{width:100%;max-width:900px;margin:0 auto;height:460px;background:#eef1f6;position:relative;border-radius:0 0 14px 14px;overflow:hidden;}
        .qg-rv canvas{display:block;width:100%!important;height:100%!important;touch-action:none;}
        .qg-rvb{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.85);border:1px solid #d8dee8;border-radius:6px;padding:5px 10px;backdrop-filter:blur(8px);}

    const maxFW = Math.min(fpa.clientWidth - (hasShed ? 120 : 60), 500);

    // Posts + sheds on footprint
    function renderFPPosts() {
        document.querySelectorAll('.qg-post').forEach(p => p.remove());
        const fpi = document.getElementById('qgFPI');
        // Track corner positions to avoid duplicates
        const placed = new Set();
        function addPost(xPct, yPct, color, opacity) {
            const key = Math.round(xPct * 10) + ',' + Math.round(yPct * 10);
            if (placed.has(key)) return;
            placed.add(key);
            const d = document.createElement('div'); d.className = 'qg-post';
            d.style.left = xPct + '%'; d.style.top = yPct + '%';
            if (color) d.style.background = color;
            if (opacity) d.style.opacity = opacity;
            fpi.appendChild(d);
        }
        // Helper: check if position is inside a door
        function fpInsideDoor(wallDoors, posFt) {
            for (let d of wallDoors) { const dL = d.offset || 0; if (posFt > dL + 0.3 && posFt < dL + d.w - 0.3) return true; }
            return false;
        }
        // Eave wall posts (left/right) — includes corners, skip inside doors, add jamb posts
        ['left', 'right'].forEach(wallId => {
            const wCfg = WALLS.find(w => w.id === wallId);
            const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
            const numBays = Math.floor(Q.l / wPS);
            const xPct = wallId === 'left' ? 3 : 97;
            const wd = allDoors.filter(d => d.wall === wallId);
            for (let i = 0; i <= numBays; i++) {
                const zFt = i * (Q.l / numBays);
                if (fpInsideDoor(wd, zFt)) continue;
                const pct = 6 + (i / numBays) * 88;
                addPost(xPct, pct);
            }
            // Jamb posts at door edges
            wd.forEach(d => {
                const dL = d.offset || 0, dR = dL + d.w;
                [dL, dR].forEach(posFt => {
                    const pct = 6 + (posFt / Q.l) * 88;
                    addPost(xPct, pct, '#d4a843');
                });
            });
        });
        // Gable posts (front/back) — skip corners, skip if open, skip inside doors, add jamb posts
        ['front', 'back'].forEach(wallId => {
            const wCfg = WALLS.find(w => w.id === wallId);
            if (wCfg && wCfg.encl === 'open') return;
            const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
            const numBays = Math.floor(Q.w / wPS);
            const wd = allDoors.filter(d => d.wall === wallId);
            const yPct = wallId === 'front' ? 6 : 94;
            for (let i = 0; i <= numBays; i++) {
                const xFt = i * (Q.w / numBays);
                if (fpInsideDoor(wd, xFt)) continue;
                const xPct = 6 + (xFt / Q.w) * 88;
                addPost(xPct, yPct, '#92400e', '.6');
            }
            // Jamb posts at door edges
            wd.forEach(d => {
                const dL = d.offset || 0, dR = dL + d.w;
                [dL, dR].forEach(posFt => {
                    const xPct = 6 + (posFt / Q.w) * 88;
                    addPost(xPct, yPct, '#d4a843');
                });
            });
        });
    }

    // Compute shed offset in feet from wall start
    function getShedOffset(sc) {
        const wallId = sc.wall;
        const wallLen = (wallId === 'front' || wallId === 'back') ? Q.w : Q.l;
        const shedLen = sc.l;
        if (shedLen >= wallLen) return 0; // full length, no offset
        const pos = sc.position || 'center';
        if (pos === 'start') return 0;
        if (pos === 'end') return wallLen - shedLen;
        if (pos === 'custom') return Math.max(0, Math.min(sc.offsetFt || 0, wallLen - shedLen));
        // center
        return (wallLen - shedLen) / 2;
    }

    function renderFPSheds() {
        document.querySelectorAll('.qg-shed').forEach(s => s.remove());
        shedConfigs.forEach(sc => {
            const el = document.createElement('div'); el.className = 'qg-shed';
            const w = sc.wall;
            const sW = sc.w, sL = sc.l;

            if (sc.type === 'leanto' || sc.type === 'gable') {
                // Simple rectangle on the chosen wall
                const sOff = getShedOffset(sc);
                if (w === 'left') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100, lS = (sOff / Q.l) * 100;
                    el.style.cssText = 'left:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                } else if (w === 'right') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100, lS = (sOff / Q.l) * 100;
                    el.style.cssText = 'right:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                } else if (w === 'front') {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100, lS = (sOff / Q.w) * 100;
                    el.style.cssText = 'top:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                } else {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100, lS = (sOff / Q.w) * 100;
                    el.style.cssText = 'bottom:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                }
                if (sc.type === 'gable') el.style.borderColor = 'rgba(34,197,94,.3)';
                el.innerHTML = '<div class="qg-shed-l">' + sW + 'x' + sL + (sc.type === 'gable' ? '<br>Gable' : '') + '</div>';
                document.getElementById('qgFPI').appendChild(el);
            } else if (sc.type === 'wrap') {
                // Wrap-around: L-shape on footprint
                const el2 = document.createElement('div'); el2.className = 'qg-shed';
                el2.style.borderColor = 'rgba(168,85,247,.3)'; el2.style.background = 'rgba(168,85,247,.04)';
                el.style.borderColor = 'rgba(168,85,247,.3)'; el.style.background = 'rgba(168,85,247,.04)';
                const wrapDir = sc.wrapDir;
                const wL = sc.wrapLeg || 0;
                if (w === 'left' || w === 'right') {
                    const wP = (sW / Q.w) * 100, lP = (sL / Q.l) * 100;
                    const lS = ((Q.l - sL) / 2 / Q.l) * 100;
                    if (w === 'left') el.style.cssText = 'left:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                    else el.style.cssText = 'right:' + (-wP - 2) + '%;width:' + wP + '%;top:' + (6 + lS * .88) + '%;height:' + (lP * .88) + '%';
                    // Wrap leg along gable
                    const wrapWP = (sW / Q.l) * 100;
                    const wrapLP = (wL / Q.w) * 100 * .88;
                    const wrapLS = ((Q.w - wL) / 2 / Q.w) * 100;
                    if (wrapDir === 'cw') el2.style.cssText = 'top:' + (-wrapWP - 2) + '%;height:' + wrapWP + '%;left:' + (6 + wrapLS * .88) + '%;width:' + wrapLP + '%';
                    else el2.style.cssText = 'bottom:' + (-wrapWP - 2) + '%;height:' + wrapWP + '%;left:' + (6 + wrapLS * .88) + '%;width:' + wrapLP + '%';
                } else {
                    const wP = (sW / Q.l) * 100, lP = (sL / Q.w) * 100;
                    const lS = ((Q.w - sL) / 2 / Q.w) * 100;
                    if (w === 'front') el.style.cssText = 'top:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                    else el.style.cssText = 'bottom:' + (-wP - 2) + '%;height:' + wP + '%;left:' + (6 + lS * .88) + '%;width:' + (lP * .88) + '%';
                    const wrapWP = (sW / Q.w) * 100;
                    const wrapLP = (wL / Q.l) * 100 * .88;
                    const wrapLS = ((Q.l - wL) / 2 / Q.l) * 100;
                    if (wrapDir === 'cw') el2.style.cssText = 'left:' + (-wrapWP - 2) + '%;width:' + wrapWP + '%;top:' + (6 + wrapLS * .88) + '%;height:' + wrapLP + '%';
                    else el2.style.cssText = 'right:' + (-wrapWP - 2) + '%;width:' + wrapWP + '%;top:' + (6 + wrapLS * .88) + '%;height:' + wrapLP + '%';
                }
                el.innerHTML = '<div class="qg-shed-l">' + sW + 'x' + sL + '<br>Wrap</div>';
                if (wL > 0) { el2.innerHTML = '<div class="qg-shed-l">' + sW + 'x' + wL + '</div>'; }
                document.getElementById('qgFPI').appendChild(el);
                if (wL > 0) document.getElementById('qgFPI').appendChild(el2);
            }
        });
    }

    function renderFPDoors() {
        document.querySelectorAll('.qg-fpd').forEach(d => d.remove());
        const fpi = document.getElementById('qgFPI');
        allDoors.filter(d => d.wall).forEach(d => {
            const w = WALLS.find(wl => wl.id === d.wall);
            const isHz = (d.wall === 'front' || d.wall === 'back');
            const startP = ((d.offset || 0) / w.len) * 100, widthP = (d.w / w.len) * 100;
            const el = document.createElement('div');
            el.className = 'qg-fpd' + (d.type === 'barn' ? ' barn' : '') + (isHz ? '' : ' vt');

            if (isHz) {
                el.style.left = (6 + startP * usable / 100) + '%'; el.style.width = (widthP * usable / 100) + '%';
                if (d.wall === 'front') el.style.top = '-4px'; else el.style.bottom = '-4px';
            } else {
                el.style.top = (6 + startP * usable / 100) + '%'; el.style.height = (widthP * usable / 100) + '%';
                if (d.wall === 'left') el.style.left = '-4px'; else { el.style.right = '-4px'; el.style.left = 'auto'; }

                    <div class="wall-spacing-ctrl" style="display:${currentFrameType === 'stud' ? 'none' : 'flex'};align-items:center;gap:4px;background:#f4f6f8;border:1px solid #e8ecf2;border-radius:6px;padding:4px 8px;">

                </div>
            </div>`;
        }).join('');

        WALLS.forEach(w => {
            const el = document.getElementById('qgFw' + w.id.charAt(0).toUpperCase());

    window._setWallEncl = function(wi, val) {
        WALLS[wi].encl = val;

    };

        WALLS[wi].postSpacing = Math.max(2, parseFloat(val) || 8);

    function closeActiveDD() { if (activeDD) { activeDD.remove(); activeDD = null; } }

    function checkConflicts() {
        const msgs = [];
        WALLS.forEach(w => {
            const wd = allDoors.filter(d => d.wall === w.id).sort((a, b) => (a.offset || 0) - (b.offset || 0));
            for (let i = 0; i < wd.length; i++) {
                const d = wd[i], s = d.offset || 0, e = s + d.w;
                if (s < 0) msgs.push(d.label + ' on ' + w.label + ': before wall edge');
                if (e > w.len) msgs.push(d.label + ' on ' + w.label + ': past wall end');
                if (i < wd.length - 1 && e > (wd[i + 1].offset || 0)) msgs.push(d.label + ' overlaps ' + wd[i + 1].label + ' on ' + w.label);
            }
        });
        const box = document.getElementById('qgConflict');
        if (msgs.length) { box.classList.add('on'); document.getElementById('qgConMsg').textContent = msgs[0] + (msgs.length > 1 ? ' (+' + (msgs.length - 1) + ')' : ''); }
        else box.classList.remove('on');
    }

            `<div class="qg-rl" id="qri${i}"><div class="ri">${it.icon}</div><div style="flex:1;min-width:0"><div class="rn">${it.name}</div><div class="rd">${it.desc}</div></div>${it.price > 0 ? '<div class="rp">$' + it.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</div>' : '<div style="font-size:10px;color:#4ade80;font-family:\'Outfit\',monospace;">✓ Included</div>'}</div>`
        ).join('');

        // Build 3D
        build3DReplay(placed, shedConfigs, WALLS);

    let lastBuildData = null;

    function animateLineItems(items) {
        // Reset all line items to hidden
        items.forEach((it, i) => {
            const el = document.getElementById('qri' + i);
            if (el) { el.classList.remove('on'); }
        });
        document.getElementById('qgRCta').classList.remove('on');
        document.getElementById('qgProg').style.width = '0%';

        setTimeout(() => {
            let idx = 0;
            const exactTotal = Q.pricing ? Q.pricing.total : 0;
            document.getElementById('qgTotA').textContent = exactTotal > 0 ? '$' + exactTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'Design Only';
            const prog = document.getElementById('qgProg');
            (function next() {
                if (idx >= items.length) {
                    setTimeout(() => document.getElementById('qgRCta').classList.add('on'), 400);
                    return;
                }
                const li = document.getElementById('qri' + idx);
                if (!li) { idx++; next(); return; }
                setTimeout(() => {
                    li.classList.add('on');
                    prog.style.width = ((idx + 1) / items.length) * 100 + '%';
                    idx++; next();
                }, 420);
            })();
        }, 900);
    }

            const statusEl = document.getElementById('qgEmailStatus');
            if (!custEmail || !custEmail.includes('@')) { statusEl.textContent = '⚠️ Please enter a valid email'; statusEl.style.color = '#f59e0b'; return; }
            emailRenderBtn.disabled = true;
            emailRenderBtn.textContent = '📧 Capturing views...';

                const d = window._3d;
                if (!d || !d.rrx) throw new Error('3D model not ready');

    function build3DReplay(placed, shedCfgs, wallCfgs) {
        const c = document.getElementById('qgRV');
        const old = c.querySelector('canvas'); if (old) old.remove();
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3244); scene.fog = new THREE.Fog(0x2a3244, 50, 110);
        const cam = new THREE.PerspectiveCamera(38, c.clientWidth / c.clientHeight, 0.1, 200);
        rrx = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); rrx.setSize(c.clientWidth, c.clientHeight); rrx.setPixelRatio(Math.min(window.devicePixelRatio, 2)); rrx.shadowMap.enabled = true;
        c.appendChild(rrx.domElement);

        scene.add(new THREE.AmbientLight(0xccddee, 0.8));
        const sun = new THREE.DirectionalLight(0xffeedd, 0.9); sun.position.set(10, 18, 8); sun.castShadow = true; scene.add(sun);
        const fill1 = new THREE.DirectionalLight(0xaabbdd, 0.5); fill1.position.set(-10, 12, -6); scene.add(fill1);
        const fill2 = new THREE.DirectionalLight(0xbbccdd, 0.4); fill2.position.set(0, 8, -12); scene.add(fill2);

        const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: 0x2a3040 }));
        gnd.rotation.x = -Math.PI / 2; gnd.position.y = -0.01; gnd.receiveShadow = true; scene.add(gnd);
        scene.add(new THREE.GridHelper(60, 60, 0x3a4458, 0x2a3244));

        const Sc = 0.1, sw = Q.w * Sc, sl = Q.l * Sc, sh = Q.h * Sc;
        const sr = (Q.h + (Q.w / 2) * (Q.pitch / 12)) * Sc, oh = (Q.oh / 12) * Sc;

        // Color name → hex lookup (matches Summertown Metals panel colors)
        const panelColors = {
            'Galvalume': 0xa8a9a3, 'White': 0xf5f5f0, 'Light Stone': 0xc9bfab,
            'Clay': 0xa89078, 'Tan': 0xc4a87a, 'Brown': 0x5c3d2e,
            'Bronze': 0x8c6239, 'Charcoal': 0x6b7280, 'Black': 0x111827,
            'Red': 0xdc2626, 'Rustic Red': 0x7f1d1d, 'Crimson': 0xbe123c,
            'Green': 0x4caf50, 'Hunter Green': 0x1b5e20, 'Gallery Blue': 0x3b6fa0
        };
        function pc(name) { return panelColors[name] || 0x475569; }

        const roofColorName = document.getElementById('qgRoofColor').value;
        const wallColorName = document.getElementById('qgWallColor').value;
        const trimColorName = document.getElementById('qgTrimColor').value;
        const hasWainscot = document.getElementById('qgWainscot').checked;
        const wainscotColorName = hasWainscot ? document.getElementById('qgWainscotColor').value : wallColorName;

        const mW = new THREE.MeshBasicMaterial({ color: pc(wallColorName), side: THREE.DoubleSide });
        const mR = new THREE.MeshBasicMaterial({ color: pc(roofColorName), side: THREE.DoubleSide });
        const mP = new THREE.MeshBasicMaterial({ color: 0xb45309 });
        const mS = new THREE.MeshBasicMaterial({ color: pc(trimColorName), side: THREE.DoubleSide });
        const mD = new THREE.MeshBasicMaterial({ color: 0x1e293b });
        const mBD = new THREE.MeshBasicMaterial({ color: 0x78350f });
        const mSh = new THREE.MeshBasicMaterial({ color: pc(roofColorName), side: THREE.DoubleSide });
        const mE = new THREE.LineBasicMaterial({ color: pc(trimColorName), transparent: true, opacity: .7 });
        const mWainscot = new THREE.MeshBasicMaterial({ color: pc(wainscotColorName), side: THREE.DoubleSide });
        const mTrimLine = new THREE.LineBasicMaterial({ color: pc(trimColorName), transparent: true, opacity: .85 });
        const mDF = new THREE.LineBasicMaterial({ color: pc(trimColorName), transparent: true, opacity: .9 });
        const mC = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });

        function mkQ(v, m) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3)); g.setIndex([0, 1, 2, 0, 2, 3]); g.computeVertexNormals(); const ms = new THREE.Mesh(g, m); ms.castShadow = true; return ms; }
        function mkL(pts, m) { return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), m); }

        const grps = { slab: new THREE.Group(), posts: new THREE.Group(), walls: new THREE.Group(), roof: new THREE.Group(), doors: new THREE.Group(), dims: new THREE.Group(), shed: new THREE.Group() };
        const dimLabels = [];
        Object.values(grps).forEach(g => { g.visible = false; scene.add(g); });

        // Slab
        grps.slab.add(new THREE.Mesh(new THREE.BoxGeometry(sw + .04, .04, sl + .04), mC));
        grps.slab.children[0].position.y = .02; grps.slab.children[0].receiveShadow = true;

        // Shed slabs from config
        (shedCfgs || []).forEach(sc => {
            const ssw = sc.w * Sc, ssl = sc.l * Sc;
            // Compute shed offset for slab positioning
            const isEW = (sc.wall === 'left' || sc.wall === 'right');
            const mwl = isEW ? Q.l : Q.w;
            const sLen = sc.l;
            const sPos = sc.position || 'center';
            let sOff = 0;
            if (sLen >= mwl) { sOff = 0; }
            else if (sPos === 'start') { sOff = 0; }
            else if (sPos === 'end') { sOff = mwl - sLen; }
            else if (sPos === 'custom') { sOff = Math.max(0, Math.min(sc.offsetFt || 0, mwl - sLen)); }
            else { sOff = (mwl - sLen) / 2; }
            const slabOff = (sOff + sLen / 2 - mwl / 2) * Sc;
            const slabL = ssl; // use shed length, not full wall
            const m = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, slabL + .02), mC);
            // Position based on wall
            if (sc.wall === 'left') m.position.set(-sw / 2 - ssw / 2, .02, slabOff);
            else if (sc.wall === 'right') m.position.set(sw / 2 + ssw / 2, .02, slabOff);
            else if (sc.wall === 'front') { m.geometry = new THREE.BoxGeometry(slabL + .02, .04, ssw + .02); m.position.set(slabOff, .02, -sl / 2 - ssw / 2); }
            else { m.geometry = new THREE.BoxGeometry(slabL + .02, .04, ssw + .02); m.position.set(slabOff, .02, sl / 2 + ssw / 2); }
            if (sc.type === 'wrap') {
                // Add second leg slab for wrap-around
                const isEave = (sc.wall === 'left' || sc.wall === 'right');
                const wrapLen = (sc.wrapLeg || 0) * Sc;
                if (isEave) {
                    // Primary is on eave (left/right), wrap leg goes along gable (front/back)
                    const gZ = sc.wrapDir === 'cw' ? -sl / 2 - ssw / 2 : sl / 2 + ssw / 2;
                    // Second leg spans the building width
                    const m2 = new THREE.Mesh(new THREE.BoxGeometry(sw + .02, .04, ssw + .02), mC);
                    m2.position.set(0, .02, gZ);
                    m2.receiveShadow = true; grps.slab.add(m2);
                    // Corner fill piece connecting the two legs
                    const m3 = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, ssw + .02), mC);
                    const cX = sc.wall === 'left' ? -sw / 2 - ssw / 2 : sw / 2 + ssw / 2;
                    m3.position.set(cX, .02, gZ);
                    m3.receiveShadow = true; grps.slab.add(m3);
                } else {
                    // Primary is on gable (front/back), wrap leg goes along eave (left/right)
                    const eX = sc.wrapDir === 'cw' ? -sw / 2 - ssw / 2 : sw / 2 + ssw / 2;
                    // Second leg spans the building length
                    const m2 = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, sl + .02), mC);
                    m2.position.set(eX, .02, 0);
                    m2.receiveShadow = true; grps.slab.add(m2);
                    // Corner fill
                    const m3 = new THREE.Mesh(new THREE.BoxGeometry(ssw + .02, .04, ssw + .02), mC);
                    const cZ = sc.wall === 'front' ? -sl / 2 - ssw / 2 : sl / 2 + ssw / 2;
                    m3.position.set(eX, .02, cZ);
                    m3.receiveShadow = true; grps.slab.add(m3);
                }
            }
            m.receiveShadow = true; grps.slab.add(m);
        });

        // === FRAMING — Post Frame vs Stud Frame ===
        const ps = .05; // post size
        const postPositions = new Set();
        const isStudFrame = currentFrameType === 'stud';

        if (isStudFrame) {
            // STUD FRAME: 2×6 studs at 16" OC (1.333 ft)
            const studSpacing = 16 / 12; // 16 inches in feet
            const studW = 0.012; // 2×6 visual width at scale (~1.5" actual)
            const studD = 0.018; // depth (~5.5" actual)
            const mStud = new THREE.MeshBasicMaterial({ color: 0xc8a060 }); // lighter wood tone for studs
            const mPlate = new THREE.MeshBasicMaterial({ color: 0xa08040 }); // slightly darker for plates

            // Bottom & top plates for each wall (continuous horizontal members)
            ['left', 'right'].forEach(wallId => {
                const xSide = wallId === 'left' ? -sw / 2 : sw / 2;
                // Bottom plate
                const bp = new THREE.Mesh(new THREE.BoxGeometry(studD, studW, sl), mPlate);
                bp.position.set(xSide, studW / 2, 0); bp.castShadow = true; grps.posts.add(bp);
                // Top plate (double)
                const tp = new THREE.Mesh(new THREE.BoxGeometry(studD, studW * 2, sl), mPlate);
                tp.position.set(xSide, sh - studW, 0); tp.castShadow = true; grps.posts.add(tp);
                // Studs along eave walls
                const numStuds = Math.floor(Q.l / studSpacing);
                for (let i = 0; i <= numStuds; i++) {
                    const z = -sl / 2 + (sl * i / numStuds);
                    const stud = new THREE.Mesh(new THREE.BoxGeometry(studD, sh - studW * 3, studW), mStud);
                    stud.position.set(xSide, sh / 2, z); stud.castShadow = true; grps.posts.add(stud);
                }
            });

            // Gable wall studs (height varies with pitch)
            ['front', 'back'].forEach(wallId => {
                const zPos = wallId === 'front' ? -sl / 2 : sl / 2;
                const wd = placed.filter(d => d.wall === wallId);
                // Bottom plate
                const bp = new THREE.Mesh(new THREE.BoxGeometry(sw, studW, studD), mPlate);
                bp.position.set(0, studW / 2, zPos); bp.castShadow = true; grps.posts.add(bp);
                // Top plate follows pitch — skip for simplicity, studs go to rafters
                const numStuds = Math.floor(Q.w / studSpacing);
                for (let i = 0; i <= numStuds; i++) {
                    const xFt = i * (Q.w / numStuds);
                    const xPos = (-Q.w / 2 + xFt) * Sc;
                    // Check door blocking
                    let blocked = false;
                    wd.forEach(d => { if (xFt > (d.offset || 0) - 0.3 && xFt < (d.offset || 0) + d.w + 0.3) blocked = true; });
                    if (blocked) continue;
                    const distC = Math.abs(xFt - Q.w / 2);
                    const studH = (Q.h + (Q.w / 2 - distC) * (Q.pitch / 12)) * Sc;
                    const stud = new THREE.Mesh(new THREE.BoxGeometry(studW, studH - studW, studD), mStud);
                    stud.position.set(xPos, (studH - studW) / 2 + studW, zPos); stud.castShadow = true; grps.posts.add(stud);
                }
            });

            // Corner posts (king studs — slightly beefier at corners)
            const cornerPS = .04;
            [[-sw/2, -sl/2], [-sw/2, sl/2], [sw/2, -sl/2], [sw/2, sl/2]].forEach(([x, z]) => {
                const cp = new THREE.Mesh(new THREE.BoxGeometry(cornerPS, sh, cornerPS), mP);
                cp.position.set(x, sh / 2, z); cp.castShadow = true; grps.posts.add(cp);
            });

        } else {
            // POST FRAME: Standard posts at configurable spacing from corners
            // Regular posts skip door openings; jamb posts always placed at door edges

            // Helper: check if a position (in feet from wall start) is inside any door on that wall
            function isInsideDoor(wallDoors, posFt) {
                for (let d of wallDoors) {
                    const dL = d.offset || 0, dR = dL + d.w;
                    if (posFt > dL + 0.3 && posFt < dR - 0.3) return true;
                }
                return false;
            }

            // EAVE WALLS (left/right) — post spacing along length
            ['left', 'right'].forEach(wallId => {
                const wCfg = wallCfgs.find(w => w.id === wallId);
                const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
                const xSide = wallId === 'left' ? -sw / 2 : sw / 2;
                const wd = placed.filter(d => d.wall === wallId);

                // Regular posts from corner at fixed spacing
                const numBays = Math.floor(Q.l / wPS);
                for (let i = 0; i <= numBays; i++) {
                    const zFt = i * (Q.l / numBays);
                    const z = (-Q.l / 2 + zFt) * Sc;
                    // Skip if inside a door opening
                    if (isInsideDoor(wd, zFt)) continue;
                    const key = Math.round(xSide * 1000) + ',' + Math.round(z * 1000);
                    if (!postPositions.has(key)) {
                        postPositions.add(key);
                        const p = new THREE.Mesh(new THREE.BoxGeometry(ps, sh, ps), mP);
                        p.position.set(xSide, sh / 2, z); p.castShadow = true; grps.posts.add(p);
                    }
                }

                // Jamb posts at each door edge
                wd.forEach(d => {
                    const dL = (d.offset || 0), dR = dL + d.w;
                    [dL, dR].forEach(posFt => {
                        const z = (-Q.l / 2 + posFt) * Sc;
                        const key = Math.round(xSide * 1000) + ',' + Math.round(z * 1000);
                        if (!postPositions.has(key)) {
                            postPositions.add(key);
                            const p = new THREE.Mesh(new THREE.BoxGeometry(ps, sh, ps), mP);
                            p.position.set(xSide, sh / 2, z); p.castShadow = true; grps.posts.add(p);
                        }
                    });
                });
            });

            // GABLE WALLS (front/back) — post spacing along width
            ['front', 'back'].forEach(wallId => {
                const wCfg = wallCfgs.find(w => w.id === wallId);
                if (wCfg && wCfg.encl === 'open') return; // clear span
                const wPS = wCfg ? wCfg.postSpacing : Q.postSpacing;
                const zPos = wallId === 'front' ? -sl / 2 : sl / 2;
                const wd = placed.filter(d => d.wall === wallId);

                // Regular posts from corner at fixed spacing
                const numBays = Math.floor(Q.w / wPS);
                for (let i = 0; i <= numBays; i++) {
                    const xFt = i * (Q.w / numBays);
                    const xPos = (-Q.w / 2 + xFt) * Sc;
                    const key = Math.round(xPos * 1000) + ',' + Math.round(zPos * 1000);
                    if (postPositions.has(key)) continue; // corner already placed
                    if (isInsideDoor(wd, xFt)) continue; // inside door opening
                    postPositions.add(key);
                    const distC = Math.abs(xFt - Q.w / 2);
                    const pH = (Q.h + (Q.w / 2 - distC) * (Q.pitch / 12)) * Sc;
                    const p = new THREE.Mesh(new THREE.BoxGeometry(ps, pH, ps), mP);
                    p.position.set(xPos, pH / 2, zPos); p.castShadow = true; grps.posts.add(p);
                }

                // Jamb posts at each door edge
                wd.forEach(d => {
                    const dL = (d.offset || 0), dR = dL + d.w;
                    [dL, dR].forEach(posFt => {
                        const xPos = (-Q.w / 2 + posFt) * Sc;
                        const key = Math.round(xPos * 1000) + ',' + Math.round(zPos * 1000);
                        if (!postPositions.has(key)) {
                            postPositions.add(key);
                            const distC = Math.abs(posFt - Q.w / 2);
                            const pH = (Q.h + (Q.w / 2 - distC) * (Q.pitch / 12)) * Sc;
                            const p = new THREE.Mesh(new THREE.BoxGeometry(ps, pH, ps), mP);
                            p.position.set(xPos, pH / 2, zPos); p.castShadow = true; grps.posts.add(p);
                        }
                    });
                });
            });
        }

        // Shed posts from config
        (shedCfgs || []).forEach(sc => {
            const ssw = sc.w * Sc, ssl = sc.l * Sc;
            const ltPitchP = sc.ltPitch || 1;
            const dropHP = (sc.dropFt || 0) * Sc;
            const attachHP = sh - dropHP;
            const shedSh = attachHP - (sc.w * (ltPitchP / 12)) * Sc; // outer post height from pitch
            // Use the post spacing of the wall the shed attaches to
            const attachWall = wallCfgs.find(w => w.id === sc.wall);
            const attachPS = attachWall ? attachWall.postSpacing : (Q.postSpacing || 10);

            // Compute shed offset from wall start (in feet)
            const isEaveWall = (sc.wall === 'left' || sc.wall === 'right');
            const mainWallLen = isEaveWall ? Q.l : Q.w;
            const shedLen = sc.l;
            const shedPos = sc.position || 'center';
            let shedOffFt = 0;
            if (shedLen >= mainWallLen) { shedOffFt = 0; }
            else if (shedPos === 'start') { shedOffFt = 0; }
            else if (shedPos === 'end') { shedOffFt = mainWallLen - shedLen; }
            else if (shedPos === 'custom') { shedOffFt = Math.max(0, Math.min(sc.offsetFt || 0, mainWallLen - shedLen)); }
            else { shedOffFt = (mainWallLen - shedLen) / 2; }
            // Shed center offset from wall center (in scene units)
            const shedCenterOff = (shedOffFt + shedLen / 2 - mainWallLen / 2) * Sc;

            // Place posts along the shed's length only (not full wall)
            function addPostLineAligned(oX, oZ, isAlongZ, shedLength, wallPS, postH) {
                const h = postH || shedSh;
                const numBays = Math.max(1, Math.floor(shedLength / wallPS));
                for (let i = 0; i <= numBays; i++) {
                    const ft = i * (shedLength / numBays);
                    const pos = (-shedLength / 2 + ft) * Sc;
                    const p = new THREE.Mesh(new THREE.BoxGeometry(ps, h, ps), mP);
                    if (isAlongZ) p.position.set(oX, h / 2, pos + shedCenterOff);
                    else p.position.set(pos + shedCenterOff, h / 2, oZ);
                    p.castShadow = true; grps.posts.add(p);
                }
            }

            if (sc.type === 'gable') {
                // Gable extension: eave posts along both sides, gable end is clear span
                const gPS = sc.gablePS || 10; // extension eave post spacing
                if (sc.wall === 'left' || sc.wall === 'right') {
                    // Extension goes outward along X from eave wall
                    // Eave runs are along the Z axis (front/back sides of extension)
                    const dir = sc.wall === 'left' ? -1 : 1;
                    const baseX = (sc.wall === 'left' ? -sw/2 : sw/2);

<script>

            else{allRects.push({x:blIn,y:off,w:sWI,h:sLI,lbl:lbl});for(var i=0;i<=nB;i++)allPts.push({x:blIn+sWI,y:off+i*sLI/nB,jamb:false});}

                    var nW=Math.max(1,Math.floor(bl/eP));for(var i=0;i<=nW;i++)allPts.push({x:i*blIn/nW,y:wOY,jamb:false});
                    allPts.push({x:oX,y:wOY,jamb:false});var cnB=Math.max(1,Math.floor(sc.w/aPS));

                    var cY0=atL?0:bwIn,cYd=atL?-1:1;for(var ci=1;ci<cnB;ci++)allPts.push({x:oX,y:cY0+cYd*(ci*sWI/cnB),jamb:false});}

    // === POST-TO-POST DIMENSIONS ONLY — all 4 walls ===

        // dir: -1=left, +1=right
        var x=wallX+dir*D;
        doc.setLineWidth(0.3);doc.setDrawColor(0);
        if(posts.length>1) doc.line(x,TY(posts[0].ft*12),x,TY(posts[posts.length-1].ft*12));
        for(var i=0;i<posts.length;i++){
            var py=TY(posts[i].ft*12);
            doc.setLineWidth(0.15);doc.setDrawColor(150);
            doc.line(wallX+dir*3,py,x+dir*3,py);
            doc.setLineWidth(0.4);doc.setDrawColor(0);
            doc.line(x-2,py,x+2,py);
        }
        doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(0);
        for(var i=0;i<posts.length-1;i++){
            var y1=TY(posts[i].ft*12),y2=TY(posts[i+1].ft*12);
            var lbl=F((posts[i+1].ft-posts[i].ft)*12);
            if(dir<0) doc.text(lbl,x-5,(y1+y2)/2,{align:'center',angle:90});
            else doc.text(lbl,x+5,(y1+y2)/2,{align:'center',angle:270});
        }
    }

    // Top: left eave
    if(wp.left.length>1) dimH(wp.left,TY(0),-1);
    // Bottom: right eave
    if(wp.right.length>1) dimH(wp.right,TY(bwIn),1);
    // Left: front gable
    if(wp.front.length>1) dimV(wp.front,TX(0),-1);
    // Right: back gable
    if(wp.back.length>1) dimV(wp.back,TX(blIn),1);

    // Legend
    var lgY=PH-MG+2;
    doc.setFontSize(5);doc.setFont('helvetica','normal');doc.setTextColor(0);
    doc.setFillColor(255);doc.setDrawColor(0);doc.setLineWidth(0.4);
    doc.rect(MG,lgY-3,5,5,'FD');
    doc.setLineWidth(0.2);doc.line(MG,lgY-3,MG+5,lgY+2);doc.line(MG+5,lgY-3,MG,lgY+2);
    doc.text('Post',MG+7,lgY+1);
    doc.setFillColor(40);doc.rect(MG+24,lgY-3,5,5,'F');
    doc.text('Jamb',MG+31,lgY+1);
    var dlX=MG+50;var dKeys=Object.keys(doorLabels);
    for(var i=0;i<dKeys.length;i++){var dl=doorLabels[dKeys[i]];
        var dtxt=dl.lbl+': '+dl.w+"'x"+dl.h+"' "+(dl.type==='garage'?'Garage Door':'Walk Door');
        doc.text(dtxt,dlX,lgY+1);dlX+=doc.getTextWidth(dtxt)+12;}
    doc.setTextColor(160);
    doc.text('Sauce Estimator  |  \u00A9 '+new Date().getFullYear()+' Lain Hinson',PW-MG,lgY+1,{align:'right'});

    // === PAGE 2 ===
    doc.addPage('letter','landscape');
    doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(14);
    doc.text('POST & DOOR SCHEDULE',MG,MG+16);
    doc.setLineWidth(0.4);doc.setDrawColor(180);doc.line(MG,MG+24,PW-MG,MG+24);
    var diag2=Math.sqrt(frameL*frameL+frameW*frameW);
    var cY=MG+44;
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('BUILDING',MG,cY);cY+=14;
    doc.setFont('helvetica','normal');doc.setFontSize(8);
    doc.text('Size: '+bw+"' x "+bl+"' x "+bh+"'    Pitch: "+pitch+'/12    Truss: '+truss+'    Posts: '+postSize,MG+12,cY);cY+=11;
    doc.text('Frame: '+F(frameL)+' x '+F(frameW)+'    Diagonal: '+F(diag2)+'    Girt Offset: '+(girtOff>0?girtOff+'"':'None'),MG+12,cY);cY+=20;
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('POST SCHEDULE',MG,cY);cY+=14;
    doc.setFontSize(8);
    ['left','right','front','back'].forEach(function(wid){
        var p=wp[wid];if(!p.length)return;
        doc.setFont('helvetica','bold');doc.text(WL[wid],MG+12,cY);
        doc.setFont('helvetica','normal');doc.text(p.length+' posts',MG+105,cY);
        var d=[];for(var i=0;i<p.length-1;i++)d.push(F((p[i+1].ft-p[i].ft)*12));
        var ch=d.join('  >  ');
        if(ch.length>85){doc.text(d.slice(0,Math.ceil(d.length/2)).join('  >  '),MG+150,cY);cY+=10;
            doc.text(d.slice(Math.ceil(d.length/2)).join('  >  '),MG+150,cY);cY+=13;}
        else{doc.text(ch,MG+150,cY);cY+=13;}
    });
    var drs=allDoors.filter(function(d){return d.wall;});
    if(drs.length){cY+=8;doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('DOOR SCHEDULE',MG,cY);cY+=14;
        doc.setFontSize(8);doc.setFont('helvetica','normal');
        drs.forEach(function(d){doc.text((d.type==='garage'?'Garage':d.type==='barn'?'Barn':'Walk')+' Door  '+d.w+"' x "+d.h+"'",MG+12,cY);doc.text(WL[d.wall]+'  @  '+(d.offset||0)+"' from corner",MG+180,cY);cY+=11;});}
    if(shedCfgs.length){cY+=8;doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('SIDE SHED SCHEDULE',MG,cY);cY+=14;
        doc.setFontSize(8);doc.setFont('helvetica','normal');
        shedCfgs.forEach(function(sc){
            var tl=sc.type==='gable'?'Gable Ext.':sc.type==='wrap'?'Wrap':'Lean-To';
            var pos=sc.position==='start'?'Start':sc.position==='end'?'End':sc.position==='custom'?(sc.offsetFt||0)+"' offset":'Centered';
            var ln=tl+'  '+sc.w+"' x "+sc.l+"'  \u2014  "+WL[sc.wall]+'  \u2014  '+pos;
            if(sc.type!=='gable'&&sc.ltPitch)ln+='  |  '+sc.ltPitch+'/12';
            if(sc.dropFt>0)ln+='  |  '+sc.dropFt+"' drop";
            doc.text(ln,MG+12,cY);cY+=11;});}
    doc.setFontSize(5.5);doc.setTextColor(160);
    doc.text('Sauce Estimator  |  \u00A9 '+new Date().getFullYear()+' Lain Hinson',PW-MG,PH-MG,{align:'right'});
    doc.save((jobName||bw+'x'+bl+'_building').replace(/[^a-zA-Z0-9]/g,'_')+'_post_layout.pdf');
};








</script>
