<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Kits - Sauce Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 48px;
        }
        
        .header h1 {
            font-size: 48px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .back-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 32px;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }
        
        .kit-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .kit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }
        
        .kit-id {
            font-size: 12px;
            color: #667eea;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .kit-name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        
        .kit-specs {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }
        
        .spec-item:last-child {
            border-bottom: none;
        }
        
        .spec-label {
            color: #6c757d;
            font-weight: 500;
        }
        
        .spec-value {
            color: #1a1a1a;
            font-weight: 600;
        }
        
        .kit-features {
            margin-bottom: 16px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 14px;
            color: #495057;
        }
        
        .feature-icon {
            color: #28a745;
            font-size: 16px;
        }
        
        .quote-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .quote-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" class="back-btn">← Back to Home</a>
        
        <div class="header">
            <h1>📦 Building Kits</h1>
            <p>Pre-configured packages ready to quote</p>
        </div>
        
        <div class="kits-grid">
            <!-- Kit 1: 30x40x12 Residential Garage -->
            <a href="#" class="kit-card" onclick="loadKit1(); return false;">
                <div class="kit-id">BKRG304012-1</div>
                <div class="kit-name">30x40x12 Residential Garage</div>
                
                <div class="kit-specs">
                    <div class="spec-item">
                        <span class="spec-label">Dimensions</span>
                        <span class="spec-value">30' × 40' × 12'</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Calculator</span>
                        <span class="spec-value">Wood No OH</span>
                    </div>
                </div>
                
                <div class="kit-features">
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>2× GD1010W Garage Doors</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>Therma Guard Roof Insulation</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>White 3/0 PLYCO Walk Door</span>
                    </div>
                </div>
                
                <button class="quote-btn">Get Quote →</button>
            </a>
            
            <!-- Add more kits here as needed -->
            
        </div>
    </div>
    
    <script>
        function loadKit1() {
            // Store kit data in sessionStorage
            const kitData = {
                calculatorType: 'wood-no-oh',
                customerName: '',
                phone: '',
                email: '',
                address: '',
                width: '30',
                length: '40',
                height: '12',
                roofColor: 'Painted',
                trussSpacing: '5',
                eavePostSpacing: '10',
                ssWidth: '0',
                ssLength: '0',
                ss2Width: '0',
                ss2Length: '0',
                insulation: 'Therma Guard',
                insulationRoof: true,
                insulationWalls: false,
                garageDoor1Type: 'GD1010W',
                garageDoor1Qty: '2',
                garageDoor2Type: '',
                garageDoor2Qty: '0',
                garageDoor3Type: '',
                garageDoor3Qty: '0',
                garageDoor4Type: '',
                garageDoor4Qty: '0',
                walkDoor1Type: 'White 3/0 PLYCO ALUMINUM FRAME',
                walkDoor1Qty: '1',
                walkDoor2Type: '',
                walkDoor2Qty: '0',
                autoCalculate: true
            };
            
            sessionStorage.setItem('buildingKit', JSON.stringify(kitData));
            window.location.href = 'wood-no-oh.html';
        }
    </script>
</body>
</html>
