<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log — Sauce Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a1628;color:#c8d6e5;min-height:100vh;}
        .topbar{background:#0f1b33;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,168,67,.15);position:sticky;top:0;z-index:100;}
        .topbar-left{display:flex;align-items:center;gap:12px;}
        .topbar-logo{width:40px;height:40px;background:linear-gradient(135deg,#b8860b,#d4a843);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:900;font-size:15px;color:#0f1b33;box-shadow:0 2px 8px rgba(212,168,67,.3);}
        .topbar-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;color:#ffffff;}
        .topbar-sub{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#d4a843;}
        .topbar-right{display:flex;gap:8px;}
        .topbar-right a{padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;color:#7a8aa5;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:all .15s;}
        .topbar-right a:hover{border-color:rgba(212,168,67,.25);color:#d4a843;}
        .topbar-right a.active{background:rgba(212,168,67,.1);color:#d4a843;border-color:rgba(212,168,67,.3);}
        .content{max-width:1200px;margin:0 auto;padding:28px 20px;}
        .stats{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
        .stat{background:#1a2744;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 20px;flex:1;min-width:140px;display:flex;align-items:center;gap:12px;}
        .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
        .stat-num{font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;color:#ffffff;}
        .stat-label{font-size:10px;color:#5a6a80;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
        .table-card{background:#1a2744;border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;}
        .table-header{background:#0f1b33;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);}
        .table-title{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:#ffffff;}
        .refresh-btn{background:rgba(212,168,67,.12);color:#d4a843;border:1px solid rgba(212,168,67,.25);padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
        .refresh-btn:hover{background:rgba(212,168,67,.2);}
        table{width:100%;border-collapse:collapse;}
        th{padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#5a6a80;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06);}
        td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
        tr:hover{background:rgba(255,255,255,.02);}
        .user-badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#ffffff;}
        .user-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;}
        .calc-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;}
        .calc-badge.calc{background:rgba(99,102,241,.15);color:#818cf8;}
        .calc-badge.designer{background:rgba(212,168,67,.15);color:#d4a843;}
        .time-cell{color:#5a6a80;font-size:12px;}
        .customer-cell{color:#c8d6e5;}
        .price-cell{font-weight:700;color:#22c55e;}
        .price-cell.na{color:#4a5a70;font-weight:400;}
        .loading{text-align:center;padding:60px;color:#4a5a70;font-size:14px;}
        .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.06);border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:768px){.topbar{padding:12px 16px;flex-direction:column;gap:10px;}.content{padding:16px 12px;}.stats{flex-direction:column;}.stat{min-width:auto;}table{font-size:12px;}th,td{padding:10px 12px;}.topbar-right{flex-wrap:wrap;justify-content:center;}}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">SE</div>
            <div><div class="topbar-title">Activity Log</div><div class="topbar-sub">Real-Time Usage</div></div>
        </div>
        <div class="topbar-right">
            <a href="home.html">Dashboard</a>
            <a href="notifications.html">Notifications</a>
            <a href="activity-log.html" class="active">Activity</a>
        </div>
    </div>
    <div class="content">
        <div class="stats">
            <div class="stat"><div class="stat-icon" style="background:rgba(34,197,94,.12);">👤</div><div><div class="stat-num" id="activeUsers">0</div><div class="stat-label">Active (5 min)</div></div></div>
            <div class="stat"><div class="stat-icon" style="background:rgba(212,168,67,.12);">📊</div><div><div class="stat-num" id="calculationsToday">0</div><div class="stat-label">Today</div></div></div>
            <div class="stat"><div class="stat-icon" style="background:rgba(99,102,241,.12);">📈</div><div><div class="stat-num" id="calculationsWeek">0</div><div class="stat-label">This Week</div></div></div>
            <div class="stat"><div class="stat-icon" style="background:rgba(34,197,94,.12);">💰</div><div><div class="stat-num" id="avgQuote">$0</div><div class="stat-label">Avg Quote</div></div></div>
        </div>
        <div class="table-card">
            <div class="table-header">
                <span class="table-title">Recent Activity</span>
                <button class="refresh-btn" onclick="loadActivityLog()">🔄 Refresh</button>
            </div>
            <div id="tableContent"><div class="loading"><div class="spinner"></div>Loading activity...</div></div>
        </div>
    </div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
let currentUser = null;
const savedUser = sessionStorage.getItem('sauce_user');
if (!savedUser) { alert('Please log in first'); window.location.href = 'home.html'; }
else { currentUser = JSON.parse(savedUser); if (currentUser.username !== 'lain.hinson') { alert('Unauthorized'); window.location.href = 'home.html'; } }

function fCur(n){return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function timeAgo(ts){var d=new Date(ts),s=Math.floor((new Date()-d)/1000);if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

var designerTools=['3D Designer','3D Building Designer'];

async function loadActivityLog(){
    try{
        var r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'getActivityLog',username:currentUser.username}),headers:{'Content-Type':'text/plain'}});
        var d=await r.json();
        if(d.success){displayActivityLog(d.activities);calculateStats(d.activities);}
        else{document.getElementById('tableContent').innerHTML='<div class="loading">Error loading</div>';}
    }catch(e){document.getElementById('tableContent').innerHTML='<div class="loading">Connection failed</div>';}
}

function displayActivityLog(acts){
    if(!acts.length){document.getElementById('tableContent').innerHTML='<div class="loading">No activity yet</div>';return;}
    var h='<table><thead><tr><th>Time</th><th>User</th><th>Tool</th><th>Customer</th><th>Total</th></tr></thead><tbody>';
    acts.forEach(function(a){
        var isDes=designerTools.indexOf(a.calculatorType)!==-1;
        var bc=isDes?'designer':'calc';
        var price=(a.totalPrice&&a.totalPrice>0)?'<span class="price-cell">'+fCur(a.totalPrice)+'</span>':'<span class="price-cell na">—</span>';
        var cust=a.customerName&&a.customerName!=='N/A'&&a.customerName!==''?a.customerName:'<span style="color:#4a5a70;">—</span>';
        h+='<tr><td class="time-cell">'+timeAgo(a.timestamp)+'</td><td><div class="user-badge"><span class="user-dot"></span>'+a.username+'</div></td><td><span class="calc-badge '+bc+'">'+a.calculatorType+'</span></td><td class="customer-cell">'+cust+'</td><td>'+price+'</td></tr>';
    });
    h+='</tbody></table>';
    document.getElementById('tableContent').innerHTML=h;
}

function calculateStats(acts){
    var now=new Date(),fiveAgo=new Date(now-5*60*1000),todayStart=new Date();todayStart.setHours(0,0,0,0);
    var weekStart=new Date(now-7*24*60*60*1000);
    var activeSet=new Set();
    acts.forEach(function(a){if(new Date(a.timestamp)>fiveAgo)activeSet.add(a.username);});
    document.getElementById('activeUsers').textContent=activeSet.size;
    document.getElementById('calculationsToday').textContent=acts.filter(function(a){return new Date(a.timestamp)>todayStart;}).length;
    document.getElementById('calculationsWeek').textContent=acts.filter(function(a){return new Date(a.timestamp)>weekStart;}).length;
    var quotes=acts.filter(function(a){return a.totalPrice>0;});
    var total=quotes.reduce(function(s,a){return s+(a.totalPrice||0);},0);
    document.getElementById('avgQuote').textContent=fCur(quotes.length>0?total/quotes.length:0);
}

loadActivityLog();
setInterval(loadActivityLog,30000);
</script>
</body>
</html>
