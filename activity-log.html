<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - Admin Only</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 32px;
        }
        
        .header h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .back-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 24px;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .activity-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .table-header {
            background: #2c3e50;
            color: white;
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        
        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f8f9fa;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }
        
        td {
            padding: 16px;
            border-bottom: 1px solid #e9ecef;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
        }
        
        .calc-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #e9ecef;
            color: #495057;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .time-ago {
            color: #6c757d;
            font-size: 14px;
        }
        
        .price {
            font-weight: 600;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" class="back-btn">← Back to Home</a>
        
        <div class="header">
            <h1>📊 Activity Log</h1>
            <p>Real-time calculator usage and user activity</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Users (5 min)</div>
                <div class="stat-value" id="activeUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Calculations Today</div>
                <div class="stat-value" id="calculationsToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total This Week</div>
                <div class="stat-value" id="calculationsWeek">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Quote Value</div>
                <div class="stat-value" id="avgQuote">$0</div>
            </div>
        </div>
        
        <div class="activity-table">
            <div class="table-header">
                <span>Recent Activity</span>
                <button class="refresh-btn" onclick="loadActivityLog()">🔄 Refresh</button>
            </div>
            
            <div id="tableContent">
                <div class="loading">Loading activity...</div>
            </div>
        </div>
    </div>
    
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
        let currentUser = null;
        
        // Check authentication
        const savedUser = localStorage.getItem('sauce_user');
        if (!savedUser) {
            alert('Please log in first');
            window.location.href = 'home.html';
        } else {
            currentUser = JSON.parse(savedUser);
            
            // Only allow lain.hinson
            if (currentUser.username !== 'lain.hinson') {
                alert('Unauthorized: Admin access only');
                window.location.href = 'home.html';
            }
        }
        
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount || 0);
        }
        
        function timeAgo(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hr ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }
        
        async function loadActivityLog() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getActivityLog',
                        username: currentUser.username
                    }),
                    headers: { 'Content-Type': 'text/plain' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayActivityLog(data.activities);
                    calculateStats(data.activities);
                } else {
                    document.getElementById('tableContent').innerHTML = 
                        '<div class="loading">Error loading activity log</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">Failed to load activity</div>';
            }
        }
        
        function displayActivityLog(activities) {
            if (activities.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">No activity yet</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Calculator</th>
                            <th>Customer</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            activities.forEach(activity => {
                html += `
                    <tr>
                        <td class="time-ago">${timeAgo(activity.timestamp)}</td>
                        <td>
                            <div class="user-badge">
                                <span class="status-dot"></span>
                                ${activity.username}
                            </div>
                        </td>
                        <td><span class="calc-badge">${activity.calculatorType}</span></td>
                        <td>${activity.customerName || 'N/A'}</td>
                        <td class="price">${formatCurrency(activity.totalPrice)}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('tableContent').innerHTML = html;
        }
        
        function calculateStats(activities) {
            const now = new Date();
            const fiveMinAgo = new Date(now - 5 * 60 * 1000);
            const todayStart = new Date(now.setHours(0, 0, 0, 0));
            const weekStart = new Date(now - 7 * 24 * 60 * 60 * 1000);
            
            // Active users (last 5 min)
            const activeUsernames = new Set();
            activities.forEach(activity => {
                const activityDate = new Date(activity.timestamp);
                if (activityDate > fiveMinAgo) {
                    activeUsernames.add(activity.username);
                }
            });
            document.getElementById('activeUsers').textContent = activeUsernames.size;
            
            // Calculations today
            const today = activities.filter(a => new Date(a.timestamp) > todayStart);
            document.getElementById('calculationsToday').textContent = today.length;
            
            // Calculations this week
            const week = activities.filter(a => new Date(a.timestamp) > weekStart);
            document.getElementById('calculationsWeek').textContent = week.length;
            
            // Average quote value
            const totalValue = activities.reduce((sum, a) => sum + (a.totalPrice || 0), 0);
            const avgValue = activities.length > 0 ? totalValue / activities.length : 0;
            document.getElementById('avgQuote').textContent = formatCurrency(avgValue);
        }
        
        // Load on page load
        loadActivityLog();
        
        // Auto-refresh every 30 seconds
        setInterval(loadActivityLog, 30000);
    </script>
</body>
</html>
