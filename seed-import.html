function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls||'';
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log('Starting import of ' + ROWS.length + ' rows...');

  const BATCH = 50;
  let ok = 0, fail = 0;

  for (let i = 0; i < ROWS.length; i += BATCH) {
    const batch = ROWS.slice(i, i + BATCH);
    try {
      const r = await fetch(SB_URL + '/rest/v1/commission_orders', {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify(batch)
      });
      if (r.ok || r.status === 201 || r.status === 204) {
        ok += batch.length;
        log('Batch ' + (i/BATCH+1) + ': inserted rows ' + (i+1) + '–' + Math.min(i+BATCH,ROWS.length) + ' ✓', 'green');
      } else {
        const txt = await r.text();
        fail += batch.length;
        log('Batch ' + (i/BATCH+1) + ' FAILED: ' + txt, 'red');
      }
    } catch(e) {
      fail += batch.length;
      log('Batch ' + (i/BATCH+1) + ' ERROR: ' + e.message, 'red');
    }
    await new Promise(r => setTimeout(r, 120));
  }

  log('');
  log('Import complete: ' + ok + ' succeeded, ' + fail + ' failed.', ok===ROWS.length?'green':'red');
  if (ok === ROWS.length) {
    log('You can now close this page and upload the updated sales-tracker.html', 'dim');
  }
  btn.disabled = false;
}
