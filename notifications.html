<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Sauce Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--s9:#0f172a;--s8:#1e293b;--s7:#334155;--s5:#64748b;--s4:#94a3b8;--s3:#cbd5e1;--s2:#e2e8f0;--s1:#f1f5f9;--a5:#f59e0b;--g5:#22c55e;--r5:#ef4444;--b5:#3b82f6;--p5:#8b5cf6;}
body{font-family:'DM Sans',sans-serif;background:var(--s1);color:var(--s8);min-height:100vh;}

/* Header */
.topbar{background:white;border-bottom:3px solid var(--a5);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:36px;height:36px;background:var(--a5);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:14px;color:var(--s9);}
.topbar-title{font-size:18px;font-weight:700;}
.topbar-sub{font-size:11px;color:var(--s5);font-family:'Space Mono',monospace;}
.topbar-right{display:flex;gap:10px;}
.topbar-right a{padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;color:var(--s7);background:var(--s1);transition:all .15s;}
.topbar-right a:hover{background:var(--s2);}
.topbar-right a.active{background:var(--a5);color:var(--s9);}

/* Content */
.content{max-width:900px;margin:0 auto;padding:28px 20px;}

/* Stats bar */
.stats{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
.stat{background:white;border-radius:10px;padding:16px 20px;flex:1;min-width:140px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.stat-num{font-size:22px;font-weight:700;}
.stat-label{font-size:11px;color:var(--s5);text-transform:uppercase;letter-spacing:.5px;font-family:'Space Mono',monospace;}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:7px 14px;border:1px solid var(--s2);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:white;color:var(--s5);font-family:'DM Sans',sans-serif;transition:all .15s;}
.filter-btn:hover{border-color:var(--s3);color:var(--s7);}
.filter-btn.active{background:var(--s9);color:white;border-color:var(--s9);}
.filter-count{background:var(--s2);color:var(--s5);font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;}
.filter-btn.active .filter-count{background:rgba(255,255,255,.2);color:white;}
.mark-all{margin-left:auto;padding:7px 14px;border:1px solid var(--s2);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:white;color:var(--b5);font-family:'DM Sans',sans-serif;}
.mark-all:hover{background:var(--b5);color:white;}

/* Notification list */
.notif-list{display:flex;flex-direction:column;gap:8px;}
.notif-item{background:white;border-radius:10px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:14px;align-items:start;transition:all .15s;border-left:4px solid transparent;cursor:pointer;text-decoration:none;color:inherit;}
.notif-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateX(2px);}
.notif-item.unread{background:#fefce8;border-left-color:var(--a5);}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.notif-body{flex:1;min-width:0;}
.notif-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.notif-customer{font-weight:700;font-size:14px;}
.notif-time{font-size:11px;color:var(--s4);font-family:'Space Mono',monospace;white-space:nowrap;}
.notif-type{font-size:12px;font-weight:600;margin-bottom:4px;}
.notif-msg{font-size:13px;color:var(--s5);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.notif-quote{font-size:11px;color:var(--s4);font-family:'Space Mono',monospace;margin-top:4px;}
.notif-actions{display:flex;gap:8px;margin-top:10px;}
.notif-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.notif-btn.primary{background:var(--b5);color:white;}.notif-btn.primary:hover{background:#2563eb;}
.notif-btn.secondary{background:var(--s1);color:var(--s7);}.notif-btn.secondary:hover{background:var(--s2);}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--s4);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:16px;font-weight:600;color:var(--s5);}
.empty-sub{font-size:13px;margin-top:4px;}

/* Loading */
.loading{text-align:center;padding:60px;}.spinner{width:32px;height:32px;border:3px solid var(--s2);border-top-color:var(--a5);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){.topbar{padding:12px 16px;flex-direction:column;gap:10px;}.content{padding:16px 12px;}.stats{flex-direction:column;}.stat{min-width:auto;}.notif-item{flex-direction:column;gap:10px;}.topbar-right{flex-wrap:wrap;justify-content:center;}}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">SE</div>
        <div><div class="topbar-title">Notifications</div><div class="topbar-sub">CUSTOMER PORTAL ACTIVITY</div></div>
    </div>
    <div class="topbar-right">
        <a href="home.html">Dashboard</a>
        <a href="notifications.html" class="active">Notifications</a>
    </div>
</div>

<div class="content">

    <!-- Stats -->
    <div class="stats" id="statsBar">
        <div class="stat"><div class="stat-icon" style="background:#fef3c7;">🔔</div><div><div class="stat-num" id="statUnread">0</div><div class="stat-label">Unread</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:#dbeafe;">💬</div><div><div class="stat-num" id="statMessages">0</div><div class="stat-label">Messages</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:#dcfce7;">✅</div><div><div class="stat-num" id="statAccepted">0</div><div class="stat-label">Accepted</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:#fce7f3;">📝</div><div><div class="stat-num" id="statChanges">0</div><div class="stat-label">Changes</div></div></div>
    </div>

    <!-- Filters -->
    <div class="filters" id="filtersBar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unread">Unread</button>
        <button class="filter-btn" data-filter="message">💬 Messages</button>
        <button class="filter-btn" data-filter="accepted">✅ Accepted</button>
        <button class="filter-btn" data-filter="changes_requested">📝 Changes</button>
        <button class="filter-btn" data-filter="update_request">🔄 Updates</button>
        <button class="filter-btn" data-filter="viewed">👁️ Views</button>
        <button class="mark-all" onclick="markAllRead()">Mark All Read</button>
    </div>

    <!-- List -->
    <div id="notifList"><div class="loading"><div class="spinner"></div><div style="color:var(--s5);font-size:14px;">Loading notifications...</div></div></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
let allNotifs = [];
let currentFilter = 'all';

const typeConfig = {
    'viewed':            { icon: '👁️', label: 'Viewed Quote',       color: '#3b82f6', bg: '#dbeafe' },
    'message':           { icon: '💬', label: 'New Message',        color: '#8b5cf6', bg: '#ede9fe' },
    'accepted':          { icon: '✅', label: 'Quote Accepted',     color: '#22c55e', bg: '#dcfce7' },
    'changes_requested': { icon: '📝', label: 'Changes Requested',  color: '#ef4444', bg: '#fee2e2' },
    'update_request':    { icon: '🔄', label: 'Update Requested',   color: '#f59e0b', bg: '#fef3c7' }
};

window.addEventListener('DOMContentLoaded', loadNotifications);

async function loadNotifications() {
    try {
        const resp = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getNotifications', username: 'lain.hinson' }),
            headers: { 'Content-Type': 'text/plain' }
        });
        const data = await resp.json();
        if (data.success) {
            allNotifs = data.notifications || [];
            updateStats();
            updateFilters();
            renderNotifications();
        } else {
            document.getElementById('notifList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load</div><div class="empty-sub">' + (data.error || '') + '</div></div>';
        }
    } catch (e) {
        document.getElementById('notifList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Connection error</div></div>';
    }
}

function updateStats() {
    document.getElementById('statUnread').textContent = allNotifs.filter(n => n.read === 'unread').length;
    document.getElementById('statMessages').textContent = allNotifs.filter(n => n.eventType === 'message').length;
    document.getElementById('statAccepted').textContent = allNotifs.filter(n => n.eventType === 'accepted').length;
    document.getElementById('statChanges').textContent = allNotifs.filter(n => n.eventType === 'changes_requested').length;
}

function updateFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        const f = btn.dataset.filter;
        if (f === 'all' || f === 'unread') return;
        const count = allNotifs.filter(n => n.eventType === f).length;
        const badge = btn.querySelector('.filter-count');
        if (badge) badge.textContent = count;
    });
}

function getFiltered() {
    if (currentFilter === 'all') return allNotifs;
    if (currentFilter === 'unread') return allNotifs.filter(n => n.read === 'unread');
    return allNotifs.filter(n => n.eventType === currentFilter);
}

function renderNotifications() {
    const filtered = getFiltered();
    const container = document.getElementById('notifList');

    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">No notifications</div><div class="empty-sub">You\'re all caught up!</div></div>';
        return;
    }

    container.innerHTML = '<div class="notif-list">' + filtered.map(n => {
        const conf = typeConfig[n.eventType] || { icon: '📋', label: n.eventType, color: '#64748b', bg: '#f1f5f9' };
        const isUnread = n.read === 'unread';
        const portalEditLink = SCRIPT_URL + '?q=' + n.quoteId + '&mode=edit';
        const portalCustLink = SCRIPT_URL + '?q=' + n.quoteId;
        const time = formatTime(n.timestamp);

        let actionHtml = '';
        if (n.eventType === 'message' || n.eventType === 'changes_requested') {
            actionHtml = '<div class="notif-actions">' +
                '<a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">💬 Reply in Portal</a>' +
                '<a href="' + portalCustLink + '" target="_blank" class="notif-btn secondary">👁️ View as Customer</a>' +
                '</div>';
        } else if (n.eventType === 'accepted') {
            actionHtml = '<div class="notif-actions">' +
                '<a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">📋 Open Portal</a>' +
                '</div>';
        } else if (n.eventType === 'update_request') {
            actionHtml = '<div class="notif-actions">' +
                '<a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">🔄 Update Quote</a>' +
                '</div>';
        } else if (n.eventType === 'viewed') {
            actionHtml = '<div class="notif-actions">' +
                '<a href="' + portalEditLink + '" target="_blank" class="notif-btn secondary">Open Portal</a>' +
                '</div>';
        }

        return '<div class="notif-item' + (isUnread ? ' unread' : '') + '">' +
            '<div class="notif-icon" style="background:' + conf.bg + ';">' + conf.icon + '</div>' +
            '<div class="notif-body">' +
                '<div class="notif-top">' +
                    '<span class="notif-customer">' + (n.customerName || 'Customer') + '</span>' +
                    '<span class="notif-time">' + time + '</span>' +
                '</div>' +
                '<div class="notif-type" style="color:' + conf.color + ';">' + conf.label + '</div>' +
                (n.message ? '<div class="notif-msg">' + escHtml(n.message) + '</div>' : '') +
                '<div class="notif-quote">' + (n.quoteId || '') + '</div>' +
                actionHtml +
            '</div>' +
        '</div>';
    }).join('') + '</div>';
}

function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 172800) return 'Yesterday';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// Filter clicks
document.getElementById('filtersBar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderNotifications();
});

async function markAllRead() {
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'markNotificationsRead', username: 'lain.hinson' }),
            headers: { 'Content-Type': 'text/plain' }
        });
        allNotifs.forEach(n => n.read = 'read');
        updateStats();
        renderNotifications();
    } catch (e) {}
}
</script>
</body>
</html>
