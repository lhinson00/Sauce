<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Sauce Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a1628;color:#c8d6e5;min-height:100vh;}

.topbar{background:#0f1b33;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,168,67,.15);position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:40px;height:40px;background:linear-gradient(135deg,#b8860b,#d4a843);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:900;font-size:15px;color:#0f1b33;box-shadow:0 2px 8px rgba(212,168,67,.3);}
.topbar-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:800;color:#ffffff;}
.topbar-sub{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#d4a843;}
.topbar-right{display:flex;gap:8px;}
.topbar-right a{padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;color:#7a8aa5;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:all .15s;}
.topbar-right a:hover{border-color:rgba(212,168,67,.25);color:#d4a843;}
.topbar-right a.active{background:rgba(212,168,67,.1);color:#d4a843;border-color:rgba(212,168,67,.3);}

.content{max-width:920px;margin:0 auto;padding:28px 20px;position:relative;z-index:1;}

.stats{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.stat{background:#1a2744;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 20px;flex:1;min-width:140px;display:flex;align-items:center;gap:12px;}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.stat-num{font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;color:#ffffff;}
.stat-label{font-size:10px;color:#5a6a80;text-transform:uppercase;letter-spacing:1px;font-weight:600;}

.filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:7px 14px;border:1px solid rgba(255,255,255,.06);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:#1a2744;color:#5a6a80;font-family:'Inter',sans-serif;transition:all .15s;}
.filter-btn:hover{border-color:rgba(212,168,67,.2);color:#7a8aa5;}
.filter-btn.active{background:rgba(212,168,67,.12);color:#d4a843;border-color:rgba(212,168,67,.3);}
.filter-count{background:rgba(255,255,255,.05);color:#4a5a70;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;}
.filter-btn.active .filter-count{background:rgba(212,168,67,.15);color:#d4a843;}
.mark-all{margin-left:auto;padding:7px 14px;border:1px solid rgba(212,168,67,.2);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:#1a2744;color:#d4a843;font-family:'Inter',sans-serif;transition:all .15s;}
.mark-all:hover{background:rgba(212,168,67,.1);border-color:rgba(212,168,67,.35);}

.notif-list{display:flex;flex-direction:column;gap:8px;}
.notif-item{background:#1a2744;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 20px;display:flex;gap:14px;align-items:start;transition:all .15s;border-left:3px solid transparent;cursor:pointer;text-decoration:none;color:inherit;}
.notif-item:hover{border-color:rgba(212,168,67,.15);box-shadow:0 4px 16px rgba(0,0,0,.3);transform:translateX(2px);}
.notif-item.unread{background:#162040;border-left-color:#d4a843;}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.notif-body{flex:1;min-width:0;}
.notif-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.notif-customer{font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;color:#ffffff;}
.notif-time{font-size:11px;color:#4a5a70;font-weight:500;white-space:nowrap;}
.notif-type{font-size:12px;font-weight:700;margin-bottom:4px;}
.notif-msg{font-size:13px;color:#7a8aa5;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.notif-quote{font-size:11px;color:#4a5a70;margin-top:4px;font-weight:500;}
.notif-actions{display:flex;gap:8px;margin-top:10px;}
.notif-btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.notif-btn.primary{background:rgba(212,168,67,.15);color:#d4a843;border:1px solid rgba(212,168,67,.25);}.notif-btn.primary:hover{background:rgba(212,168,67,.25);}
.notif-btn.secondary{background:rgba(255,255,255,.04);color:#7a8aa5;border:1px solid rgba(255,255,255,.08);}.notif-btn.secondary:hover{background:rgba(255,255,255,.08);}

.empty{text-align:center;padding:60px 20px;color:#4a5a70;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:#7a8aa5;}
.empty-sub{font-size:13px;margin-top:4px;}

.loading{text-align:center;padding:60px;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.06);border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){.topbar{padding:12px 16px;flex-direction:column;gap:10px;}.content{padding:16px 12px;}.stats{flex-direction:column;}.stat{min-width:auto;}.notif-item{flex-direction:column;gap:10px;}.topbar-right{flex-wrap:wrap;justify-content:center;}}
</style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">SE</div>
        <div><div class="topbar-title">Notifications</div><div class="topbar-sub">Customer Portal Activity</div></div>
    </div>
    <div class="topbar-right">
        <a href="home.html">Dashboard</a>
        <a href="notifications.html" class="active">Notifications</a>
    </div>
</div>
<div class="content">
    <div class="stats" id="statsBar">
        <div class="stat"><div class="stat-icon" style="background:rgba(212,168,67,.12);">🔔</div><div><div class="stat-num" id="statUnread">0</div><div class="stat-label">Unread</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:rgba(99,102,241,.12);">💬</div><div><div class="stat-num" id="statMessages">0</div><div class="stat-label">Messages</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:rgba(34,197,94,.12);">✅</div><div><div class="stat-num" id="statAccepted">0</div><div class="stat-label">Accepted</div></div></div>
        <div class="stat"><div class="stat-icon" style="background:rgba(239,68,68,.12);">📝</div><div><div class="stat-num" id="statChanges">0</div><div class="stat-label">Changes</div></div></div>
    </div>
    <div class="filters" id="filtersBar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unread">Unread</button>
        <button class="filter-btn" data-filter="message">💬 Messages</button>
        <button class="filter-btn" data-filter="accepted">✅ Accepted</button>
        <button class="filter-btn" data-filter="changes_requested">📝 Changes</button>
        <button class="filter-btn" data-filter="update_request">🔄 Updates</button>
        <button class="filter-btn" data-filter="viewed">👁️ Views</button>
        <button class="mark-all" onclick="markAllRead()">Mark All Read</button>
    </div>
    <div id="notifList"><div class="loading"><div class="spinner"></div><div style="color:#4a5a70;font-size:14px;">Loading notifications...</div></div></div>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
const PORTAL_URL = 'https://lhinson00.github.io/Sauce/customer-portal.html';
let allNotifs = [];
let currentFilter = 'all';

const typeConfig = {
    'viewed':            { icon: '👁️', label: 'Viewed Quote',       color: '#6366f1', bg: 'rgba(99,102,241,.15)' },
    'message':           { icon: '💬', label: 'New Message',        color: '#818cf8', bg: 'rgba(129,140,248,.15)' },
    'accepted':          { icon: '✅', label: 'Quote Accepted',     color: '#22c55e', bg: 'rgba(34,197,94,.15)' },
    'changes_requested': { icon: '📝', label: 'Changes Requested',  color: '#ef4444', bg: 'rgba(239,68,68,.15)' },
    'update_request':    { icon: '🔄', label: 'Update Requested',   color: '#d4a843', bg: 'rgba(212,168,67,.15)' },
    'followup_sent':     { icon: '📤', label: 'Follow-up Sent',     color: '#6366f1', bg: 'rgba(99,102,241,.15)' }
};

window.addEventListener('DOMContentLoaded', loadNotifications);

async function loadNotifications() {
    try {
        const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getNotifications', username: 'lain.hinson' }), headers: { 'Content-Type': 'text/plain' } });
        const data = await resp.json();
        if (data.success) { allNotifs = data.notifications || []; updateStats(); updateFilters(); renderNotifications(); }
        else { document.getElementById('notifList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load</div><div class="empty-sub">' + (data.error || '') + '</div></div>'; }
    } catch (e) { document.getElementById('notifList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Connection error</div></div>'; }
}

function updateStats() {
    document.getElementById('statUnread').textContent = allNotifs.filter(n => n.read === 'unread').length;
    document.getElementById('statMessages').textContent = allNotifs.filter(n => n.eventType === 'message').length;
    document.getElementById('statAccepted').textContent = allNotifs.filter(n => n.eventType === 'accepted').length;
    document.getElementById('statChanges').textContent = allNotifs.filter(n => n.eventType === 'changes_requested').length;
}

function updateFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => { const f = btn.dataset.filter; if (f === 'all' || f === 'unread') return; const count = allNotifs.filter(n => n.eventType === f).length; const badge = btn.querySelector('.filter-count'); if (badge) badge.textContent = count; });
}

function getFiltered() {
    if (currentFilter === 'all') return allNotifs;
    if (currentFilter === 'unread') return allNotifs.filter(n => n.read === 'unread');
    return allNotifs.filter(n => n.eventType === currentFilter);
}

function renderNotifications() {
    const filtered = getFiltered();
    const container = document.getElementById('notifList');
    if (filtered.length === 0) { container.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">No notifications</div><div class="empty-sub">You\'re all caught up!</div></div>'; return; }
    container.innerHTML = '<div class="notif-list">' + filtered.map(n => {
        const conf = typeConfig[n.eventType] || { icon: '📋', label: n.eventType, color: '#7a8aa5', bg: 'rgba(255,255,255,.05)' };
        const isUnread = n.read === 'unread';
        const portalEditLink = PORTAL_URL + '?q=' + n.quoteId + '&admin=lain.hinson';
        const portalCustLink = PORTAL_URL + '?q=' + n.quoteId;
        const time = formatTime(n.timestamp);
        let actionHtml = '';
        if (n.eventType === 'message' || n.eventType === 'changes_requested') {
            actionHtml = '<div class="notif-actions"><a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">💬 Reply in Portal</a><a href="' + portalCustLink + '" target="_blank" class="notif-btn secondary">👁️ View as Customer</a></div>';
        } else if (n.eventType === 'accepted') {
            actionHtml = '<div class="notif-actions"><a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">📋 Open Portal</a></div>';
        } else if (n.eventType === 'update_request') {
            actionHtml = '<div class="notif-actions"><a href="' + portalEditLink + '" target="_blank" class="notif-btn primary">🔄 Update Quote</a></div>';
        } else if (n.eventType === 'viewed') {
            actionHtml = '<div class="notif-actions"><a href="' + portalEditLink + '" target="_blank" class="notif-btn secondary">Open Portal</a></div>';
        }
        return '<div class="notif-item' + (isUnread ? ' unread' : '') + '"><div class="notif-icon" style="background:' + conf.bg + ';">' + conf.icon + '</div><div class="notif-body"><div class="notif-top"><span class="notif-customer">' + (n.customerName || 'Customer') + '</span><span class="notif-time">' + time + '</span></div><div class="notif-type" style="color:' + conf.color + ';">' + conf.label + '</div>' + (n.message ? '<div class="notif-msg">' + escHtml(n.message) + '</div>' : '') + '<div class="notif-quote">' + (n.quoteId || '') + '</div>' + actionHtml + '</div></div>';
    }).join('') + '</div>';
}

function formatTime(ts) { const d = new Date(ts); const now = new Date(); const diff = (now - d) / 1000; if (diff < 60) return 'Just now'; if (diff < 3600) return Math.floor(diff / 60) + 'm ago'; if (diff < 86400) return Math.floor(diff / 3600) + 'h ago'; if (diff < 172800) return 'Yesterday'; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

document.getElementById('filtersBar').addEventListener('click', e => { const btn = e.target.closest('.filter-btn'); if (!btn) return; currentFilter = btn.dataset.filter; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderNotifications(); });

async function markAllRead() {
    try { await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'markNotificationsRead', username: 'lain.hinson' }), headers: { 'Content-Type': 'text/plain' } }); allNotifs.forEach(n => n.read = 'read'); updateStats(); renderNotifications(); } catch (e) {}
}
</script>
</body>
</html>
