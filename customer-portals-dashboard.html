<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portals — Sauce Estimator</title>
    <script>
        (function() {
            const s = sessionStorage.getItem('sauce_user');
            if (!s) { window.location.replace('index.html'); return; }
            try { const u = JSON.parse(s); if (!u || u.username !== 'lain.hinson') { window.location.replace('home.html'); } } catch(e) { window.location.replace('index.html'); }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Sora','Inter',sans-serif;background:#0d1b2a;min-height:100vh;color:#e0e6ed;}
        .topbar{background:#1a2744;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a3d66;position:sticky;top:0;z-index:100;}
        .topbar-brand{display:flex;align-items:center;gap:14px;}
        .topbar-logo{width:40px;height:40px;background:linear-gradient(135deg,#b8860b,#d4a843);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#1a2744;font-family:'Outfit',sans-serif;}
        .topbar-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;color:#f0f3f7;}
        .topbar-subtitle{font-size:10px;font-weight:600;color:#d4a843;letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
        .topbar-right{display:flex;align-items:center;gap:16px;}
        .btn-back{padding:8px 18px;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.25);color:#d4a843;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;font-family:'Sora',sans-serif;transition:all .15s;}
        .btn-back:hover{background:rgba(212,168,67,.15);border-color:rgba(212,168,67,.4);}
        .main{max-width:1200px;margin:0 auto;padding:32px 24px 60px;}
        .page-header{margin-bottom:28px;}
        .page-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#b8860b;margin-bottom:8px;}
        .page-tag::before{content:'';width:6px;height:6px;background:#b8860b;border-radius:50%;}
        .page-header h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:900;color:#f0f3f7;letter-spacing:-0.5px;}
        .page-header p{font-size:13px;color:#7a8aa5;margin-top:6px;}
        .stats-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
        .stat-card{background:#1a2744;border:1px solid #2a3d66;border-radius:12px;padding:16px 20px;flex:1;min-width:150px;}
        .stat-card .val{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;color:#d4a843;}
        .stat-card .lbl{font-size:11px;color:#7a8aa5;margin-top:2px;}
        .search-bar{display:flex;gap:10px;margin-bottom:20px;}
        .search-bar input{flex:1;padding:10px 16px;background:#1a2744;border:1px solid #2a3d66;border-radius:10px;color:#e0e6ed;font-family:'Sora',sans-serif;font-size:13px;outline:none;}
        .search-bar input::placeholder{color:#5a6b85;}
        .search-bar input:focus{border-color:#d4a843;}
        .customer-list{display:flex;flex-direction:column;gap:12px;}
        .customer-card{background:#1a2744;border:1px solid #2a3d66;border-radius:14px;overflow:hidden;transition:all .2s;}
        .customer-card:hover{border-color:rgba(212,168,67,.3);}
        .customer-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px;}
        .customer-header:hover{background:rgba(212,168,67,.03);}
        .cust-info{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
        .cust-avatar{width:42px;height:42px;min-width:42px;background:linear-gradient(135deg,#b8860b,#d4a843);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#1a2744;font-family:'Outfit',sans-serif;}
        .cust-name{font-family:'Outfit',sans-serif;font-weight:700;font-size:15px;color:#f0f3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .cust-meta{font-size:11px;color:#7a8aa5;margin-top:2px;}
        .cust-badges{display:flex;gap:6px;align-items:center;}
        .badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
        .badge-quotes{background:rgba(212,168,67,.12);color:#d4a843;}
        .badge-salesperson{background:rgba(90,138,106,.12);color:#5a9a6a;}
        .expand-icon{color:#7a8aa5;font-size:18px;transition:transform .2s;}
        .customer-card.open .expand-icon{transform:rotate(180deg);}
        .customer-quotes{display:none;border-top:1px solid #2a3d66;padding:0 20px 16px;}
        .customer-card.open .customer-quotes{display:block;}
        .quote-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(42,61,102,.5);gap:12px;flex-wrap:wrap;}
        .quote-row:last-child{border-bottom:none;}
        .quote-id{font-family:'Outfit',monospace;font-weight:700;font-size:13px;color:#d4a843;min-width:90px;}
        .quote-specs{font-size:12px;color:#7a8aa5;flex:1;min-width:150px;}
        .quote-total{font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;color:#f0f3f7;min-width:80px;text-align:right;}
        .quote-date{font-size:11px;color:#5a6b85;min-width:80px;text-align:right;}
        .quote-actions{display:flex;gap:6px;}
        .qa-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none;font-family:'Sora',sans-serif;border:none;cursor:pointer;transition:all .15s;}
        .qa-view{background:rgba(212,168,67,.12);color:#d4a843;}.qa-view:hover{background:rgba(212,168,67,.2);}
        .qa-edit{background:rgba(59,130,246,.12);color:#60a5fa;}.qa-edit:hover{background:rgba(59,130,246,.2);}
        .loading{text-align:center;padding:60px;color:#7a8aa5;font-size:14px;}
        .empty{text-align:center;padding:60px;color:#5a6b85;font-size:14px;}
        @media(max-width:768px){.topbar{padding:0 16px;}.main{padding:20px 14px;}.stats-row{flex-direction:column;}.quote-row{flex-direction:column;align-items:flex-start;gap:6px;}.quote-total,.quote-date{text-align:left;}}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">SE</div>
            <div><div class="topbar-title">Customer Portals</div><div class="topbar-subtitle">Published Quotes Dashboard</div></div>
        </div>
        <div class="topbar-right">
            <a href="home.html" class="btn-back">← Back to Home</a>
        </div>
    </div>
    <div class="main">
        <div class="page-header">
            <div class="page-tag">Administration</div>
            <h1>Customer Portals</h1>
            <p>All published quotes organized by customer — click to expand</p>
        </div>
        <div class="stats-row">
            <div class="stat-card"><div class="val" id="statCustomers">—</div><div class="lbl">Customers</div></div>
            <div class="stat-card"><div class="val" id="statQuotes">—</div><div class="lbl">Total Quotes</div></div>
            <div class="stat-card"><div class="val" id="statRecent">—</div><div class="lbl">Last 7 Days</div></div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by customer name, email, or quote ID..." oninput="filterCustomers()">
        </div>
        <div id="customerList" class="customer-list">
            <div class="loading">Loading customer portals...</div>
        </div>
    </div>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8V4A6F2o8gaBFQDEcYt8V91S5we2elm2a4bKey6pzcAX4pj845VHdcHjQyc7-J7E1/exec';
        const PORTAL_BASE = 'https://lhinson00.github.io/Sauce/customer-portal.html';
        let allCustomers = [];

        async function loadDashboard() {
            try {
                const resp = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getPortalDashboard' }),
                    headers: { 'Content-Type': 'text/plain' }
                });
                const data = await resp.json();
                if (!data.success) throw new Error(data.error || 'Failed to load');
                allCustomers = data.customers || [];
                updateStats();
                renderCustomers(allCustomers);
            } catch (e) {
                document.getElementById('customerList').innerHTML = '<div class="empty">Failed to load portals. ' + e.message + '</div>';
            }
        }

        function updateStats() {
            document.getElementById('statCustomers').textContent = allCustomers.length;
            let totalQ = 0;
            let recentQ = 0;
            const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            allCustomers.forEach(c => {
                totalQ += (c.quotes || []).length;
                (c.quotes || []).forEach(q => {
                    if (q.timestamp && new Date(q.timestamp).getTime() > weekAgo) recentQ++;
                });
            });
            document.getElementById('statQuotes').textContent = totalQ;
            document.getElementById('statRecent').textContent = recentQ;
        }

        function renderCustomers(customers) {
            const el = document.getElementById('customerList');
            if (!customers.length) { el.innerHTML = '<div class="empty">No customer portals found</div>'; return; }
            // Sort by most recent quote first
            customers.sort((a, b) => {
                const aLatest = (a.quotes || []).reduce((mx, q) => Math.max(mx, q.timestamp ? new Date(q.timestamp).getTime() : 0), 0);
                const bLatest = (b.quotes || []).reduce((mx, q) => Math.max(mx, q.timestamp ? new Date(q.timestamp).getTime() : 0), 0);
                return bLatest - aLatest;
            });
            el.innerHTML = customers.map((c, i) => {
                const initials = (c.customerName || '??').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                const numQ = (c.quotes || []).length;
                const metaParts = [];
                if (c.email) metaParts.push(c.email);
                if (c.phone) metaParts.push(c.phone);
                const quotesHtml = (c.quotes || []).map(q => {
                    const specs = q.specs || '';
                    const total = q.total ? '$' + Number(q.total).toLocaleString() : '';
                    const date = q.timestamp ? new Date(q.timestamp).toLocaleDateString() : '';
                    const portalLink = PORTAL_BASE + '?q=' + encodeURIComponent(q.quoteId) + '&admin=lain.hinson';
                    return `<div class="quote-row">
                        <div class="quote-id">${q.quoteId || '—'}</div>
                        <div class="quote-specs">${specs}</div>
                        <div class="quote-total">${total}</div>
                        <div class="quote-date">${date}</div>
                        <div class="quote-actions">
                            <a href="${portalLink}" target="_blank" class="qa-btn qa-view">View Portal</a>
                            <button class="qa-btn qa-edit" onclick="event.stopPropagation();navigator.clipboard.writeText('${PORTAL_BASE}?q=${encodeURIComponent(q.quoteId)}');this.textContent='✓ Copied';setTimeout(()=>this.textContent='📋 Copy Link',1500)">📋 Copy Link</button>
                        </div>
                    </div>`;
                }).join('');
                return `<div class="customer-card" id="cust${i}">
                    <div class="customer-header" onclick="toggleCard(${i})">
                        <div class="cust-info">
                            <div class="cust-avatar">${initials}</div>
                            <div>
                                <div class="cust-name">${c.customerName || 'Unknown'}</div>
                                <div class="cust-meta">${metaParts.join(' · ') || 'No contact info'}</div>
                            </div>
                        </div>
                        <div class="cust-badges">
                            <span class="badge badge-quotes">${numQ} quote${numQ !== 1 ? 's' : ''}</span>
                            ${c.salesperson ? '<span class="badge badge-salesperson">' + c.salesperson + '</span>' : ''}
                        </div>
                        <span class="expand-icon">▼</span>
                    </div>
                    <div class="customer-quotes">${quotesHtml || '<div style="padding:12px 0;color:#5a6b85;font-size:12px;">No quotes published yet</div>'}</div>
                </div>`;
            }).join('');
        }

        function toggleCard(i) {
            document.getElementById('cust' + i).classList.toggle('open');
        }

        function filterCustomers() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) { renderCustomers(allCustomers); return; }
            const filtered = allCustomers.filter(c => {
                if ((c.customerName || '').toLowerCase().includes(q)) return true;
                if ((c.email || '').toLowerCase().includes(q)) return true;
                if ((c.phone || '').includes(q)) return true;
                if ((c.salesperson || '').toLowerCase().includes(q)) return true;
                if ((c.quotes || []).some(qo => (qo.quoteId || '').toLowerCase().includes(q))) return true;
                return false;
            });
            renderCustomers(filtered);
        }

        loadDashboard();
    </script>
</body>
</html>
